schema_version = 1
id = "kernel.identity.credential-admission"
title = "Per-thread credential publication survives sibling birth admission"
guest_surfaces = ["syscall:setresuid", "syscall:clone", "kernel:thread-ledger"]
semantic_authority = [
  "man 2 setresuid: the kernel credential attributes belong to each thread; valid updates must not fail because a sibling birth is in flight",
  "man 2 clone: a new thread inherits the creating thread's credentials",
]
fixture = "unit:setresuid_during_sibling_birth_completes_once"
scale_points = [1, 8, 32]
rationale = "An internal birth credit cannot manufacture guest EAGAIN for a valid per-thread credential update. A conflicting kernel publication reservation waits inside the admitted operation, without syscall redispatch. The sibling records one birth and the caller publishes each update once. Exact pre-fix source from 800247419^ fails with guest errno 11 at seed 0, scale 1; fixed source returns 0."

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 0
per_unit = 1
layers = ["vm-free"]
rationale = "Each valid update enters the real dispatcher once, including while waiting for a conflicting publication reservation. The fixture asserts CompatReporter syscall invocations and exact publication events; this does not establish signed cost."

[bindings]
vm_free = "carrick-kernel-example::admission_interleavings::{setresuid_during_sibling_birth_completes_once,admitted_credential_wait_releases_permit_without_redispatch}"

