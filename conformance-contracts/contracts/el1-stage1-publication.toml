schema_version = 1
id = "kernel.el1.stage1-publication"
title = "One rollback-capable stage-1 publication authority across guest EL1 and the host"
guest_surfaces = [
  "fault:first-touch",
  "kernel:stage1-mmu",
  "kernel:sparse-materialization",
  "scheduler:page-table-quiescence",
  "vmm:hvf",
]
semantic_authority = [
  "Arm Architecture Reference Manual Armv8-A: translation-table writes must obey break-before-make, visibility and TLB-maintenance requirements",
  "man 2 mmap and man 2 mprotect: accessible translations enforce the mapping's current permissions and anonymous first touch supplies private zero-filled storage",
  "Hypervisor.framework hv_vm_map / hv_vm_unmap: stage-2 backing must exist for an IPA before a guest stage-1 leaf can expose it",
]
fixture = "unit:stage1-guest-editor-and-live-cursor; embed:el1-sched first-touch 256|1024|4096"
scale_points = [1, 8, 32, 128]
rationale = "EL1 increment 2 shared-publication checkpoint. Guest EL1 claims the exact published MM's single editor word, then re-reads its gate; a host pause or retirement raises/closes that gate and waits for the admitted editor before touching or freeing the same live stage-1 image. The SeqCst pair makes the race exhaustive: the host observes the editor or the guest observes the gate and releases without editing. Live PageTableManager construction reconstructs its spare-page cursor from hardware-visible bytes, so authority handoff cannot reissue a table page already in the walk. These bindings establish mutation exclusion and safe live-image adoption only. Frame-grant visibility, stage-2 plus owner and inventory commit before a valid leaf, rollback, EL1 fault service, and signed structural acceptance remain required by this same contract."
structural_budgets = []

[bindings]
vm_free = "carrick-sched-core::spaces::tests::{one_exact_guest_editor_owns_a_space_at_a_time,a_host_pause_closes_the_gate_before_waiting_for_the_guest_editor,a_closed_space_refuses_an_editor_without_leaking_the_claim}; carrick-kernel::kernel::mm_occupancy::tests::a_published_fence_waits_for_the_exact_guest_editor; carrick-mmu-core::aarch64::tests::new_live_discovers_the_last_occupied_spare_page_before_allocating"

[bindings.unresolved]
embed = "The existing signed carrick-embed::el1_sched::el1_memory_first_touch_stays_in_guest witness remains red until the guest consumes authenticated frame grants and publishes the leaf itself."
docker = "Native arm64 Docker semantics for the three-scale first-touch fixture are retained; automated same-source differential binding remains open."
embed_structural = "Register and assert exact guest edit attempts, refusals, publications, rollbacks, frame-grant/return counts and host-exit slope when the production fault path is connected."
production = "The shared editor word and live cursor are wired into production host pause/retirement and manager construction. Guest EL1 fault dispatch does not yet claim the editor or publish a leaf."
