l1_stage1_table_backing_is_stage2_writable_but_not_guest_writable"

[bindings.unresolved]
embed = "The exact signed carrick-embed::el1_sched::el1_memory_first_touch_stays_in_guest witness completes parent and child zero-fill, private write and post-rendezvous verification at 256, 1,024 and 4,096 pages. The accepted run records 99, 102 and 119 host exits; incremental slopes are 0.0020 and 0.0028 exits per added page against the <0.125 gate. The unentitled negative control passes and scoped cleanup is zero."
docker = "Native arm64 Docker semantics for the three-scale first-touch fixture are retained; automated same-source differential binding remains open."
embed_structural = "Register and assert exact guest edit attempts, refusals, publications, rollbacks, frame-grant/return counts and host-exit slope when the production fault path is connected."
production = "The shared editor word and live descriptor authority are wired into production host pause/retirement and manager construction. Slot-local frame-grant mailboxes are part of the checked shared ABI. The production kernel authority can apply and roll back its exact unpublished inventory mapping, and the dispatcher can plan and commit a VMA-clipped bulk resident span. The borrow-bound host-alias permit exposes its typed MM identity in the shipped feature configuration, so the release runtime can bind that request without widening mutation authority. The forwarded-fault runtime selects the active engine slot; HVF prepares real stage-2 backing, authenticates inventory and owner custody, retains the alias and publishes Ready last. The production guest data-abort path selects the trap-frame slot, requests the grant, preserves Ready across editor-gate refusal and claims only after exact editor admission. It adopts the exact live primary table image, creates missing hierarchy and publishes the authenticated grant through PageTableManager with Linux write/execute permissions and nG, invalidates the ASID and acknowledges it. HVF makes the physical primary-table backing writable for EL1 without marking its semantic mapping guest-writable. Host live editors adopt guest-linked hierarchy and advance their allocation cursor before later edits; fork snapshots discover the same hierarchy from the reachable live graph before copying the populated prefix. Fork projection retains the authenticated current output in an inherited invalid private-alias leaf without making an untouched page accessible. Exact signed execution completes the three-scale semantic and structural fixture with negative entitlement and scoped cleanup controls. Primary table exhaustion fails closed pending the separate guest extension-arena grant protocol. The panic bridge reports any refusal without changing publication authority. Guest extension growth, permission/retirement paths and the remaining checkpoint-2 acceptance stay open."
