schema_version = 1
id = "kernel.el1.stage1-publication"
title = "One rollback-capable stage-1 publication authority across guest EL1 and the host"
guest_surfaces = [
  "fault:first-touch",
  "kernel:stage1-mmu",
  "kernel:sparse-materialization",
  "scheduler:page-table-quiescence",
  "vmm:hvf",
]
semantic_authority = [
  "Arm Architecture Reference Manual Armv8-A: translation-table writes must obey break-before-make, visibility and TLB-maintenance requirements",
  "man 2 mmap and man 2 mprotect: accessible translations enforce the mapping's current permissions and anonymous first touch supplies private zero-filled storage",
  "Hypervisor.framework hv_vm_map / hv_vm_unmap: stage-2 backing must exist for an IPA before a guest stage-1 leaf can expose it",
]
fixture = "unit:stage1-guest-editor-live-cursor-frame-grant-inventory-and-range; embed:el1-sched first-touch 256|1024|4096"
scale_points = [1, 8, 32, 128]
rationale = "EL1 increment 2 shared-publication checkpoint. Guest EL1 claims the exact published MM's single editor word, then re-reads its gate; a host pause or retirement raises/closes that gate and waits for the admitted editor before touching or freeing the same live stage-1 image. The SeqCst pair makes the race exhaustive: the host observes the editor or the guest observes the gate and releases without editing. Live PageTableManager construction reconstructs its spare-page cursor from hardware-visible bytes, so authority handoff cannot reissue a table page already in the walk. The carrier-wide frame-grant mailbox binds a request and response to one exact nonzero MM key and request generation. EL1 requests only the fault access class; the host supplies authoritative VMA permissions. A successful response is valid only when it contains the fault, stays within the requested bulk span, permits that access, and names nonzero frame, mapping, stage-2 owner and inventory-revision identities. Wrong-MM, stale-generation and unauthenticated responses cannot be consumed. The kernel authority now issues the exact post-commit inventory revision with an independently retained owner generation and can roll the unpublished mapping back. Its range planner clips one grant to the same-protection VMA and one 2 MiB window, then commits residency for the whole span. These bindings establish mutation exclusion, safe live-image adoption, exact grant transport and kernel-side publication authority. VMM stage-2 preparation before the inventory transaction, Ready publication, guest authority reauthentication, EL1 leaf publication, fault service and signed structural acceptance remain required by this same contract."
structural_budgets = []

[bindings]
vm_free = "carrick-sched-core::spaces::tests::{one_exact_guest_editor_owns_a_space_at_a_time,a_host_pause_closes_the_gate_before_waiting_for_the_guest_editor,a_closed_space_refuses_an_editor_without_leaking_the_claim}; carrick-kernel::kernel::mm_occupancy::tests::a_published_fence_waits_for_the_exact_guest_editor; carrick-mmu-core::aarch64::tests::new_live_discovers_the_last_occupied_spare_page_before_allocating; carrick-el1-abi::tests::{frame_grant_mailbox_binds_ready_data_to_exact_request_and_mm,frame_grant_mailbox_rejects_mismatched_or_unauthenticated_ready_data}; carrick-runtime::vcpu_loop::memory::tests::frame_grant_inventory_receipt_is_exact_and_rollbackable_before_leaf_publication; carrick-kernel::dispatch::mem::fault::tests::frame_grant_plan_clips_to_one_bulk_window_and_commits_the_whole_span"

[bindings.unresolved]
embed = "The existing signed carrick-embed::el1_sched::el1_memory_first_touch_stays_in_guest witness remains red until the guest consumes authenticated frame grants and publishes the leaf itself."
docker = "Native arm64 Docker semantics for the three-scale first-touch fixture are retained; automated same-source differential binding remains open."
embed_structural = "Register and assert exact guest edit attempts, refusals, publications, rollbacks, frame-grant/return counts and host-exit slope when the production fault path is connected."
production = "The shared editor word and live cursor are wired into production host pause/retirement and manager construction. The frame-grant mailbox is part of the checked shared ABI. The production kernel authority can apply and roll back its exact unpublished inventory mapping, and the dispatcher can plan and commit a VMA-clipped bulk resident span. No VMM host service or guest fault consumer uses those endpoints yet. Guest EL1 fault dispatch does not yet claim the editor or publish a leaf."
