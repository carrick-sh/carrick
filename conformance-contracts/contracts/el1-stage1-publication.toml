schema_version = 1
id = "kernel.el1.stage1-publication"
title = "One rollback-capable stage-1 publication authority across guest EL1 and the host"
guest_surfaces = [
  "fault:first-touch",
  "kernel:stage1-mmu",
  "kernel:sparse-materialization",
  "scheduler:page-table-quiescence",
  "vmm:hvf",
]
semantic_authority = [
  "Arm Architecture Reference Manual Armv8-A: translation-table writes must obey break-before-make, visibility and TLB-maintenance requirements",
  "man 2 mmap and man 2 mprotect: accessible translations enforce the mapping's current permissions and anonymous first touch supplies private zero-filled storage",
  "Hypervisor.framework hv_vm_map / hv_vm_unmap: stage-2 backing must exist for an IPA before a guest stage-1 leaf can expose it",
]
fixture = "unit:stage1-guest-editor-live-cursor-frame-grant-inventory-and-range; embed:el1-sched first-touch 256|1024|4096"
scale_points = [1, 8, 32, 128]
rationale = "EL1 increment 2 shared-publication checkpoint. Guest EL1 claims the exact published MM's single editor word, then re-reads its gate; a host pause or retirement raises/closes that gate and waits for the admitted editor before touching or freeing the same live stage-1 image. The SeqCst pair makes the race exhaustive: the host observes the editor or the guest observes the gate and releases without editing. Live PageTableManager construction follows authenticated live descriptors through physical capacity and adopts every table page touched by a host edit, so a host manager created before guest hierarchy growth neither rejects a valid linked table nor reissues that page. A host fork snapshot likewise walks the reachable live table graph and extends the copied prefix through the highest linked primary page, with no full-capacity scan. Each persistent vCPU slot has an independent single-flight frame-grant mailbox binding a request and response to one exact nonzero MM key and request generation; unrelated slots can progress concurrently without page-granular fallback. EL1 requests only the fault access class; the host supplies authoritative VMA permissions. A successful response is valid only when it contains the fault, stays within the requested bulk span, permits that access under the existing AArch64 first-touch rule, and names nonzero frame, mapping, stage-2 owner and inventory-revision identities. Wrong-MM, stale-generation and unauthenticated responses cannot be consumed. The forwarded-fault boundary reads the active slot and exact MM identity from its engine and borrow-bound host-alias permit, claims only that slot's exact fault/access request, clips one grant to the same-protection VMA and one 2 MiB window, and asks the active VMM to prepare it. HVF quiesces the exact MM, creates real zeroed stage-2 backing, stages the backend inventory row, applies and authenticates the kernel inventory receipt and owner generation, retains the live alias, and returns the leaf IPA. The runtime publishes Ready only after that sequence and then commits residency for the complete semantic span. On the retry, EL1 observes only its slot's exact response, acquires and reauthenticates the exact MM editor before claiming Ready, adopts the live primary table image through its fixed alias, validates the complete target before editing, and uses the shared PageTableManager transaction to allocate missing hierarchy, publish RW/UXN/nG descriptors child-before-parent and roll back every failed edit. The table image remains non-writable to EL0 and host syscall-copy paths, while its physical stage-2 backing admits EL1 descriptor writes; writable stage-2 authority does not widen the Linux semantic mapping. EL1 then broadcasts one ASID invalidation and acknowledges the response. Exhausting the currently backed table pool refuses whole; a guest cannot fabricate an extension arena before separate stage-2 publication. A closed gate leaves Ready published and the host recognizes that exact response as a retry rather than misdelivering a fault; refusal is consumed once without same-dispatch republication. The EL1 panic bridge preserves the source location and a stable publication-error code across HVC so a signed invariant failure names its rejected publication shape instead of appearing as a generic abort or hang."
structural_budgets = []

