schema_version = 1
id = "arm.softcpu.cache-hot-set"
title = "Bound translation work for resident AArch64 guest blocks"
guest_surfaces = ["isa:aarch64", "vmm:soft"]
semantic_authority = ["Arm ARM DDI0487G.a C6.2 instruction semantics for SUBS, B.cond and HVC."]
fixture = "carrick-softcpu-aarch64-host::boot_probe"
scale_points = [1, 100, 10000]
rationale = "The unchanged loop body and its HVC exit occupy two resident translations."

[[structural_budgets]]
kind = "upper-bound"
metric = "softcpu_block_decodes"
maximum = 2
layers = ["vm-free"]
rationale = "Each of the two resident blocks is decoded once."

[[structural_budgets]]
kind = "upper-bound"
metric = "softcpu_block_emits"
maximum = 2
layers = ["vm-free"]
rationale = "Each of the two resident blocks is emitted once."

[bindings]
vm_free = [
  "carrick-softcpu-aarch64-host::boot_probe::resident_loop_translates_only_two_blocks",
]
[bindings.unresolved]
embed_structural = "The native ARM64 soft dispatcher witness runs without an embedded soft carrier."
docker = "The witness uses the architecture's instruction semantics and a provider exit. No Docker ratio is claimed."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
