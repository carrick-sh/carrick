schema_version = 1
id = "x86.softcpu.level0"
title = "Level 0 x86_64 copy-through binary translation executes user code and surfaces typed architectural faults over SoftMmuMemory without host signals"
guest_surfaces = ["fault:breakpoint", "exit:software-interrupt", "isa:x86_64", "vmm:soft", "fault:page-fault", "fault:invalid-opcode", "fault:general-protection", "fault:divide-error"]
semantic_authority = [
  "Intel SDM Vol. 3A Ch. 6: Interrupt and Exception Handling (#DE vector 0, #UD vector 6, #GP vector 13, #PF vector 14 error-code bits P/W/U/RSVD/I/PK)",
  "AMD64 Architecture Programmer's Manual Vol. 2: canonical 48-bit virtual addresses and page-translation fault ordering",
  "Intel SDM Vol. 1 Ch. 8/10/13: x87 environment formats, SIMD exceptions and XSAVE component masks/headers",
  "Intel SDM Vol. 2: ignored long-mode segment prefixes, INT/INT3 and MASKMOV memory operands",
  "native x86_64 host CPU differential execution of randomized ALU, memory, and stack basic blocks",
]
fixture = "carrick-softcpu-x86::softcpu_level0"
scale_points = [1]
structural_budgets = []
rationale = "Level 0 same-ISA copy-through binary translation in carrick-softcpu-x86 translates guest virtual addresses exclusively through the per-CPU SoftTlb, SoftWalker, and SoftMmuMemory without mapping guest virtual addresses into the host address space or installing host signal handlers (SIGSEGV/SIGFPE/SIGILL/SIGBUS). Every memory access, page-straddling bounce-buffer access, instruction fetch, and division surfaces exact architectural #PF (with CR2 and P/W/U/I/PK error code), #UD, #GP(0), or #DE exits while preserving guest GPRs, RFLAGS, and uncommitted page bytes on fault."

# Level 0 has an explicit native-instruction allowlist and a fixed CPUID view.
# VEX/EVEX, gathers and unimplemented instruction classes raise guest #UD.
# XCR0 is 3: no YMM state is exposed. Legacy x87/XSAVE image helpers and
# SIMD arithmetic are refused with guest #UD until the helper layer. Guest RSP stays virtual;
# every gateway restores host DF/MXCSR/FCW before Rust, and JIT pages use W^X.
# Aggregate ELF/native-oracle and extended memory/complex-op cases are in
# the helper layer; all seven required review witnesses remain in this core.
# Address-size/FS/GS string and XLAT forms and FS/GS stack operations are
# refused before mutation until their architectural semantics are implemented.
# Translation caching and structural execution budgets remain follow-up #616.

[bindings]
vm_free = "carrick-softcpu-x86::softcpu_level0::{invalid_opcode_witnesses_ud2_and_bad_encodings,general_protection_witnesses_privileged_at_cpl3_and_sensitive_at_cpl0,general_protection_witnesses_non_canonical_and_unaligned_sse,divide_error_witnesses_div_idiv_zero_overflow_and_fault_priority,implicit_masked_store_cannot_write_a_host_address,ignored_legacy_segment_prefixes_execute_in_long_mode,unsupported_ymm_state_is_neither_advertised_nor_executed,complete_f3_instruction_at_page_end_does_not_fetch_next_page,oversized_and_unknown_memory_images_never_enter_native_memory_path,native_admission_denies_unimplemented_host_features,breakpoints_and_software_interrupts_have_typed_exits,guest_rsp_values_survive_native_ops_memory_helpers_and_exits,rip_relative_word_lea_preserves_upper_destination_bits,masked_store_crosses_pages_without_changing_disabled_bytes,scalar_cmpsd_never_uses_unchecked_native_copy,descriptor_queries_exit_without_host_state,unsupported_implicit_address_forms_refuse_before_mutation}; context::tests::{gateway_returns_with_host_df_and_fp_controls_restored,crossing_conditional_write_preserves_untouched_bounce_bytes,published_blocks_and_gateways_are_rx_and_never_writable}; context::SoftCpuContext compile-fail gateway API witnesses"

