schema_version = 1
id = "x86.softcpu.level0"
title = "Level 0 x86_64 copy-through binary translation executes user code and surfaces typed architectural faults over SoftMmuMemory without host signals"
guest_surfaces = ["fault:debug", "fault:alignment-check", "fault:breakpoint", "fault:simd-floating-point", "exit:software-interrupt", "isa:x86_64", "vmm:soft", "fault:page-fault", "fault:invalid-opcode", "fault:general-protection", "fault:divide-error"]
semantic_authority = [
  "Intel SDM Vol. 3A Ch. 6: Interrupt and Exception Handling (#DE vector 0, #UD vector 6, #GP vector 13, #PF vector 14 error-code bits P/W/U/RSVD/I/PK)",
  "AMD64 Architecture Programmer's Manual Vol. 2: canonical 48-bit virtual addresses and page-translation fault ordering",
  "Intel SDM Vol. 1 Ch. 8/10/13: x87 environment formats, SIMD exceptions and XSAVE component masks/headers",
  "Intel SDM Vol. 2: ignored long-mode segment prefixes, INT/INT3 and MASKMOV memory operands",
  "Intel SDM Vol. 2 REP/MOVS/STOS/CMPS/SCAS: restartable count/index progress, DF element order, and fault-time comparison flags",
  "Intel SDM Vol. 3A alignment-check exception and Vol. 3B single-step exception; Vol. 2 POPF/CLAC/STAC/INT1 and system instruction privilege/UMIP rules (https://cdrdv2-public.intel.com/868137/325462-089-sdm-vol-1-2abcd-3abcd-4.pdf)",
  "native x86_64 host CPU differential execution of randomized ALU, memory, and stack basic blocks",
]
fixture = "carrick-softcpu-x86::softcpu_level0"
scale_points = [64, 512, 4096, 4097, 8193, 32769]
rationale = "Level 0 same-ISA copy-through binary translation in carrick-softcpu-x86 translates guest virtual addresses exclusively through the per-CPU SoftTlb, SoftWalker, and SoftMmuMemory without mapping guest virtual addresses into the host address space or installing host signal handlers (SIGSEGV/SIGFPE/SIGILL/SIGBUS). Every memory access, page-straddling bounce-buffer access, instruction fetch, and division surfaces exact architectural #PF (with CR2 and P/W/U/I/PK error code), #UD, #GP(0), or #DE exits while preserving guest GPRs, RFLAGS, and uncommitted page bytes on fault."

# Level 0 has an explicit native-instruction allowlist and a fixed CPUID view.
# VEX/EVEX, gathers and unimplemented instruction classes raise guest #UD.
# FPU=0: image helpers provide no x87 arithmetic; CR0.EM=0 permits SSE.
# FXSR/XSAVE are enabled here; RDTSCP/PKU remain absent and raise #UD.
# Address-size/FS/GS string and XLAT forms and FS/GS stack ops remain refused.
# XCR0 is 3: no YMM state is exposed. Checked SSE arithmetic raises guest #XM;
# legacy x87 state images validate the full span. Guest RSP stays virtual;
# every gateway restores host DF/MXCSR/FCW before Rust, and JIT pages use W^X.
# Virtual x87 metadata survives block ends; native execution publishes only
# XMM/MXCSR. FXSAVE preserves software bytes and honors REX.W pointer widths.
# FP leaves are immutable and cached per normalized encoding per vCPU; host
# allocation/publication failures return EmitError before guest execution.
# REP: <=4096 elements per execution window; TF reduces this to one element.
# MOVS/STOS authenticate page-bounded spans once, preserving physical alias
# overlap in element order. VM-free TLB probes are <=4 for a one-page copy,
# independent of byte count (64/512/4096); RCX/RSI/RDI bind actual progress.
# Legal descriptor/segment/IRET instructions exit Sensitive for machine-owner
# service, exactly like LAR/LSL; they never execute against host system state.
# Translation caching remains follow-up #616. #626 items 4 (cross-page LOCK
# atomicity) and 5 (in-block self-modification) remain outside this contract.

[[structural_budgets]]
kind = "upper-bound"
metric = "guest_memory_read_bytes"
maximum = 65536
layers = ["vm-free"]
rationale = "Per REP window: <=4096 elements * <=8 bytes * <=2 read operands. rep_all_string_widths_obey_the_iteration_budget binds RCX progress. rep_copy_translation_work_is_page_chunked independently measures <=4 actual TLB probes for a one-page copy at 64/512/4096 bytes; no per-element address translation."

[[structural_budgets]]
kind = "upper-bound"
metric = "guest_memory_write_bytes"
maximum = 32768
layers = ["vm-free"]
rationale = "Per REP MOVS/STOS window: <=4096 elements * <=8 bytes written. Restartable RIP prevents executing the successor on exhaustion. Tests bind the completed count, index deltas and untouched suffix independently of wall-clock time."

