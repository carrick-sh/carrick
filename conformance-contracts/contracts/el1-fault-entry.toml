# #2655: an x86 fork whose rows outgrow the residency table is refused
# "not now" (`ForkStockRefusal::Residency`); the guest grows the table and
# reruns the fork. Witnesses are bound under kernel.el1.fork-cow.
# This family's contract expectations, bindings and budgets are unchanged.
# #2480 slice 1 (N1 vocabulary): LeafAccess moved verbatim from
# carrick-mmu-core aarch64 and LeafSize from x86::descriptor_txn into the
# neutral carrick-mmu-core stage1 module (crates/carrick-mmu-core/src/stage1.rs);
# aarch64::LeafAccess and x86::descriptor_txn::{Access, LeafSize} are now
# re-exports of the same types. LeafAccess gains an explicit probe wire
# conversion (Read=0, Write=1, Execute=2, unchanged). No semantic, layout or
# work change: the existing bindings below remain the regression evidence,
# re-run unchanged at this head; no new acceptance is claimed.
# #1394: additional ABI bookkeeping witness only; existing semantic and
# work-budget bindings remain authoritative. Census publication reads counters
# after executor join and does not alter this contract's guest operation.
# #1153: InotifyNameCache seqlock rebuild and EL1_ABI_LAYOUT_HASH update in
# shared crates/carrick-el1-abi/src/lib.rs (bound under kernel.el1.inotify and
# kernel.x86.file-region). Fault-entry semantics and budgets are unchanged.
# Request-lifetime follow-up: request words now carry 64-bit incarnation
# identities and HOST_REQUEST_PROTOCOL participates in ABI hashing. Record
# layout/hash regression bindings remain required; no new GIC/fault/page-table
# behavior is asserted by the request lifetime tests.
# Transfer-protocol review: the shared ABI hash now includes transfer claim
# encodings, so older images cannot decode an in-flight transfer as Free.
# No GIC, fault, metadata or page-table layout/algorithm changed here; retain
# those existing regression bindings. New transfer unit tests do not prove
# these contracts, and fresh signed promotion remains required.
schema_version = 1
id = "kernel.el1.fault-entry"
title = "Guest EL1 lower-EL data-abort entry and architectural context preservation with host fallback"
guest_surfaces = [
  "kernel:el1_fault_entry",
  "kernel:sparse_materialization",
  "syscall:mprotect",
