# The inherited redirected-write change adds no fork or table implementation.
# native_files::tests::native_child_write_serves_parent_redirected_stdout_after_host_close
# uses the shipping ring dup2/fork path and verifies that child writes keep
# the inherited physical cursor after the host publication owner drops.
# Existing fork/descriptor budgets and signed bindings are unchanged.
schema_version = 1
id = "kernel.fork.filetable"
title = "Fork file table copy scaling"
guest_surfaces = ["syscall:clone", "syscall:fork", "kernel:filetable"]
semantic_authority = [
  "man 2 fork",
  "man 2 clone",
  "conformance-probes/probe-inventory.json:forkfiletable",
]
fixture = "probe:forkfiletable"
scale_points = [1, 8, 32, 128]
rationale = "Fork file-table copy cost must scale affinely with populated descriptors, avoiding redundant scans across unallocated descriptor space or unneeded allocations."

[bindings]
vm_free = [
  "carrick-kernel-example::fork_filetable_contract",
  "carrick-fd-core::tests::red_until_step3_m1_sparse_fork_visits_only_populated_descriptors",
]
embed = [
  "carrick-embed::fork_filetable_contract",
]
docker = [
  "probe:forkfiletable",
]
ecosystem = [
  "cpython:multiprocessing_fork",
  "ltp:fork09",
  "ltp:fork14",
]

[[structural_budgets]]
kind = "exact"
metric = "task_admissions"
value = 1
rationale = "Each fork admits exactly one child task into the kernel."

[[structural_budgets]]
kind = "affine"
metric = "guest_memory_copy_bytes"
base = 96
per_unit = 32
rationale = "File table copy memory is affine in populated descriptor count (32 bytes per slot plus 3 stdio slots)."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20

# M1 extends this contract without widening its populated-descriptor budget.
# Additional VM-free binding (flips at M1 cutover):
# carrick-fd-core::tests::red_until_step3_m1_sparse_fork_visits_only_populated_descriptors
# One populated high fd, backed capacities 65/4096/65536. Exact slot reads are
# currently capacity, not population (1). expect_err matches the scan reason
# and exact count at every scale; invert at cutover, never increase the budget.
