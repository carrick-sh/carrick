schema_version = 1
id = "x86.cpl0.work-boundary"
title = "A completed CPL0 syscall settles owed host work on its exact task"
guest_surfaces = ["vmm:kvm", "syscall:wait4", "syscall:rt_sigtimedwait", "signal:delivery"]
semantic_authority = [
  "man 2 waitpid: a caught signal may interrupt or restart a child wait",
  "man 2 rt_sigtimedwait: a blocked signal in the wait set is consumed by the waiter",
  "native x86_64 Linux execution of the identical static assembly fixtures",
]
fixture = "carrick-x86-cpl0-host::cpl0_boot::production_work_port_tests; carrick-cli::x86_kvm_run::mounted_static_x86_signal_{restarts_owned_wait4,wait_pingpong}_matches_native"
scale_points = [1, 2]
structural_budgets = []
rationale = """
A completed in-ring syscall may leave a host wake owed. The stopped task's
WORK_PORT must be admitted by production KVM, consume that task's flags once,
and deliver owed wakes after physical custody is released. A peer task's flags
must remain untouched. The VM-free witness proves exact-task and once-only
consumption; the live KVM fixtures compare the same ELF with native Linux.
No polling, time extension, or executor serialization is part of the contract.
"""

[bindings]
vm_free = "carrick-x86-cpl0-host::cpl0_boot::production_work_port_tests::{completed_cpl0_work_has_a_production_boundary,work_boundary_consumes_only_the_stopped_tasks_flags_once}"
embed = "KVM production carrier: carrick-cli::x86_kvm_run::{mounted_static_x86_signal_restarts_owned_wait4_matches_native,mounted_static_x86_signal_wait_pingpong_matches_native}"

[bindings.unresolved]
embed_structural = "Exact physical work-doorbell counts and full wake-delivery closure are not yet emitted as a structural observation."
docker = "Docker is unavailable on this x86 KVM worker; native x86_64 Linux runs of the exact ELFs provide the local oracle."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
