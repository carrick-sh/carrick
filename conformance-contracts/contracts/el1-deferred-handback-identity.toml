schema_version = 1
id = "kernel.el1.deferred-handback-identity"
title = "Host handback owns cleanup and preserves incarnation through publication"
guest_surfaces = ["syscall:futex", "scheduler:lifecycle", "syscall:exit_group"]
semantic_authority = ["man 2 futex: wake applies to the selected waiters", "man 2 exit_group: terminate all threads in the process"]
fixture = "unit:deferred_slot_handback_does_not_wake_a_reused_record; unit:drain_handback_identity_survives_reuse_before_the_consumer_runs; unit:host_wake_batch_keeps_identity_after_return_and_reuse; unit:service_take_keeps_identity_after_return_and_reuse; unit:host_claim_is_not_published_before_queue_cleanup; unit:host_claim_cleanup_does_not_unlink_a_replacement_waiter; unit:host_wake_transfer_owns_waitv_cleanup_until_completion; unit:a_host_request_during_transfer_prevents_guest_relocation"
scale_points = [1, 8, 32]
structural_budgets = []
rationale = "An evacuated record may be claimed, retired and reused before its deferred handback is published. The deferred work must retain the original incarnation and may never manufacture readiness for a replacement waiter. The deterministic schedule evacuates N records, retires and replaces each, then delivers the saved handbacks, asserting zero replacement publications and unchanged parked ownership. This is a reduction of a concrete identity gap, not attribution of the historical Python crash. The producer also retains exclusive mutation authority until cleanup finishes; cancellation during a transfer delegates retirement rather than freeing a slot under its producer. Host-claim and waitv fixtures verify this boundary and preserve the owed host request during relocation. Cancellation intent is recorded before returning EL1-held ownership; deferred flags name a non-wrapping record incarnation and cannot target or mask a newer use. Post-publication retirement/restore ownership remains under audit. No timing or structural-observation closure is claimed."

[bindings]
vm_free = "carrick-kernel::el1_zone::tests::deferred_slot_handback_does_not_wake_a_reused_record; carrick-sched-core::tests::{drain_handback_identity_survives_reuse_before_the_consumer_runs,host_wake_batch_keeps_identity_after_return_and_reuse,service_take_keeps_identity_after_return_and_reuse} (identity captured before host publication, including consumer preemption and returned batches); carrick-sched-core::tests::guest_wake_publication_has_no_remaining_futex_entry (zero attached futex entries at guest queue consumption; populations 1/8/32); carrick-sched-core::tests::{host_claim_is_not_published_before_queue_cleanup,host_claim_cleanup_does_not_unlink_a_replacement_waiter,host_wake_transfer_owns_waitv_cleanup_until_completion,a_host_request_during_transfer_prevents_guest_relocation} (owned transfer, cancellation, waitv cleanup and deferred host requests); carrick-sched-core::tests::{cancelled_on_cpu_claim_is_retired_by_the_next_handback,an_admitted_cancel_request_does_not_cancel_a_reused_record,exhausted_record_incarnation_is_never_reallocated,late_host_requests_neither_target_nor_mask_a_new_incarnation} (incarnation-bound deferred requests and cancellation-before-handback)"

