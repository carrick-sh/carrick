# #1881: shared thread registration prepares custody before publication.
# This family's operations and budgets are unchanged. Atomicity is witnessed by
# native_process_runtime::host_test_support::register_thread_busy_keeps_birth_authenticable
# under process.native.arm-admission; the full VM-free native suite passes.
# No additional signed, Docker or runtime-ratio evidence is claimed here.
schema_version = 1
id = "kernel.el1.deferred-handback-identity"
title = "Host handback owns cleanup and preserves incarnation through publication"
guest_surfaces = ["syscall:futex", "scheduler:lifecycle", "syscall:exit_group"]
semantic_authority = ["man 2 futex: wake applies to the selected waiters", "man 2 exit_group: terminate all threads in the process"]
fixture = "unit:deferred_slot_handback_does_not_wake_a_reused_record"
scale_points = [1, 8, 32]
rationale = "An evacuated record may be claimed, retired and reused before its deferred handback is published. The deferred work must retain the original incarnation and may never manufacture readiness for a replacement waiter. The deterministic schedule evacuates N records, retires and replaces each, then delivers the saved handbacks, asserting zero replacement publications and unchanged parked ownership. This is a reduction of a concrete identity gap, not attribution of the historical Python crash. The producer also retains exclusive mutation authority until cleanup finishes; cancellation during a transfer delegates retirement rather than freeing a slot under its producer. Host-claim and waitv fixtures verify this boundary and preserve the owed host request during relocation. Cancellation intent is recorded before returning EL1-held ownership; deferred flags name a non-wrapping record incarnation and cannot target or mask a newer use. Post-publication retirement/restore ownership remains under audit. No timing or structural-observation closure is claimed."

[[structural_budgets]]
kind = "exact"
metric = "wake_publications"
value = 0
layers = ["vm-free"]
rationale = "Delivery of N retired incarnations must publish zero wakes for replacement waiters. Counts cover the actual callback in one synthetic zone at N=1/8/32; this does not bound live-handback work, queue visits or runtime cost."

[bindings]
vm_free = [
  "carrick-sched-core::tests::{cancelled_metadata_wait_releases_record_without_resume,cancelled_deferred_metadata_wait_releases_record_without_resume} (metadata receipts: one retirement, zero orphan completion publications, no resume, stale delivery cannot retire a replacement)",
  "carrick-sched-core::spaces::notification::tests::actual_gate_refusal_during_final_release_cannot_park_after_it (#1773: shared notification publication preserves exact operation custody and prevents a stranded scheduler record after final release; no change to queue delivery, IPC semantics or handback identity)",
  "carrick-el1-linux::sched::tests::{cancelled_on_cpu_thread_is_not_stranded_by_repark,signal_requested_on_cpu_is_not_lost_by_repark}",
  "carrick-kernel::el1_zone::tests::deferred_slot_handback_does_not_wake_a_reused_record",
  "carrick-kernel::el1_zone::tests::{deferred_capture_precedes_filter_and_releases_queue_authority,serial_host::deferred_capture_does_not_hold_publisher_registration} (capture hook before filtering; released slot and registration locks, replacement stays parked; measurement infrastructure only)",
  "carrick-kernel::el1_zone::tests::{service_capture_publishes_once_across_repeated_step_aways,service_capture_does_not_bounce_between_eligible_drivers,serial_host_deferred_capture_control::hold_is_captured_exactly_once_at_the_next_step_away} (service handback: one capture and one host publication across 1/8/32 consecutive inline host waits and alternating eligible drivers; first-entry births retain activation custody)",
  "carrick-kernel::kernel::scheduler::tests::serial_host::failed_zone_load_settlement_retires_only_its_owned_continuation (generic and exact wakes cannot admit a parked context; control claim before lease, exact continuation transfer, one retirement on failed-load settlement and stale delivery after reuse; synthetic region, VM-free only)",
  "carrick-kernel::kernel::scheduler::tests::serial_host::{exit_drain_abandons_object_wait_exactly_once,exit_drain_control_during_transfer_reaches_the_sibling} (two admitted live sibling threads, task-exit intent, real zone enrollment and executor exit settlement; transfer control delivery already passes on the base, so this does not attribute an idle-vCPU stall)",
  "carrick-kernel::kernel::scheduler::tests::{a_deferred_zone_handback_does_not_audit_a_reaped_target,zone_handback_authenticates_the_registered_continuation} (exact deferred wake target, reaped-task no-op and matching continuation delivery; VM-free only)",
  "carrick-runtime::vcpu_loop::executor::tests::serial_host_captured_service_after_self_affinity_and_futex_wakes_current_idle_slot (real self-affinity, shared-futex wake, service capture and host publication; current-mailbox durable wake before guest entry, one capture and one claim on the allowed CPU)",
  "carrick-sched-core::tests::guest_wake_publication_has_no_remaining_futex_entry (zero attached futex entries at guest queue consumption; populations 1/8/32)",
  "carrick-sched-core::tests::{cancelled_on_cpu_claim_is_retired_by_the_next_handback,an_admitted_cancel_request_does_not_cancel_a_reused_record,exhausted_record_incarnation_is_never_reallocated,late_host_requests_neither_target_nor_mask_a_new_incarnation} (incarnation-bound deferred requests and cancellation-before-handback)",
  "carrick-sched-core::tests::{drain_handback_identity_survives_reuse_before_the_consumer_runs,host_wake_batch_keeps_identity_after_return_and_reuse,service_take_keeps_identity_after_return_and_reuse} (identity captured before host publication, including consumer preemption and returned batches)",
  "carrick-sched-core::tests::{host_claim_is_not_published_before_queue_cleanup,host_claim_cleanup_does_not_unlink_a_replacement_waiter,host_wake_transfer_owns_waitv_cleanup_until_completion,a_host_request_during_transfer_prevents_guest_relocation} (owned transfer, cancellation, waitv cleanup and deferred host requests)",
  "carrick-sched-core::tests::{host_request_wins_against_enrolled_guest_park,host_request_after_guest_park_claims_the_published_wait,requested_running_records_survive_preemption_and_unswitch} (request lifetime through park and queue transitions; VM-free only)",
  "carrick-sched-core::object_wait::host_tests::host_request_after_admission_refuses_the_park (#1467: an OnCpuRequested request landing after object-wait admission refuses the park by claim CAS, keeps host_wanted, leaves no enrollment or operation, then reparks after release; VM-free only)",
  "carrick-sched-core::tests::host_request_after_observation_refuses_the_object_park (#1467: the object-park publication CASes from the observed OnCpu claim; a later host request of any kind refuses it with host_wanted kept and the current handback honoured; VM-free only)",
  "carrick-el1-linux::native_process_runtime::host_test_support::{host_request_during_service_park_yields_then_reparks,host_request_during_exception_service_park_yields_as_exception,host_request_during_fault_service_park_yields_as_exception,host_request_during_owner_wait_park_yields_then_reparks} (#1467: two live processes; a host request on the running child refuses its service or owner-wait park, which yields through the operation's exact owner checkpoint with the exact operation retained instead of NativeServiceQuarantined; exception and fault completions resume through Exception rather than syscall handling; the honoured request reparks and the ticket ACK returns; VM-free only)",
]

