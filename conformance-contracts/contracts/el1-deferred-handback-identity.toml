schema_version = 1
id = "kernel.el1.deferred-handback-identity"
title = "Host handback owns cleanup and preserves incarnation through publication"
guest_surfaces = ["syscall:futex", "scheduler:lifecycle", "syscall:exit_group"]
semantic_authority = ["man 2 futex: wake applies to the selected waiters", "man 2 exit_group: terminate all threads in the process"]
fixture = "unit:deferred_slot_handback_does_not_wake_a_reused_record"
scale_points = [1, 8, 32]
rationale = "An evacuated record may be claimed, retired and reused before its deferred handback is published. The deferred work must retain the original incarnation and may never manufacture readiness for a replacement waiter. The deterministic schedule evacuates N records, retires and replaces each, then delivers the saved handbacks, asserting zero replacement publications and unchanged parked ownership. This is a reduction of a concrete identity gap, not attribution of the historical Python crash. The producer also retains exclusive mutation authority until cleanup finishes; cancellation during a transfer delegates retirement rather than freeing a slot under its producer. Host-claim and waitv fixtures verify this boundary and preserve the owed host request during relocation. Cancellation intent is recorded before returning EL1-held ownership; deferred flags name a non-wrapping record incarnation and cannot target or mask a newer use. Post-publication retirement/restore ownership remains under audit. No timing or structural-observation closure is claimed."

[[structural_budgets]]
kind = "exact"
metric = "wake_publications"
value = 0
layers = ["vm-free"]
rationale = "Delivery of N retired incarnations must publish zero wakes for replacement waiters. Counts cover the actual callback in one synthetic zone at N=1/8/32; this does not bound live-handback work, queue visits or runtime cost."

[bindings]
vm_free = "carrick-kernel::el1_zone::tests::{deferred_capture_precedes_filter_and_releases_queue_authority,serial_host::deferred_capture_does_not_hold_publisher_registration} (capture hook before filtering; released slot and registration locks, replacement stays parked; measurement infrastructure only); carrick-kernel::el1_zone::tests::deferred_slot_handback_does_not_wake_a_reused_record; carrick-sched-core::tests::{drain_handback_identity_survives_reuse_before_the_consumer_runs,host_wake_batch_keeps_identity_after_return_and_reuse,service_take_keeps_identity_after_return_and_reuse} (identity captured before host publication, including consumer preemption and returned batches); carrick-sched-core::tests::guest_wake_publication_has_no_remaining_futex_entry (zero attached futex entries at guest queue consumption; populations 1/8/32); carrick-sched-core::tests::{host_claim_is_not_published_before_queue_cleanup,host_claim_cleanup_does_not_unlink_a_replacement_waiter,host_wake_transfer_owns_waitv_cleanup_until_completion,a_host_request_during_transfer_prevents_guest_relocation} (owned transfer, cancellation, waitv cleanup and deferred host requests); carrick-sched-core::tests::{cancelled_on_cpu_claim_is_retired_by_the_next_handback,an_admitted_cancel_request_does_not_cancel_a_reused_record,exhausted_record_incarnation_is_never_reallocated,late_host_requests_neither_target_nor_mask_a_new_incarnation} (incarnation-bound deferred requests and cancellation-before-handback); carrick-el1::sched::tests::{cancelled_on_cpu_thread_is_not_stranded_by_repark,signal_requested_on_cpu_is_not_lost_by_repark}; carrick-sched-core::tests::{host_request_wins_against_enrolled_guest_park,host_request_after_guest_park_claims_the_published_wait,requested_running_records_survive_preemption_and_unswitch} (request lifetime through park and queue transitions; VM-free only); carrick-kernel::kernel::scheduler::tests::{a_deferred_zone_handback_does_not_audit_a_reaped_target,zone_handback_authenticates_the_registered_continuation} (exact deferred wake target, reaped-task no-op and matching continuation delivery; VM-free only); carrick-kernel::kernel::scheduler::tests::serial_host::failed_zone_load_settlement_retires_only_its_owned_continuation (generic and exact wakes cannot admit a parked context; control claim before lease, exact continuation transfer, one retirement on failed-load settlement and stale delivery after reuse; synthetic region, VM-free only)"

[bindings.unresolved]
embed = "Deterministic signed evacuation/retirement/reuse interleaving remains to be bound."
embed_structural = "Scoped WorkObservation for deferred handback dispatch is not registered yet."
docker = "This internal record-identity interleaving is VM-free; guest futex/lifecycle differential coverage and pinned Python comparison remain required."
observation = "The VM-free retired-delivery fixture now emits source-hashed ContractObservation/WorkSnapshot at 1/8/32 and enforces zero wake publications, with excess-publication negative controls. Live-handback work, queue visits, other producer transitions and signed structural bindings remain open."
