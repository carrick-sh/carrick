schema_version = 1
id = "kernel.file.copyfile-accounting"
title = "Darwin copyfile tries a clone first and preserves actual copied bytes"
guest_surfaces = ["syscall:copy_file_range"]
semantic_authority = ["Linux copy_file_range(2): return the count of bytes actually copied, including zero at EOF; macOS copyfile clone is an equivalent data movement optimization."]
fixture = "unit:copyfile_policy::tests"
scale_points = [1]
structural_budgets = []
rationale = "The eligible full-file transfer attempts an O(1) clone before a data copy and never substitutes the expected length for a reported zero-byte copy. The policy is pure and portable; the Darwin call binding needs the signed Mac gate."

[bindings]
vm_free = "carrick-vfs::copyfile_policy::tests"

[bindings.unresolved]
embed_structural = "Darwin fcopyfile binding needs the director's signed macOS gate."
docker = "Linux oracle for copy_file_range remains with the director gate."
