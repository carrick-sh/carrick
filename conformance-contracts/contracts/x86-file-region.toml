schema_version = 1
id = "kernel.x86.file-region"
title = "CPL0 file records belong to one retained carrier region"
guest_surfaces = ["personality:files", "syscall:dup", "syscall:close", "kernel:current-mm"]
semantic_authority = ["open(2): distinct open descriptions share an inode", "dup(2), close(2): description references and descriptor lifetime", "Issue #330 and approved F2 design: exact carrier region custody"]
fixture = "carrick-x86-cpl0:file_region; carrick-vmm-kvm:cpl0_entry"
scale_points = [1, 16, 20, 128, 512]
rationale = "One checked venue names the shared ABI object/open/fd/name/cache allocations. KVM retains the exact host mapping with its separately typed supervisor VA and GPA. Guest venue authentication checks same-VM header/binding self-consistency plus a per-carrier identity; foreign bindings refuse access. Guest-observed retirement is fixture-only. Descriptor mutation uses one region-resident lock word; host mutations own stopped-carrier execution exclusion and refuse paused CPL0 transactions. Two carriers remain independent; real guest fork/dup/child-exit preserves distinct parent/child descriptor references to the inherited inode. Table witnesses do not claim FileService Open or regular-file I/O acceptance."

structural_budgets = [] # ABI extent/capacity assertions and KVM retained-byte/slot checks.

[bindings]
vm_free = "carrick-x86-cpl0::file_region:: layout_alignment_capacity_and_extent, stdio_parity_and_closed_descriptor_stays_closed, record_beyond_fifteen_uses_shared_capacity, foreign_retired_and_two_carriers, fork_dup_lookup_and_retire_preserve_live_parent (all prefixed file_region_)"

[bindings.unresolved]
x86_cpl0 = "Live KVM bindings: carrick-vmm-kvm::cpl0_boot::cpl0_layout_tests::file_region_published_before_guest_entry , carrick-vmm-kvm::cpl0_shared_entry::production_file_region_stdio_dup_parity and carrick-vmm-kvm::cpl0_entry::{file_region_guest_stdio_parity_and_two_carrier_independence,file_region_guest_closes_record_beyond_fifteen,file_region_guest_refuses_foreign_publication,file_region_guest_refuses_retired_publication}, carrick-vmm-kvm::cpl0_initial_mm::file_region_guest_fork_dup_and_child_retirement_preserve_parent and cpl0_layout_tests::{file_region_host_mutation_refused_while_cpu_running,file_region_host_refuses_paused_cpl0_descriptor_transaction}. Merge-queue NEW=[] receipt remains director-owned."
embed_structural = "Full signed gate on the director's HVF host remains required by the approved F2 exit."
docker = "F2 changes storage venue and carrier custody, not regular-file Open lowering; full file-service differential binding belongs to F4. No Docker is available on the F2 worker."
