schema_version = 1
id = "kernel.x86.file-region"
title = "CPL0 file records belong to one retained carrier region"
guest_surfaces = ["personality:files", "syscall:dup", "syscall:close", "kernel:current-mm"]
semantic_authority = ["open(2): distinct open descriptions share an inode", "dup(2), close(2): description references and descriptor lifetime", "Issue #330 and approved F2 design: exact carrier region custody"]
fixture = "carrick-x86-cpl0:file_region; carrick-vmm-kvm:cpl0_entry"
scale_points = [1, 16, 20, 128, 512]
rationale = "One checked venue names the shared ABI object/open/fd/name/cache allocations. KVM retains the exact host mapping with its separately typed supervisor VA and GPA. Guest access authenticates the current CPU's owner-issued binding; foreign or retired publications cannot grant records. Two carriers remain independent, while two live tasks in one carrier may retain distinct references to one inode. Table witnesses do not claim FileService Open or regular-file I/O acceptance."

structural_budgets = [] # ABI extent/capacity assertions and KVM retained-byte/slot checks.

[bindings]
vm_free = "carrick-x86-cpl0::file_region:: layout_alignment_capacity_and_extent, stdio_parity_and_closed_descriptor_stays_closed, record_beyond_fifteen_uses_shared_capacity, foreign_retired_and_two_carriers, two_live_tasks_share_inode_with_distinct_open_references (all prefixed file_region_)"

[bindings.unresolved]
x86_cpl0 = "Live KVM bindings: carrick-vmm-kvm::cpl0_boot::cpl0_layout_tests::file_region_published_before_guest_entry , carrick-vmm-kvm::cpl0_shared_entry::production_file_region_stdio_dup_parity and carrick-vmm-kvm::cpl0_entry::{file_region_guest_stdio_parity_and_two_carrier_independence,file_region_guest_closes_record_beyond_fifteen,file_region_guest_refuses_foreign_publication,file_region_guest_refuses_retired_publication,file_region_guest_two_live_tasks_keep_distinct_open_references}. Merge-queue NEW=[] receipt remains director-owned."
embed_structural = "Full signed gate on the director's HVF host remains required by the approved F2 exit."
docker = "F2 changes storage venue and carrier custody, not regular-file Open lowering; full file-service differential binding belongs to F4. No Docker is available on the F2 worker."
