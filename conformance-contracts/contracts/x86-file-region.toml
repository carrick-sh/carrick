# #1580 derives KVM lifecycle sidecar placement from the shared guest layout.
# cpl0_lifecycle::x5_shared_clone_exit and cpl0_fork_e2e are the real-KVM
# red/green controls; this contract's guest semantics and budgets are unchanged.
# See docs/conformance-contracts/kvm-lifecycle-sidecars.md for the scoped proof.
# #1394: additional ABI bookkeeping witness only; existing semantic and
# work-budget bindings remain authoritative. Census publication reads counters
# after executor join and does not alter this contract's guest operation.
# #1028: type physical custody diagnostic reasons; no change to this
# contract's semantics or work budgets. The host dispatch test
# physical_custody_reasons_preserve_fatal_codes_and_debug_text checks
# reason codes and unchanged text; retain the existing execution controls.
schema_version = 1
id = "kernel.x86.file-region"
title = "CPL0 file records belong to one retained carrier region"
guest_surfaces = ["personality:files", "syscall:dup", "syscall:close", "kernel:current-mm"]
semantic_authority = ["open(2): distinct open descriptions share an inode", "dup(2), close(2): description references and descriptor lifetime", "Issue #330 and approved F2 design: exact carrier region custody"]
fixture = "carrick-x86-cpl0:file_region; carrick-vmm-kvm:cpl0_entry"
scale_points = [1, 16, 20, 128, 512]
rationale = """
One checked venue names the shared ABI object/open/fd/name/cache allocations. KVM retains the exact host mapping with its separately typed supervisor VA and GPA. Guest venue authentication checks same-VM header/binding self-consistency plus a per-carrier identity; foreign, unpublished and retired bindings have distinct refusals. Guest-observed retirement is fixture-only. Descriptor mutation uses one region-resident lock word; host mutations own stopped-carrier execution exclusion and refuse paused CPL0 descriptor transactions. Guest admission never waits on host custody, and poisoning is a typed fatal. This is not inode-lock quiescence: a kicked CPU can hold an inode lock (F3/F4 constraint). Single-step fixtures use exclusive mutable carrier custody; M1 create_stopped has no F2 registration. Two carriers remain independent; real guest fork/dup/child-exit preserves distinct parent/child descriptor references to the inherited inode. Exact shared-open ring-reference counts are 1 before fork, 4 after both dup calls, and 3 after child retirement with the independently admitted idle-peer stdout included; the VM-free twin checks 1, 2, 4, 2 without that peer. Table witnesses do not claim FileService Open or regular-file I/O acceptance.

#671 R1c neutral CPL0 boot extraction: the helper boundary preserves the
existing descriptor writes and ordering. Existing Linux/KVM bindings run:
cpl0_boot::birth_source_tests::bootstrap_metadata_records_are_disjoint_before_root_binding,
cpl0_boot::initial_reply_tests::shared_physical_staging_rolls_back_before_exposure,
cpl0_boot::initial_reply_tests::inventory_retains_two_live_owner_selected_mms,
cpl0_boot::initial_reply_tests::initial_inventory_refuses_a_receipt_from_another_mm,
cpl0_boot::cpl0_layout_tests::file_region_published_before_guest_entry
No retry, signed acceptance, or runtime-ratio claim; semantics and budgets
remain unchanged.

#671 R3 fixture-map extraction moves supervisor_maps, lapic_map and data_map
with their layout assertions into the neutral boot coordinator. Function
bodies and map geometry are unchanged; cross-crate visibility is widened.
Existing KVM bindings x5_shared_clone_exit,
entry_kick_and_timer_preempt_two_private_contexts and
return_kick_and_timer_preempt_two_private_contexts exercise the retained maps.
The existing CPL0 initial-MM, file-region and entropy bindings also run through
this bootstrap. CPUID bindings provide gate coverage; no descriptor-path
coverage. No scheduler policy, binding, budget or runtime-ratio claim changes.

#671 R3 owned preparation extraction: prepare_boot returns PreparedBoot before
backend registration. RAM, the ELF plan, table capacity, IPC backings and their
generation, and kernel pod storage move without copying bytes or allocations.
The original preparation block retains its validation and publication order;
only module paths and the borrowed inventory boundary change. Existing bound
KVM initial-MM, IPC, lifecycle, file-region and entropy witnesses named here
exercise that same bootstrap. The neutral bootstrap descriptor byte witness
initialize_bootstrap_descriptors_has_exact_bytes also runs. CPUID and segment
bindings provide gate coverage; no descriptor-path coverage (follow-up #2476).
The scheduler fixtures entry_kick_and_timer_preempt_two_private_contexts and
return_kick_and_timer_preempt_two_private_contexts exercise both retained roots.
No bindings, semantic expectations, structural budgets or acceptance layers
change; signed acceptance and runtime-ratio promotion remain director-owned.

#671 M1-1 shared boot extraction: install_boot_memory (generic over
CarrierMemoryIo) now holds KVM's post-preparation memory registration, and
load_guest_mm with publish_production_reservations is generic over
Cpl0BootCarrier. bind_initial_task_identity, bind_execution and
initial_mm_key moved onto BootstrapCustody, and initial_extent_bytes_for
and unexpected_boot_wake are shared functions. KVM delegates to all of
them. The moved bodies keep their validation, publication order and
errors: only indentation, module paths, borrow spellings and the
custody/CPU accessors change. KVM's kernel entry keeps the original
sregs/MSR/regs ioctl sequence. just test-kvm passed with exit 0 at
c744a7e13 (patch-identical code at 66eb87b3a) in both partitions, including KVM lib (47) and neutral host
lib (106). The soft carrier (carrick-vmm-soft) is the second production
caller; its probe admits an initial MM through the same functions. No
bindings, semantic expectations, structural budgets or acceptance layers
change. Signed acceptance and runtime-ratio promotion remain
director-owned.
"""

# ABI unit witness asserts zero CAS attempts while observed held, then one
# acquiring CAS after release. This no_std atomic witness uses no WorkMeter.
