schema_version = 1
id = "kernel.x86.file-region"
title = "CPL0 file records belong to one retained carrier region"
guest_surfaces = ["personality:files", "syscall:dup", "syscall:close", "kernel:current-mm"]
semantic_authority = ["open(2): distinct open descriptions share an inode", "dup(2), close(2): description references and descriptor lifetime", "Issue #330 and approved F2 design: exact carrier region custody"]
fixture = "carrick-x86-cpl0:file_region; carrick-vmm-kvm:cpl0_entry"
scale_points = [1, 16, 20, 128, 512]
rationale = "One checked venue names the shared ABI object/open/fd/name/cache allocations. KVM retains the exact host mapping with its separately typed supervisor VA and GPA. Guest venue authentication checks same-VM header/binding self-consistency plus a per-carrier identity; foreign, unpublished and retired bindings have distinct refusals. Guest-observed retirement is fixture-only. Descriptor mutation uses one region-resident lock word; host mutations own stopped-carrier execution exclusion and refuse paused CPL0 descriptor transactions. Guest admission never waits on host custody, and poisoning is a typed fatal. This is not inode-lock quiescence: a kicked CPU can hold an inode lock (F3/F4 constraint). Single-step fixtures use exclusive mutable carrier custody; M1 create_stopped has no F2 registration. Two carriers remain independent; real guest fork/dup/child-exit preserves distinct parent/child descriptor references to the inherited inode. Exact shared-open ring-reference counts are 1 before fork, 4 after both dup calls, and 3 after child retirement with the independently admitted idle-peer stdout included; the VM-free twin checks 1, 2, 4, 2 without that peer. Table witnesses do not claim FileService Open or regular-file I/O acceptance."

# ABI unit witness asserts zero CAS attempts while observed held, then one
# acquiring CAS after release. This no_std atomic witness uses no WorkMeter.
structural_budgets = []

[bindings]
# The signal-delivery move in linux_personality.rs changes no file-region
# custody or descriptor operation. The file_region suite remains the positive
# venue/descriptor witness; x86 machine-frame conversion stays in this adapter.
vm_free = "carrick-x86-cpl0-host::cpl0_boot::initial_reply_tests::{shared_physical_staging_rolls_back_before_exposure,inventory_retains_two_live_owner_selected_mms,initial_inventory_refuses_a_receipt_from_another_mm} (shared initial physical grant staging: exact-MM custody and rollback before exposure; existing file-region semantics unchanged); carrick-x86-cpl0::file_region:: layout_alignment_capacity_and_extent, stdio_parity_and_closed_descriptor_stays_closed, record_beyond_fifteen_uses_shared_capacity, foreign_retired_and_two_carriers, fork_dup_lookup_and_retire_preserve_live_parent, unpublished_is_distinct_from_retired (all prefixed file_region_); carrick-el1-abi::tests::fd_map_waiter_does_no_rmw_while_lock_is_observed_held"

[bindings.unresolved]
terminal_open_release = "F3 (issue #384) owns region-indexed terminal open retirement: queue_open_release still suppresses x86 exit-time keys. Pass the authenticated FileTables/binding region to the producer, retain per-carrier host open cleanup custody, and drain that region's pending keys at host boundaries including child exit. The KVM executor currently acknowledges only explicit stdio HostObjectReleaseCrossing records; it does not consume OpenReferencePending. The existing owned_recall drain uses the global ARM aperture and ALLOCATED_OPEN_FILES ownership, not F2 carrier custody. Required live witness: child holds the last reference to a host-bound open, exits without close, and the host observes Terminal and retires the exact host object once. F2 table witnesses do not prove this lifecycle."
x86_cpl0 = "Live KVM bindings: carrick-vmm-kvm::cpl0_boot::cpl0_layout_tests::file_region_published_before_guest_entry , carrick-vmm-kvm::cpl0_shared_entry::production_file_region_stdio_dup_parity and carrick-vmm-kvm::cpl0_entry::{file_region_guest_stdio_parity_and_two_carrier_independence,file_region_guest_closes_record_beyond_fifteen,file_region_guest_refuses_foreign_publication,file_region_guest_refuses_retired_publication,file_region_guest_refuses_unpublished_binding}, carrick-vmm-kvm::cpl0_initial_mm::file_region_guest_fork_dup_and_child_retirement_preserve_parent and cpl0_layout_tests::{file_region_host_mutation_refused_while_cpu_running,file_region_host_refuses_paused_cpl0_descriptor_transaction,file_region_run_refuses_host_access_without_waiting,file_region_poisoned_admission_is_repeated_typed_fatal}. Merge-queue NEW=[] receipt remains director-owned."
embed_structural = "Full signed gate on the director's HVF host remains required by the approved F2 exit."
docker = "F2 changes storage venue and carrier custody, not regular-file Open lowering; full file-service differential binding belongs to F4. No Docker is available on the F2 worker."
