  "carrick-x86-cpl0-host::cpl0_boot::initial_reply_tests::{shared_physical_staging_rolls_back_before_exposure,inventory_retains_two_live_owner_selected_mms,initial_inventory_refuses_a_receipt_from_another_mm} (shared initial physical grant staging: exact-MM custody and rollback before exposure; existing file-region semantics unchanged)",
  "carrick-x86-cpl0::file_region:: layout_alignment_capacity_and_extent, stdio_parity_and_closed_descriptor_stays_closed, record_beyond_fifteen_uses_shared_capacity, foreign_retired_and_two_carriers, fork_dup_lookup_and_retire_preserve_live_parent, unpublished_is_distinct_from_retired (all prefixed file_region_)",
  "carrick-el1-abi::tests::fd_map_waiter_does_no_rmw_while_lock_is_observed_held",
  "carrick-el1-abi::tests::an_image_built_against_another_layout_is_refused (shared ABI identity and EL1_NAME_CACHE_SIZE/alignment asserts include seqlock-backed InotifyNameCache; carrick-x86-cpl0::file_region::file_region_layout_alignment_capacity_and_extent re-verified; no new file-region custody or KVM claim)",
  "carrick-x86-cpl0-host::cpl0_boot::birth_source_tests::bootstrap_metadata_records_are_disjoint_before_root_binding (bootstrap control-layout precondition for the existing KVM file-region fixtures; file-region storage and descriptor semantics unchanged)",
  "carrick-el1-abi::refusal_census_tests::refusal_snapshot_preserves_caller_populations_without_changing_service_counts",
  "carrick-el1-abi::tests::an_image_built_against_another_layout_is_refused",
  "carrick-el1-abi::tests::layout_hash_changes_when_any_fact_changes",
]

[bindings.unresolved]
terminal_open_release = "F3 (issue #384) owns region-indexed terminal open retirement: queue_open_release still suppresses x86 exit-time keys. Pass the authenticated FileTables/binding region to the producer, retain per-carrier host open cleanup custody, and drain that region's pending keys at host boundaries including child exit. The KVM executor currently acknowledges only explicit stdio HostObjectReleaseCrossing records; it does not consume OpenReferencePending. The existing owned_recall drain uses the global ARM aperture and ALLOCATED_OPEN_FILES ownership, not F2 carrier custody. Required live witness: child holds the last reference to a host-bound open, exits without close, and the host observes Terminal and retires the exact host object once. F2 table witnesses do not prove this lifecycle."
