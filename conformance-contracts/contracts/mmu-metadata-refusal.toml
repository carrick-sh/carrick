schema_version = 1
id = "kernel.mm.metadata-refusal"
title = "MMU metadata allocation admission, refusal recovery, and zero-allocation rollback"
guest_surfaces = [
  "kernel:stage1_mmu",
  "kernel:undo_journal",
  "syscall:mmap",
  "syscall:mprotect",
  "syscall:munmap",
]
semantic_authority = [
  "man 2 mmap: MAP_PRIVATE | MAP_ANONYMOUS creates a private mapping whose pages and protections are preserved upon transaction failure",
  "Linux mm semantics: Carrick kernel preserves internal page table consistency and stage-1 descriptor authority on failed memory management transactions, avoiding corrupted state or descriptor authority leakage (distinguished from an unproven blanket guarantee that all failed mprotect calls are atomic across partial range splits)",
  "Arm Architecture Reference Manual Armv8-A D5: stage-1 translation preserves existing descriptor authority when a table update transaction is rolled back or aborted",
]
fixture = "mmu:metadata-refusal 1|8|32|128"
scale_points = [1, 8, 32, 128]
rationale = "Neutral MMU edit, publication, and rollback transactions must recover deterministically from metadata allocation refusal without aborting, leaking grants, or corrupting live descriptor authority. All collection capacities (descriptor undo pre-images, staged writes, dirty locations, owned table expansion, arena tracking, and free-table reclamation lists) must be admitted through fallible reservations before corresponding recoverable mutations. Rollback consumes pre-admitted storage and performs zero heap allocations, including extension-arena return bookkeeping. Capacity failure when requesting a stage-1 extension arena returns any unused grant exactly once. Transactions must preserve authoritative descriptors, translation outcomes, owner generations, and subsequent mutation capability under repeated failure and retry cycles at scales 1, 8, 32, and 128."

[bindings]
vm_free = "carrick-mmu-core::aarch64::tests::metadata_refusal_contract; carrick-mmu-core::aarch64::tests::test_metadata_refusal_witness_rollback_allocations; carrick-aarch64::stage1_authority::tests::stage1_authority_metadata_refusal_propagation"

[bindings.unresolved]
embed = "Signed guest execution pending in-guest EL1 MMU service bring-up; host VM-free tests prove transactional admission, zero-allocation rollback, and genuine allocator refusal."
docker = "Docker oracle differential comparison is maintained for user-visible syscall boundaries; metadata transaction failure recovery operates at the internal kernel MMU substrate."
embed_structural = "Structural budgets for zero-allocation rollback and bounded admission are verified via VM-free allocator witnesses across 1, 8, 32, and 128 extension scales."
embed_timing = "Timing ratio is not asserted for internal kernel MMU metadata refusal."

[[structural_budgets]]
kind = "exact"
metric = "host_heap_allocations"
value = 0
rationale = "Rollback must consume pre-admitted capacity and never allocate heap memory, even when returning extension arenas. The bound VM-free witness additionally asserts zero rollback requested bytes and derives admission allocation/byte bounds from descriptor population and geometric container growth."
