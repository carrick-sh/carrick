schema_version = 1
id = "arm.softcpu.handoff-residency"
title = "Keep soft AArch64 compiled code resident across provider exits without serving stale code"
guest_surfaces = ["isa:aarch64", "vmm:soft", "syscall:getpid", "syscall:mprotect", "syscall:mmap", "syscall:munmap", "syscall:read"]
semantic_authority = [
  "Arm ARM DDI0487G.a C6.2 instruction semantics for SVC, STR (immediate) and B.",
  "Arm ARM DDI0487G.a instruction cache maintenance (IC IVAU, IC IALLU) for modified instructions; arm64 Linux makes a new user-executable mapping coherent when it is installed.",
  "man 2 mprotect, mmap (MAP_FIXED), munmap, read, getpid, exit_group.",
]
fixture = "carrick-softcpu-aarch64-host::soft_dispatch_witness"
scale_points = [10, 100]
rationale = "Each provider exit and block quantum is a new dispatcher call. Code emitted for the loop's hot set (svc, b, and the hvc #2 and eret vector blocks) plus the one-time path to the first svc stays resident, so emissions do not grow with the number of handoffs."

[[structural_budgets]]
kind = "upper-bound"
metric = "softcpu_block_emits"
maximum = 9
layers = ["vm-free"]
rationale = "Nine blocks reach the first svc and run the loop at 10 and at 100 handoffs. Main emitted 47 and 407."

[bindings]
vm_free = [
  "carrick-softcpu-aarch64-host::soft_dispatch_witness::soft_carrier_emits_the_hot_set_once_across_provider_exits",
  "carrick-softcpu-aarch64-host::soft_dispatch_witness::soft_carrier_serves_rewritten_code_and_faults_after_prot_none",
  "carrick-softcpu-aarch64-host::soft_dispatch_witness::soft_carrier_serves_rewritten_code_and_the_remapped_page",
  "carrick-softcpu-aarch64-host::soft_dispatch_witness::soft_carrier_faults_after_munmap_of_resident_code",
]
[bindings.unresolved]
embed_structural = "The soft AArch64 carrier runs in carrick-softcpu-aarch64-host test binaries; CLI carrier wiring lands in a later #1236 slice."
signed = "The soft carrier does not boot through HVF; native ARM64 block execution runs on the hosted soft-aarch64-native job."
docker = "The witnesses check served instruction words, exit codes and fault addresses directly. No Docker ratio is claimed for the soft lane."
