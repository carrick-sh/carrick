# #2306: wait_query parks pre-reap status-copy OwnerWait via the existing
# owner-service continuation. The host fixture gains a status-copy refusal
# and a real fork/exit/wait witness under kernel.memory.owner-wait.
# This family's contract expectations, bindings and budgets are unchanged.
# #1093 S4c slice a: `native_process_runtime/host_test_support.rs` adds dual-ISA
# post-no-return exec SIGSEGV and lost-race witnesses bound under
# process.exec.custody. No change to this contract's guest semantics, bindings
# or budgets.
# #2621: select/pselect6 over several zone descriptors is a client of the
# zone epoll owner (a transient epoll the operation pins); the multi-fd
# witnesses are bound below. Guest semantics and budgets are unchanged.
# #2621 (#2730): a fork child's select set with HOST members (sockets,
# regular files; a single host descriptor too) reads their levels from the
# thread's host set, nested in the transient set; any other host kind
# leaves the whole call a counted ENOSYS. Witnesses bound below; budgets
# are unchanged.
schema_version = 1
id = "kernel.el1.poll-select-owner"
title = "One readiness owner for zone and mixed waitsets"
guest_surfaces = ["syscall:poll", "syscall:ppoll", "syscall:select", "syscall:pselect6", "syscall:epoll_pwait"]
semantic_authority = ["man 2 poll", "man 2 select", "man 7 epoll"]
fixture = "VM-free scoped two-owner seam; see M2-M5 witness ledger"
scale_points = [1, 8, 64]
rationale = "Zone wait enrollment must create zero host readiness proxies at each scale; count only scoped proxy handles, never global fd deltas. Poll output publishes exactly one two-byte revents field per entry, without rewriting fd or events; the dispatcher witness counts writes at all scale points. Existing epoll record tests prove LT/ET/ONESHOT and detach, not mixed completion incarnation or mask transactions."
