schema_version = 1
id = "kernel.inotify.watch"
title = "Private-rootfs inotify watch scaling"
guest_surfaces = [
  "syscall:inotify_init1",
  "syscall:inotify_add_watch",
  "syscall:inotify_rm_watch",
  "kernel:inotify",
  "syscall:write",
]
semantic_authority = [
  "man 2 inotify_init1",
  "man 2 write",
  "man 7 inotify",
  "man 2 inotify_add_watch",
  "man 2 inotify_rm_watch",
  "conformance-probes/probe-inventory.json:inotifymatrix",
]
fixture = "probe:inotifymatrix"
scale_points = [1, 8, 32, 128]
rationale = "The fixture watches Carrick's private rootfs, whose mutations are complete in the unified kernel graph. Registration and removal stay virtual there; externally mutable bind mounts retain native vnode watches."

[bindings]
vm_free = "carrick-kernel-example::inotify_watch_contract"
embed = "carrick-embed::inotify_watch_contract"
docker = "probe:inotifymatrix"
ecosystem = ["ltp:inotify09", "ltp:inotify11"]

[[structural_budgets]]
kind = "exact"
metric = "host_backend_calls"
value = 0
rationale = "A private-rootfs watch performs no native registration or deregistration because every guest mutation is delivered by the fork-coherent dispatch registry."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
