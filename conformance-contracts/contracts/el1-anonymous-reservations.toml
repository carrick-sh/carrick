  "carrick-kernel::kernel::frame_inventory::tests::published_mapping_can_split_into_exact_subranges_of_the_same_frame (production fragment events preserve pending retirement through splitting and the final ordinary unmap)",
  "carrick-x86-cpl0-host::carrier_memory::tests::{stale_absence_preserves_successor_and_live_peer,whole_mm_permit_survives_backend_refusal} (production terminal release authenticates the root before retirement, retains exact permits across refusal, and joins the backend receipt after residency and custody release; real memslot binding in carrick-vmm-kvm::carrier_memory::memslot_tests)",
  "carrick-kernel::kernel::frame_inventory::physical_projection_tests::child_release_join_refuses_foreign_half_without_replacing_original_inventory (neutral release owner preserves the inventory half on rejected backend join)",
  "carrick-x86-cpl0-host::carrier_memory::tests::pending_permit_waits_for_final_vm_owner (preallocated backing/retirement handoff; real KVM bindings additionally retain a live vCPU and sibling VM after outer-wrapper destruction)",
  "carrick-hal::fork_stock::tests::admitted_abort_retains_release_progress_and_pins_across_refusal (admitted abort owns exact release progress, excludes commit after partial release, retains physical pins through refusal, rejects stale execution, and settles once; VM-free only)",
  "carrick-kernel::kernel::frame_inventory::tests::unpublished_fork_abort_retains_real_permits_across_refusal (1100 unpublished aborts through production fork stock and real inventory, a live parent, refused transfer then exact retry, same inventory revision, one consumed permit and zero abandonment; no runtime abort continuation claim)",
]
embed = [
  "carrick-embed::el1_sched::el1_anonymous_reservations_stay_in_guest",
]

[bindings.unresolved]
kvm = "Executing x86 binding: carrick-vmm-kvm::cpl0_entry::production_anonymous_protect_and_partial_unmap_stay_in_ring. Requires real KVM; the contract evaluator has no registered KVM observation layer."
docker = "Native arm64 Docker differential verification for multi-scale anonymous reservations; automated same-source binding remains open."
embed_structural = "Not yet a registered WorkObservation binding: the signed test (`el1_anonymous_reservations_stay_in_guest`) asserts, outside the contract evaluator, served mmap >= count, served brk >= 2, forwarded mmap/brk equal across scales and an exit slope below 0.125 exits per added reservation (a fractional per-unit slope is not expressible in the integer affine budget schema). Intent: assert guest-served mmap and brk counters cover every reservation, forwarded mmap/brk counts identical across 64, 256 and 1024 operations, and incremental host-exit slope < 0.125 exits per reservation."
production = "Migrate production brk and mmap dispatch handlers from unconditional Forward to authoritative EL1 service backed by the shared reservation authority."

# Declared from the assertions of `el1_anonymous_reservations_stay_in_guest`
# (scales 64/256/1024): (1) served mmap[222] >= count and served brk[214] >= 2
# per run; (2) forwarded mmap and brk counts identical at every scale; (3)
# incremental host-exit slope < 0.125 exits per added reservation. The metric
# vocabulary (`WorkMetric`) has no per-syscall served/forwarded counters and the
# affine schema has integer `per_unit` only, so (1) and (3) stay asserted by the
# embed test (`bindings.unresolved.embed_structural`); (2) is declared below as
# its structural consequence: forwarded host dispatches do not grow with the
# reservation count.
[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 256
per_unit = 0
layers = ["embed-structural"]
rationale = "Forwarded mmap/brk do not grow with the number of reservations: every anonymous mmap (including MAP_FIXED) and the brk growth and shrink are served at EL1, so host dispatches are the fixture's fixed start-up population, identical at 64, 256 and 1024 reservations. The base is a ceiling for that scaffolding, not a per-reservation allowance; the embed test additionally asserts equality of the forwarded mmap[222] and brk[214] counts across scales."
