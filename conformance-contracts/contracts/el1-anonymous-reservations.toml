  "carrick-el1::memory::tests::delegated::mmap_stack_hint_is_served_like_private_anonymous (MAP_STACK is a hint served by the root; MAP_GROWSDOWN keeps the host decoder)",
  "carrick-el1::memory::tests::delegated::two_isa_anonymous_edits_publish_to_a_live_peer",
  "carrick-x86-cpl0::anonymous_refusal_tests::both_linux_decoders_project_the_same_anonymous_call",
  "carrick-core::mm::reservation::root::tests::{return_tokens_cannot_cross_tables_with_identical_numeric_ids,journal_join_preserves_proofs_when_given_another_table,journal_join_rejects_foreign_inventory_with_same_numeric_owner,retired_journal_release_before_borrowed_root_retirement_joins_once,retired_journal_recycled_slots_and_same_raw_mm_do_not_touch_successor} (slice 2a token identity only; eager clearing remains until 2b)",
