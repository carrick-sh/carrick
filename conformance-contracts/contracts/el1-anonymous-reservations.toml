  "carrick-core::mm::retirement::nonce_tests::release_record_pin_outcome_classifies_held_premapped_and_predecessor (last requested mapped pin yields neutral ReadyToRetry; premapped safe-point retirement and superseded predecessors retain their existing verdicts)",
  "carrick-core-abi::mm::inventory::tests::{mm_release_requires_empty_inventory_and_preserves_exact_owner,mm_release_join_rejects_foreign_origin_owner_revision_and_transaction} (two-half receipt identity only; backend permit consumption remains pending)",
  "carrick-thread::physical_retirement::tests (S2b exact-record completion enrollment, release-before-enrollment, identity/reuse control, cancellation, deferred callback publication, typed producer abandonment and revocation of captured callbacks; no native Pending ACK or service-budget claim)",
  "carrick-vmm-hvf::trap::global_frame::allocator_stats_tests::{physical_retirement_enrollment_and_last_pin_use_the_existing_idle_owner,physical_retirement_failed_finalization_preserves_pending_completion,physical_retirement_interim_backing_survives_idle_until_issuing_mm_retirement} (macOS adapter witnesses: actual retained pins, the existing idle retirement owner, exact retained owner/backing lifetime, a second MM, and fresh generation on IPA reuse; execution requires the signed host lane)",
  "carrick-kernel::dispatch::mem::delegated_tests::{delegated_host_stock_keeps_fragmented_window_first_touch,delegated_host_stock_keeps_planning_during_fork_pending}",
  "carrick-core::mm::reservation::root::tests::{stock_policy_host_preserves_pending_fork_and_eligibility_rules,stock_policy_host_observations_are_uncapped_and_native_remains_bounded} (Slice 1 correction: one planner with typed host-unbounded/native-bounded rules; existing host answers preserved, native policy unused until later native integration)",
  "carrick-kernel::kernel::frame_inventory::physical_projection_tests::{backing_reply_withdrawal_restores_inventory_before_allocation_release,backing_reply_two_live_owners_restore_preimage_or_retain_failed_custody,pinned_backing_settlement_retains_the_transaction_until_retirement,unpublished_pin_retention_keeps_mm_admission_open} (Slice 3: mapping-bound physical reply transaction, exact inventory preimage, ordinary pin retention through issuing-MM retirement, and fail-closed release/undo/ACK failures; stock adoption, lifecycle and returns remain open)",
  "carrick-kernel::kernel::frame_inventory::physical_projection_tests::{unpublished_backing_refusal_restores_two_live_mm_inventory_before_release,unpublished_backing_refusal_keeps_allocation_on_indeterminate_rollback,unpublished_backing_drop_rolls_back_and_retains_indeterminate_custody} (Slice 2 part 1: pre-offer inventory/allocation custody only; two live inventory owners and root-incarnation reuse, no native stock publication or full reply/return settlement claim)",
  "carrick-core::mm::reservation::root::tests::{private_stock_plan_future_holes_are_exact_mm_and_revalidated,private_stock_plan_excludes_occupancy_and_bounds_fragmented_inputs,private_stock_plan_rejects_nonprivate_file_heap_and_inaccessible_nodes} (Slice 1 shared selection and revalidation only; two live roots, pending/owed/occupancy exclusions, no native publication or service-budget claim)",
