schema_version = 1
id = "kernel.el1.anonymous-reservations"
title = "Guest EL1 authoritative anonymous reservations and brk/mmap semantics"
guest_surfaces = [
  "syscall:mmap",
  "syscall:brk",
  "syscall:mremap",
  "kernel:stage1-mmu",
  "kernel:frame-inventory",
  "vmm:hvf",
]
semantic_authority = [
  "committed arm64 memflagmatrix oracle: mmap protection bit 1<<28 is accepted; unrepresented EL1 protection bits retain host decoding",
  "man 2 mmap: MAP_PRIVATE | MAP_ANONYMOUS creates a zero-filled private mapping without file backing",
  "man 2 mmap: MAP_FIXED / MAP_FIXED_NOREPLACE place or replace mappings at exact page-aligned addresses",
  "man 2 mmap: MAP_STACK is a hint for thread stacks with no effect on the mapping; Rust std maps its signal stack MAP_PRIVATE|MAP_ANONYMOUS|MAP_STACK",
  "man 2 brk: brk changes the location of the program break, allocating or releasing memory at the heap boundary",
  "Arm A-profile exception and translation architecture: guest EL1 owns translation-table installation and reservation tracking",
]
fixture = "embed:el1-sched anonymous-reservations 64|256|1024"
scale_points = [64, 256, 1024]
rationale = "EL1 increment 2 anonymous reservation checkpoint (TASK 1). Under the authoritative EL1 memory model, anonymous reservations (mmap and brk) are decided directly by EL1 without forwarding the system call to the host. The guest kernel maintains virtual memory area (VMA) tracking, address-space holes, placement, MAP_FIXED replacement, and byte-precise break growth and shrink. Memory pages are committed lazily on first touch via authenticated host bulk frame extents, rather than requiring synchronous host reservation RPCs. The signed three-scale witness verifies that anonymous mmap and brk calls are served directly in EL1 (served[222] and served[214]), that forwarded mmap/brk counts do not grow with the reservation count, and that host exits remain sublinear in the reservation count."

[bindings]
vm_free = [
  "carrick-core::mm::retirement::nonce_tests::release_record_pin_outcome_classifies_held_premapped_and_predecessor (last requested mapped pin yields neutral ReadyToRetry; premapped safe-point retirement and superseded predecessors retain their existing verdicts)",
  "carrick-thread::physical_retirement::tests (S2b exact-record completion enrollment, release-before-enrollment, identity/reuse control, cancellation, deferred callback publication, typed producer abandonment and revocation of captured callbacks; no native Pending ACK or service-budget claim)",
  "carrick-vmm-hvf::trap::global_frame::allocator_stats_tests::{physical_retirement_enrollment_and_last_pin_use_the_existing_idle_owner,physical_retirement_failed_finalization_preserves_pending_completion,physical_retirement_interim_backing_survives_idle_until_issuing_mm_retirement} (macOS adapter witnesses: actual retained pins, the existing idle retirement owner, exact retained owner/backing lifetime, a second MM, and fresh generation on IPA reuse; execution requires the signed host lane)",
  "carrick-kernel::dispatch::mem::delegated_tests::{delegated_host_stock_keeps_fragmented_window_first_touch,delegated_host_stock_keeps_planning_during_fork_pending}",
  "carrick-core::mm::reservation::root::tests::{stock_policy_host_preserves_pending_fork_and_eligibility_rules,stock_policy_host_observations_are_uncapped_and_native_remains_bounded} (Slice 1 correction: one planner with typed host-unbounded/native-bounded rules; existing host answers preserved, native policy unused until later native integration)",
  "carrick-kernel::kernel::frame_inventory::physical_projection_tests::{backing_reply_withdrawal_restores_inventory_before_allocation_release,backing_reply_two_live_owners_restore_preimage_or_retain_failed_custody,pinned_backing_settlement_retains_the_transaction_until_retirement,unpublished_pin_retention_keeps_mm_admission_open} (Slice 3: mapping-bound physical reply transaction, exact inventory preimage, ordinary pin retention through issuing-MM retirement, and fail-closed release/undo/ACK failures; stock adoption, lifecycle and returns remain open)",
  "carrick-kernel::kernel::frame_inventory::physical_projection_tests::{unpublished_backing_refusal_restores_two_live_mm_inventory_before_release,unpublished_backing_refusal_keeps_allocation_on_indeterminate_rollback,unpublished_backing_drop_rolls_back_and_retains_indeterminate_custody} (Slice 2 part 1: pre-offer inventory/allocation custody only; two live inventory owners and root-incarnation reuse, no native stock publication or full reply/return settlement claim)",
  "carrick-core::mm::reservation::root::tests::{private_stock_plan_future_holes_are_exact_mm_and_revalidated,private_stock_plan_excludes_occupancy_and_bounds_fragmented_inputs,private_stock_plan_rejects_nonprivate_file_heap_and_inaccessible_nodes} (Slice 1 shared selection and revalidation only; two live roots, pending/owed/occupancy exclusions, no native publication or service-budget claim)",
  "carrick-kernel::dispatch::mem::delegated_tests::delegated_private_stock_policy_keeps_two_live_mms_independent (host adapter only)",
  "carrick-el1-linux::aarch64_process_tests::native_fault_supply_tests::anonymous_reservation_first_touch_service_budget (red on main: production mmap, first-touch physical-supply selections and authenticated descriptor grants at 64/256/1024; necessary service-request slope <1/8, no transport or HVF exit census)",
  "carrick-el1::memory::tests::delegated::mmap_unrepresented_protection_preserves_host_linux_decoder (decoder fallback only; live descriptor publication requires embed)",
  "carrick-el1::memory::tests::delegated::mmap_stack_hint_is_served_like_private_anonymous (MAP_STACK is a hint served by the root; MAP_GROWSDOWN keeps the host decoder)",
]
embed = [
  "carrick-embed::el1_sched::el1_anonymous_reservations_stay_in_guest",
]

[bindings.unresolved]
docker = "Native arm64 Docker differential verification for multi-scale anonymous reservations; automated same-source binding remains open."
embed_structural = "Not yet a registered WorkObservation binding: the signed test (`el1_anonymous_reservations_stay_in_guest`) asserts, outside the contract evaluator, served mmap >= count, served brk >= 2, forwarded mmap/brk equal across scales and an exit slope below 0.125 exits per added reservation (a fractional per-unit slope is not expressible in the integer affine budget schema). Intent: assert guest-served mmap and brk counters cover every reservation, forwarded mmap/brk counts identical across 64, 256 and 1024 operations, and incremental host-exit slope < 0.125 exits per reservation."
production = "Migrate production brk and mmap dispatch handlers from unconditional Forward to authoritative EL1 service backed by the shared reservation authority."

# Declared from the assertions of `el1_anonymous_reservations_stay_in_guest`
# (scales 64/256/1024): (1) served mmap[222] >= count and served brk[214] >= 2
# per run; (2) forwarded mmap and brk counts identical at every scale; (3)
# incremental host-exit slope < 0.125 exits per added reservation. The metric
# vocabulary (`WorkMetric`) has no per-syscall served/forwarded counters and the
# affine schema has integer `per_unit` only, so (1) and (3) stay asserted by the
# embed test (`bindings.unresolved.embed_structural`); (2) is declared below as
# its structural consequence: forwarded host dispatches do not grow with the
# reservation count.
[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 256
per_unit = 0
layers = ["embed-structural"]
rationale = "Forwarded mmap/brk do not grow with the number of reservations: every anonymous mmap (including MAP_FIXED) and the brk growth and shrink are served at EL1, so host dispatches are the fixture's fixed start-up population, identical at 64, 256 and 1024 reservations. The base is a ceiling for that scaffolding, not a per-reservation allowance; the embed test additionally asserts equality of the forwarded mmap[222] and brk[214] counts across scales."
