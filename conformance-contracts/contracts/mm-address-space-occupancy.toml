schema_version = 1
id = "kernel.mm.address-space-occupancy"
title = "One authority says which vCPUs run which address space: every pause, sole check, fork, crash snapshot and ASID retirement of an MM reads the vCPU slots occupied by it, never the thread an executor loaded"
guest_surfaces = [
  "kernel:current-mm",
  "scheduler:execution-admission",
  "scheduler:page-table-quiescence",
  "syscall:mmap",
  "syscall:munmap",
  "syscall:mprotect",
  "syscall:madvise",
  "syscall:clone",
  "syscall:vfork",
  "syscall:execve",
  "syscall:exit_group",
  "fault:first-touch",
  "fault:cow",
  "signal:core-dump",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 mprotect / man 2 munmap / man 2 mmap: once the call returns, every thread of the address space observes the new mapping; no thread runs on the old translation while it is being changed",
  "man 2 fork: the child's address space is a copy of the parent's at the fork, while the parent's other threads (and a vfork child sharing the parent's memory) keep running on the shared one",
  "man 2 vfork: the child shares the calling process's memory, including with the parent's other threads, until it calls execve or _exit",
  "man 5 core: a core dump holds the memory and every thread's registers of the dumping process",
  "Arm ARM D8.13: a TLBI ASIDE1IS invalidates, on every PE of the Inner Shareable domain, the stage-1 translations of that ASID; an address space's ASID is reusable only after its last translations are invalidated",
]
fixture = "unit:carrick-sched-core::occupancy (install/switch/vacate, host-only slots, Dekker fence stress with more installers than slots); unit:carrick-kernel::kernel::mm_occupancy (switched slot, two processes sharing an MM, rejected install, crash participation, unwind); embed:el1-sched mm-occupancy (two live processes, more threads than vCPUs, mmap/mprotect/munmap editors, fork and vfork, private futex handoffs)"
scale_points = [8, 128, 400, 2000]
rationale = "EL1 increment 2, step 1. Which vCPUs execute an address space used to be owned by executor participation: an exact-MM census of admitted THREADS (GuestExecutorCensus) that the page-table pause and the frame-COW sole check consulted, task-minted membership plus the per-process vCPU registry for fork and crash, and per-ExecutorId ASID residency for retirement. Every one keys on the thread an executor loaded, so a vCPU that EL1 switched to another address space would be invisible to the pause of that space: red-first, a pause of Z was granted against the census while a vCPU running Z was in guest (docs/perf-results/2026-09-26-mm-occupancy/red-census.log, base 3c52608b8). Now one table (carrick_sched_core::Occupancy, no_std and all-zero-valid so it can live in the shared EL1 region) holds, per vCPU execution slot (the zone slot of the vCPU's mailbox lease, or a host-only slot for a vCPU without one), the address space it runs. An executor occupies its vCPU's slot while it has the task loaded: from the start of each resident stretch to the unload (a task preempted at a syscall boundary stays admitted but leaves the vCPU, and the next task loaded there occupies it), less blocking host waits; the first signed run, which tied occupancy to admission instead, refused the next task loaded on a preempting executor's vCPU (el1_sched_exec_from_a_sibling_with_parked_threads, el1_files_exit_group_stress, el1_files_cross_process_readers_contract). A pause raises the MM's fence, then snapshots the slots running the MM and kicks and drains the ones in guest; an executor stores its in-guest flag and then reads the fence before every entry; all four accesses are SeqCst, so the pause either drains an entrant or the entrant sees the fence (Dekker; the VM-free stress runs more installers than slots switching address spaces on shared slots and counts any entry the pauser believed drained). A sole stage-1 proof is a pause whose snapshot held no other vCPU, and it holds the fence, so no admitted peer can enter behind it (only a pause that drains asks host waits to bail); entry is bounded-waiting: once an executor parked at guest entry has woken four times to find the next pause's fence already raised, the next elected editor lets every parked executor leave the park before it raises the fence, because with every edit now fenced a hot mmap/munmap loop re-elected the instant its pause ended and starved the MM's other vCPUs (the windowcoherence probe's sibling-handoff scenario went from 34 s to 51 s and timed out its 45 s budget in the probe gate; bounded it runs in 6 s). The bound counts refusals of a running entrant, not pauses or time: waiting before every pause, or after 4 or 16 bypassing pauses, made editors wait for host scheduling of parked executors under oversubscription and dropped el1_served_burst's worker below its 1M-lseek floor, and a 1 ms parked-time threshold left sibling-handoff at 44 s; editors (exec, fork parent, legacy dispatch) occupy nothing. Crash capture pauses the MM for its snapshot after the lease drain, so a thread of the dumping process that EL1 ran on another process's vCPU (the MM is shared across a vfork) is kicked back where the per-process registry cannot see it; fork's COW pause drains every vCPU running the parent's MM the same way. ASID retirement requires the MM to run nowhere (no task of it is left) and invalidates with one broadcast TLBI ASIDE1IS on the retiring executor's own vCPU; a foreign-COW publication is serviced by the first vCPU that runs the MM next with one broadcast for all. The per-ExecutorId residency sets, the acknowledgement fan-out to every resident executor and the paused exact-invalidation phase are deleted: they proved per vCPU what the inner-shareable invalidation already does for every PE, and they could not name a vCPU that EL1 switched. The table lives in host memory in this step; EL1 installing an address space itself is the next step and must publish the MM's fence in the shared region."
structural_budgets = []

[bindings]
vm_free = "carrick-sched-core::occupancy::tests (one_vcpu_runs_one_address_space, a_switched_slot_is_counted_for_the_address_space_it_runs, host_slots_are_distinct_from_zone_slots_and_reusable, a_pause_never_misses_a_vcpu_about_to_run_its_address_space); carrick-kernel::kernel::mm_occupancy::tests (a_pause_of_z_drains_a_vcpu_switched_from_y_to_z, every_vcpu_running_an_mm_is_counted_whatever_process_it_loaded, rejected_install_still_drains_original_before_granting_mutation, failed_crash_participation_vacates_the_slot, an_unloaded_admission_vacates_its_slot_and_reoccupies_where_it_is_loaded, vacating_one_occupant_preserves_the_other_and_unwind_vacates, a_vcpu_without_a_mailbox_keeps_one_host_slot_per_thread); carrick-runtime::hvpatch::asid::tests (retirement_needs_one_broadcast_invalidation_of_its_exact_generation, retirement_closes_new_loads_and_waits_for_an_in_flight_load); carrick-runtime::hvpatch::stage1_mm::tests (one_service_on_any_vcpu_covers_a_publication_for_every_vcpu, a_publication_during_a_service_stays_owed, pre_entry_service_records_coverage_only_after_hardware_success); carrick-runtime::vcpu_loop::quiesce::pt_pause_tests (foreign_cow_pauses_the_active_target_and_defers_invalidation_to_the_next_entry); carrick-thread::fork_quiesce::tests (a_starving_entrant_leaves_before_the_next_fence_is_raised, red without the bounded entrant wait)"
embed = "carrick-embed::el1_sched (signed; el1_sched_mm_occupancy_two_processes: two live processes, each with twice as many writer threads as guest CPUs handing turns off through private futexes, writers verifying their pages while an editor churns mmap/mprotect/madvise/munmap, a forker whose children check that inherited pages stay stable, and a vfork spawner; every writer reads back what it wrote, every snapshot holds and every child exits 0; run at the default executor count and with CARRICK_EL1_SCHED=0, CARRICK_EL1_FUTEX=0 and CARRICK_HVF_GIC=0; plus the whole el1_ suite); conformance probe windowcoherence (signed, retained generic runner: its sibling-handoff scenario is the starvation witness for fenced edits)"

[bindings.unresolved]
docker = "The fixture asserts the Linux results directly (each writer reads back every value it wrote, every fork child and vfork child exits 0 through waitpid); the embed test is the differential against what Linux guarantees, and the mm-family LTP rows and go/cpython ecosystem rows compare against the cached Docker oracle."
embed_structural = "Pause drains and kicks are USDT probes (pt-pause-begin/ready) with no registered WorkObservation metric. The signed fixture is not red against a pause that drains nobody (a negative control with the drain removed still passed twice): fork parks its siblings through the lease drain before its COW pause and every edit ends in an inner-shareable TLBI, so a missed drain has no deterministic guest-visible witness there; the discriminating red is the VM-free switched-slot and Dekker cases."
embed_timing = "No timing is claimed for the authority; the paired workload runs recorded in the design doc are uncontrolled."
