observation = "The VM-free regression asserts no reaped-task auditor abort. Live notification queueing is covered by hvpatch_migration_endpoint_routes_task_wake_to_exact_scheduler_generation. WorkObservation and deterministic work-counter bindings remain pending; empty budgets do not confer structural acceptance."
