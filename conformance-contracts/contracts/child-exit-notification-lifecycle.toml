schema_version = 1
id = "kernel.wait.child-exit-notification-lifecycle"
title = "Delayed child-exit notification retains exact parent authority"
guest_surfaces = ["syscall:wait4", "scheduler:lifecycle", "signal:SIGCHLD"]
semantic_authority = ["man 2 waitpid", "man 2 sigaction"]
fixture = "unit:child_exit_notification_snapshot_cannot_wake_a_reaped_parent"
scale_points = [1, 8, 32]
rationale = "A child-exit notification captured before its parent exits may arrive after that parent is reaped. The delayed scheduler nudge must authenticate the exact task, thread and execution generation, without waking a successor or aborting the carrier. Durable child waitability and wait-subscription publication remain authoritative. The correction adds no polling, retry or population scan."

[[structural_budgets]]
kind = "affine"
metric = "child_exit_notification_thread_visits"
base = 0
per_unit = 1
layers = ["vm-free"]
rationale = "N deliveries of a retained single-thread parent snapshot visit exactly N threads; the fixture separately asserts the nonzero count."

[[structural_budgets]]
kind = "exact"
metric = "child_exit_notification_wake_attempts"
value = 0
layers = ["vm-free"]
rationale = "The VM-free fixture has retired execution states before delivery, so it filters all threads before scheduler authentication. A signed thread may retain an execution generation after graph reap; the exact scheduler then rejects it as Pending."

[[structural_budgets]]
kind = "exact"
metric = "child_exit_notification_thread_visits"
value = 2
layers = ["embed-structural"]
rationale = "The signed three-process fixture has two child exits and two single-thread parent snapshots; this covers the whole fixture, not just the delayed notification."

[[structural_budgets]]
kind = "upper-bound"
metric = "child_exit_notification_wake_attempts"
maximum = 2
layers = ["embed-structural"]
rationale = "One exact-authority authentication per visited snapshot thread; Pending is a rejection without delivery, not excess scheduler work."

[[structural_budgets]]
kind = "exact"
metric = "child_exit_notification_wake_deliveries"
value = 0
layers = ["vm-free"]
rationale = "No retired parent can receive a queued or kicked notification wake."

[[structural_budgets]]
kind = "upper-bound"
metric = "child_exit_notification_wake_deliveries"
maximum = 1
layers = ["embed-structural"]
rationale = "Only the root can receive a queued or kicked wake; exact authority rejects the already-reaped middle parent. The signed semantic ordering and zero reaped-wake rejections remain required."

