rationale = "A child-exit notification captured before its parent exits may arrive after that parent is reaped. The delayed scheduler nudge must authenticate the exact task, thread and execution generation, without waking a successor or aborting the carrier. Durable child waitability and wait-subscription publication remain authoritative. The correction adds no polling, retry or population scan."

