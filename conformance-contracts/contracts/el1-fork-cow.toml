  "carrick-el1-linux::aarch64_process_tests::native_fault_supply_tests::native_backing_repark_retains_custody_when_allocation_fails (physical reply waits once on an editor with allocation failure injected, retains the exact lifecycle claim and retry, then completes after release with exactly one physical-offer settlement; VM-free only)",
  "carrick-el1-linux::aarch64_process_tests::native_fault_supply_tests::{native_child_first_touch_of_inherited_prepared_leaf_makes_progress,native_child_prot_none_across_fork_preserves_parent_bytes,native_prepared_reply_retries_after_competing_valid_publication,native_inherited_prepared_writes_stay_private_to_each_live_process,native_child_mprotect_rw_after_prot_none_fork_cannot_write_parent_frame} (actual native fork Frame custody, invalid inherited leaf owner selection, one-page Publish and shared physical/table reply settlement; the inherited publication keeps its output and is fork-COW armed (VALID, EL0 read-only, bit 55, Linux write intent in bit 57, deferred bit 59 consumed), with zero copied or allocated backing at publication; a child write is invisible to the live parent and a parent write to the live child, each through one compound EL1 COW copy at write time; PROT_NONE across fork then child mprotect(RW) and a write leaves the parent frame unchanged; the write witnesses were red at 974279786e, where publication set only VALID)",
