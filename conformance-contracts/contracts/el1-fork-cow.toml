  "carrick-x86-cpl0-host::cpl0_boot::initial_reply_tests::{shared_physical_staging_rolls_back_before_exposure,inventory_retains_two_live_owner_selected_mms,initial_inventory_refuses_a_receipt_from_another_mm} (shared physical staging only: exact-MM publication custody and rollback before exposure; these staging-only fixtures do not confer signed acceptance)",
