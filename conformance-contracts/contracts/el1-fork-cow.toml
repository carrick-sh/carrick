# #2276 round 5: fork arms a wholly private block (AArch64 L1/L2, x86
# 2M/1G) in place, at block granularity: zero split tables, one live edit
# and one custody record per block, whatever its size. Its first COW write
# splits exactly the covering block inside the descriptor executor's
# CowRepoint, with at most two host-granted tables carried by the COW grant,
# and copies only the fault's granule; later writes in the block split
# nothing. Fork-time splits that remain (mixed/structural) link table
# attributes only. Settlement orders one MM's completions causally (#1801).
# Witnesses below; the signed Go rows on #2278 remain the production proof.
# #1733: the EL0 fault arm settles USED grant completions before the host
# refill. Adds one VM-free binding; budgets and signed bindings unchanged.
# #1394: additional ABI bookkeeping witness only; existing semantic and
# work-budget bindings remain authoritative. Census publication reads counters
# after executor join and does not alter this contract's guest operation.
# #1044: owned-yield replies are typed separately from memory preparation.
# The retained IPC/CarrierWork seam bindings below cover that API change;
# existing fork, lifecycle, file and inotify acceptance remains unchanged.
# #1101: fork lifecycle backing uses retained metadata custody.
# Fork table loans, table population, and COW transitions are unchanged; only the custody of the backing for pre-existing lifecycle slots changes.
# The component ownership/counter witnesses are registered under
# kernel.el1.metadata-allocation; retain every existing family binding below.
# These VM-free component checks do not confer signed acceptance for this family.
# #1028: type physical custody diagnostic reasons; no change to this
# contract's semantics or work budgets. The host dispatch test
# physical_custody_reasons_preserve_fatal_codes_and_debug_text checks
# reason codes and unchanged text; retain the existing execution controls.
schema_version = 1
id = "kernel.el1.fork-cow"
title = "Guest EL1 fork copy-on-write resolution and leaf repointing"
guest_surfaces = [
  "syscall:clone",
  "syscall:fork",
  "fault:permission",
  "kernel:stage1-mmu",
  "kernel:frame-inventory",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 fork: after a fork in a multithreaded program, each child process receives a private copy of the parent's memory",
  "man 2 clone: CLONE_VM not set establishes copy-on-write page sharing between parent and child",
  "Arm A-profile translation architecture: write access to a read-only translation generates a Permission Fault delivered to EL1; EL1 allocates a private physical frame, copies the source page, updates stage-1 descriptors to AP_RW, invalidates the local ASID, and returns to EL0 without host intervention",
]
fixture = "embed:el1-sched fork-cow 20 16|64|256"
scale_points = [16, 64, 256]
rationale = "EL1 increment 2 fork copy-on-write checkpoint (TASK 2 and TASK 3). Prior to this increment, write permission faults on COW pages trapped through HardwareCowResolver, which returned PermissionDenied and exited to the host carrier's cow_engine for physical allocation, host copying, stage-2 mapping and descriptor update. Under guest COW ownership, EL1 directly handles write permission faults on shared read-only private pages: it acquires a private frame from its pre-mapped pool, copies page contents in guest memory, updates the stage-1 leaf to read-write (AP_RW), issues an ASID-scoped TLBI, and resumes EL0 with zero host exits. Parent and child verify memory isolation across multiple worker threads. The signed witness verifies that the carrier-scoped host COW ledger (`carrick_embed::host_cow_snapshot`, completed host COW transactions of every MM the carrier admitted, including fork children) records none, that COW faults enter EL1, that frame grants balance returns, and that incremental host exits across scales remain below 0.125 exits per added COW page. Host fault exits are reported but are not host COW resolutions and are never used as that count."

