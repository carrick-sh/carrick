schema_version = 1
id = "kernel.memory.owner-wait"
title = "Owner-memory waits have one killable settlement owner"
guest_surfaces = ["kernel:continuation", "syscall:pipe2", "syscall:read", "syscall:write", "syscall:nanosleep", "syscall:clock_nanosleep"]
semantic_authority = ["Owner decision #711 and #802: owner memory arbitration is a killable internal lock wait", "man 7 signal: SIGKILL cannot be blocked, caught or ignored; fatal process action applies to every thread", "man 2 read and man 2 pipe2: output and descriptor effects belong to a completed operation"]
fixture = "production runtime with two live shared-MM threads, real owner editor or PendingContentWrite, physical readiness during enrollment and after parking, native IPC direct-EL0 completion"
scale_points = [1, 2]
structural_budgets = []
rationale = "Owner waits are killable-only: handled signals and stops never complete them. Process-wide SIGKILL or group exit stops every waiter's resume, independent of signal-delivery reservation. Native terminal cancellation retains its typed mailbox-trap or direct-EL0 origin across zone materialization and physical waits. No effect is consumed before secured copyout, or after cancellation is pending. Runtime writer exclusion is released before re-preparation. Enrollment readiness and scheduler resumption use the same settlement protocol for all owner-wait users. Holders may execute only bounded internal work; they must not retain an editor across a park, stop or guest-controlled dependency. The model explores shipping settlement and atomic cancellation/effect authority with loom words. Signal queues, mailbox transport, holder audit and signed guest delivery remain separate obligations."

[bindings]
vm_free = "carrick-runtime::vcpu_loop::binding::tests::{serial_host_owner_physical_sigkill_during_enrollment_precedes_ready_retry,serial_host_owner_physical_nonleader_process_sigkill_precedes_ready_retry,serial_host_owner_physical_nonleader_process_sigkill_during_enrollment,serial_host_owner_physical_resume_releases_writer_before_retry,serial_host_owner_physical_immediate_resume_releases_writer_before_retry}; carrick-runtime::vcpu_loop::tests::{serial_host_native_ipc_owner_wait_cancellation_from_el0,serial_host_native_ipc_physical_owner_wait_cancellation_from_el0,serial_host_sleep_copyin_wait_preserves_handled_signal_until_completion,serial_host_sleep_copyin_wait_remains_killable}; carrick-runtime::vcpu_loop::owner_wait_loom; carrick-core::cancellation::loom_models; carrick-runtime::vcpu_loop::binding::tests::serial_host_owner_physical_kill_after_ready_before_effect_admission"

[bindings.unresolved]
embed_structural = "Signed HVF unavailable on ctb-w1; exact-artifact signed acceptance and live guest handled-signal delivery remain director-owned."
docker = "Docker unavailable and forbidden on ctb-w1; this internal owner-refusal schedule has no external Linux producer."
holder_audit = "The model's editor releases without guest work. A complete typed holder audit across all owner authorities is not established by this model."
