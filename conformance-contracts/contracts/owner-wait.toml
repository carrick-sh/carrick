schema_version = 1
id = "kernel.memory.owner-wait"
title = "Owner-memory waits have one killable settlement owner"
guest_surfaces = ["kernel:continuation", "syscall:pipe2", "syscall:read", "syscall:write", "syscall:nanosleep", "syscall:clock_nanosleep", "syscall:epoll_pwait", "syscall:rt_sigtimedwait", "syscall:io_getevents"]
semantic_authority = ["Owner decision #711 and #802: owner memory arbitration is a killable internal lock wait", "man 7 signal: SIGKILL cannot be blocked, caught or ignored; fatal process action applies to every thread", "man 2 read and man 2 pipe2: output and descriptor effects belong to a completed operation"]
fixture = "production runtime with two live shared-MM threads, real owner editor or PendingContentWrite, physical readiness during enrollment and after parking, native IPC direct-EL0 completion; S1 dispatcher witnesses inject Editor OwnerWait or epoll Supply(Grant) before output admission, verify no consumption or output on refusal, and verify exact delivery on redispatch; shared array witnesses bound whole-record preparation and retain valid prefix authority"
scale_points = [1, 2]
structural_budgets = []
rationale = "Owner waits are killable-only: handled signals and stops never complete them. Process-wide SIGKILL or group exit stops every waiter's resume, independent of signal-delivery reservation. Native terminal cancellation retains its typed mailbox-trap or direct-EL0 origin across zone materialization and physical waits. No effect is consumed before secured copyout, or after cancellation is pending. Runtime writer exclusion is released before re-preparation. Enrollment readiness and scheduler resumption use the same settlement protocol for all owner-wait users. Holders may execute only bounded internal work; they must not retain an editor across a park, stop or guest-controlled dependency. The model explores shipping settlement and atomic cancellation/effect authority with loom words. Signal queues, mailbox transport, holder audit and signed guest delivery remain separate obligations."

[bindings]
# S1 witnesses prove pre-consumption destination admission and bounded
# preparation, including signal preservation and epoll Supply(Grant)/Editor
# refusal. They do not prove runtime settlement, fatal cancellation, or
# signed guest execution; the existing runtime and unresolved bindings apply.
vm_free = "carrick-runtime::vcpu_loop::binding::tests::{serial_host_owner_physical_sigkill_during_enrollment_precedes_ready_retry,serial_host_owner_physical_nonleader_process_sigkill_precedes_ready_retry,serial_host_owner_physical_nonleader_process_sigkill_during_enrollment,serial_host_owner_physical_resume_releases_writer_before_retry,serial_host_owner_physical_immediate_resume_releases_writer_before_retry}; carrick-runtime::vcpu_loop::tests::{serial_host_native_ipc_owner_wait_cancellation_from_el0,serial_host_native_ipc_physical_owner_wait_cancellation_from_el0,serial_host_sleep_copyin_wait_preserves_handled_signal_until_completion,serial_host_sleep_copyin_wait_remains_killable}; carrick-runtime::vcpu_loop::owner_wait_loom; carrick-core::cancellation::loom_models; carrick-runtime::vcpu_loop::binding::tests::serial_host_owner_physical_kill_after_ready_before_effect_admission; carrick-kernel::dispatch::signal::tests::{s1_signal_copyout_refusal_preserves_pending_signal,s1_empty_signalfd_skips_owner_preparation,s1_signalfd_true_fault_consumes_faulting_signal}; carrick-kernel::dispatch::net::epoll_ops::nested_epoll_readiness_tests::{s1_epoll_copyout_refusal_preserves_oneshot_and_edge_readiness,s1_epoll_refusal_keeps_pipe_bytes_and_pending_report}; carrick-kernel::dispatch::fs::legacy_aio::s1_tests::{s1_aio_copyout_refusal_preserves_completion,s1_aio_large_output_preserves_minimum_and_refused_window}; carrick-kernel::dispatch::copyout::tests::{s1_array_keeps_first_valid_permit_across_mapping_changes,s1_arrays_secure_only_whole_records_and_bound_preparation_work}"

