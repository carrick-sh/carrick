schema_version = 1
id = "kernel.memory.owner-wait"
title = "Owner-memory waits have one killable settlement owner"
guest_surfaces = ["kernel:continuation", "syscall:pipe2", "syscall:read", "syscall:write", "syscall:nanosleep", "syscall:clock_nanosleep", "syscall:epoll_pwait", "syscall:rt_sigtimedwait", "syscall:io_getevents"]
semantic_authority = ["Owner decision #711 and #802: owner memory arbitration is a killable internal lock wait", "man 7 signal: SIGKILL cannot be blocked, caught or ignored; fatal process action applies to every thread", "man 2 read and man 2 pipe2: output and descriptor effects belong to a completed operation", "man 2 nanosleep: interrupted relative sleep publishes the remaining interval and returns EINTR (4), never restarts despite SA_RESTART"]
fixture = "Interrupted-sleep remainder: exact saved 16-byte record across owner or supply then physical refusal; 1/2/3 cumulative preparations and 0/0/1 commits, no new sleep or redispatch; page crossing adds one committed window; cancellation after either refusal forbids further preparation. production runtime with two live shared-MM threads, real owner editor or PendingContentWrite, physical readiness during enrollment and after parking, native IPC direct-EL0 completion; S1 dispatcher witnesses inject Editor OwnerWait or epoll Supply(Grant) before output admission, verify no consumption or output on refusal, and verify exact delivery on redispatch; shared array witnesses bound whole-record preparation and retain valid prefix authority"
scale_points = [1, 2]
structural_budgets = []
rationale = "Owner waits are killable-only: handled signals and stops never complete them. Process-wide SIGKILL or group exit stops every waiter's resume, independent of signal-delivery reservation. Native terminal cancellation retains its typed mailbox-trap or direct-EL0 origin across zone materialization and physical waits. No effect is consumed before secured copyout, or after cancellation is pending. Runtime writer exclusion is released before re-preparation. Enrollment readiness and scheduler resumption use the same settlement protocol for all owner-wait users. Holders may execute only bounded internal work; they must not retain an editor across a park, stop or guest-controlled dependency. The model explores shipping settlement and atomic cancellation/effect authority with loom words. Signal queues, mailbox transport, holder audit and signed guest delivery remain separate obligations."

