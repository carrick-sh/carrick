embed_structural = "No signed mixed native/HVF code publication or direct-link revocation binding yet. Guest hardware stores, writable aliases and private RX admission remain unresolved."
embed_timing = "No new original inotify09 timing or native-residence acceptance."
docker = "Internal lifetime ordering; the Linux syscall semantic regressions remain separate. No mixed-engine guest race oracle is bound."

