schema_version = 1
id = "kernel.mm.native-code-drain"
title = "Participating host writes revoke and drain active instruction content"
guest_surfaces = ["kernel:current-mm", "scheduler:execution-admission", "scheduler:page-table-quiescence", "syscall:process_vm_writev", "syscall:ptrace"]
semantic_authority = ["Carrick exact task/execution/MM authority", "Carrick physical backing content identity and participating host-write ordering"]
fixture = "unit:native-code-drain"
scale_points = [1, 8, 32, 128]
rationale = "A participating host writer must revoke future content use and wait for affected active users before changing bytes. Unrelated physical pages are not revoked or drained. Captured code content is activated only inside its exact kernel running scope. This is not proof of private RX admission, hardware-write mediation, executable publication, or linked native execution."

[bindings]
vm_free = "carrick-runtime::vcpu_loop::memory::tests::native_instruction_content_scope_contract (feature conformance-metrics); carrick-vmm-hvf::trap::code_content::execution_tests; real carrier instruction receipt and syscall writer regressions"

