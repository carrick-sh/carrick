schema_version = 1
id = "kernel.signal.job-control-wait-interruption"
title = "Group-stop interruption is scoped to Linux's eligible blocking interfaces"
guest_surfaces = ["syscall:epoll_pwait", "syscall:rt_sigtimedwait", "syscall:semop", "syscall:semtimedop", "syscall:recvfrom", "syscall:sendto"]
semantic_authority = ["man 7 signal: Interruption of system calls and library functions by stop signals"]
fixture = "probe:epollstopcont"
scale_points = [2]
structural_budgets = []
rationale = """
A thread group's actual stop transition advances one durable task-owned epoch.
A parked continuation compares its admitted epoch, so another thread consuming
the stop signal or a stop+continue pair before resumption cannot erase it.
Eligible waits fail with EINTR without consuming a handler signal. Pipe I/O,
futexes, poll/select and sleeps preserve their continuation. Socket eligibility
requires the admitted SO_RCVTIMEO/SO_SNDTIMEO deadline, never an incidental
reactor timer. Existing task-wake subscriptions provide notification; this
adds no polling, redispatch while parked, or host-process authority.
An actual group stop also claims exact thread-group EL1 zone records through
an incarnation-tagged GroupStop handback request. The request is an owned
wait disposition, not another stopped flag or stop epoch: TaskJobControl
remains the authority. Its reason survives deferred handback and SIGCONT;
a retired operation token preserves a result already completed in EL1.
The two-thread VM-free binding exercises the real carrier wait service.
Signed output is checked against predicted Linux output; the integration
director owns Docker refresh and broader promotion. No timing acceptance or
structural meter completeness is claimed here.
"""

[bindings]
vm_free = "carrick-kernel::el1_zone::tests::serial_host_group_stop_claims_zone_wait_before_continue"
embed = "probe:epollstopcont"
docker = "probe:epollstopcont"
