[bindings.unresolved]
docker = "Hypervisor interrupt delivery is host-internal; Linux supplies no oracle for it. The Linux obligation is timely asynchronous interruption, carried by the ecosystem rows."
embed_structural = "Owed-kick outcomes are observable only through `scripts/dtrace/hvpatch-pt-pause-drain-stall.d` (irq-kick-taken vs kick-owed); no WorkObservation metric is registered. The KVM backend keeps a no-op IRQ vehicle (`injects_kick_irq` false) and is not covered."
