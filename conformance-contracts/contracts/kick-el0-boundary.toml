schema_version = 1
id = "kernel.vcpu.kick-el0-boundary"
title = "A kick absorbed in Carrick's EL1 code surfaces at the next EL0 instruction boundary"
guest_surfaces = ["scheduler:vcpu-kick", "scheduler:page-table-quiescence", "signal:asynchronous-delivery"]
semantic_authority = ["Hypervisor.framework hv_vcpu_types.h: HV_INTERRUPT_TYPE_IRQ = 0, HV_INTERRUPT_TYPE_FIQ = 1", "Hypervisor.framework hv_vcpu.h: hv_vcpu_set_pending_interrupt returns HV_UNSUPPORTED if the VM was created with a GIC device", "Arm ARM: an unmasked pending IRQ is taken before the first instruction after the ERET that unmasks it", "man 7 signal: an asynchronous signal is delivered on the next return to user mode"]
fixture = "unit:owed-kick-model"
scale_points = [1, 8, 32, 128]
rationale = "A cross-thread kick that stops a vCPU inside Carrick's syscall vector, EL1 image or clock stub cannot be surfaced there, so the engine re-enters the guest and owes the kick to EL0 as a pending virtual IRQ. Two defects made every such kick a silent no-op: applevisor-sys 1.0.0 numbers `hv_interrupt_type_t` in the reverse of the SDK, so its `IRQ` asserted the FIQ line, which Carrick masks at every level; and Carrick runs EL0 with DAIF masked, so even a real IRQ would not be taken. The owed kick unmasks I in the EL0 return state (SPSR_EL1 at EL1, live PSTATE at EL0), re-arms after every internally handled exit because HVF clears pending interrupts on each run return, and restores the original I bit at the first surfaced exit, so guest-visible PSTATE is unchanged. The EL1 syscall hook saves SPSR_EL1 on entry and reloads it before its served `eret`; it once checked pending host work BEFORE that reload, so a kick absorbed between the two (live trace: `kick-rearm-irq` at hook+0x150) had its unmask overwritten and EL0 ran on with the kick pending and masked. A thread that then computed without a host syscall stalled the page-table drain forever (Fact 9: 21 of 24 oversubscribed burst runs hung on b91d830ec). The absorb now publishes every owed kick to the slot's pending-host-work flag, and the hook checks it after its last SPSR_EL1 write, so a kick absorbed at any hook instruction either leaves through the host or keeps its unmask. Qualified live with standalone Hypervisor.framework probes on macOS 27.2 / M4, including Carrick's own vector page: the SDK IRQ line with I clear is taken at EL0 and exits through `hvc #4`; the binding's `IRQ` never is. Since EL1 plan 1a the carrier VM carries the in-kernel GICv3, so the owed kick is SGI 15 made pending in the vCPU's redistributor on the owning thread (GICR_ISPENDR0) and withdrawn with GICR_ICPENDR0 (`gic::arm_kick`/`clear_kick`, the only vehicle). That pending state survives run returns (qualified live), so the re-arm is idempotent, `settle` withdraws it at the first surfaced exit, and `run_to_exit` withdraws a kick it re-armed for an EL1 critical section on every other surfaced exit. The SDK IRQ line remains only behind the CARRICK_HVF_GIC=0 hatch. Under the GIC the served path also opens an EL1 IRQ window, before its ELR/SPSR reload, that can acknowledge the kick SGI; the IRQ hook then republishes it as the slot's pending host work, so the hook's check forwards it. The VM-free interpreter of the real vector bytes injects the kick at every boundary of the hook and of the IRQ hook in both modes, and was red with the republish removed (a kick armed before the window was consumed at EL1) and with the window moved after the check (the IRQ's ELR/SPSR reached the served eret)."
structural_budgets = []

