schema_version = 1
id = "kernel.el1.address-space-switch"
title = "Guest EL1 switches a vCPU between processes' address spaces itself, never installing one that a page-table pause or ASID retirement has fenced, and every pause drains each vCPU EL1 put on its space"
guest_surfaces = [
  "kernel:current-mm",
  "scheduler:execution-admission",
  "scheduler:page-table-quiescence",
  "scheduler:in-guest-switch",
  "syscall:futex",
  "syscall:mmap",
  "syscall:munmap",
  "syscall:mprotect",
  "syscall:clone",
  "syscall:vfork",
  "syscall:execve",
  "syscall:exit_group",
  "fault:cow",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 mprotect / man 2 munmap / man 2 mmap: once the call returns, every thread of the address space observes the new mapping; no thread runs on the old translation while it is being changed",
  "man 2 fork: the child's address space is a copy of the parent's at the fork; a write by either is not seen by the other",
  "man 2 futex: FUTEX_WAKE wakes waiters of the futex word; the woken thread runs in its own process's address space",
  "Arm ARM D8.13: with TCR_EL1.AS the ASID in TTBR0_EL1 tags stage-1 translations; a TLBI ASIDE1IS invalidates that ASID's translations on every PE of the Inner Shareable domain, and an ASID is reusable only after its last translations are invalidated",
]
fixture = "unit:carrick-sched-core::spaces (publish/open/raise/close/free, colliding keys, owed COW); unit:carrick-sched-core (EL1 install vs pause Dekker stress, negative control that skips the gate, closed space never reinstalled); unit:carrick-el1::sched (futex wait switches to another process in guest, raised gate sends the thread to its executor, owed COW invalidation before install, WFI holds no space, idle entry runs no thread itself); unit:carrick-kernel::kernel::mm_occupancy (gate follows the MM fence, retired publication closed/unbound/freed, zone vCPU moved off the MM is drained while in guest); unit:carrick-thread::fork_quiesce (bound mirror follows the fence); embed:el1-sched two-process (two processes ping-pong through a shared futex on more threads than vCPUs)"
scale_points = [500, 3000]
rationale = "EL1 increment 2, step 2. Through 1d guest EL1 ran only threads of the address space installed on its vCPU; a thread of another process went to that vCPU's executor, which loaded it through the host, so two processes handing a futex back and forth cost 6.2-6.4 host exits per round trip. Now the host publishes each address space (its TTBR0/TTBR1, ASID included) in a table in the shared EL1 region when an executor first loads one of its threads, with a gate that copies the MM's page-table fence (raised by every pause before its occupancy scan, lowered when it ends) and a closed bit set while the entry is published and from the moment the ASID starts retiring. EL1 on a vCPU whose executor has a task loaded switches it to another process's thread by moving it to the carrier maintenance root (ASID 0, which maps only the kernel hole and the EL1 region), publishing the new space in the slot's shared occupancy word, then reading the gate (SeqCst both, the installer half of step 1's Dekker pair), and only then installing the roots, after one TLBI ASIDE1IS if a foreign-COW publication for the space is not yet covered. A vCPU parking in WFI leaves a published space for the maintenance root, so it holds no process's translations while idle. A vCPU in the idle entry (its executor has no task loaded) runs no thread itself, as in 1d: running threads from the idle entry lost a host control claim raced against the idle exit, and exit_group waited forever on a sibling parked in EL1 (reproduced in el1_sched_exit_group_with_parked_threads, then 5/5 green with idle switching removed). Retirement closes the gate, drains every in-guest vCPU whose word names the space, frees the entry, and only then invalidates the ASID for reuse. Processes whose threads run with Rosetta's own TTBR1 or hardware TSO are never published. A zone-slot resident counts as running the MM only while in the guest AND while the slot's word still names the MM: the executor's port names the thread it loaded, whose in-guest flag stays set across whatever EL1 runs on the vCPU, and the first signed two-process run hung because a drain read only that flag (gate stuck raised, coordinator in drain_exact_mm). MM ids are carrier-unique: per-kernel numbering gave two containers' MMs the same zone key, and a pause of one counted the other's vCPUs (the concurrent container gate). Measured on the signed two-process test: about 0 host exits per round trip (within noise), against 6.45-6.66 with CARRICK_EL1_MM_SWITCH=0 on the same binary."
structural_budgets = []

[bindings]
vm_free = "carrick-sched-core::spaces::tests (a_published_space_is_granted_only_while_its_gate_is_open, colliding_keys_probe_and_freed_entries_are_skipped_then_reused, a_cow_publication_is_owed_until_an_install_covers_it); carrick-sched-core::tests (a_pause_never_misses_an_el1_address_space_install, an_install_that_skips_the_gate_is_caught, a_closed_space_is_never_installed_again); carrick-el1::sched::tests (a_futex_wait_switches_the_vcpu_to_another_process_in_guest, a_raised_gate_sends_the_thread_to_its_executor, an_owed_cow_invalidation_runs_before_the_install, a_vcpu_in_wfi_holds_no_address_space, the_idle_entry_runs_no_thread_itself); carrick-kernel::kernel::mm_occupancy::tests (a_published_gate_follows_the_mm_fence, a_retired_publication_is_closed_unbound_and_freed, a_zone_vcpu_moved_off_the_mm_is_drained_while_it_stays_in_guest, red with the flag-only predicate); carrick-kernel::kernel::ids::tests (object_ids_are_nonzero_and_never_reused: MM ids differ across registries); carrick-thread::fork_quiesce::tests (a_bound_mirror_follows_the_fence)"
embed = "carrick-embed::el1_sched (signed; el1_sched_two_processes_share_vcpus asserts fewer than 1.0 host exits per round trip and is red with CARRICK_EL1_MM_SWITCH=0 at 6.66; el1_sched_mm_occupancy_two_processes keeps two live processes with more threads than vCPUs, mmap/mprotect/munmap editors, fork and vfork correct with EL1 switching; plus the whole el1_ suite)"

[bindings.unresolved]
docker = "The fixtures assert the Linux results directly (both processes complete every futex round trip; every writer reads back what it wrote, every fork and vfork child exits 0); the mm-family LTP rows and go/cpython ecosystem rows compare against the cached Docker oracle."
embed_structural = "The exit count per round trip is the structural witness; there is no registered WorkObservation metric for EL1 space switches yet (the zone counters el1_space_switches, el1_space_refusals and el1_cow_invalidations are printed in the census)."
embed_timing = "No timing is claimed; the paired workload runs recorded in the design doc are uncontrolled."
