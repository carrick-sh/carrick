schema_version = 1
id = "kernel.sleep.owner-copyin"
title = "Sleep timespec copy-in retains ownership across memory waits"
guest_surfaces = ["syscall:nanosleep", "syscall:clock_nanosleep"]
semantic_authority = ["man 2 nanosleep: EFAULT denotes inaccessible user memory; EINTR denotes signal interruption", "man 2 clock_nanosleep: TIMER_ABSTIME names an absolute deadline"]
fixture = "unit:sleep_copyin_owner_wait_is_not_efault; unit:absolute_sleep_samples_clock_after_suspended_copy_finishes"
scale_points = [1]
rationale = "A valid 16-byte timespec may suspend on an owner reservation, physical dependency or supply. The exact copy continuation survives; no timer starts and no guest errno completes until that input is available. The VM-free witness copies its seconds prefix once, suspends twice and completes its nanoseconds suffix without rereading. An absolute deadline is evaluated after copy completion. The runtime witness holds a real editor from a second live thread, publishes handled SIGUSR1 while the copy-in is parked, releases the editor and completes a zero-duration nanosleep or clock_nanosleep before delivering the handler; a separate schedule verifies SIGKILL termination while the editor remains held. Real bad pointers and invalid nanoseconds remain EFAULT and EINVAL."
