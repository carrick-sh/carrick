schema_version = 1
id = "process.native.terminal-child"
title = "Terminal child retirement and parent handback retain exact execution custody"
guest_surfaces = ["syscall:exit", "syscall:exit_group", "syscall:wait4", "syscall:waitid", "signal:SIGCHLD", "signal:kill", "vmm:hvf", "scheduler:continuation"]
semantic_authority = [
  "man 2 exit: termination releases process resources before notifying the parent",
  "man 2 wait: a child's terminal status is consumed once by its parent",
  "man 2 prctl: an orphan is reparented to its nearest living subreaper or init",
]
fixture = "VM-free ARM native fork/exit/wait with a parked parent: an in-ring child wake resumes the wait result in x0, while an unplaceable wake hands back once; reuse the child's record and CPU slot with a new TaskKey generation"
scale_points = [1]
rationale = "The successful authenticated zone retirement retains task, execution generation, MM and thread generation independently of reusable record storage. One terminal crossing authenticates that custody plus the committed child root incarnation and hardware root. Acceptance changes PendingRetirement to Retired once. A placeable parent wake queues its existing record once; the scheduler re-enters the owner before ERET and returns the child PID in x0. After leaving the root and publishing slot absence, an unplaceable parent wait crosses to the existing runtime host continuation venue. The same wait claim produces at most one handback, with no polling, redispatch or population scan for execution authentication. A new slot entry invalidates terminal custody. Retired completion authority requires zero MM occupancy on the exact CPU slot; the ARM host additionally checks its hardware maintenance root. The released child attempts the shared reservation-root drain before publishing parent readiness, including when no later fork occurs; Busy roots retain their existing queued custody. An authenticated maintenance-root drain applies the shared HAL stock owner: per-MM release once, table and lifecycle clearing, address-tag retirement, retained-pin drop, then stock return. The shared registry leaves a retired child waitable as one zombie until the parent consumes it; WNOHANG observes a live child without parking, and a second consuming wait returns the numeric no-child error. Native waitid WEXITED reads the same receipt and synthesizes Linux SIGCHLD siginfo; WNOWAIT leaves that receipt available for the following consuming wait4. Signal termination preserves Linux wait status and SIGCHLD payload through late birth settlement. Parent exit reparents the exact child generation to the adopter selected by the registry before the child's terminal notification. Group exit retains admitted Born/ExitedInZone membership and physical retirement custody without closing live participant gates. The VM-free native fork/exit witness requires neutral structural retirement to succeed without a later stock loan; terminal wake uses the retained execution receipt independently of the reclaimed child root."

[bindings]
vm_free = "carrick-el1-linux::aarch64_process_tests::native_fault_supply_tests::native_child_empty_supply_resumes_cow_without_changing_parent (real native fork, COW and backing service continuations, terminal USED settlement, exact-MM inventory release before physical backing, structural retirement without a later Loan); carrick-el1-linux::aarch64_process_tests::native_retirement_tests::native_child_exit_reclaims_stock_before_carrier_structural_shutdown; carrick-el1-linux::aarch64_process_tests::{test_wait4_consumes_zombie_once_with_exact_status,arm_in_ring_wait4_wake_resumes_owner_before_eret,arm_terminal_child_retirement_and_parent_handback_once,terminal_retirement_cannot_retire_a_reused_record_or_slot_generation,arm_two_live_threads_exit_group_ends_group_with_status}; carrick-sched-core::tests::unplaceable_parent_host_handback_consumes_one_park; carrick-el1-linux::native_process_runtime::tests::{child_signal_exit_preserves_status_across_birth_claim_settlement,exit_group_holds_terminal_custody_until_pre_live_claim_settles,delayed_child_exit_notifies_adopter_when_selected_parent_exits_on_peer,delayed_child_exit_uses_adopter_interest_when_old_parent_ignored_default,delayed_child_exit_does_not_inherit_departed_parents_signal_interest}"

[bindings.unresolved]
waitid_job_control = "Native waitid WEXITED is bound here. WSTOPPED/WCONTINUED-only waits remain outside this terminal-exit binding until the signal owner gains shared process-stop/continue custody; it deliberately preserves default stop signals, and a host wait answer is not an admissible substitute."
embed_structural = "Director-owned ARM signed verification after production process adoption and stock slices land. This VM-free slice does not execute HVC or validate VMM registers."
docker = "Native ARM wait/exit oracle and uninstrumented ratio evidence remain director-owned; Docker is unavailable on ctb-w2."

[[structural_budgets]]
kind = "exact"
metric = "kernel_redispatches"
value = 0
layers = ["vm-free"]
rationale = "The original owned parent wait resumes once, retirement is accepted once, duplicate/stale requests are refused, and one host wake consumes the original park. No semantic retry or polling is admitted."
