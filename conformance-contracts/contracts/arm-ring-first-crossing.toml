schema_version = 1
id = "kernel.el1.arm-ring-first-crossing"
title = "Ring-first refusal preserves ISA policy, family work and completion transport"
guest_surfaces = ["syscall:getuid", "syscall:getpid", "syscall:clock_gettime", "syscall:exit", "syscall:exit_group", "syscall:mmap", "syscall:clone", "syscall:wait4", "syscall:rt_sigreturn", "vmm:hvf", "entry:x86"]
semantic_authority = ["man 2 _exit", "man 2 exit_group", "man 2 mmap", "man 2 waitpid", "https://man7.org/linux/man-pages/man2/signalfd.2.html", "docs/design/arm-ring-first-flip.md"]
fixture = "fixtures/linux-aarch64-hello/src/ring_first.rs"
scale_points = [1]
structural_budgets = []
rationale = """
The owner accepts ENOSYS for unported guest authority calls under the strict
ARM switch. A refused getuid has exactly one refusal and zero forwarded calls;
with the exact =0 hatch it has zero refusals and one forwarded call. Terminal
calls must preserve their status and forward once when no in-ring process
owner serves them, as on x86. The signed witness also checks getpid and the
EL1 monotonic clock fast path (zero host forwards), and bounds its descriptor readiness wait to five seconds. It has
no libc startup; the separate registered GNU fixture links glibc through
ld.so, forwards file-backed mappings and forks once, then polls SIGCHLD for
five seconds and reaps once with WNOHANG. Pipe EOF alone is not a child-state
notification. No workload timing ratio is claimed. Refusal applies only to
unported calls; family fallback, owed work and completion handback preserve
existing authority. x86 policy never reads an ARM aperture and counts native
ordinals. Zero aperture storage enforces strict; explicit opt-out, persistence
and the typed runtime API retain policy. One classified constant-time crossing
table agrees with both exhaustive 0..=512 ISA checks. Aperture
control geometry is compile-time disjoint from service-copy descriptors and
the MM portal, and included in the image layout hash. The aligned VM-free
hatch fixture toggles control with slot-zero idle descriptors populated and
reclaims the exact slot after every setting. A later root must match the
carrier-held policy; conflicting root admission fails before mapping without
changing either live policy.
"""

[bindings]
vm_free = "carrick-el1::x86_context_selects_x86_crossings_without_arm_aperture; carrick-el1::x86_unported_refusal_counts_native_ordinal_not_canonical_ordinal; carrick-personality-linux::crossing::tests::both_sets_match_the_exhaustive_census_through_512; carrick-personality-linux::dispatch::ring_first_tests::strict_arm_preserves_family_declines_handback_and_owed_work; carrick-personality-linux::dispatch::ring_first_tests::failed_entry_admission_cannot_bypass_crossing_policy; carrick-personality-linux::dispatch::ring_first_tests::strict_arm_terminal_calls_without_process_owner_cross_to_carrier; carrick-el1-abi::tests::aperture_control_is_disjoint_from_service_copy_descriptors; carrick-vmm-hvf::hatch::tests::aperture_configuration_preserves_service_copy_slot_zero; carrick-vmm-hvf::hatch::tests::carrier_admission_rejects_conflicting_ring_policy_without_changing_it; carrick-mem::memory::el1_shim_tests::mailbox_shim_routes_raw_clock_gettime_only_when_fast_paths_are_enabled"
embed = "carrick-embed::arm_ring_first_strict_refusal_witness; carrick-embed::arm_ring_first_hatch_disabled_forward_witness; carrick-embed::arm_ring_first_strict_glibc_fork_wait_witness; carrick-embed::arm_ring_first_opt_out_glibc_fork_wait_witness"

[bindings.unresolved]
docker = "Strict ENOSYS is the explicit owner policy, not Linux syscall coverage. Docker execution is prohibited in this scoped task; Linux terminal semantics come from the syscall specifications."
