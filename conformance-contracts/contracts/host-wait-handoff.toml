schema_version = 1
id = "kernel.scheduler.host-wait-handoff"
title = "Host-wait scheduler handoff"
guest_surfaces = [
  "scheduler:host_wait",
  "syscall:read",
  "syscall:write",
  "syscall:pread64",
  "syscall:pwrite64",
  "syscall:fsync",
  "syscall:fdatasync",
]
semantic_authority = [
  "man 2 write",
  "man 2 read",
  "man 2 fsync",
]
fixture = "scheduler_handoff"
scale_points = [1, 2, 4, 8]
rationale = "A host wait must relinquish guest CPU ownership without relinquishing the waiting task's exact execution generation or moving its thread-affine vCPU, keeping guest CPUs available when host operations block. A replacement that has saved/detached its task must return a borrowed CPU before waiting for ASID retirement acknowledgements; the returning host waiter may own a required acknowledgement. The deterministic runtime binding is vcpu_loop::executor::tests::saved_replacement_returns_host_wait_slot_before_terminal_retirement."

[bindings]
vm_free = "carrick-kernel::kernel::scheduler::tests::residency_flush_cannot_lose_a_spare_to_bound_handoff_wake (one flush request must reach a spare across CPU handoff, with no polling or retry); carrick-kernel-example::scheduler_handoff; carrick-kernel::kernel::scheduler::tests::{a_deferred_zone_handback_does_not_audit_a_reaped_target,zone_handback_authenticates_the_registered_continuation,zone_handback_before_registration_kicks_the_running_owner_once} (zone delivery target authentication, retired no-op, and one kick/zero queue rows before enrollment; no new preemption-policy or runtime-cost acceptance); carrick-kernel::kernel::scheduler::tests::serial_host::failed_zone_load_settlement_retires_only_its_owned_continuation (test-only extension: exact continuation transfer and failed-load retirement, zero queued rows after failure/stale delivery; no new preemption, scaling or runtime-ratio acceptance)"
embed = "carrick-embed::host_wait_policy"
docker = "probe:hostwaithandoff"
ecosystem = ["cpython:io", "go:os", "ltp:sendmsg02"]

[[structural_budgets]]
kind = "exact"
metric = "vcpu_migrations"
value = 0
rationale = "Host-wait transitions never migrate a thread-affine vCPU to another host thread."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
