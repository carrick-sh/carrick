schema_version = 1
id = "kernel.el1.anonymous-retirement"
title = "Guest EL1 anonymous mappings retire and reuse bulk frames"
guest_surfaces = [
  "syscall:mmap",
  "syscall:munmap",
  "fault:first-touch",
  "kernel:stage1-mmu",
  "kernel:frame-inventory",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 mmap: a fresh MAP_PRIVATE | MAP_ANONYMOUS mapping is zero-filled even when it reuses a previously unmapped virtual range",
  "man 2 munmap: references to pages in the unmapped range are invalid and the mapping may be replaced by a later mmap",
  "Hypervisor.framework hv_vm_unmap: retired stage-2 backing is removed before its IPA is returned for reuse",
]
fixture = "embed:el1-sched mapping-retirement 256|1024|4096"
scale_points = [256, 1024, 4096]
rationale = "EL1 increment 2 mapping-retirement checkpoint. Each run repeatedly maps one private anonymous range at the same virtual address, verifies complete zero fill, writes every Linux page, unmaps the range, and maps it again. Host diagnostics bind every successfully published EL1 frame-grant lease to its eventual exact allocator return and report whether a later grant reused a returned IPA. The signed three-scale witness requires all grant bytes to return, at least one physical lease to be reused, and incremental host exits below 0.125 per added page per round. This proves semantic replacement, physical return, zeroed reuse and bulk rather than page-granular host work; it does not by itself migrate the munmap syscall into EL1."
structural_budgets = []

[bindings]
vm_free = "carrick-mmu-core::aarch64::tests::owned_host_image_reuse_clears_live_descriptors_written_by_an_el1_editor; carrick-kernel::dispatch::mem::tests::lazy_fixed_anonymous_replacement_rearms_first_touch_after_retirement; carrick-vmm-hvf::trap::global_frame::allocator_stats_tests::el1_grant_stats_count_owned_and_pooled_return_and_reuse"
embed = "carrick-embed::el1_sched::el1_anonymous_mapping_retirement_returns_and_reuses_frames"
docker = "native-arm64 same-source mapping-retirement fixture at 256, 1024 and 4096 pages; docs/perf-results/2026-09-27-el1-anonymous-retirement"

[bindings.unresolved]
production = "This checkpoint proves exact retirement, zeroed reuse and bounded bulk work through the existing mmap-family service boundary. Permission-denial coverage and migration of mmap-family syscall ownership into EL1 remain later increments."
