schema_version = 1
id = "kernel.futex.contention"
title = "Futex contention"
guest_surfaces = ["syscall:futex", "scheduler:continuation", "runtime:platform-futex"]
semantic_authority = [
  "man 2 futex",
  "conformance-probes/probe-inventory.json:futexpingpong",
  "conformance-probes/probe-inventory.json:futexwakeexact",
]
fixture = "probe:futexpingpong"
scale_points = [1, 8, 32, 128]
rationale = "Blocking futex operations must park without redispatch and wake with work proportional to the affected waiter set."

[bindings]
# Supplemental VM-free witness in crates/carrick-thread/src/thread.rs:
# carrick-thread::thread::tests::futex_halt_poll_nonzero_delays_parking_until_window_expires
# uses FutexParkHooks through FutexTable::wait_prepared_with_poll_clock to
# control only the halt-poll clock and observe parking registration. It proves
# zero parked waiters before the nonzero window's exact deadline, then exactly
# one registration and one counted wake at expiry, with no host sleep or
# elapsed-time threshold. Production still supplies Instant::now.
# Non-regression witness for continuation.rs blocked continuation extraction:
# carrick-kernel-example::futex_contention_contract and unit tests in
# crates/carrick-thread/src/thread.rs confirm contention scaling, continuation
# budgets, and waiter enrollment invariants remain intact.
vm_free = [
  "carrick-kernel-example::futex_contention_contract",
  "carrick-el1-linux::aarch64_process_tests::futex_unbacked_word_waits_for_owner_with_two_live_threads",
  "carrick-el1-linux::aarch64_process_tests::futex_relative_deadline_survives_owner_wait_with_two_live_threads",
  "carrick-el1-linux::aarch64_process_tests::futex_relative_deadline_survives_synchronous_owner_redispatch_with_two_live_threads",
  "carrick-el1-linux::aarch64_process_tests::futex_cancelled_owner_wait_releases_deadline_before_next_wait",
  "carrick-el1-linux::aarch64_process_tests::futex_owner_deadline_is_discarded_before_an_unrelated_syscall",
  "carrick-el1-linux::aarch64_process_tests::futex_owner_deadline_is_discarded_before_an_unserved_futex",
  "carrick-runtime::vcpu_loop::binding::tests::serial_host_futex_deadline_survives_zone_word_recheck_owner_park",
  "carrick-el1::substrate::file::atomic_copy_tests",
  "carrick-kernel::dispatch::overlay_dispatch_tests::futex_wait_preserves_owner_memory_refusal_before_comparison",
  "carrick-kernel::dispatch::overlay_dispatch_tests::threaded_futex_relative_deadline_survives_owner_redispatch",
  "carrick-kernel::dispatch::proc::copyout_refusal_s3_tests::futex_pi_lock_and_unlock_wait_for_owner_refused_copyout_without_waking_waiters",
]
embed = [
  "carrick-embed::futex_contention_contract",
]
docker = [
  "probe:futexpingpong",
]
ecosystem = [
  "cpython:concurrent_futures",
  "go:sync",
]

[[structural_budgets]]
kind = "affine"
metric = "continuation_enrollments"
base = 0
per_unit = 1
rationale = "Each blocking waiter enrolls exactly once before parking."

[[structural_budgets]]
kind = "affine"
metric = "futex_queue_visits"
base = 1
per_unit = 1
rationale = "Wake visits only the queue head and the affected waiter set."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
