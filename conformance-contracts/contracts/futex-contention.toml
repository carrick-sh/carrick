schema_version = 1
id = "kernel.futex.contention"
title = "Futex contention"
guest_surfaces = ["syscall:futex", "scheduler:continuation", "runtime:platform-futex"]
semantic_authority = [
  "man 2 futex",
  "conformance-probes/probe-inventory.json:futexpingpong",
  "conformance-probes/probe-inventory.json:futexwakeexact",
]
fixture = "probe:futexpingpong"
scale_points = [1, 8, 32, 128]
rationale = "Blocking futex operations must park without redispatch and wake with work proportional to the affected waiter set."

[bindings]
# Supplemental VM-free witness in crates/carrick-thread/src/thread.rs:
# carrick-thread::thread::tests::futex_halt_poll_nonzero_delays_parking_until_window_expires
# uses FutexParkHooks through FutexTable::wait_prepared_with_poll_clock to
# control only the halt-poll clock and observe parking registration. It proves
# zero parked waiters before the nonzero window's exact deadline, then exactly
# one registration and one counted wake at expiry, with no host sleep or
# elapsed-time threshold. Production still supplies Instant::now.
# This single-waiter witness does not prove contention scaling, continuation
# budgets, guest execution, or Docker runtime ratios; the bindings below retain
# those obligations.
vm_free = "carrick-kernel-example::futex_contention_contract"
embed = "carrick-embed::futex_contention_contract"
docker = "probe:futexpingpong"
ecosystem = ["go:sync", "cpython:concurrent_futures"]

[[structural_budgets]]
kind = "affine"
metric = "continuation_enrollments"
base = 0
per_unit = 1
rationale = "Each blocking waiter enrolls exactly once before parking."

[[structural_budgets]]
kind = "affine"
metric = "futex_queue_visits"
base = 1
per_unit = 1
rationale = "Wake visits only the queue head and the affected waiter set."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
