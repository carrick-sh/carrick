# #1580 derives KVM lifecycle sidecar placement from the shared guest layout.
# cpl0_lifecycle::x5_shared_clone_exit and cpl0_fork_e2e are the real-KVM
# red/green controls; this contract's guest semantics and budgets are unchanged.
# See docs/conformance-contracts/kvm-lifecycle-sidecars.md for the scoped proof.
schema_version = 1
# The progress witness lays out its scheduler table, observation record and
# second root from their sizes. Compile-time bounds prevent overlap before
# hardware execution; cpl0_progress retains its executed XSAVE/TLS isolation
# checks and interrupt budgets. CPUID and XCR0 policy are unchanged.
id = "x86.cpuid.v3"
title = "KVM CPUID and XCR0 expose x86-64-v3 plus host-qualified AES, PCLMUL and deadline timer"
guest_surfaces = ["vmm:kvm", "arch:x86-cpuid", "exec:x86-long-mode"]
semantic_authority = [
  "System V Application Binary Interface AMD64 Architecture Processor Supplement, section 3.1.2 (x86-64-v3 microarchitecture level); Intel SDM volume 2A CPUID specification (order 325383); clean-room architectural rules without Linux, KVM or QEMU implementation source",
]
fixture = "carrick-x86::cpuid::tests; carrick-vmm-kvm::kvm::x86_tests::x86_vcpu_exposes_pinned_x86_64_v3_profile; carrick-vmm-kvm::tests::cpuid_v3_kvm"
scale_points = [11]
structural_budgets = []
rationale = """
Every KVM x86 guest vCPU exposes one deterministic 11-entry CPUID table (`GuestCpuidView`)
pinned to the System V psABI x86-64-v3 baseline plus the IA-32e / CPL0 supervisor
capabilities Carrick programs (`SMEP`, `SMAP`, `SYSCALL`, `NX`, `PAT`, `PGE`, `APIC`,
`INVTSC`), with INVTSC masked by host support and `XCR0` initialized fail-closed to `0x7` (`x87 | SSE | AVX`, 832-byte
standard XSAVE frame). Host qualification (`GuestCpuidView::qualify_supported`)
verifies every required hardware capability once at VM creation in bounded O(entries)
time, clamps `MAXPHYADDR` to `min(host_max_phy_addr, 48)` (refusing `< 36`), stamps
per-vCPU `APIC ID` and calibrated `CPUID.15H` TSC ratio, caps basic leaves with a
zero leaf `0x16` so Intel SDM / KVM out-of-range fallback returns zeroes, and strips
every feature outside the pinned profile (v3 plus host-qualified AES-NI,
PCLMULQDQ and TSC_DEADLINE), including `AVX-512`, `AMX`, `SHA`, `RDRAND`, `RDSEED`, `ADX`, `FSGSBASE`, `PKU`, `LA57`, `UMIP`,
`XSAVEOPT`/`XSAVEC`/`XSAVES`, `HYPERVISOR`, `0x4000_0000` leaves,
`RDTSCP`, `PDPE1GB`, and AMD SEV leaves. Red-first witnesses prove raw host
`KVM_GET_SUPPORTED_CPUID` pass-through fails the strict v3 isolation audit and
verify host qualification refusal and scrubbing before live KVM ring-3 execution.
"""

[bindings]
vm_free = [
  "carrick-x86::cpuid::tests::x86_64_v3_table_advertises_exact_pinned_profile",
  "carrick-x86::cpuid::tests::raw_unscrubbed_host_cpuid_fails_v3_isolation_audit",
  "carrick-x86::cpuid::tests::qualify_supported_scrubs_v4_amd_and_intel_hosts_and_clamps_max_phy_addr",
  "carrick-x86::cpuid::tests::qualify_supported_refuses_hosts_missing_any_required_v3_or_cpl0_capability",
  "carrick-x86::cpuid::tests::per_vcpu_apic_id_and_high_frequency_tsc_calibration_round_trip",
  "carrick-x86::cpuid::tests::optional_features_are_host_qualified",
]

[bindings.unresolved]
