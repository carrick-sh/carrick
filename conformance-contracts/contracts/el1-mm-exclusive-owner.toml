rationale = "Exclusive ownership forbids host semantic protection, COW, VMA projection and predecessor selection after admission. Range operations visit the affected leaves plus tree height, not unrelated VMA population (16/512 nodes). Capacity policy is defined only by kernel.el1.elastic-frame-extents: 4 KiB pages, 16 KiB compounds, 1 MiB extents, 16 KiB low and 1 MiB high watermarks, one pending extent per MM generation and at most one wholly free retained extent after settlement. These are requirements, not green observations. No lock spans host I/O."

