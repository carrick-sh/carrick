schema_version = 1
id = "kernel.vcpu.shutdown-entry"
title = "Carrier shutdown remains visible across every physical vCPU entry"
guest_surfaces = ["scheduler:vcpu-kick", "scheduler:execution-admission", "process:exit-group"]
semantic_authority = ["man 2 exit_group: terminate all threads in the calling process", "Carrick carrier shutdown must join every executor without restarting an idle guest", "Hypervisor.framework hv_vcpus_exit next-entry persistence qualified on the director Mac"]
fixture = "unit:shutdown-entry-handshake"
scale_points = [1, 2]
rationale = "Shutdown is a sticky executor-wide state, independent of consumable reschedule requests, task bindings and mailbox generations. Every physical entry publishes itself and observes shutdown atomically. Shutdown sets the latch then kicks only a published entry. The two-live-executor witness requires zero hardware kicks before entry, one for the active peer and independent shutdown observations. Loom executes the shipping atomic protocol across an internal exit and re-entry. Its edge-only hardware counterexample is required: the director Mac qualified the pending next-entry cancellation with an immediate CANCELED return. Observed shutdown in an in-flight HVF quantum arms existing host-work/IRQ draining, preserving switched-record settlement rather than abandoning EL1 critical sections. Closing executors with undrained work must reach a real condvar park, and retiring the last obligation must wake them to return Closed. After closing scheduler admission, the registry write barrier drains in-flight pool replenishment and the birth-pool owner revokes only unclaimed standing capacity. Claimed/born entries retain their ordinary settlement owner. Two live tasks exit during close with actual process-birth submissions held by their real thread identity pools; unused reservations release before executor joins. Native exception service cancellation precedes host terminal-wake admission. Exact native exception owners remain on their retained terminal checkpoint rather than entering host reload. Two live threads cover a fault in service, late acknowledgement, group exit status, and exclusion from the host run queue. Deferred object completion, settlement, reactor readiness and generic/control wakes share the native-entry verdict: physical Host custody never readies an exception-owned host continuation. An exact native-record wait retains host resumption before zone enrollment and accepts the eventual normal handback or terminal retirement. An adopted host member whose cancelled fault finishes at group exit transfers its consumed native frame back to its exact host terminal owner with a retained handoff receipt; the checkpoint returns Left without entering EL0 or treating HostCustody as Invalid. The VM-free witness drives real Kernel clone, native fault service, group exit, late ACK, host adoption and final status 7. A deterministic host claimant interleaves after queue publication and before receipt completion; successful publication remains authoritative after ownership moves. Existing native queues retain unplaced completions and notify parked execution capacity through the existing scheduler control epoch; publication wakes live eligible stealers once, bounded by the fixed slot population. No retry, periodic interrupt or runtime polling is introduced."
