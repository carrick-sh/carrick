embed = "carrick-vmm-hvf::trap_engine_hvf::shutdown_kick::trap_engine_hvf_shutdown_kick_before_entry; carrick-vmm-hvf::trap_engine_hvf::shutdown_kick::trap_engine_hvf_shutdown_kick_in_run; carrick-embed::el1_files_exit_group_stress"

[bindings.unresolved]
docker = "Physical vCPU cancellation is host-internal; Linux supplies no equivalent HVF oracle."
embed_structural = "Before-entry latch qualified on the director Mac. Signed el1_files stress must be rerun for the native exception terminal ownership changes."
embed_timing = "No guest runtime ratio is claimed; the signed qualification bounds raw run return to two seconds and reports reason/time."
