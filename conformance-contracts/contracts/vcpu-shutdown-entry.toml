schema_version = 1
id = "kernel.vcpu.shutdown-entry"
title = "Carrier shutdown remains visible across every physical vCPU entry"
guest_surfaces = ["scheduler:vcpu-kick", "scheduler:execution-admission", "process:exit-group"]
semantic_authority = ["man 2 exit_group: terminate all threads in the calling process", "Carrick carrier shutdown must join every executor without restarting an idle guest", "Hypervisor.framework hv_vcpus_exit next-entry persistence requires signed qualification"]
fixture = "unit:shutdown-entry-handshake"
scale_points = [1, 2]
rationale = "Shutdown is a sticky executor-wide state, independent of consumable reschedule requests, task bindings and mailbox generations. Every physical entry publishes itself and observes shutdown atomically. Shutdown sets the latch then kicks only a published entry. The two-live-executor witness requires zero hardware kicks before entry, one for the active peer and independent shutdown observations. Loom executes the shipping atomic protocol across an internal exit and re-entry. Its edge-only hardware counterexample is required: the candidate is not a proof of HVF cancellation until the signed raw-WFI qualification establishes a pending next-entry cancellation. Observed shutdown in an in-flight HVF quantum arms existing host-work/IRQ draining, preserving switched-record settlement rather than abandoning EL1 critical sections. No retry, periodic interrupt or runtime polling is introduced."
structural_budgets = []

[bindings]
vm_free = "carrick-runtime::vcpu_loop::executor::tests::shutdown_latch_survives_consumed_reschedule_request; carrick-runtime::vcpu_loop::executor::tests::shutdown_entry_latch_is_sticky_and_scoped_across_two_live_executors; carrick-runtime::vcpu_loop::executor::shutdown_loom::shutdown_entry_handshake_with_latched_backend; carrick-runtime::vcpu_loop::executor::shutdown_loom::shutdown_entry_handshake_requires_backend_latch; carrick-runtime::vcpu_loop::executor::shutdown_loom::shutdown_entry_handshake_rejects_missing_latch_check"
embed = "carrick-vmm-hvf::trap_engine_hvf::shutdown_kick::trap_engine_hvf_shutdown_kick_before_entry; carrick-vmm-hvf::trap_engine_hvf::shutdown_kick::trap_engine_hvf_shutdown_kick_in_run; carrick-embed::el1_files_exit_group_stress"

[bindings.unresolved]
docker = "Physical vCPU cancellation is host-internal; Linux supplies no equivalent HVF oracle."
embed_structural = "Signed qualification and el1_files stress are pending on the director Mac. A failing pre-entry qualification leaves this candidate unlandable."
embed_timing = "No guest runtime ratio is claimed; the signed qualification bounds raw run return to two seconds and reports reason/time."
