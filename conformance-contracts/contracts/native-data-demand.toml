rationale = "A bounded research interval which cannot reach a native memory access before a checkpoint needs execution authority but no data grant. Conservative control-flow analysis must include both conditional successors and backward edges, terminate at host checkpoints, reject invalid targets, and retain the existing backedge bound. Any interval that may access memory uses the unchanged activation path. This is private research code publication with mock stage-2, not product execution acceptance."

