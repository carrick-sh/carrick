[bindings.unresolved]
embed_structural = "Carrier code publication, signed native execution, signal/cancellation and scheduling composition remain unbound."
embed_timing = "Paired unchanged-ELF host controls are diagnostic, not signed native acceptance."
docker = "Same ELF controls must retain identical Linux semantics; no product-native differential binding exists."

