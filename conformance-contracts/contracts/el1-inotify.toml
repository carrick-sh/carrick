# #1090 shared-file scope (classification acknowledgement, not runtime acceptance).
# The shared ABI hash follows the expanded thread-control record; this file
# changes no operation or allocation policy. The ABI unit suite passed 163 tests.
# Existing semantic bindings and work budgets below are retained. These scope
# notes do not replace their contract-specific acceptance. Live continuation
# and reservation-transfer evidence remains unresolved under
# kernel.el1.signal-delivery-owner; see
# docs/conformance-contracts/continuation-signal-return.md.
# #1044: owned-yield replies are typed separately from memory preparation.
# The retained IPC/CarrierWork seam bindings below cover that API change;
# existing fork, lifecycle, file and inotify acceptance remains unchanged.
schema_version = 1
id = "kernel.el1.inotify"
title = "Delegated EL1 inotify operations"
guest_surfaces = [
  "syscall:inotify_init1",
  "syscall:inotify_add_watch",
  "syscall:inotify_rm_watch",
  "syscall:write",
  "syscall:lseek",
  "syscall:read",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 inotify_init1",
  "man 2 inotify_add_watch",
  "man 2 inotify_rm_watch",
  "man 2 write",
  "man 2 lseek",
  "man 2 read",
  "man 7 inotify",
]
fixture = "probe:el1_inotify"
scale_points = [1, 8, 32, 128]
rationale = "LTP inotify09 (two threads racing inotify_add_watch/inotify_rm_watch against write/lseek on the watched file for 3,000,000 iterations) is served in-zone on every run: at least 90% of each hot syscall at EL1, a startup-bounded number of delegations, and within 2x of native Docker. Linux inotify semantics are preserved (TPASS). Ownership must not depend on startup races, so every one of several runs must meet the bounds."

[bindings]
vm_free = [
  "carrick-core-abi::seqlock::tests::{exclusive_seq_excludes_writers_and_rejects_a_ticket_across_any_write,seq_byte_buf_round_trips_and_compares_all_word_boundaries}",
  "carrick-el1-abi::tests::{test_inotify_name_cache,name_cache_concurrent_invalidate_and_refill_never_returns_other_paths_handle}",
  "carrick-el1-abi::loom_models::{loom_invalidate_all_and_refill_never_returns_other_paths_handle,loom_invalidate_file_and_refill_never_returns_other_paths_handle,loom_direct_eviction_overwrite_never_returns_wrong_handle,loom_concurrent_insert_and_invalidate_release_the_entry_and_stay_linearizable}",
]
embed = [
  "carrick-embed::el1_inotify09_contract",
]

[bindings.unresolved]
docker = "EL1 delegation is an internal execution path transparent to the Linux ABI."

[[structural_budgets]]
kind = "upper-bound"
metric = "kernel_dispatches"
maximum = 300000
layers = ["embed-structural"]
rationale = "Per run, host dispatches of inotify_add_watch (27), inotify_rm_watch (28), write (64) and lseek (62) each stay under 10% of the 3,000,000 iterations (the embed contract checks served >= 90% per syscall per run); contention-forwarded operations are served on the host against the in-zone object without an ownership change."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 5
