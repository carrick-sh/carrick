  "carrick-fd-core::record_lock::tests::readers_share_and_a_writer_waits_for_every_reader",
  "carrick-fd-core::record_lock::tests::unlock_splits_and_a_retake_merges_the_owners_ranges",
  "carrick-fd-core::record_lock::tests::a_full_table_refuses_before_any_effect",
  "carrick-fd-core::record_lock::tests::ofd_and_flock_locks_keep_their_owners_and_families_apart",
  "carrick-fd-core::record_lock::tests::a_dead_owners_locks_block_nobody",
  "carrick-fd-core::record_lock::tests::posix_ranges_follow_fcntl",
  "carrick-fd-core::record_lock::tests::identities_follow_the_description_incarnation",
