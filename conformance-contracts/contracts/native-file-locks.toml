schema_version = 1
id = "kernel.native.file-locks"
title = "The ring owns advisory file locks for native processes"
guest_surfaces = ["syscall:fcntl", "syscall:flock"]
semantic_authority = ["man 2 fcntl", "man 2 flock", "docs/host-facility-boundary.md"]
fixture = "unit:serial_host_arm_fork_children_contend_record_locks_and_flock_in_the_ring"
scale_points = [1, 2]
structural_budgets = []
rationale = """
#231 (apt's lock files). fcntl(2) record locks (F_GETLK/F_SETLK/F_SETLKW),
OFD locks (F_OFD_*) and flock(2) are compat-zone state: one neutral lock
table (carrick-fd-core record_lock) in the IPC directory, keyed by the
file's typed identity, which the carrier stamps on a native host-file
description at open. A record lock belongs to the caller's descriptor
table, an OFD lock or flock to one open file description. A close of any
descriptor of the file ends the table's record locks on it, as does the
descriptor a dup2/dup3 replaces and exec's close-on-exec sweep; the
description's last reference ends its OFD and flock locks; at exit the
retired table stops owning and the host drain reaps and wakes. A blocking
request never spins or holds capacity: it parks as an owned FileLockWait
operation on the lock object's lane, enrolled under the table lock, and a
release's wake reruns it to probe once. A signal ends it with EINTR.
The operation keeps the request decoded at entry (fcntl(2) copies its
struct flock in once), and a woken wait is routed by that operation before
any descriptor lookup: it goes on with the description it pinned even when
a sibling closed or replaced its number, and a record lock taken through a
number that no longer names that description is given back with EBADF.
A close or dup2 releases the record locks of exactly the file it retired,
read in the same descriptor-table acquisition.
Not served (counted ENOSYS): SEEK_CUR/SEEK_END bases and unstamped
descriptions; no EDEADLK. The host-dispatched ARM run root keeps the host
arbiter (dispatch/fs/locks.rs), so its locks and a native child's do not
yet conflict (follow-up).
"""

[bindings]
vm_free = [
  "carrick-el1-linux::aarch64_process_tests::serial_host_arm_fork_children_contend_record_locks_and_flock_in_the_ring (production ARM dispatch, two live processes; red: every lock call -38)",
  "carrick-el1-linux::aarch64_process_tests::serial_host_arm_two_lock_waiters_rerun_and_park_again (one release wakes two waiters; the loser parks again on its retained operation)",
  "carrick-fd-core::record_lock::tests::two_tables_contend_for_one_record_lock_until_a_close_releases_it",
  "carrick-fd-core::record_lock::tests::readers_share_and_a_writer_waits_for_every_reader",
  "carrick-fd-core::record_lock::tests::unlock_splits_and_a_retake_merges_the_owners_ranges",
  "carrick-fd-core::record_lock::tests::a_full_table_refuses_before_any_effect",
  "carrick-fd-core::record_lock::tests::ofd_and_flock_locks_keep_their_owners_and_families_apart",
  "carrick-fd-core::record_lock::tests::a_dead_owners_locks_block_nobody",
  "carrick-fd-core::record_lock::tests::posix_ranges_follow_fcntl",
  "carrick-el1-linux::aarch64_process_tests::serial_host_arm_woken_lock_waiters_take_the_request_they_parked_with (the waiters' struct flock rewritten to F_UNLCK while they park; red on a0bd7837d: both reruns returned at once, neither holding the lock)",
  "carrick-el1-linux::aarch64_process_tests::serial_host_arm_lock_waiter_goes_on_with_its_description_after_a_sibling_replaces_its_fd (a sibling dup2s a pipe over the waited-on fd: F_SETLKW ends EBADF holding nothing and blocking flock 0, as the native oracle; red on a0bd7837d: the rerun was routed away from the lock owner)",
  "carrick-el1-linux::aarch64_process_tests::serial_host_arm_close_releases_record_locks_of_the_file_it_retired (a sibling's dup2 between close's entry and its retirement; red on a0bd7837d: the other file's locks were released, the closed file's survived)",
  "carrick-el1-linux::aarch64_process_tests::serial_host_arm_dup_releases_record_locks_only_of_a_displaced_file (a sibling's close and relock between dup3's claim and its commit; red on a0bd7837d: the sibling's lock was released)",
  "carrick-el1-linux::aarch64_process_tests::native_exec_pipe_tests::serial_host_native_fork_exec_ends_record_locks_on_close_on_exec (production exec service: the close-on-exec sweep ends the process's record lock and keeps flock and OFD locks; red with the exec release removed)",
  "carrick-fd-core::record_lock::tests::identities_follow_the_description_incarnation",
  "carrick-fd-core::record_lock::tests::a_parked_request_round_trips_and_refuses_foreign_records",
  "carrick-el1-abi::ipc::tests::el1_ipc_file_lock_layout_refuses_the_previous_abi",
  "carrick-el1-abi::ipc::tests::el1_ipc_file_locks_and_identities_are_shared_by_both_venues",
]
embed = [
  "KVM production carrier: carrick-vmm-kvm::cpl0_initial_mm::serial_host_root_and_fork_child_contend_record_locks_and_flock (native oracle byte for byte; red: fcntl x10, flock x4 refused)",
  "KVM production carrier: carrick-vmm-kvm::cpl0_initial_mm::serial_host_fork_child_record_lock_outlives_its_thread_and_ends_with_dup2_and_exit_group (a non-last thread's exit keeps the lock; dup2 and exit_group with a running worker release it; red: fcntl x5 refused)",
  "KVM production carrier: carrick-vmm-kvm::cpl0_initial_mm::serial_host_exec_close_on_exec_ends_record_locks_and_keeps_flock_and_ofd_locks (a fork child execs itself; native oracle byte for byte; red with the exec release removed: E8 reported the record lock still held)",
]

[bindings.unresolved]
semantics = "SEEK_CUR/SEEK_END bases, EDEADLK and the host-dispatched ARM run root's locks (host arbiter) are not served by this owner (#2460)."
structural = "No work-count budget is bound; the table costs the number of locks held per operation, and every release wakes every lock waiter of the zone (one lane, #2460). The pool-exhaustion witness serial_host_lock_waiters_beyond_the_pool_hold_no_capacity and its pipe control are ignored on #2458: one x86 wake of two parked fork children fails the carrier on main before any lock code runs."
embed_structural = "UNRUN (director): signed ARM run of apt-get on the implementation head."
docker = "The x86 KVM witness compares with the native Linux oracle; no Docker differential."
