schema_version = 1
id = "kernel.native.file-locks"
title = "The ring owns advisory file locks for native processes"
guest_surfaces = ["syscall:fcntl", "syscall:flock"]
semantic_authority = ["man 2 fcntl", "man 2 flock", "docs/host-facility-boundary.md"]
fixture = "unit:serial_host_arm_fork_children_contend_record_locks_and_flock_in_the_ring"
scale_points = [1, 2]
structural_budgets = []
rationale = """
#231 (apt's lock files). fcntl(2) record locks (F_GETLK/F_SETLK/F_SETLKW),
OFD locks (F_OFD_*) and flock(2) are compat-zone state: one neutral lock
table (carrick-fd-core record_lock) in the IPC directory, keyed by the
file's typed identity, which the carrier stamps on a native host-file
description at open. A record lock belongs to the caller's descriptor
table, an OFD lock or flock to one open file description. A close of any
descriptor of the file ends the table's record locks on it, as does the
descriptor a dup2/dup3 replaces and exec's close-on-exec sweep; the
description's last reference ends its OFD and flock locks; at exit the
retired table stops owning and the host drain reaps and wakes. A blocking
request never spins or holds capacity: it parks as an owned FileLockWait
operation on the lock object's lane, enrolled under the table lock, and a
release's wake reruns it to probe once. A signal ends it with EINTR.
Not served (counted ENOSYS): SEEK_CUR/SEEK_END bases and unstamped
descriptions; no EDEADLK. The host-dispatched ARM run root keeps the host
arbiter (dispatch/fs/locks.rs), so its locks and a native child's do not
yet conflict (follow-up).
"""

[bindings]
vm_free = [
