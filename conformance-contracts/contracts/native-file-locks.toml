  "KVM production carrier: carrick-vmm-kvm::cpl0_initial_mm::serial_host_fork_child_record_lock_outlives_its_thread_and_ends_with_dup2_and_exit_group (a non-last thread's exit keeps the lock; dup2 and exit_group with a running worker release it; red: fcntl x5 refused)",
