# #1090 shared-file scope (classification acknowledgement, not runtime acceptance).
# The shared ABI hash follows the expanded thread-control record; this file
# changes no operation or allocation policy. The ABI unit suite passed 163 tests.
# Existing semantic bindings and work budgets below are retained. These scope
# notes do not replace their contract-specific acceptance. Live continuation
# and reservation-transfer evidence remains unresolved under
# kernel.el1.signal-delivery-owner; see
# docs/conformance-contracts/continuation-signal-return.md.
# #1153: InotifyNameCache seqlock rebuild and EL1_ABI_LAYOUT_HASH update in
# shared crates/carrick-el1-abi/src/lib.rs (bound under kernel.el1.inotify and
# kernel.x86.file-region). Open-lifetime reference custody is unchanged.
schema_version = 1
id = "kernel.el1.open-lifetime"
title = "One terminal authority for host and ring file references"
guest_surfaces = ["syscall:dup", "syscall:dup3", "syscall:close", "syscall:fork", "kernel:file-reference"]
semantic_authority = ["man 2 dup", "man 2 close", "man 2 fork", "Issue #329 and director ruling on PR #332: F1a shared lifetime cutover"]
fixture = "carrick-kernel:el1_delegation::tests::serial_host::file_seam_"
scale_points = [1, 16, 512]
rationale = "Host fd-map entries are non-owning views. Ring dup/fork acquire explicit references in the same generation-authenticated lifetime that owns the host functional-reference group. Closing that host group cannot elect recall while a ring reference lives. The last release retains cleanup custody and publishes one indexed handoff; recall demotes bytes without recycling a live open record. The real-VFS witnesses fork through Aarch64NativeProcessService with two live graph tasks. ARM host-view dup/close still cross; owned native-child slots now close/dup in ring. EL1-owned mutation keeps copied child slots out of the host index and removes them before fd reuse. No registered structural-observation closure is claimed."
structural_budgets = []
[bindings]
vm_free = [
  "carrick-kernel::el1_delegation::tests::serial_host::{file_seam_ring_duplicate_survives_last_host_reference,file_seam_final_ring_release_has_one_terminal_handoff_at_each_population,file_seam_native_child_exit_preserves_parent_and_terminal_custody}",
  "carrick-el1-abi::open_lifetime::tests",
]
[bindings.unresolved]
embed_structural = "Director-owned full signed regression gate; the production non-Linux binding follows in F1b/F4."
docker = "Linux dup/close/fork authority is public man pages; this slice's real-VFS proof targets internal reference custody. Neutral Open belongs to F4."
observation = "The ABI observer measures actual CAS attempts; the unfalsifiable records=1 field and record-visit claim are removed. Uncontended one-CAS assertions at 1/16/512 are diagnostic local checks, not a registered WorkScope budget or a bound on fd lookup, fork, host-work task selection or runtime cost. F3 must bind any broader structural claim."
