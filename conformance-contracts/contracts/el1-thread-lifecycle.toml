embed = "carrick-embed::el1_sched::{el1_thread_lifecycle_spawn_slope,el1_thread_lifecycle_tgkill_right_after_clone,el1_thread_lifecycle_mask_storm_exactly_once,el1_thread_lifecycle_cleartid_tid_reuse,el1_thread_lifecycle_rlimit_nproc_exact,el1_thread_lifecycle_fork_during_clone_storm,el1_thread_lifecycle_exit_group_and_exec_during_clone_storm,el1_thread_lifecycle_ptrace_traceclone,el1_thread_lifecycle_seccomp_clone_filter,el1_thread_lifecycle_parked_threads_beyond_executor_pool}"

# Post-exec process forks use a distinct child lifecycle page and require no
# executable thread-birth capacity on the parent. Two live roots retain
# independent gates: AwaitingExecBinding forks, ForkClosing/Closed/HostOnly
# refuse with EAGAIN before preparing an MM or queuing a child.
# Native Closing must reach host-loaded members even when their temporary
# zone admission record has already been released. One control-wake batch is
# applied per retained lifecycle page; this does not complete guest waits.
vm_free = "carrick-mem::memory::syscall_mailbox_tests::served_native_frame_with_late_host_work_reenters_irq_boundary, carrick-mem::memory::el1_hook_kick::native_signal_work_cause_never_replays_a_served_syscall, and carrick-el1-linux::sched::tests::late_host_work_on_a_switched_native_record_enters_its_owner_boundary (a served native frame with late host work becomes an IRQ frame and the neutral scheduler requires its exact switched owner to settle custody before any host exit, preserving final EL0 return state and syscall completion); carrick-sched-core::tests::{idle_native_mm_does_not_license_a_host_owned_successor,idle_native_mm_steals_host_work_without_switching_it_in} (idle native MM installation cannot license a host-owned successor or stolen record; handback precedes driver parking); carrick-el1-linux::aarch64_process_tests::native_child_handoff_tests::{arm_exec_binding_then_native_fork_commits_on_current_stack,arm_fresh_binding_then_native_fork_commits_on_current_stack} (Linux pthread stack bounds cover the complete aligned 128-byte Commit wire record after production exec commit/executable binding and ARM native clone; retained custody stays boxed, host-home Free custody remains unchanged; no signed guest authentication claim); carrick-el1-abi::entry_binding_fatal::tests (terminal register/frame/identity/custody observation only; no guest execution acceptance); carrick-runtime::vcpu_loop::memory::tests::arm_entry_binding_diagnostic_reaches_the_fatal_record_without_truncation; carrick-el1-linux::native_process_runtime::tests::{native_fork_awaiting_exec_binding_with_fork_closing_peer,native_fork_awaiting_exec_binding_with_closed_peer,native_fork_awaiting_exec_binding_with_host_only_peer}; carrick-sched-core::loom_models: production claim-word/queue atomics, preemption bound 3 for focused races and 2 for composed cases, no duration/permutation cap; scheduler ownership and kick receipts only, graph adoption and physical interrupt delivery remain integration obligations; carrick-el1-linux::aarch64_process_tests::{arm_two_live_threads_exit_group_ends_group_with_status,arm_signal_setup_then_timed_futex_keeps_its_deadline}; carrick-runtime::vcpu_loop::binding::tests::native_terminal_request_kicks_loaded_member_without_zone_record_once; carrick-el1-image compiled frame gate and carrick-xtask::el1_image_sysroot::image_build::frame_budget::tests (parser, combined chain rejection, oversized personality frame)"

[bindings.unresolved]
vm_free = "Host terminal handback (#469): carrick-runtime::vcpu_loop::executor::backend::residency::tests::native_terminal_host_wake_does_not_return_after_exit_group parks the real native root with a second live host-born thread, publishes the sibling retirement receipt, and forces host transfer through the production register materializer. It requires re-entry to the retained native owner rather than a post-exit_group EL0 return, preserved status 7, exactly one terminal consumption through common dispatch, and cleared disposition on record reuse. The distinct-generation row of arm_two_live_threads_exit_group_ends_group_with_status keeps host process incarnation 12 separate from CPU snapshot generation 1; the exact host receipt must finish Closing after its zone wake. Late-owner terminal wake (#469): carrick-el1-linux::aarch64_process_tests::arm_unadopted_exit_wakes_closing_owner_without_process_venue first refuses the Born sibling's production process admission before root registration, then imports both live threads, parks the closing root during the sibling's admitted raw exit, and requires exactly one zone wake and one root exit. The witness uses existing admission/commit seams with no sleeps; retirement notification comes from the neutral terminal verdict even when the caller has no process venue. Page-live exit reservation binding: carrick-kernel::kernel::operations::exit::tests::host_exit_observes_page_last_member_before_mutating_graph keeps both graph records intact when an in-zone exit has already made the host caller last in the page live word. carrick-core::lifecycle::membership_tests::unpublished_nonfinal_exit_restores_live_in_release, carrick-el1-linux::aarch64_process_tests::arm_raw_exit_decline_after_membership_reservation_restores_live and carrick-kernel::kernel::thread_ledger::tests::lifecycle_host_adopted_abi_exit_consumes_exact_reserved_custody prove declined reservations restore one live unit, including release builds and an intervening birth. Reservation and restoration each update only the exact page word, with no census scan or additional allocation. Signed integration remains director-owned. Exit-participant binding: carrick-kernel::kernel::thread_ledger::tests::prepared_parent_exit_* deterministically interleave a prepared parent exit with its two-thread live child's admitted ABI birth, zone/host nonfinal exit, and membership before completion publication. They preserve exact identity and reparenting, keep the participant gate Open, retain revision capacity through exhaustion, release it on drop, and reject unowned revision drift. These focused tests do not confer signed spawn-slope acceptance. Terminal clear binding: carrick-runtime::vcpu_loop::threads::child_tid_owner_tests covers owner refusal, graph contention cancellation, terminal owner, retired loser and unadopted member custody. Single-queue CLEARTID binding (#685): its serial_host_zone_joiner_woken_by_unkeyed_{thread_exit,terminal_commit,clear_drain} wake a zone-parked joiner of the retiring thread's mm from a job with no zone key, and serial_host_zone_cleared_child_tid_is_not_cleared_or_woken_again proves the host lane honours ClearChildTidState::ClearedInZone; carrick-personality-linux x86_wave2 x5_exit_requeued_after_wake_wakes_once proves an in-zone exit requeued after its wake records ClearedInZone and the re-run exit neither clears nor wakes again. carrick-kernel::kernel::operations::exit::tests::retired_task_holds_wait_vfork_and_subscribers_until_terminal_clear_publication proves clear-before-completion with real vfork and exit subscribers; continuation and scheduler tests cover the staged-child enrollment and wake classification races. carrick-runtime::vcpu_loop::terminal_clear_loom (just test-loom) explores two actors with preemption bound 2 around the production prepared-clear sequencer: one committed clear/one wake, or one cancelled permit and no terminal effects on graph refusal. Its eager-publication negative control must be rejected. The modeled graph/futex observations are not a proof of owner enrollment or the HVF ABI; ordinary and signed bindings remain required. carrick-runtime::vcpu_loop::thread_adoption::tests::{abi_first_entry_after_exec_close_cannot_acquire_a_runtime_owner,abi_first_entry_before_terminal_close_remains_in_the_admission_drain} deterministically prove that first host entry cannot create a member after exec stop and that an admitted first entry remains in the terminal publication drain; a second live process keeps its own admission. abi_first_entry_of_an_existing_birth_can_finish_while_fork_admission_is_closed preserves adoption of a fork's existing sibling. carrick-kernel::el1_zone::tests::foreign_parked_thread_projection_uses_exact_incarnation_not_vcpu_home proves O(1) sleeping-state lookup for non-home records and rejects another thread or reused record; carrick-el1-abi::thread_lifecycle::tests::zone_record_binding_is_bounded_and_reset_with_its_control_incarnation proves bounded publication reads and reset. carrick-vmm-hvf::trap::task_only_carrier_directory_tests::retired_process_slot_reuse_does_not_alias_retained_thread_authority proves logical retirement/root-slot reuse cannot confuse retained predecessor thread custody with a new process, while successor threads share their own MM; retired_process_mm_indexes_do_not_grow_with_historical_forks proves the exact MM indexes retain zero historical rows at fork scales 1/8/32; no full lifecycle acceptance is claimed. Pool, ledger and settle semantics get VM-free kernel tests in stage L1 (kernel-example suites); the live EL1 clone/exit path, cross-vCPU signal masks and executor-pool exhaustion need real trap frames. Process-exit interleave binding: carrick-el1-linux::native_process_runtime::tests::delayed_child_exit_* run a real NativeProcessRuntime R -> P -> C on two compact CPU slots and force P through exit_group on a peer host thread inside C's committed exit, after MM retirement and before notification. They prove exact parent-generation retirement, reparenting of C's receipt to R, no carrier failure and one final publication; they confer no signed spawn-slope acceptance. Host fork/exit binding (#441): carrick-el1-linux::aarch64_process_tests::{arm_exit_group_defeats_admitted_host_fork,arm_exit_group_defeats_prepared_host_fork,arm_exit_group_defeats_committing_host_fork,arm_exit_group_waits_for_winning_host_fork_publication,arm_exit_group_waits_for_losing_host_fork_backend_rollback} share the actual KernelContext page and control with ARM arm_call, retain a second live process, and verify status 7, no child or retained MM/files/record for the loser, zero residual publication claims, and independent-child reparenting for the winner. One constant-size SeqCst claim/gate pair orders host commit against terminal close; Closing cannot settle during publication or rollback. HostOnly service keeps seccomp/ptrace host forks legal. The host_only_setup_sigprocmask_declines_to_host and host_only_setup_robust_list_declines_to_host VM-free ARM dispatch witnesses require Forward and unchanged per-thread state on HostOnly pages, preserving filter and tracer authority. These VM-free bindings do not prove HVF execution.; carrick-el1-image compiled frame gate and carrick-xtask::el1_image_sysroot::image_build::frame_budget::tests (parser, combined chain rejection, oversized personality frame)"
docker = "Each fixture mode asserts Linux semantics only and is meant to run unchanged as `el1-sched <mode>` in native arm64 Docker; the same-source differential binding is not yet automated. `nproc-limit` needs root in the container (it drops to uid 34567); `ptrace-clone` needs the default Docker seccomp profile (ptrace allowed)."
embed_structural = "Not yet a registered WorkObservation binding: el1_thread_lifecycle_spawn_slope asserts, outside the contract evaluator, forwarded `exit` calls per added thread < 0.05 across 16/64/256 rounds (fractional, so not expressible as an integer affine budget) and prints the forwarded clone, rt_sigprocmask, sigaltstack, set_robust_list and gettid slopes. Expected RED until thread exit is served in the zone (stage L3/L4)."
production = "Kernel ThreadIdentityPool and ThreadLedger (L1), lifecycle page and control slot ABI (L2), EL1 lifecycle personality (L3) and settle-before-context runtime gates (L4)."

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 1024
per_unit = 2
layers = ["embed-structural"]
rationale = "Declared from el1_thread_lifecycle_spawn_slope (4 threads per round in each of two processes, so 8 threads per scale unit = one round). Today each thread costs about 9 forwarded calls (about 72 per round). With thread birth, exit, signal masks, sigaltstack and robust-list setup served in the zone, forwarded dispatches per round are a small constant, so at most 2 per round remain (the design's own budget is about 0 per round) on top of a fixed base for fixture start-up, the fork and the pipe pair. The test's exact assertion, forwarded thread exits per added thread below 0.05, is stricter than this integer form and stays in the embed test."
