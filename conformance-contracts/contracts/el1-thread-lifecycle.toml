semantic_authority = [
  "man 2 clone: CLONE_PARENT_SETTID stores the child tid in the parent before clone returns, CLONE_CHILD_CLEARTID clears the word and wakes a futex when the child exits; the returned tid is valid for tgkill immediately",
  "man 2 gettid / man 2 tgkill / man 2 kill: a thread's tid is stable for its life; tgkill targets exactly that thread; kill with a thread's tid signals the thread group",
  "man 7 signal: a process-directed signal is delivered to exactly one thread that does not block it; a real-time signal queued with sigqueue is delivered once per send; changing the mask so a pending signal becomes unblocked delivers it",
  "man 2 getrlimit (RLIMIT_NPROC): the limit applies to every task (process or thread) of the real uid, across processes; clone and fork fail with EAGAIN when the uid's count would exceed it",
  "man 2 fork: the child has exactly one thread, the caller's copy, whatever other threads existed in the parent",
  "man 2 _exit: a terminating process reparents its children to init or a subreaper; raw exit retires only its calling thread, with reparenting reserved for the last thread in that group (https://man7.org/linux/man-pages/man2/_exit.2.html)",
  "man 2 execve / man 2 exit_group: every other thread of the group is destroyed and does not survive; after execve the process is single-threaded with the caller's pid",
  "man 2 ptrace: PTRACE_O_TRACECLONE stops the tracee with PTRACE_EVENT_CLONE, reports the new tid through PTRACE_GETEVENTMSG, and auto-attaches the new thread with an initial SIGSTOP",
  "man 2 seccomp: a filter's SECCOMP_RET_ERRNO action fails the matching clone with that errno before any task is created",
  "man 2 futex: a thread blocked in a futex wait or a poll never prevents other threads of any process from running",
  "man 5 proc_pid_stat: state S describes an interruptible sleeping thread; a parked adopted EL1 birth has the same observable state as a parked host-born thread",
]
fixture = "embed:el1-sched thread-spawn-slope 4 16|64|256; embed:el1-sched tgkill-after-clone 16; embed:el1-sched mask-storm 2000; embed:el1-sched signal-retarget 32; embed:el1-sched tid-reuse 100; embed:el1-sched nproc-limit; embed:el1-sched fork-storm 16; embed:el1-sched exit-group-storm 4; embed:el1-sched exec-storm 4; embed:el1-sched ptrace-clone; embed:el1-sched seccomp-clone; embed:el1-sched futex-flood 192"
scale_points = [16, 64, 256]
rationale = "EL1 thread lifecycle stage L0 (docs/superpowers/plans/2026-09-30-el1-thread-lifecycle.md). The signed fork-COW fixture pays about 9 forwarded calls per thread spawn and exit (clone, four rt_sigprocmask, three sigaltstack, exit); the design moves birth and exit into the zone behind a kernel-issued identity pool. These witnesses fix what that must not change, each asserting Linux semantics only so the same fixture binary is green on native arm64 Docker: (a) thread spawn/join across two live processes; (b) a CLONE_THREAD child is tgkill-able the instant clone returns, its gettid equals the PARENT_SETTID word and the clone result, the handler runs on that tid, /proc/self/task lists it, and a second process kill(tid)s it; (c) a thread flipping a signal's mask in a loop while another process sigqueues 2000 values sees each exactly once, and a process-directed signal goes to the thread that does not block it, in both directions; (d) after CLEARTID join the tid leaves /proc/self/task and a still-listed tid is not reissued; (e) RLIMIT_NPROC counts threads uid-wide (fixture drops to uid 34567): at the limit clone and fork fail EAGAIN while a same-uid peer with its own limit forks, the smallest admitting limit counts both processes, and with limit L and C existing tasks exactly L-C held threads are admitted (a new task is refused when the uid already has >= L tasks); (f) fork during an 8-thread clone storm leaves the child exactly one thread; (g) exit_group and execve during a clone storm leave no surviving tid and no hang; (h) PTRACE_O_TRACECLONE and a seccomp EPERM filter on thread clone behave as on Linux; (j) 192 parked threads per process in two processes, beyond the executor pool's default workers, all complete. The structural claim asserted by the spawn-slope test is that thread exit is born in the zone: fewer than 0.05 forwarded exit calls per added thread across 16/64/256 rounds. ARM entry composition additionally enforces compiled stack envelopes of at most 12288 bytes including the vector save on the unchanged 16384-byte stack; signal frames and native retained records use admitted heap storage or borrows. See docs/el1-stack-budget.md for scope, nesting and outstanding whole-program/guard-page work."

