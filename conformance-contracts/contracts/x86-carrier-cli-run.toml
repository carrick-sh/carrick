rationale = """
The CLI must load an x86 ELF into a Carrick-owned guest MM and execute it in
the production CPL0 shared kernel under KVM. In-zone identity, MM, child and
wait operations must use the common kernel graph; only stdout bytes and other
real host crossings use the host transport. Fork must create no host process.
The first CLI test is deliberately red on the current plan refusal. The
production carrier, physical/MM custody, task scheduling and work counters
must be bound before this contract can claim a structural or runtime pass.
The one-page, two-slot Cpl0Carrier fixture and retired bringup_fns path are
not execution bindings for this contract.
"""

