schema_version = 1
id = "kernel.time.realtime-calibration"
title = "Existing and newly executed address spaces share the syscall realtime base"
guest_surfaces = ["syscall:clock_gettime", "syscall:gettimeofday", "syscall:execve", "vdso:clock_gettime"]
semantic_authority = ["man 2 clock_gettime", "Linux Test Project clock_gettime04 (LTP 20260529)"]
fixture = "ltp:clock_gettime04-with-sibling-exec"
scale_points = [1, 8, 32, 128]
structural_budgets = []
rationale = "Without an explicit clock adjustment, sequential vDSO/syscall realtime reads must not move backwards when a sibling exec calibrates a new vvar page. Every page and syscall reader uses one immutable host-carrier calibration; guest clock adjustments remain independent container deltas. Host calibration uses one atomic compare-exchange per stamp. Native exec copies one word from the existing clock domain into its private image before mapping. Neither operation retries, scans address spaces, or updates a sibling's vvar. The VM-free tests check calibration coherence and the native loader's application of the container delta. Signed execution checks ten LTP comparisons alongside the declared number of sibling execs and requires both the initial process and a native exec successor to read the host realtime clock. No work-meter observation or runtime ratio is claimed."

[bindings]
vm_free = [
  "carrick-mem::vdso::tests::realtime_calibration_is_shared_by_existing_and_new_address_spaces",
  "carrick-runtime::runtime::exec::tests::native_exec_successor_inherits_realtime_calibration",
]
embed = [
  "carrick-embed::realtime_calibration::realtime_calibration_survives_sibling_exec",
  "carrick-embed::realtime_calibration::realtime_is_calibrated_for_the_native_exec_successor",
]
docker = [
  "ltp:clock_gettime04-with-sibling-exec",
]
ecosystem = [
  "ltp:clock_gettime04",
]
