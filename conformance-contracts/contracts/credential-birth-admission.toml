schema_version = 1
id = "kernel.credentials.birth-admission"
title = "Thread credential publication does not close sibling birth admission"
guest_surfaces = ["syscall:setuid", "syscall:setgid", "syscall:setresuid", "syscall:setresgid", "syscall:clone", "libc:NPTL setxid"]
semantic_authority = ["man 2 setresuid", "man 2 setresgid", "man 2 clone", "man 2 setrlimit", "man 7 nptl"]
fixture = "setid_birth_admission: one claimed sibling birth held across 1/8/32 credential transitions"
scale_points = [1, 8, 32]
rationale = "Linux credentials belong to the calling thread; NPTL broadcasts raw setxid calls to synchronize siblings. A sibling birth cannot cause an internal EAGAIN on a credential transition. The settled registry transaction publishes completed births before replacing the caller's credentials. CAS revocation withdraws only unused credits, preserving a claimed sibling's identity, caller credentials and uid-wide RLIMIT_NPROC charge. The VM-free dispatcher witness completes every requested transition in one entry, without a continuation, polling or redispatch, while the sibling birth remains claimed."

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 0
per_unit = 1
layers = ["vm-free"]
rationale = "Each requested transition enters the real dispatcher once, including while waiting for a conflicting publication reservation. The fixtures assert CompatReporter invocations and exact publication events; this is not a signed work observation."

[bindings]
vm_free = "carrick-kernel-example::setid_birth_admission::setid_during_a_claimed_sibling_birth_completes_without_wait_or_errno; carrick-kernel-example::admission_interleavings::{setresuid_during_sibling_birth_completes_once,admitted_credential_wait_releases_permit_without_redispatch} (exact pre-fix source, seeded shared hooks, one birth/publication and zero admitted-wait redispatch at 1/8/32); carrick-kernel::kernel::thread_ledger::tests::{credential_update_preserves_claimed_sibling_birth_and_uid_accounting,credential_update_settles_own_completed_birth_before_cow}"
embed = "carrick-conformance-next::probes_shard_0::generic_probe_shard_0 with CARRICK_PROBE_FILTER=setidthreadchurn; carrick-embed::el1_sched::el1_thread_lifecycle_rlimit_nproc_exact"

[bindings.unresolved]
docker = "Use the committed source-hash-validated setidthreadchurn oracle; this shared-host task explicitly prohibits Docker. No refreshed differential or runtime-ratio acceptance is claimed."
observation = "The VM-free fixture directly asserts one dispatcher invocation per transition and no suspension at scales 1/8/32; this is not a registered WorkObservation or a claim about total kernel work."
