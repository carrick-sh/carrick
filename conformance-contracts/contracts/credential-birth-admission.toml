schema_version = 1
id = "kernel.credentials.birth-admission"
title = "Thread credential publication does not close sibling birth admission"
guest_surfaces = ["syscall:setuid", "syscall:setgid", "syscall:setresuid", "syscall:setresgid", "syscall:clone", "libc:NPTL setxid"]
semantic_authority = ["man 2 setresuid", "man 2 setresgid", "man 2 clone", "man 2 setrlimit", "man 7 nptl"]
fixture = "setid_birth_admission: one claimed sibling birth held across 1/8/32 credential transitions"
scale_points = [1, 8, 32]
rationale = "Linux credentials belong to the calling thread; NPTL broadcasts raw setxid calls to synchronize siblings. A sibling birth cannot cause an internal EAGAIN on a credential transition. The settled registry transaction publishes completed births before replacing the caller's credentials. CAS revocation withdraws only unused credits, preserving a claimed sibling's identity, caller credentials and uid-wide RLIMIT_NPROC charge. The VM-free dispatcher witness completes every requested transition in one entry, without a continuation, polling or redispatch, while the sibling birth remains claimed."
