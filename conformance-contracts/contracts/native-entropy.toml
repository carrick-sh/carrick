rationale = "A fork child and parent remain live through bounded entropy staging, the existing host getrandom handler, exact ticket acknowledgment, copyout and native resume. Staging is bounded to 4096 bytes. Busy and OwnerWait retain bytes and the committed cursor rather than regenerating or replaying output. Physical signed ARM and x86 transport require their own evidence."

