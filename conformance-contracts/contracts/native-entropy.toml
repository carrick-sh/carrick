semantics = "ARM VM-free witnesses drive asynchronous completion and native resume. Signed native-child execution remains UNRUN (director)."
structural = "Bounded staging and retained page cursor have VM-free witnesses, including stale-MM claim refusal. Signed work counts and runtime ratios remain UNRUN (director)."
x86 = "The ignored KVM cpl0_initial_mm tests serial_host_native_child_getrandom_default_returns_eight_bytes and serial_host_native_child_getrandom_nonblock_returns_eight_bytes exercise fork, child getrandom and parent wait through the production pool. Native Linux exits 8 for both flags, KVM exits 218 (-38 modulo 256). The x86 carrier still needs typed entropy transport; these are defect witnesses, not acceptance."
