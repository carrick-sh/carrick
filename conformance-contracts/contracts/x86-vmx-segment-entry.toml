kvm_intel = "Issue #253: director-owned GCP Intel KVM gate must prove the exact candidate no longer fails VM entry; VM-free evidence is not live acceptance."
kvm_amd = "Merge-queue KVM receipt must show no new failures against main; local just test-kvm is prohibited by the lane policy."
signed = "Linux worker cannot run signed HVF tests; no signed runtime acceptance is claimed."
docker = "Architectural VM-entry contract uses Intel SDM authority; this host has no Docker and no workload ratio is claimed."
