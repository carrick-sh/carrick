# #1580 derives KVM lifecycle sidecar placement from the shared guest layout.
# cpl0_lifecycle::x5_shared_clone_exit and cpl0_fork_e2e are the real-KVM
# red/green controls; this contract's guest semantics and budgets are unchanged.
# See docs/conformance-contracts/kvm-lifecycle-sidecars.md for the scoped proof.
schema_version = 1
id = "x86.vmx.segment-entry"
title = "Long-mode hidden descriptors satisfy Intel VMX segment entry checks"
guest_surfaces = ["vmm:kvm", "vmm:nvmm", "vmm:bhyve", "exec:x86-long-mode", "task:x86-restore"]
semantic_authority = ["Intel SDM volume 3, order 325384, sections 26.3.1.1 through 26.3.1.4; clean-room architectural rules, without Linux, KVM or QEMU implementation source"]
fixture = "carrick-x86::segments::tests; carrick-x86::bringup_fns::tests::vmx_programmed_entry_segments_are_valid; carrick-vmm-kvm::kvm_x86_engine::vmx_segment_tests"
scale_points = [8]
structural_budgets = []
rationale = """
Every entry and restore publishes representable hidden segment limits and
consistent G bits. The busy 64-bit TR has limit 0x67, access rights 0x8B
and G=0, including after CPL0 rebasing. Constructors derive G from the
byte limit and refuse limits that cannot be encoded. The validator visits
one fixed array of eight descriptors exactly once, with no I/O, waits or
retries. Typed programming adds no runtime validation pass or allocation.
Red-first shared user/kernel and actual entry witnesses, plus the grouped
KVM restore builder, fail on the old TR with only Granularity violations.
Green negative controls exercise independent descriptor and control defects.
The validator is scoped to four-level IA-32e entry; capability-dependent
CR fixed masks and injected-interrupt state remain backend responsibilities.

#671 R1c neutral CPL0 boot extraction: the helper boundary preserves the
existing descriptor writes and ordering. Existing Linux/KVM bindings provide
gate coverage; no descriptor-path coverage (follow-up #2476):
kvm_x86_engine::vmx_segment_tests::vmx_restore_user_and_cpl0_segments_are_valid
No retry, signed acceptance, or runtime-ratio claim; semantics and budgets
remain unchanged.

#671 R3 owned preparation extraction: prepare_boot returns PreparedBoot before
backend registration. RAM, the ELF plan, table capacity, IPC backings and their
generation, and kernel pod storage move without copying bytes or allocations.
The original preparation block retains its validation and publication order;
only module paths and the borrowed inventory boundary change. Existing bound
KVM initial-MM, IPC, lifecycle, file-region and entropy witnesses named here
exercise that same bootstrap. The neutral bootstrap descriptor byte witness
initialize_bootstrap_descriptors_has_exact_bytes also runs. CPUID and segment
bindings provide gate coverage; no descriptor-path coverage (follow-up #2476).
The scheduler fixtures entry_kick_and_timer_preempt_two_private_contexts and
return_kick_and_timer_preempt_two_private_contexts exercise both retained roots.
No bindings, semantic expectations, structural budgets or acceptance layers
change; signed acceptance and runtime-ratio promotion remain director-owned.

#671 R4 isolates the new BootCpuState value/helper boundary from KVM ioctl
conversion. It retains the existing program_longmode_entry and
program_fault_segments helpers, per-slot entry registers, direct-map GDTR,
private IDTR/TR, fixture IF policy and production CR4 requirement. KVM keeps
its setter order, readback checks and admission. The neutral production-caller
witness boot_cpu_state_has_exact_values records control registers, hidden
segment values and entry registers for both slots and all boot-mode pairs.
RIP-stride, CR4-SMAP and IDT-alias mutations each make that witness fail.
Existing vmx_programmed_entry_segments_are_valid and
vmx_restore_user_and_cpl0_segments_are_valid bindings also run unchanged.
No binding, budget, runtime-ratio or signed-acceptance claim changes.

#671 M1-1 shared boot extraction: install_boot_memory (generic over
CarrierMemoryIo) now holds KVM's post-preparation memory registration, and
load_guest_mm with publish_production_reservations is generic over
Cpl0BootCarrier. bind_initial_task_identity, bind_execution and
initial_mm_key moved onto BootstrapCustody, and initial_extent_bytes_for
and unexpected_boot_wake are shared functions. KVM delegates to all of
them. The moved bodies keep their validation, publication order and
errors: only indentation, module paths, borrow spellings and the
custody/CPU accessors change. KVM's kernel entry keeps the original
sregs/MSR/regs ioctl sequence. just test-kvm passed with exit 0 at
c744a7e13 (patch-identical code at 66eb87b3a) in both partitions, including KVM lib (47) and neutral host
lib (106). The soft carrier (carrick-vmm-soft) is the second production
caller; its probe admits an initial MM through the same functions. No
bindings, semantic expectations, structural budgets or acceptance layers
change. Signed acceptance and runtime-ratio promotion remain
director-owned.
"""

[bindings]
vm_free = [
  "carrick-x86::segments::tests",
  "carrick-vmm-kvm::kvm_x86_engine::vmx_segment_tests::vmx_restore_user_and_cpl0_segments_are_valid",
  "carrick-x86::bringup_fns::tests::vmx_programmed_entry_segments_are_valid",
  "carrick-el1-abi::tests::an_image_built_against_another_layout_is_refused",
  "carrick-el1-abi::tests::layout_hash_changes_when_any_fact_changes",
]

[bindings.unresolved]
embed_structural = "Live Intel and AMD KVM bindings are director-owned acceptance; this worker binds architectural state only, with no runtime work observation."
kvm_intel = "Issue #253: director-owned GCP Intel KVM gate must prove the exact candidate no longer fails VM entry; VM-free evidence is not live acceptance."
kvm_amd = "Merge-queue KVM receipt must show no new failures against main; local just test-kvm is prohibited by the lane policy."
signed = "Linux worker cannot run signed HVF tests; no signed runtime acceptance is claimed."
docker = "Architectural VM-entry contract uses Intel SDM authority; this host has no Docker and no workload ratio is claimed."
