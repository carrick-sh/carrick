schema_version = 1
id = "kernel.native.host-file-venue"
title = "Native processes cross to the host only for host files, through the dispatcher's own path"
guest_surfaces = ["syscall:pipe2", "syscall:read", "syscall:pread64", "syscall:lseek", "syscall:getdents64", "syscall:fstat", "syscall:newfstatat", "syscall:statx", "syscall:openat", "syscall:faccessat", "syscall:write", "syscall:writev"]
semantic_authority = ["man 2 read", "man 2 pread", "man 2 lseek", "man 2 getdents64", "man 2 fstat", "man 2 statx", "man 2 openat", "man 2 pipe", "owner decision on #231, #894 and #937"]
fixture = "unit:native_reads_equal_the_dispatchers_own_syscalls"
scale_points = [1]
structural_budgets = []
rationale = """
A ring-owned (native) process has no host task. Its calls on in-zone objects
(pipes, eventfds, epoll) never build a host request: they stay with the ring,
which answers fstat/statx of those objects itself from the same shared stat
record the dispatcher reports. Calls on host-backed descriptions cross once
to the carrier, which runs the dispatcher's own description cores (read,
pread64, lseek, getdents64, stat) against the caller's pinned description, so
a native process sees exactly what the dispatcher's own syscalls return.
Pipe creation is staged once to the carrier's existing pipe factory and
publishes two existing in-zone OFDs atomically into the caller's ring table.
It allocates zero host fd slots and retains zero host-resource tokens. Subsequent
I/O and close remain in ring; the carrier retains no endpoint after publication.
A failed output copy withdraws each newly created endpoint only while its
slot still names that exact backing incarnation, preserving concurrent reuse.
Paths resolve with the caller's own credentials and filesystem context, never
the serving task's. The VM-free witnesses compare venue results with the
dispatcher's syscalls byte for byte and prove the in-zone routing.
"""

