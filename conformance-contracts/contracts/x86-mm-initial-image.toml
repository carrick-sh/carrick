schema_version = 1
id = "x86.mm.initial-image"
title = "A fresh x86 address space enters an ELF executable and its interpreter through the shared guest MM owner"
guest_surfaces = ["exec:static-elf", "exec:dynamic-elf", "vmm:kvm", "mm:initial-image"]
semantic_authority = [
  "Linux x86_64 ELF and System V ABI: PT_LOAD file bytes and zero BSS, user page permissions, 16-byte aligned entry RSP at argc followed by argv, envp and auxv",
  "ELF gABI Program Interpreter and x86-64 psABI process initialization: enter PT_INTERP at its entry; AT_BASE identifies its load bias while AT_ENTRY, AT_PHDR and AT_PHNUM describe the executable",
  "The exact static x86_64 exit_group(7) ELF enters at e_entry and terminates with status 7",
]
fixture = "carrick-el1::isa::x86::initial_mm::tests; carrick-vmm-kvm::cpl0_initial_mm::shared_guest_owner_loads_static_elf_and_exits_seven; production_enters_pt_interp_instead_of_executable_entry"
scale_points = [1, 2, 3]
structural_budgets = []
rationale = """
The ISA-neutral ELF planner supplies the executable and PT_INTERP regions;
only executable regions determine brk. The x86 guest initial owner backs the
entry leaf and full configured bootstrap stack. Remaining ELF pages retain
immutable initialized bytes and implicit zero padding through the reservation
owner's HostBackingIdentity. Faults select those sources through the existing
Prepare protocol. Source custody belongs to the carrier's retained initial
aperture, so a parent's exit or exec cannot invalidate a child's byte source.
The initial aperture remains capped at 512 MiB. At 4, 32 and 100 MiB, sizing
permits one staged copy plus topology-sized table stock and bounded metadata;
untouched pages owe neither private output frames nor publications. Fork
inherits absent sources separately from the bounded resident frame population.
The large-fork binding reads a nonzero initialized byte in a distant leaf that
was absent at fork, in both child and parent.
This is not yet a complete integration: forwarded host reads and writes still
require resident stage-1 translations. Valid ELF-backed syscall buffers can
therefore fail when untouched. The existing UserRead/UserWrite transfer owner
must prepare these buffers and retain the syscall across Supply/Wait before
forwarding. A direct source-read fallback or host descriptor edit would bypass
that owner. The initial-MM suite remains red and this candidate must not land.
Signed acceptance, native Docker differential and runtime ratios remain open.
"""

