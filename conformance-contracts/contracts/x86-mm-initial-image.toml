schema_version = 1
id = "x86.mm.initial-image"
title = "A fresh x86 address space enters an ELF executable and its interpreter through the shared guest MM owner"
guest_surfaces = ["exec:static-elf", "exec:dynamic-elf", "vmm:kvm", "mm:initial-image"]
semantic_authority = [
  "Linux x86_64 ELF and System V ABI: PT_LOAD file bytes and zero BSS, user page permissions, 16-byte aligned entry RSP at argc followed by argv, envp and auxv",
  "ELF gABI Program Interpreter and x86-64 psABI process initialization: enter PT_INTERP at its entry; AT_BASE identifies its load bias while AT_ENTRY, AT_PHDR and AT_PHNUM describe the executable",
  "The exact static x86_64 exit_group(7) ELF enters at e_entry and terminates with status 7",
]
fixture = "carrick-el1::isa::x86::initial_mm::tests; carrick-vmm-kvm::cpl0_initial_mm::shared_guest_owner_loads_static_elf_and_exits_seven; production_enters_pt_interp_instead_of_executable_entry"
scale_points = [1, 2, 3]
structural_budgets = []
rationale = """
The shared ElfProgram resolves PT_INTERP once using the guest filesystem,
plans its segments with the same ISA-neutral ELF parser, and supplies both
images to the existing MM owner. Only executable regions determine brk.
The dynamic fixture preserves one frame grant/publication per mapped user
page and proves interpreter entry with executable auxiliary metadata. The
configured bootstrap stack is privately zero-backed before entry, including
its prefix: production retains its existing 64 KiB bound. Only the initialized
tail is serialized. The lower-stack translation assertion was NotPresent
before full configured backing; no demand-fault retry or stack-size increase
is introduced.
The host parses through the one ISA-neutral ELF planner and lends only file
bytes and load metadata. The guest creates an unpublished root, copies the
single supervisor half, builds its own stack, initializes private zeroed
frames and maps each user page through an edit intent. One publication record
is returned per mapped page. The VM-free fixture checks six user pages (two ELF and four stack),
six data grants, one root plus exactly five unique page-table grants, and
zero-filled BSS, and that every owned initial page (text, data and the
anonymous stack) is published with owner-private (PRIVATE) custody, so a
later copy-on-write of an ELF data page is admitted. The KVM fixture enters a real static ELF at its mapped RIP
and observes exit_group(7), with no semantic host forward. This bounded
carrier fixture does not prove production VM/vCPU lifetime or the CLI x86 run
path; those belong to the x86-run milestone and director acceptance.
"""

[bindings]
vm_free = "carrick-el1::x86_initial_mm_tests::fresh_owner_maps_static_text_data_and_stack_with_publications; guest_stack_has_sysv_order_and_exact_auxv_addresses; fresh_owner_enters_interpreter_but_break_and_auxv_belong_to_executable; carrick-mem::x86_initial_image::static_x86_image_reuses_elf_plan_without_host_mm_edits; dynamic_x86_image_enters_interpreter_with_executable_auxv"
embed = "KVM-only carrier fixture: carrick-vmm-kvm::cpl0_initial_mm::shared_guest_owner_loads_static_elf_and_exits_seven; production_enters_pt_interp_instead_of_executable_entry"
docker = "Native x86 Linux static-ELF behavior is asserted by the exact exit status; Docker oracle and runtime ratio remain director-owned."
