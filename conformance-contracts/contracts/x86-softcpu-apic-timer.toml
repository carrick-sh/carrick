schema_version = 1
id = "x86.softcpu.apic-timer"
title = "Software xAPIC interrupt priority, IPIs and TSC deadline wakeups"
guest_surfaces = ["isa:x86_64", "vmm:soft", "interrupt:xapic", "timer:tsc-deadline"]
semantic_authority = [
  "Intel SDM Vol. 3A Chapter 10: xAPIC register page, task and processor priority, EOI, fixed-delivery ICR destinations and LVT timer modes",
  "Intel SDM Vol. 2: HLT, STI, MOV CR8, RDMSR and WRMSR; IA32_TSC_DEADLINE is an absolute guest TSC deadline and clears on expiry",
]
fixture = "carrick-softcpu-x86::softcpu_apic_timer"
scale_points = [1, 1000, 1000000000]
rationale = "A periodic timer coalesces missed expirations into one pending vector and computes the next deadline arithmetically, independent of elapsed periods. HLT retains its parked state until an interrupt; waits share the clock used by RDTSC and account for guest TSC writes. The two live CPU fixture sends one ping and one pong through guest MMIO, observes ISR before and after EOI, and resumes both CPUs after HLT."

[[structural_budgets]]
kind = "upper-bound"
metric = "wake_publications"
maximum = 1
layers = ["vm-free"]
rationale = "One poll coalesces any number of missed periodic deadlines into a single IRR bit; the test asserts timer_fire_count and the exact next deadline at each scale."

