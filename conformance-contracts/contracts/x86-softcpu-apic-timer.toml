[bindings.unresolved]
embed_structural = "Soft carrier integration is a later part of #578. This slice executes a small CPL0 image on SoftMachine, not the full Carrick kernel. KVM parity requires accessible /dev/kvm and the separately registered kvm test target. Cross-CPU page-table mutation and shootdown remain #607."
