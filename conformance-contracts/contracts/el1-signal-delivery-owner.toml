schema_version = 1
id = "kernel.el1.signal-delivery-owner"
title = "Signal payload queues and delivery have one shared owner"
guest_surfaces = ["signal:asynchronous-delivery", "syscall:rt_sigreturn", "syscall:rt_sigaction", "syscall:rt_sigprocmask", "syscall:rt_sigsuspend", "syscall:rt_sigpending", "syscall:rt_sigtimedwait", "syscall:sigaltstack", "syscall:tgkill", "syscall:tkill", "syscall:kill", "syscall:rt_sigqueueinfo", "syscall:rt_tgsigqueueinfo"]
semantic_authority = ["public arm64 SVE ABI signal handling/return documentation", "Arm Linux Plumbers 2017 signal-frame diagrams", "man 7 signal", "man 2 sigaction", "man 2 sigprocmask", "man 2 sigaltstack", "man 2 sigreturn", "man 2 tgkill", "man 2 kill", "man 2 rt_sigqueueinfo"]
fixture = "VM-free scoped two-owner seam; see M2-M5 witness ledger"
scale_points = [1, 8, 32, 128]
rationale = "Two live tasks with separate containers retain independent realtime queues. Clearing shared pending summary leaves host payload authority; this preparation witness does not treat summary clear as a valid delivery transaction. FIFO and lifecycle reducers remain positive semantic requirements. X86 action selection, handler-frame admission and mask publication now run in one shared EL1 signal_delivery owner; its ISA adapter retains frame conversion and group-exit custody. SignalFrameParams separates selected handler placement SP from interrupted user SP so SA_ONSTACK places the frame on the alternate stack while uc_mcontext.sp preserves the interrupted user SP, and ARM public frame build/restore masks internal EL0 DAIF (0x3c0/0x340) from public uc_mcontext.pstate while preserving legal guest EL0 flags and restoring canonical internal return DAIF (0x3c0). The ingress ABI owns exact identity and bounded admission: a full queue returns the same event to its producer, and a stale generation cannot match live custody. ARM native-child kill/tkill/tgkill, signal-mask and signal-wait calls route directly to this shared owner. A native child's rt_sigsuspend retains its original mask and owned continuation, releases its execution slot, and resumes exactly once with numeric EINTR when its parent targets it; there is no host signal wait or syscall replay. Exact-generation process and thread selection remains in the shared graph. Exact routing population work and EL1 frame ownership remain unresolved; signed EL0 frame semantics are bound separately. ARM entry composition additionally enforces compiled stack envelopes of at most 12288 bytes including the vector save on the unchanged 16384-byte stack; signal frames and native retained records use admitted heap storage or borrows. See docs/el1-stack-budget.md for scope, nesting and outstanding whole-program/guard-page work. Native per-thread queue publication updates only the exact retained member projection: at populations 1/8/32/128, an enqueue/dequeue pair performs exactly two pending-word stores and at most 2 * (floor(log2(members)) + 2) projection-row comparisons. Process pending-word changes publish to all members; late member admission and record rehome preserve those process bits. The VM-free budget counts actual lookup comparisons and publication stores, including zero-work and wrong-target semantic controls; it does not claim whole signal-routing cost or runtime-ratio acceptance."
structural_budgets = []

