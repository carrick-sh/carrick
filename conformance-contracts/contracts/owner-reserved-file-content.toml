schema_version = 1
id = "kernel.mm.owner-reserved-file-content"
title = "Reserved file mappings load content through their admitted owner venue"
guest_surfaces = ["syscall:mmap", "syscall:fork", "kernel:guest-memory-transfer"]
semantic_authority = ["man 2 mmap: a private file mapping initially contains its file bytes", "man 2 mmap: MAP_FIXED replaces the selected range without changing peer address spaces"]
fixture = "delegated fixed file mapping after EL1 reservation retirement; split-loop native reserved content"
scale_points = [1]
structural_budgets = []
rationale = """
An opaque host reservation excludes guest access while its host mmap operation
prepares and loads file content. The exact-MM mutation guard and a borrowed
admitted root mint one noncopyable, thread-bound write proof for the complete
open NONE venue. Metadata/root guards are released before backend entry. The
native backend authenticates carrier, MM, incarnation, live stage-1 root and
range; it selects live COW descriptors, clips logical publication to the
reservation, then recomputes the output IPA before copying. An unarmed leaf
still needs live writable output and matching backend/kernel exclusive counts; shared
private frames and private file views do not acquire direct-write authority.
The physical owner pin and content-write admission span the native copy.
Ordinary user transfers and legacy-only raw access keep their existing gates.

The routed kernel witness checks literal file bytes and the proof's exact
identity/range. The split-loop witness now uses the production AArch64 engine
and HVF native memory consumer with kernel-minted inventory, rather than a fake
GuestMemory. A native two-MM witness rejects wrong carrier/MM/incarnation/root,
out-of-range destinations, stale IPA, shared private/private-file backing and divergent backend/kernel
reference counts.
Its positive path is fresh exclusive backing; live guest COW publication and
signed closure remain required. No registered WorkObservation, runtime ratio
or signed acceptance is inferred from these local witnesses.
"""

[bindings]
vm_free = "carrick-kernel::dispatch::mem::delegated_tests::delegated_fixed_file_map_reuses_a_retired_el1_reservation; carrick-runtime::runtime::tests::split_loop_preserves_reserved_file_content_writes; carrick-vmm-hvf::trap::foreign_mm::tests::native_reserved_file_content_uses_owner_cow_and_copy_admission"
embed = "carrick-embed::el1_host_copyout::el1_host_buffers_follow_reused_mapping_in_two_live_processes; carrick-conformance-next::inotify_lifecycle::case_inotify_watch_churn"

[bindings.unresolved]
docker = "Same-source file-mapping and loader oracle binding remains open; no Docker runs on cloudmac"
embed_structural = "Reserved-write call count is enforced locally; no registered signed work observation"
embed_timing = "No same-image timing ratio claimed for this transport correction"
