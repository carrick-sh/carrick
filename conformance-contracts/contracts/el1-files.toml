schema_version = 1
id = "kernel.el1.files"
title = "Delegated EL1 regular file operations"
guest_surfaces = [
  "syscall:read",
  "syscall:write",
  "syscall:lseek",
  "syscall:pread64",
  "syscall:pwrite64",
  "syscall:fstat",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 read",
  "man 2 write",
  "man 2 lseek",
  "man 2 pread64",
  "man 2 pwrite64",
  "man 2 fstat",
]
fixture = "probe:el1_files"
scale_points = [1, 8, 32, 128]
rationale = "Eligible host regular files (the host passthrough rootfs) are delegated to EL1 execution while exactly one open description refers to the inode. Repeated read, write, lseek, pread64, and pwrite64 operations on a delegated file are served at EL1 without VM exits or host kernel dispatches. fstat and every other host access recall the file first. A delegation window recalled before serving 64 operations backs the description off for a doubling number of forwarded attempts, so an interleaving that recalls every window converges to the host path's cost; a window that pays off clears the backoff."

[bindings]
embed = "carrick-embed::el1_files_contract"

[bindings.unresolved]
vm_free = "EL1 delegation requires hardware-assisted HVF execution."
docker = "EL1 delegation is an internal execution path transparent to the Linux ABI."

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 64
per_unit = 0
layers = ["embed-structural"]
rationale = "Host dispatches of syscalls 62 (lseek) and 64 (write) do not grow with the loop: at most a fixed startup population (perl's startup fstat calls recall the file and start one short backoff) is forwarded, then every iteration of the 10,000-iteration write+lseek loop is served at EL1."
