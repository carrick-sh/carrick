schema_version = 1
id = "kernel.el1.files"
title = "Delegated EL1 regular file operations"
guest_surfaces = [
  "syscall:read",
  "syscall:write",
  "syscall:lseek",
  "syscall:pread64",
  "syscall:pwrite64",
  "syscall:fstat",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 read",
  "man 2 write",
  "man 2 lseek",
  "man 2 pread64",
  "man 2 pwrite64",
  "man 2 fstat",
]
fixture = "probe:el1_files"
scale_points = [1, 8, 32, 128]
rationale = "Eligible regular files are delegated to EL1 execution. Repeated read, write, lseek, pread64, and pwrite64 operations on delegated regular files are served at EL1 without VM exits or host kernel dispatches. A description recalled 2 times within its lifetime becomes ineligible for re-delegation until close to prevent unbounded recall-then-delegate thrashing from interleaved operations."

[bindings]
embed = "carrick-embed::el1_files_contract"

[bindings.unresolved]
vm_free = "EL1 delegation requires hardware-assisted HVF execution."
docker = "EL1 delegation is an internal execution path transparent to the Linux ABI."

