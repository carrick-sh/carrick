schema_version = 1
id = "kernel.el1.files"
title = "Delegated EL1 regular file operations"
guest_surfaces = [
  "syscall:read",
  "syscall:write",
  "syscall:lseek",
  "syscall:pread64",
  "syscall:pwrite64",
  "syscall:fstat",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 read",
  "man 2 write",
  "man 2 lseek",
  "man 2 pread64",
  "man 2 pwrite64",
  "man 2 fstat",
]
fixture = "probe:el1_files"
scale_points = [1, 8, 32, 128]
rationale = "A host regular file on the host passthrough rootfs enters the zone through its only open description; later descriptions of the inode join it with their own open-file records (see kernel.el1.files.shared-inode). Repeated read, write, lseek, pread64, and pwrite64 operations on an in-zone file are served at EL1 without VM exits or host kernel dispatches. fstat and path stats write the zone's size and pages back without recalling; operations the zone cannot model (mmap, record locks, O_APPEND) recall the inode. A file enters the zone only at open; a recalled description stays on the host path for its whole life (see kernel.el1.zone-entry-at-open)."

[bindings]
embed = "carrick-embed::el1_files_contract"

[bindings.unresolved]
vm_free = "EL1 delegation requires hardware-assisted HVF execution."
docker = "EL1 delegation is an internal execution path transparent to the Linux ABI."

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 64
per_unit = 0
layers = ["embed-structural"]
rationale = "Host dispatches of syscalls 62 (lseek) and 64 (write) do not grow with the loop: at most a fixed startup population is forwarded, then every iteration of the 10,000-iteration write+lseek loop is served at EL1."
