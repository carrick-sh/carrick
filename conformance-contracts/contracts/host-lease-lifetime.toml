schema_version = 1
id = "host.lease.workload-lifetime"
title = "Host exclusion outlives supervised cancellation and reaping"
guest_surfaces = ["host:lease-workload-lifetime"]
semantic_authority = ["Native macOS/Linux flock exclusion and process exit readiness, exercised by the host-lease integration fixtures"]
fixture = "native:lease-runner-death; native:nested-admission; native:two-checkouts"
scale_points = [1, 2]
structural_budgets = []
rationale = "This native tooling contract exercises commands and fork-without-exec test children holding zero flock descriptors. Outer caller death and supervisor TERM/INT/HUP cancel direct and nested work before exclusion releases. Linux subreaping also covers detached descendants closing inherited descriptors; Darwin covers descendants retaining their session or scope writer. Darwin checks incarnation before each signal and uses native exit watches, but PID-only kill has a residual final query-to-signal reuse window. SIGKILL of the sole supervisor and Darwin detached close-all-fds descendants are explicit non-goals, pinned by failing ignored tests. Permission-denied helpers continue running while active cleanup retains exclusion until exit; cancellation never SIGSTOPs them. Nested admission owns the authenticated scope writer. Identical commands in other checkouts must finish normally. These are native integration/model assertions, not guest syscall claims or guest timing budgets."

[bindings]
vm_free = "carrick-xtask::tests::host_lease::runner_death_cancels_workload_before_releasing_exclusion; carrick-xtask::tests::host_lease::runner_death_cancels_nested_workload_before_releasing_exclusion; carrick-xtask::tests::host_lease::runner_death_cancels_detached_nested_workload_before_releasing_exclusion; carrick-xtask::tests::host_lease::nested_admission_requires_the_supervisor_scope_writer; carrick-xtask::tests::host_lease::cancellation_preserves_another_checkout_with_identical_command; carrick-xtask::tests::host_lease::supervisor_sigterm_cancels_before_releasing_exclusion; carrick-xtask::tests::host_lease::supervisor_sigint_cancels_before_releasing_exclusion; carrick-xtask::tests::host_lease::supervisor_sighup_cancels_before_releasing_exclusion; carrick-xtask::lease_supervisor::cleanup_tests::permission_error_keeps_observing_workload_exit; carrick-xtask::lease_supervisor::incarnation_tests::exit_reap_and_reuse_before_each_signal_does_not_target_replacement; carrick-xtask::lease_supervisor::incarnation_tests::reaping_does_not_wait_on_a_replacement_incarnation; carrick-xtask::lease_supervisor::macos_scope::tests::exited_child_is_not_reaped_until_waitpid; carrick-xtask::lease_supervisor::macos_scope::tests::privileged_identity_is_observable_without_signal_permission; carrick-xtask::lease_supervisor::incarnation_tests::privilege_change_preserves_live_identity_without_matching_replacement"

[bindings.unresolved]
embed_structural = "Native lease/cancellation authority lives outside the guest and HVF carrier. The macOS/Linux subprocess integration fixtures exercise the actual host boundary without creating a VM."
docker = "Docker is a lease participant, not an oracle for native host-process ownership. Independent native exclusive flock acquisition checks exclusion directly on macOS and Linux."
