  "carrick-el1-linux::aarch64_process_tests::born_thread_entry_tests::arm_unhomed_host_thread_switched_in_after_another_process_admits",
  "carrick-el1-linux::aarch64_process_tests::born_thread_entry_tests::arm_unhomed_host_thread_switched_in_after_another_process_delivers_pending_signal_once",
