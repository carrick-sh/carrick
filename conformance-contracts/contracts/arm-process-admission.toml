id = "process.native.arm-admission"
title = "ARM root setup and process calls share one authenticated native owner"
guest_surfaces = ["syscall:set_tid_address", "syscall:wait4", "syscall:exit", "kernel:thread-lifecycle", "kernel:process-admission"]
semantic_authority = [
  "man 2 set_tid_address: return the calling thread ID and retain its clear-child-tid address",
  "man 2 wait4: a caller with no children receives ECHILD (10)",
  "man 2 clone: CLONE_THREAD members belong to the same process and retain their individual thread identities",
]
fixture = "An ARM host root enters the production admission boundary before set_tid_address, then wait4 and raw last-thread exit; two already-live records import into that same owner; host lease renewal preserves its Arc and census; stale imported fields refuse before registry publication"
scale_points = [1, 2]
rationale = "Admission creates one native process owner for the retained root and imports authenticated lifecycle members without creating host tasks or changing live membership. Re-entry retains that owner. The setup and no-child wait each dispatch once and request no fork stock. Unpublished admission-only home custody ends with the call, so ARM host reconciliation cannot mistake an ordinary returned call for a parked thread; a published handoff retains its record. The fixed lifecycle pool bounds the initial import scan; ordinary re-entry resolves the exact registry member. Signal resources are reachable from the native entry; ARM signal routing belongs to #285."

# #1881: shared host-thread admission must refuse pending-writer contention
# before consuming a birth or publishing credentials, membership or indexes.
# The VM-free witness holds real pending custody, then drops it and directly
# retries production registration: exactly one member and index are added.
# Notification-driven retry needs #887 release plumbing and is not claimed.
# Round 3: five existing threads carry distinct 4096..5124-entry group vectors.
# Production registration must preserve their backing pointers, capacities and
# contents, and the pre-reserved table, while copying only the new credentials.
# This is a deterministic payload-copy budget, not a runtime-ratio claim.
# #1958: a native-owned ARM thread birth is registered with its process
# owner at publication (`enqueue_born` -> `enqueue_thread`), as on x86,
# instead of lazily at first entry. Its first switch-in then publishes the
# owner's namespace PID; a vCPU last loaded with another process (or with
# none) no longer makes the birth's first admission refuse Stale, which the
# final signal checkpoint aborted as `entry_binding`. Admission semantics and
# budgets are unchanged. Red on main e3086946eb, green on the fix:
# carrick-el1-linux::aarch64_process_tests::born_thread_entry_tests::*.
# Signed proof (20 runs of el1_sched_two_processes_share_vcpus) is the
# director's.
# #1958 (second cause): EL1 switching a host-loaded thread's home record back
# in restores the host's namespace PID and root incarnation, which another
# process's native resume overwrote on the shared vCPU; the root's next
# admission and its 0xfffe signal checkpoint (`entry_binding`) then admit
# through its own owner. Semantics and budgets are unchanged. Red on main
# 927df2a8a, green on the fix:
# carrick-el1-linux::aarch64_process_tests::born_thread_entry_tests::arm_host_loaded_root_*.
# The host's real load publication (`publish_current_task`) feeds that
# restoration on a reused slot for a host-loaded thread (#2044 review P0 1),
# and the checkpoint returns a refused admission (`Stale`) or delivery
# (`Quarantined`, at the declined-fault seam) instead of serving it (P0 2).
# #1958 (third cause): a host-loaded thread's park record that its executor
# unhomed into a host zone wait is woken and switched in on another vCPU
# after another process's record ran there. It is neither home nor
# registered, so its resume published no process binding and the thread ran
# with the other process's PID and root incarnation; its return checkpoint
# refused it (`entry_binding`). Semantics and budgets are unchanged:
# carrick-el1-linux::aarch64_process_tests::born_thread_entry_tests::arm_unhomed_host_thread_*.
# Diagnostic only: the checkpoint's fatal now carries the refusal's kind
# (NativeService* reason at the checkpoint's own coordinates); the existing
# mapping witness is dispatch::tests::
# native_service_refusals_keep_the_error_in_the_fatal_transport.
# #1742: the host re-authenticates the stopped forking lane at each fork-stock
# crossing. A sibling thread's host page-table pause of the shared MM (a
# raised space gate) made that lane look dead, so the custody commit of an
# already published vfork child was refused into `ForkCustodyRefused`. A pause
# is contention; only a closed or re-keyed space refuses. Semantics and
# budgets are unchanged:
# native_retirement_tests::arm_vfork_custody_commits_while_a_sibling_pauses_the_parent_space.
[bindings]
vm_free = [
  "carrick-el1-linux::aarch64_process_tests::arm_root_setup_enters_production_process_venue",
