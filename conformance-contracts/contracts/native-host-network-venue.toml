schema_version = 1
id = "kernel.native.host-network-venue"
title = "Native processes reach the host network through the carrier's one socket implementation"
guest_surfaces = ["syscall:socket", "syscall:connect", "syscall:bind", "syscall:listen", "syscall:accept", "syscall:accept4", "syscall:sendto", "syscall:recvfrom", "syscall:getsockopt", "syscall:setsockopt", "syscall:getsockname", "syscall:getpeername", "syscall:shutdown", "syscall:read", "syscall:write", "syscall:fstat", "syscall:ppoll", "syscall:poll"]
semantic_authority = ["man 2 socket", "man 2 connect", "man 2 bind", "man 2 listen", "man 2 accept4", "man 2 send", "man 2 recv", "man 2 getsockopt", "man 2 getsockname", "man 2 getpeername", "man 2 shutdown", "man 2 poll", "man 7 signal", "director ruling on #231"]
fixture = "crates/carrick-vmm-kvm/tests/fixtures/native_child_inet.S"
scale_points = [1]
structural_budgets = []
rationale = """
The network is a real host crossing. A ring-owned (native) process has no
host task, so before #231 its AF_INET/AF_INET6 socket calls were a counted
ENOSYS. A child's call on the inet family, and every call on a socket
descriptor, stages one NetSyscall record: the canonical syscall, its
arguments and exactly the user ranges Linux's call reads or writes. The
carrier runs the dispatcher's own socket handler for that syscall against a
scratch descriptor table holding only the caller's socket, so a native
process sees the run root's network model exactly (address rewriting,
in-zone loopback, DNS gateway, per-description option state); there is no
second socket implementation. A socket the call creates moves into the
caller's ring namespace. Completion copies back only written extents.

A call that would block never blocks the carrier or holds execution
capacity: the carrier samples the member's own host-readiness queue before
its one non-blocking probe, enrols the host fd with its one wait reactor
(the CarrierWaitService that serves the run root's host-fd waits; no second
readiness thread) and answers an owner wait. The reactor notifies the queue
once the host reports
readiness (or a poll's deadline passes) and the member publishes the call's
own record again (its staged input, poll serial and transfer progress),
which probes once. A signal cancels the wait from the member's own queue as
EINTR; a socket call, read or write that moved nothing is retained for the
shared signal policy, which restarts it under SA_RESTART on both ISAs (a
poll never is). A poll's deadline is keyed on the member and the call's
ring serial, which a re-issued identical poll does not share. AF_UNIX and in-zone descriptors keep
their ring owners; the run root keeps its existing routes.

The call is the caller's own (director ruling D2): the ring stamps every
socket record with the member's NetCaller (its ring TaskKey, its pid as its
pid namespace sees it, its ids and effective capabilities), and the carrier
runs the handler in a scope where every credential, capability and pid read
answers the member's, never the run root's. An unstamped socket record is
refused. SIGPIPE is the caller's own: the carrier always sends with
MSG_NOSIGNAL and the ring raises SIGPIPE on an EPIPE that moved nothing.

A send or recv keeps its caller's whole extent (#2414 review P0-1). One
record stages at most NET_TRANSFER_MAX_BYTES (64 KiB) of its data, which
every inet datagram fits: a datagram is one transfer, and the carrier
answers EMSGSIZE for a larger datagram send before transmitting anything.
The reply leads with the socket's NetTransferFacts (stream, blocking), and
the ring's owned continuation moves a stream transfer record by record from
the byte after the last one moved: a blocking send to its full count, a
MSG_WAITALL receive on a blocking stream until its buffer is full or the
stream ends; a signal or error after progress answers the bytes moved.
"""

