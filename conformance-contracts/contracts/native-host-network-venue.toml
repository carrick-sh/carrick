  "carrick-kernel::host_readiness::tests::a_poll_deadline_is_fixed_by_its_first_wait_and_spent_when_answered",
  "carrick-kernel::host_readiness::tests::a_kernel_without_a_live_reactor_refuses_the_wait",
]
