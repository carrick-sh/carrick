  "KVM production: carrick-vmm-kvm::cpl0_initial_mm::native_child_inet_tcp_and_udp_cross_to_the_host_network (fork child: blocking TCP connect/send/recv/shutdown/EOF, UDP sendto + poll + recvfrom, poll timeout, non-blocking connect + poll(POLLOUT) + SO_ERROR, TCP over ::1)",
  "KVM production: carrick-vmm-kvm::cpl0_initial_mm::native_child_inet_calls_run_under_the_childs_own_identity (fork child: TCP SO_PEERCRED {0,-1,-1}, 64 KiB recv, a 100000-byte blocking send returns 100000, SIGPIPE on EPIPE / none with MSG_NOSIGNAL / write raises it, setresuid(1000) then raw ICMP socket EPERM and TCP socket still opens)",
  "KVM production: carrick-vmm-kvm::cpl0_initial_mm::native_child_inet_transfers_keep_their_whole_extent (fork child: 65000-byte UDP send and recv whole, 100000-byte UDP send EMSGSIZE with nothing transmitted, a short recv buffer truncates a datagram and discards its rest, a 409600-byte blocking TCP send into a small window returns 409600, a 200000-byte MSG_WAITALL recv returns 200000)",
  "KVM production: carrick-vmm-kvm::cpl0_initial_mm::native_child_inet_repoll_after_eintr_waits_its_own_timeout (fork child: a SIGUSR1-interrupted poll is EINTR; the same poll after its deadline passed waits its own timeout; a blocking recvfrom interrupted under SA_RESTART restarts and receives)",
]

