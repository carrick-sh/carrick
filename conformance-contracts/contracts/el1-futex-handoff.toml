schema_version = 1
id = "kernel.el1.futex-handoff"
title = "Guest threads that hand off through a private futex switch inside the guest at EL1, and the host still reaches every thread parked there"
guest_surfaces = [
  "syscall:futex",
  "syscall:futex_waitv",
  "syscall:sched_setaffinity",
  "syscall:exit_group",
  "syscall:execve",
  "syscall:tgkill",
  "scheduler:vcpu-kick",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 sched_setaffinity: a self-affinity change excluding the current CPU migrates to an allowed CPU before returning to guest instructions; futex partners pinned to one CPU must not hand off across vCPUs",
  "man 2 futex: FUTEX_WAIT returns 0 when woken by FUTEX_WAKE, EAGAIN when the word differs, EINTR when a signal interrupts the wait (never restarted), ETIMEDOUT at its timeout; FUTEX_WAKE returns the number of waiters woken",
  "man 2 exit_group: every thread of the process terminates",
  "man 2 execve: all threads other than the calling one are destroyed",
  "man 7 signal: a handler runs on the interrupted thread; futex waits return EINTR regardless of SA_RESTART",
]
fixture = "embed:el1-sched pingpong|signal|exit-group|exec; unit:carrick-sched-core; unit:carrick-el1::sched"
scale_points = [5000, 55000]
structural_budgets = []
rationale = "EL1 increment 1b. Before it, every FUTEX_WAIT/FUTEX_WAKE handoff between two guest threads left the guest twice and crossed a host condvar: a ping-pong round trip cost 5.3-5.4 host exits, 93-95 us of carrier CPU and 48 us p50. A zone-parked thread now has exactly one owner at a time, named by the claim word of its ZoneRecord in shared EL1 memory (Parked, Queued on a slot, OnCpu on a slot, or Host), and every ownership move is one compare-and-swap. EL1 serves FUTEX_WAKE(_BITSET)_PRIVATE with a positive count by claiming waiters onto its own slot's run queue, all or nothing (a wake larger than the run queue's free space forwards whole; a capped count once made FUTEX_WAKE(9) wake 8), and an untimed FUTEX_WAIT(_BITSET)_PRIVATE only when a woken successor is queued: it saves the caller's full EL0 context (GPRs, pc, pstate, sp_el0, TPIDR/TPIDRRO/CONTEXTIDR, v0-v31, FPSR/FPCR) into its record, parks it and restores the successor with x0 = its result, with no host exit. Everything else forwards to the host, which services the same queues with the same core (one path per case): timed waits, requeue, waitv, shared or PI futexes, a wait with no runnable successor, a non-futex syscall while the run queue is non-empty, and any syscall while host work is pending. Signals, timeouts and exit/exec control must first win the record's claim from Parked or Queued; a record EL1 holds (OnCpu or Queued) is reached by kicking its slot, whose executor hands every such record back at the exit. A queued thread cannot starve behind a busy one: since EL1 plan 1c (kernel.el1.guest-scheduler) the slot's virtual timer preempts the running thread once a queued one has waited 2 ms (the 1b host guard that kicked such a slot is deleted), and a woken thread may go to another vCPU. CARRICK_EL1_FUTEX=0 (exact) restores the host-only futex path for bisection."

