vm_free = "carrick-kernel-example::scheduler_handoff::self_affinity_change_requires_migration_before_return; carrick-runtime::vcpu_loop::executor::tests::self_affinity_syscall_migrates_before_the_next_guest_entry (migration before guest return after self-affinity exclusion, independent of queue demand); carrick-sched-core::tests; carrick-el1::sched::tests; carrick-kernel::el1_zone::tests::{deferred_slot_handback_does_not_wake_a_reused_record,deferred_slot_handback_preserves_live_records} (deferred incarnation preservation only; signed historical-failure attribution remains open); carrick-sched-core::tests::{drain_handback_identity_survives_reuse_before_the_consumer_runs,host_wake_batch_keeps_identity_after_return_and_reuse,service_take_keeps_identity_after_return_and_reuse} (host publication and returned-batch identity); carrick-sched-core::tests::guest_wake_publication_has_no_remaining_futex_entry (zero attached futex entries at guest queue consumption; populations 1/8/32); carrick-sched-core::tests::{host_claim_is_not_published_before_queue_cleanup,host_claim_cleanup_does_not_unlink_a_replacement_waiter,host_wake_transfer_owns_waitv_cleanup_until_completion,a_host_request_during_transfer_prevents_guest_relocation} (owned transfer, cancellation, waitv cleanup and deferred host requests); carrick-sched-core::tests::{cancelled_on_cpu_claim_is_retired_by_the_next_handback,an_admitted_cancel_request_does_not_cancel_a_reused_record,exhausted_record_incarnation_is_never_reallocated,late_host_requests_neither_target_nor_mask_a_new_incarnation} (incarnation-bound deferred requests and cancellation-before-handback); carrick-el1::sched::tests::{cancelled_on_cpu_thread_is_not_stranded_by_repark,signal_requested_on_cpu_is_not_lost_by_repark}; carrick-sched-core::tests::{host_request_wins_against_enrolled_guest_park,host_request_after_guest_park_claims_the_published_wait,requested_running_records_survive_preemption_and_unswitch} (atomic running request versus park admission; zero leftover wait entries and timer on refusal; VM-free only); carrick-kernel::kernel::scheduler::tests::{a_deferred_zone_handback_does_not_audit_a_reaped_target,zone_handback_authenticates_the_registered_continuation} (exact deferred wake target, reaped-task no-op and matching continuation delivery; VM-free only); carrick-kernel::el1_zone::tests::deferred_slot_handback_does_not_wake_a_reused_record (test-only observation extension: source-hashed retired-delivery publication count at 1/8/32, enforced by kernel.el1.deferred-handback-identity; no new guest scheduling, live-path cost or signed acceptance)"
