  "carrick-el1::memory::tests::delegated::two_isa_parked_reprobe_refuses_a_closed_space_and_waits_out_a_counted_pause (#2986: mprotect shares the delegated admission and the parked reprobe; a closed space is a NoGrant refusal, a counted pause is Contended(Gate))",
  "carrick-el1::memory::tests::delegated::delegated_edit_over_sparse_residency_is_one_step_over_the_backed_span (#3073: an mprotect PROT_NONE or a munmap over a private range resident in 2 or 32 separate runs is one descriptor step over the backed span, served in ring; the hole takes the new protection from the root model)",
  "carrick-mmu-core::aarch64::descriptor_txn::tests::executor::protect_skips_absent_entries_between_resident_runs (#3073: ARM's permission transaction changes every terminal of a sparse range and leaves every hole absent)",
  "carrick-mmu-core::x86::descriptor_txn::tests::guest_protect_skips_absent_entries_between_resident_runs (#3073: the x86 permission transaction does the same)",
]
