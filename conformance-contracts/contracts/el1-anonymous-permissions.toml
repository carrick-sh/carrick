[bindings.unresolved]
kvm = "Executing x86 bindings: carrick-vmm-kvm::cpl0_entry::production_anonymous_protect_and_partial_unmap_stay_in_ring; carrick-vmm-kvm::cpl0_initial_mm::{production_mprotect_makes_written_anonymous_memory_executable,production_mprotect_makes_a_committed_reserve_executable,production_mprotect_makes_a_forked_childs_anonymous_memory_executable} (#2874: anonymous RW memory written then mprotected PROT_READ|PROT_EXEC and executed, in the root, inside a PROT_NONE reserve and in a forked child; each against the native oracle; red at ENOSYS); carrick-vmm-kvm::cpl0_initial_mm::{production_mprotect_and_munmap_cover_a_sparse_resident_range,production_mprotect_and_munmap_cover_a_forked_childs_sparse_resident_range,production_mprotect_and_munmap_cover_a_range_of_many_resident_runs} (#3073: 256 KiB of a PROT_NONE reserve, committed RW and written in 2 or 32 separate pages, is mprotected PROT_READ and munmapped whole; bytes, the hole's zero and the fault after munmap match the native oracle; red at ENOSYS). Requires real KVM; the contract evaluator has no registered KVM observation layer."
production = "Exact complete-range resident private-anonymous mprotect now runs under the guest's exact-MM editor across tagged L1/L2 blocks and L3 leaves, preserves output identity and permission ceilings, performs ASID invalidation, and refuses partial coarse blocks or widening to the host fallback. Permission faults no longer request first-touch grants; host syscall-copy paths read the live tagged permissions; host edits adopt guest-grown hierarchy before mutation; and COW parity accepts a stale shadow only for an exact tagged live leaf. The signed 256/1024/4096-page fixture serves all four target-range transitions per round in EL1, preserves bytes, reports SEGV_ACCERR for every denied read/write, returns every initial frame byte, and remains nearly page-scale flat. One fixed one-page signal-stack guard mprotect still forwards per process and each denied-access signal cycle still exits to the host pending the signal increment. Broader mmap-family ownership, fork-COW authority and final host page-table pause removal remain open checkpoint-2 work."
