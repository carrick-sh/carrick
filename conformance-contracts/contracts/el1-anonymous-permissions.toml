  "carrick-kernel::dispatch::mem::delegated_tests::{delegated_whole_code_range_keeps_owner_protection,serial_host_delegated_whole_code_range_writes_and_executes} (whole 256 MiB arena PROT_NONE MAP_NORESERVE to RWX at 0x6020000000; passing control before continuation fix, not reproduction of signed Node failure)",
  "carrick-kernel::dispatch::mem::delegated_tests::serial_host_delegated_outside_hint_native_store_survives_protection (Linux host: production admitted-owner mmap/mprotect, real native PROT_NONE 256 MiB outside-arena hint and unhinted control, volatile stores after owner-published RW/RWX; no VMM execution claim)",
  "carrick-el1-linux::aarch64_process_tests::native_fault_supply_tests::native_owner_whole_code_range_writes_and_executes (native process admission and Linux entry with whole 256 MiB RWX commit, zero pre-commit touches, then resident owner protection and generated host-code execution; no signed/VMM acceptance)",
  "carrick-el1-linux::aarch64_process_tests::native_fault_supply_tests::native_owner_noreserve_code_range_writes_and_executes (Linux x86_64 host: native process admission, full Linux dispatch, lazy 256 MiB reservation, resident RWX editor, validated physical backing and host-native generated-code execution; guest instruction execution remains signed-lane evidence)",
  "carrick-el1::memory::tests::delegated::two_isa_noreserve_code_range_stays_owner_admitted (256 MiB lazy PROT_NONE to RWX subrange; no backing allocation or descriptor edit for untouched pages; instruction execution remains signed-lane evidence)",
  "carrick-el1-linux::aarch64_process_tests::{native_process_venue_survives_host_only_and_closed_admission,arm_permission_fault_keeps_signal_owner_after_admission_home_release,arm_permission_fault_sig_dfl_terminates_through_native_owner,arm_permission_fault_two_live_threads_delivers_handler_and_sig_dfl_parks_group_exit}",
