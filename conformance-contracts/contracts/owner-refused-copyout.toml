schema_version = 1
id = "kernel.copyout.owner-refusal"
title = "A transient owner copyout refusal is a clean retry, never EFAULT"
guest_surfaces = ["syscall:pipe2", "syscall:socketpair", "syscall:fstat", "syscall:newfstatat", "syscall:statx", "syscall:clock_gettime", "syscall:clock_getres", "syscall:gettimeofday", "syscall:times", "syscall:getrusage", "syscall:getrlimit", "syscall:sysinfo", "syscall:getitimer", "syscall:timerfd_gettime", "syscall:getdents64", "syscall:accept", "syscall:accept4", "syscall:getsockname", "syscall:getpeername", "syscall:getsockopt", "syscall:wait4", "syscall:waitid"]
semantic_authority = ["man 2 pipe2: EFAULT only for an invalid pipefd", "man 2 wait4: EFAULT only for an invalid status or rusage pointer", "man 2 accept: EFAULT only for an addr not in a writable part of the user address space", "man 2 getdents64: EFAULT only for an argument outside the accessible address space"]
fixture = "unit:dispatch::copyout_tests (OwnerRefusingMemory refuses the first prepare with an Editor OwnerWait); unit:wait_status_copyouts_wait_for_an_owner_refusal_without_reaping"
scale_points = [1]
structural_budgets = []
rationale = "An admitted EL1 owner may refuse a host copyout transiently (editor busy, physical supply, retained writer). A valid pointer must never see EFAULT for that. Each migrated handler prepares every output through dispatch::copyout before its first side effect, so a refusal returns OwnerMemoryWait with committed 0, nothing written and nothing created, consumed, dequeued, reaped or advanced; the runtime's redispatch then completes once. An invalid pointer is not a retry and surfaces at the commit, as on the legacy venue. One prepare per attempt adds constant work. Direct writes that remain in dispatch/ are counted by xtask copyout-debt with exact per-file ceilings."

[bindings]
vm_free = "carrick-kernel::dispatch::copyout_tests::{pipe2_waits_for_an_owner_refused_copyout_instead_of_efault,socketpair_waits_for_an_owner_refused_copyout_instead_of_efault,fstat_waits_for_an_owner_refused_copyout_instead_of_efault,newfstatat_waits_for_an_owner_refused_copyout_instead_of_efault,statx_waits_for_an_owner_refused_copyout_instead_of_efault,clock_gettime_waits_for_an_owner_refused_copyout_instead_of_efault,gettimeofday_waits_for_an_owner_refused_copyout_instead_of_efault,time_and_resource_records_wait_for_an_owner_refused_copyout,getdents64_waits_for_an_owner_refused_copyout_without_consuming_entries,accept_waits_for_an_owner_refused_copyout_without_dequeuing,getsockname_and_getpeername_wait_for_an_owner_refused_copyout,getsockopt_waits_for_an_owner_refused_copyout_instead_of_efault,getdents64_with_a_guest_sized_count_never_reaches_the_permit_fatal}; carrick-kernel::dispatch::proc::kernel_process_dispatch_tests::wait_status_copyouts_wait_for_an_owner_refusal_without_reaping; carrick-kernel::dispatch::copyout::tests"

[bindings.unresolved]
embed_structural = "Signed two-live-thread witnesses (el1_sched_sock_pingpong_stepper_without_hold, #695 control) are director-owned; this slice ran no VM."
remaining_sites = "recvmsg/recvfrom name and control, ioctl, signal, sysv, mqueue, proc prctl/uname/sched, io_uring, epoll_wait and the rest of dispatch/ still write directly; xtask copyout-debt counts them."
clone_tid = "CLONE_PARENT_SETTID/CHILD_SETTID copyouts in carrick-runtime vcpu_loop are outside dispatch/ and still lower an owner refusal to clone EFAULT; plan on #711."
docker = "No Docker differential: the refusal is a Carrick owner-venue state with no Linux analogue; semantic results are unchanged from the legacy venue."
