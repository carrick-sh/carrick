schema_version = 1
id = "kernel.copyout.owner-refusal"
title = "A transient owner copyout refusal is a clean retry, never EFAULT"
guest_surfaces = ["syscall:pipe2", "syscall:socketpair", "syscall:fstat", "syscall:newfstatat", "syscall:statx", "syscall:clock_gettime", "syscall:clock_getres", "syscall:gettimeofday", "syscall:times", "syscall:getrusage", "syscall:getrlimit", "syscall:sysinfo", "syscall:getitimer", "syscall:timerfd_gettime", "syscall:getsockname", "syscall:getpeername", "syscall:wait4", "syscall:waitid"]
semantic_authority = ["man 2 stat: EFAULT only for a bad pathname or output address", "man 2 pipe2: EFAULT only for an invalid pipefd", "man 2 wait4: EFAULT only for an invalid status or rusage pointer"]
fixture = "unit:vcpu_loop::tests::serial_host_pipe2_owner_wait_redispatches_through_production_runtime_once (two live shared-MM threads; the sibling holds the production MM editor while pipe2 parks and resumes through the production runtime); unit:dispatch::copyout_contention_tests (the same editor contention through the real owner portal); unit:dispatch::copyout_tests (OwnerRefusingMemory refuses the first prepare with an Editor OwnerWait); unit:wait_status_copyouts_wait_for_an_owner_refusal_without_reaping"
scale_points = [1, 8, 32, 128]
structural_budgets = []
rationale = "An admitted EL1 owner may refuse a host copyout or length read transiently (editor busy, physical supply, retained writer, read suspension). A valid pointer must never see EFAULT for that. Each migrated handler prepares every output through dispatch::copyout before its first side effect; wait4 and waitid do not reap until every requested output is secured. Sockaddrs prepare only their actual bytes, zero-output calls skip owner preparation, and a later invalid slot preserves the longest valid prefix before EFAULT. Internal owner arbitration for a redispatch-safe copyout is not interruptible by ordinary signals: those signals remain pending until the syscall completes, while SIGKILL and group exit still wake the park. This is the Linux model of a copy waiting on the mm lock: a killable-only kernel lock wait, never a signal-delivery or job-control-stop point. It is safe only because owner authority is held across bounded Carrick-internal work and never across a park, a stop, a guest wait or a host round trip that waits on guest progress (contract on #711, rule 2). Native bindings sample the exact native pending authority and transfer a fatal obligation to native exit custody; bridge SIGSTOP never wakes either a zone or physical owner wait. Native kill/tgkill publication owes an event-driven host wake. A release-winning Ready followed by native tgkill(SIGKILL) and settled host work must still cancel renewed owner contention without another release. Carrier and native queue projections have separate writer capabilities and one read-only union. One fatal host-work publication invokes exactly N persistent task callbacks for N owner-wait subscriptions in one process, deduplicating notifications by exact TaskKey. Consuming copyouts (accept/accept4, getdents64 and getsockopt(SO_ERROR)) are deferred to #744. Direct writes that remain in dispatch/ are counted by xtask copyout-debt with exact per-file ceilings."

