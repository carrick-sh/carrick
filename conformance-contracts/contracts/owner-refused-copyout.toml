fixture = "unit:vcpu_loop::tests::serial_host_pipe2_owner_wait_redispatches_through_production_runtime_once (two live shared-MM threads; the sibling holds the production MM editor while pipe2 parks and resumes through the production runtime); unit:dispatch::copyout_contention_tests (the same editor contention through the real owner portal); unit:dispatch::copyout_tests (OwnerRefusingMemory refuses the first prepare with an Editor OwnerWait); unit:wait_status_copyouts_wait_for_an_owner_refusal_without_reaping; S1 dispatcher witnesses inject Editor OwnerWait or epoll Supply(Grant) before output admission, verify no consumption or output on refusal, and verify exact delivery on redispatch; shared array witnesses bound whole-record preparation and retain valid prefix authority"
scale_points = [1, 8, 32, 128]
structural_budgets = []
rationale = "An admitted EL1 owner may refuse a host copyout or length read transiently (editor busy, physical supply, retained writer, read suspension). A valid pointer must never see EFAULT for that. Each migrated handler prepares every output through dispatch::copyout before its first side effect; wait4 and waitid do not reap until every requested output is secured, signalfd reads do not dequeue pending signals until the output window is prepared, and remap_file_pages does not cache remap_snapshots until its copyout commits. Sockaddrs prepare only their actual bytes, zero-output calls skip owner preparation, and a later invalid slot preserves the longest valid prefix before EFAULT. Internal owner arbitration for a redispatch-safe copyout is not interruptible by ordinary signals: those signals remain pending until the syscall completes, while SIGKILL and group exit still wake the park. This is the Linux model of a copy waiting on the mm lock: a killable-only kernel lock wait, never a signal-delivery or job-control-stop point. It is safe only because owner authority is held across bounded Carrick-internal work and never across a park, a stop, a guest wait or a host round trip that waits on guest progress (contract on #711, rule 2). Native bindings sample the exact native pending authority and transfer a fatal obligation to native exit custody; bridge SIGSTOP never wakes either a zone or physical owner wait. Native kill/tgkill publication owes an event-driven host wake. A release-winning Ready followed by native tgkill(SIGKILL) and settled host work must still cancel renewed owner contention without another release. Carrier and native queue projections have separate writer capabilities and one read-only union. Native projection admission is exclusive per control slot, including independently retained custody; its non-Clone writer owns final cleanup and duplicate admission is refused. One fatal host-work publication invokes exactly N persistent task callbacks for N owner-wait subscriptions in one process, deduplicating notifications by exact TaskKey. S2 secures both value-result destinations before taking a pending SO_ERROR. IP_TTL uses Linux one-byte output for positive capacities below four on every host; host-returned lengths never authorize output beyond the captured capacity or Linux wire size. Host option queries capture the caller capacity once and use that snapshot through output admission, even if a sibling changes the length word during the query. Host, netlink, packet and in-memory option outputs use one permit; name queries reuse the same preparation. Consuming accept/accept4 and packet receive/ring outputs remain counted debt outside S2; retained-operation work belongs to #986/#744. Direct writes that remain in dispatch/ are counted by xtask copyout-debt with exact per-file ceilings."

