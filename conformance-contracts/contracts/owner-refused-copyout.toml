schema_version = 1
id = "kernel.copyout.owner-refusal"
title = "A transient owner copyout refusal is a clean retry, never EFAULT"
guest_surfaces = ["syscall:pipe2", "syscall:socketpair", "syscall:fstat", "syscall:newfstatat", "syscall:statx", "syscall:clock_gettime", "syscall:clock_getres", "syscall:gettimeofday", "syscall:times", "syscall:getrusage", "syscall:getrlimit", "syscall:sysinfo", "syscall:getitimer", "syscall:timerfd_gettime", "syscall:getsockname", "syscall:getpeername", "syscall:wait4", "syscall:waitid"]
semantic_authority = ["man 2 pipe2: EFAULT only for an invalid pipefd", "man 2 wait4: EFAULT only for an invalid status or rusage pointer"]
fixture = "unit:vcpu_loop::tests::pipe2_owner_wait_redispatches_through_production_runtime_once (two live shared-MM threads; the sibling holds the production MM editor while pipe2 parks and resumes through the production runtime); unit:dispatch::copyout_contention_tests (the same editor contention through the real owner portal); unit:dispatch::copyout_tests (OwnerRefusingMemory refuses the first prepare with an Editor OwnerWait); unit:wait_status_copyouts_wait_for_an_owner_refusal_without_reaping"
scale_points = [1]
structural_budgets = []
rationale = "An admitted EL1 owner may refuse a host copyout or length read transiently (editor busy, physical supply, retained writer, read suspension). A valid pointer must never see EFAULT for that. Each migrated handler prepares every output through dispatch::copyout before its first side effect; wait4 and waitid do not reap until every requested output is secured. Sockaddrs prepare only their actual bytes, zero-output calls skip owner preparation, and a later invalid slot preserves the longest valid prefix before EFAULT. Internal owner arbitration for a redispatch-safe copyout is not interruptible by ordinary signals: those signals remain pending until the syscall completes, while SIGKILL and group exit still wake the park. Consuming copyouts (accept/accept4, getdents64 and getsockopt(SO_ERROR)) are deferred to #744. Direct writes that remain in dispatch/ are counted by xtask copyout-debt with exact per-file ceilings."

[bindings]
vm_free = "carrick-runtime::vcpu_loop::tests::pipe2_owner_wait_redispatches_through_production_runtime_once; carrick-kernel::dispatch::copyout_contention_tests::pipe2_copyout_waits_for_live_sibling_editor_and_commits_once; carrick-kernel::dispatch::copyout_tests::{pipe2_waits_for_an_owner_refused_copyout_instead_of_efault,socketpair_waits_for_an_owner_refused_copyout_instead_of_efault,fstat_waits_for_an_owner_refused_copyout_instead_of_efault,newfstatat_waits_for_an_owner_refused_copyout_instead_of_efault,statx_waits_for_an_owner_refused_copyout_instead_of_efault,clock_gettime_waits_for_an_owner_refused_copyout_instead_of_efault,gettimeofday_waits_for_an_owner_refused_copyout_instead_of_efault,time_and_resource_records_wait_for_an_owner_refused_copyout,getsockname_and_getpeername_wait_for_an_owner_refused_copyout,later_invalid_output_retains_valid_prefix_in_gettimeofday_and_sockaddr,sockaddr_at_page_end_with_storage_addrlen_prepares_only_actual_bytes,zero_output_gettimeofday_makes_zero_owner_prepares}; carrick-kernel::dispatch::proc::kernel_process_dispatch_tests::{wait_status_copyouts_wait_for_an_owner_refusal_without_reaping,wait4_commits_valid_status_when_rusage_faults_and_consumes_child,wait4_with_no_outputs_makes_zero_owner_prepares}; carrick-kernel::dispatch::copyout::tests"

[bindings.unresolved]
embed_structural = "Signed two-live-thread witnesses (el1_sched_sock_pingpong_stepper_without_hold, #695 control) are director-owned; this slice ran no VM."
remaining_sites = "Generic host getsockopt passthrough, recvmsg/recvfrom name and control, ioctl, signal, sysv, mqueue, proc prctl/uname/sched, io_uring, epoll_wait and the rest of dispatch/ still write directly; xtask copyout-debt counts them."
clone_tid = "CLONE_PARENT_SETTID/CHILD_SETTID copyouts in carrick-runtime vcpu_loop are outside dispatch/ and still lower an owner refusal to clone EFAULT; plan on #711."
