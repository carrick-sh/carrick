schema_version = 1
id = "kernel.copyout.owner-refusal"
title = "A transient owner copyout refusal is a clean retry, never EFAULT"
guest_surfaces = ["syscall:pipe2", "syscall:socketpair", "syscall:fstat", "syscall:newfstatat", "syscall:statx", "syscall:clock_gettime", "syscall:clock_getres", "syscall:gettimeofday", "syscall:times", "syscall:getrusage", "syscall:getrlimit", "syscall:sysinfo", "syscall:getitimer", "syscall:timerfd_gettime", "syscall:getdents64", "syscall:accept", "syscall:accept4", "syscall:getsockname", "syscall:getpeername", "syscall:getsockopt", "syscall:wait4", "syscall:waitid"]
semantic_authority = ["man 2 pipe2: EFAULT only for an invalid pipefd", "man 2 wait4: EFAULT only for an invalid status or rusage pointer", "man 2 accept: EFAULT only for an addr not in a writable part of the user address space", "man 2 getdents64: EFAULT only for an argument outside the accessible address space"]
fixture = "unit:dispatch::copyout_contention_tests (two live shared-MM threads; the sibling holds the production MM editor while pipe2 copies out through the real owner portal); unit:dispatch::copyout_tests (OwnerRefusingMemory refuses the first prepare with an Editor OwnerWait); unit:wait_status_copyouts_wait_for_an_owner_refusal_without_reaping"
scale_points = [1]
structural_budgets = []
rationale = "An admitted EL1 owner may refuse a host copyout or length read transiently (editor busy, physical supply, retained writer, read suspension). A valid pointer must never see EFAULT for that. Each migrated handler reads input lengths and prepares every output before consuming an unretained side effect (including SO_ERROR consumption); getdents, SO_ERROR, and accept instead retain the exact open-file or accepted-endpoint authority across suspension. Sockaddrs prepare only their actual bytes, zero-output calls skip owner preparation, and a later invalid slot preserves the longest valid prefix before EFAULT. Direct writes that remain in dispatch/ (including generic host getsockopt passthrough) are counted by xtask copyout-debt with exact per-file ceilings."

[bindings]
vm_free = "carrick-kernel::dispatch::copyout_contention_tests::pipe2_copyout_waits_for_live_sibling_editor_and_commits_once; carrick-kernel::dispatch::copyout_tests::{pipe2_waits_for_an_owner_refused_copyout_instead_of_efault,socketpair_waits_for_an_owner_refused_copyout_instead_of_efault,fstat_waits_for_an_owner_refused_copyout_instead_of_efault,newfstatat_waits_for_an_owner_refused_copyout_instead_of_efault,statx_waits_for_an_owner_refused_copyout_instead_of_efault,clock_gettime_waits_for_an_owner_refused_copyout_instead_of_efault,gettimeofday_waits_for_an_owner_refused_copyout_instead_of_efault,time_and_resource_records_wait_for_an_owner_refused_copyout,getdents64_waits_for_an_owner_refused_copyout_without_consuming_entries,getdents64_retained_copyout_ignores_numeric_fd_reuse,accept_owns_the_dequeued_connection_across_an_owner_refusal,getsockname_and_getpeername_wait_for_an_owner_refused_copyout,getsockopt_waits_for_an_owner_refused_copyout_instead_of_efault,getsockopt_so_error_retained_copyout_ignores_numeric_fd_reuse,getdents64_with_a_guest_sized_count_never_reaches_the_permit_fatal,later_invalid_output_retains_valid_prefix_in_gettimeofday_sockaddr_and_getsockopt,sockaddr_at_page_end_with_storage_addrlen_prepares_only_actual_bytes,accept_and_getsockopt_preserve_read_suspension_on_length_pointer,getsockopt_so_error_retains_pending_error_across_owner_refusal,zero_output_gettimeofday_makes_zero_owner_prepares}; carrick-kernel::dispatch::proc::kernel_process_dispatch_tests::{wait_status_copyouts_wait_for_an_owner_refusal_without_reaping,wait4_commits_valid_status_when_rusage_faults_and_consumes_child,wait4_with_no_outputs_makes_zero_owner_prepares}; carrick-kernel::dispatch::copyout::tests; carrick-kernel::kernel::continuation::tests::retained_write_owner_park_ignores_two_signals_until_release_but_kill_wakes"

[bindings.unresolved]
