schema_version = 1
id = "kernel.mm.invalidation-domain"
title = "A translation invalidation reaches every member that may cache it, stopped members included"
guest_surfaces = [
  "syscall:munmap",
  "syscall:mprotect",
  "syscall:madvise",
  "kernel:stage1-mmu",
  "kernel:frame-inventory",
  "scheduler:page-table-quiescence",
]
semantic_authority = [
  "man 2 munmap: references to pages in the unmapped range are invalid after the call returns, on every thread of the process",
  "man 2 mprotect: an access that violates the new protection raises SIGSEGV on every thread, so revoked write permission cannot survive in another CPU's cached translation",
  "Intel SDM vol. 3A 4.10.4: software must invalidate cached translations on every logical processor that may hold them before reusing the frame (TLB shootdown)",
]
fixture = "carrick-core::mm::retirement::invalidation::tests"
scale_points = [1, 2, 3]
rationale = "Slice 1a of #681: the neutral invalidation domain in carrick-core::mm::retirement::invalidation with its shared layout in carrick-core-abi::mm::served. Debt is per member (owed/served watermarks raised by fetch_max), never per sender, so a request for context B cannot overwrite a stopped member's outstanding debt for context A (the #692 shape of today's x86 per-sender request cells, witnessed red by a model of that protocol). Two Dekker pairs, each closed by SeqCst fences, are loom-checked with the completion verdict asserted safe: install-versus-request (counted or served), entry-versus-request (kicked or served before execution), and a three-thread requester/member/completer model with a stop/enter ABA; removing any one of the four pair fences fails a model, and the completer needs no fence of its own. An install whose local flush fails keeps its debt in owed; a seat claim flushes the claiming cache before adopting the member's served watermark; completions carry a per-table domain nonce and never satisfy another domain's retirement or reclaim. Member words are private behind an unsafe accessor. Slice 2 (#607) adds what the softmmu physical venue needs, neutrally: an owning `TableHandle` so a member that outlives any borrow scope (a soft vCPU thread) holds its seat without a self-referential borrow; domain-wide requests (`stage_domain`) that count every seated member whatever its context, closed against a concurrent claim by the seat Dekker pair (claim CAS then SeqCst fence then read the issue counter; issue then SeqCst fence then read seat). The loom model fails with the claim fence weakened to Acquire; it still passes with AcqRel, because loom does not model the store-buffer ordering a SeqCst fence adds over AcqRel, so AcqRel is not caught by the model and SeqCst stays required by the C++ memory model for this store-then-load pair; `PendingInvalidation::counted_members` for per-request work; `ReclaimQueue::iter` so an owner can refuse reuse of a pending identity; and coverage of an earlier domain-wide reclaim tag by a later domain-wide completion of the same kind (every member seated at both commits is counted by both; one released in between left no cache), so a dropped pending request is recoverable. Context-keyed tags stay exact. Slices 3-7 migrate #684, HVF, x86 CPL0 and the ASID allocator."

[[structural_budgets]]
kind = "exact"
metric = "invalidation_steady_state_rmws"
value = 0
layers = ["vm-free"]
rationale = "The member safe-point check runs on every trap and syscall return. With no debt it performs exactly owed[2] + served[2] loads on the member's own coherence granule and no read-modify-write or store on any shared word, at every table size n (1, 2, 3 members). An instrumented ServedWord counts every RMW across all member words; the issue counter's value is checked unchanged."

[bindings]
vm_free = "carrick-core::mm::retirement::invalidation::tests::per_sender_cell_model_loses_stopped_member_debt_692; carrick-core::mm::retirement::invalidation::tests::domain_keeps_stopped_member_debt_across_later_requests; carrick-core::mm::retirement::invalidation::tests::running_member_serves_before_completion_and_stopped_debt_survives; carrick-core::mm::retirement::invalidation::tests::steady_state_check_is_own_line_loads_with_zero_rmws (evaluates the structural budget at n = 1, 2, 3); carrick-core::mm::retirement::invalidation::tests::exhausted_counter_pins_at_max_and_commit_refuses_without_publishing; carrick-core::mm::retirement::invalidation::tests::install_failure_leaves_debt_visible_and_served_on_entry; carrick-core::mm::retirement::invalidation::tests::seat_reuse_flushes_the_new_cache_before_adopting_the_watermark; carrick-core::mm::retirement::invalidation::tests::completion_from_another_domain_never_acknowledges_or_reclaims; carrick-core::mm::retirement::invalidation::tests::domain_request_counts_every_seated_member_whatever_its_context; carrick-core::mm::retirement::invalidation::tests::owning_handle_seat_moves_to_its_own_thread_and_serves_requests; carrick-core::mm::retirement::invalidation::tests::reclaim_iter_lists_outstanding_objects_until_their_exact_release; carrick-core::mm::retirement::invalidation::tests::a_later_domain_wide_completion_covers_earlier_domain_wide_reclaim_only; carrick-core::mm::retirement::invalidation::loom_models (just test-loom; hosted `loom` job; includes loom_models_claim_races_domain_request_counts_or_flushes)"

[bindings.unresolved]
embed_structural = "The softmmu venue (slice 2, `softmmu.x86.physical-retirement`) consumes the domain VM-free; no hypervisor venue consumes it yet. The signed binding arrives with HVF slice 4 and x86 CPL0 slice 5; until then no signed guest execution, kick delivery or architectural invalidation is claimed."
docker = "Internal invalidation invariant with no guest-visible change in this slice. The Linux-visible obligations (munmap/mprotect on multi-threaded processes) are carried by the backend slices that adopt the domain."
