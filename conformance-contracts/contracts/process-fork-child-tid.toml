schema_version = 1
id = "kernel.process.fork-child-tid"
title = "A process fork applies child TID effects in its private address space"
guest_surfaces = ["syscall:clone", "syscall:exit", "kernel:process-admission"]
semantic_authority = [
  "man 2 clone: CLONE_CHILD_SETTID stores the TID in child memory before return to user space",
  "man 2 clone: CLONE_CHILD_CLEARTID clears the child address and wakes its futex at exit",
  "man 2 set_tid_address: clear_child_tid belongs to the exiting thread",
]
fixture = "A parent with an initialized ctid word forks a second live process through clone(SIGCHLD | CLONE_CHILD_SETTID | CLONE_CHILD_CLEARTID), resumes the child, then exits it"
scale_points = [1, 2]
structural_budgets = []
rationale = "Exactly one process owner admits the fork; the child receives a private MM after COW. The child TID is written only after the split and before its first user instruction. Terminal ownership clears and wakes only that child's ctid. The work is one child-local set, one child-local clear, and one futex wake independent of the number of live processes."

[bindings]
vm_free = "carrick-personality-linux::common_entry::common_linux_entry_calls_native_process_custody; carrick-el1-linux::native_process_runtime::tests::process_clone_child_tid_lives_in_child_mm_and_clears_on_exit"
embed = "carrick-embed::el1_files_inode_exclusivity_two_processes"

[bindings.unresolved]
docker = "The local host profile forbids starting Docker; a native arm64 Docker differential remains a separate serialized authority check."
