vm_free = "carrick-sched-core::tests (el1_wake_places_a_floating_thread_on_an_idle_slot, enter_idle_refuses_wfi_with_a_queued_thread, a_home_record_runs_only_on_its_home_slot, el1_honours_affinity_for_floating_threads, the_slot_timer_ends_a_timed_park_once, a_preempted_thread_resumes_without_a_result, a_tick_migrates_queued_threads_to_idle_slots, cross_slot_wakes_never_strand_a_thread_on_a_stopped_slot); carrick-el1::sched::tests (a_wait_with_nothing_runnable_idles_until_host_work, an_idle_vcpu_parks_in_wfi_after_its_spin, a_timed_wait_ends_in_guest_with_etimedout, timed_waits_this_vcpu_cannot_keep_forward, a_wake_hands_a_thread_to_the_idle_vcpu_it_belongs_to, the_virtual_timer_preempts_a_compute_loop, a_kick_taken_at_el0_forwards); carrick-mem::memory::el1_hook_kick (gic_kick_taken_at_el0_leaves_through_the_kick_exit, gic_el0_irq_hook_returns_exactly_and_loses_no_kick, idle_action_leaves_through_the_idle_exit, gic_mode_vector_page_routes_el0_interrupts_to_el1); carrick-hal::aarch64_arch::tests::aarch64_sigframe_shows_the_guest_its_historical_daif"
