schema_version = 1
id = "kernel.el1.guest-scheduler"
title = "Guest threads are scheduled across vCPUs inside the guest: blocking handoffs, timed futex waits, preemption and idle need no host exit, and the host still reaches every thread parked on an idle vCPU"
guest_surfaces = [
  "syscall:futex",
  "syscall:exit_group",
  "syscall:execve",
  "syscall:tgkill",
  "syscall:rt_sigreturn",
  "syscall:sched_setaffinity",
  "scheduler:preemption",
  "scheduler:vcpu-kick",
  "scheduler:el1-interrupts",
  "signal:asynchronous-delivery",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 futex: FUTEX_WAIT returns 0 when woken, EAGAIN when the word differs, EINTR on a signal, ETIMEDOUT when its relative timeout (CLOCK_MONOTONIC) expires, never before it; FUTEX_WAKE returns the number of waiters woken",
  "man 2 sched_setaffinity: a thread runs only on CPUs in its affinity mask",
  "man 7 sched: SCHED_OTHER threads that share a CPU are time-sliced; a runnable thread is not starved by a thread that never blocks",
  "man 2 exit_group / man 2 execve: every other thread terminates",
  "man 7 signal: an asynchronous signal is delivered to a thread on its next return to user mode, including one blocked in a wait",
  "Linux arm64 sigcontext: `pstate` is the interrupted EL0 PSTATE; Carrick has always shown it with DAIF 0x3c0, and the EL1 kernel's EL0 interrupt unmask must not change what the guest reads",
  "Arm ARM: WFI wakes on a pending interrupt even with PSTATE.I set; ICC_SGI1R_EL1 routes an SGI by Aff3.Aff2.Aff1 and a target list of Aff0; the EL1 virtual timer asserts its PPI while CNTV_CTL_EL0 is enabled and CNTVCT >= CNTV_CVAL",
  "Hypervisor.framework hv_gic.h: with the in-kernel GIC, SGIs, the virtual timer PPI and WFI are handled in the hypervisor (qualified by the EL1 scheduler spike, spike/el1-scheduler c9897ae4c: zero exits to the VMM)",
]
fixture = "embed:el1-sched pinned-pingpong|timed-wait|compute-pair|idle-carrier|wfi-signal|pstate|exit-group|exec; unit:carrick-sched-core; unit:carrick-el1::sched; unit:vector-page-interpreter"
scale_points = [2000, 22000, 300, 3300, 200, 1200]
rationale = "EL1 increment 1c. Before it, EL1 switched a vCPU between threads of one process only when a woken thread was queued on the waker's own vCPU, ignoring the woken thread's affinity; a handoff to a thread on another vCPU, every timed futex wait (433 host exits per 200 1 ms waits, lateness p50 282 us) and every wait with nothing runnable left the guest, and a thread queued behind a syscall-free loop was freed by a host thread polling every 2 ms. Now each vCPU slot has a run-queue lock and a state other vCPUs read (Host, Running, IdleSpin, IdleWfi). EL1 queues a woken thread on another slot only under that slot's lock while it is in the guest; the executor sets Host under the same lock before it drains the slot at an exit, so no thread is stranded on a slot nobody runs (VM-free contention test). The record EL1 creates for the thread the host loaded on a slot is that slot's home record and runs only there, because the host believes the thread runs there; the executor unhomes it when it settles the thread. A wake places each waiter on its home slot, else on an idle slot of the same address space its affinity allows, else on the waker's own queue, all or nothing as in 1b. A wait with nothing runnable idles the vCPU in EL1: it polls its queue for 20 us, then parks in WFI with IRQs masked and acknowledges by polling ICC_IAR1_EL1; a waker sends the reschedule SGI 14 to a slot that is running or in WFI. The loaded thread's relative FUTEX_WAIT_PRIVATE timeout ends on its slot's virtual timer with ETIMEDOUT; at an exit the executor hands a pending deadline to the host continuation. Every served return to EL0 clears PSTATE.I, and an interrupt taken at EL0 enters the EL1 image through the vector's EL0 IRQ hook, so the timer preempts a loop that never makes a syscall once a queued thread has waited a 2 ms slice, and the kick SGI leaves through hvc #4. The guest never sees the unmask: signal frames and core notes show DAIF 0x3c0 as before (el0_visible_pstate). The host reaches a thread parked on a WFI-parked vCPU by hv_vcpus_exit: the kick lands in EL1 code, the run loop resumes it with the kick SGI pending, and the idle loop leaves through the new hvc #5 idle exit; the executor then settles the thread, whose zone wait takes the signal, exit or exec drain. The 2 ms run-queue guard thread is deleted. The zone runs only with the in-kernel GIC; CARRICK_HVF_GIC=0 and CARRICK_EL1_FUTEX=0 restore the host futex paths."
structural_budgets = []

