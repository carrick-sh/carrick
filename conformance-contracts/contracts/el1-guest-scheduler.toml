docker = "The fixture asserts the Linux results directly (0 on a wake, ETIMEDOUT not before the deadline, EINTR on a signal, exit_group status, the exec successor's output, the ucontext PSTATE the guest has always read); a generic Docker probe was not blessed in this session. The LTP futex rows and the ecosystem rows compare against the cached Docker oracle."
embed_structural = "Host exits are read through carrick_embed::vcpu_run_exits_total(), carrier CPU through getrusage of the test process, and in-guest work (cross-vCPU wakes, SGIs, preemptions, timeouts, idle entries, WFIs, idle exits) through the zone counters in shared EL1 memory; no WorkObservation metric is registered for them."
