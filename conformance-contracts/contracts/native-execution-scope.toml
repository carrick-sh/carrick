schema_version = 1
id = "kernel.mm.native-execution-scope"
title = "Native execution owns its running handshake until the safe point"
guest_surfaces = ["kernel:current-mm", "scheduler:execution-admission", "scheduler:page-table-quiescence"]
semantic_authority = ["Carrick exact task execution lease", "Carrick exact-MM pause-modify-resume protocol", "man 2 mprotect", "man 2 munmap"]
fixture = "unit:native-execution-scope"
scale_points = [1, 8, 32, 128]
rationale = "Normal native execution must retain exact census membership and a private running handshake without holding mutation exclusion. An interrupt requests a safe point; only scope exit acknowledges it. Repeated entry and host memory-control service after setup must allocate no host memory. Native endpoints join the exact-MM drain but never acknowledge hardware ASID tickets; memory service preserves external stops and authenticates the current lease. This scope grants no memory pointers or executable publication."

