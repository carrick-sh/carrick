[bindings.unresolved]
embed_structural = "The lifecycle and allocation contract is VM-free. Host carrier data and bounded ELF composition are exercised separately; native code publication, signals, cancellation and scheduling still require signed execution composition."
embed_timing = "No new performance measurement or native workload acceptance."
docker = "Internal admission invariant; Linux mapping semantics remain the external obligation. No corresponding differential guest race is registered."

