# #2645 slice A: behaviour-preserving move of the HVF BIND/open helpers,
# stopped zone-slot publication and retained lifecycle publication into
# carrick-kernel dispatch/{carrier_loop,carrier_lifecycle}.rs behind
# carrick-hal retained_metadata. Probes, error states and gate semantics are
# unchanged; this contract's semantics, bindings and work budgets are
# unchanged.
# #2645 slice B: the soft carrier publishes the root's retained lifecycle
# page and control slot into its EL1 dynamic metadata aperture through the
# shared carrier lifecycle publisher, so the ring serves the per-thread
# setup calls (set_robust_list, sigaltstack, rt_sigprocmask) from the
# control slot, as on HVF. Bound below by the pre-entry publication witness.
# #2645 slice B wake path: the soft CPU gains a GICv3 CPU interface for its
# private interrupts (acknowledge, EOI, self-targeted SGI1R) and derives the
# EL1 virtual timer's ISTATUS and PPI from its counter; WFI parks the vCPU's
# thread outside the stage-2 borrow until the timer deadline or a kick
# instead of surfacing Halt. The GIC priorities move into carrick-el1-abi,
# shared with HVF's bring-up (values unchanged). Bound by the soft_wake
# witnesses on the production idle entry and the soft CPU unit witnesses.
# The zone stays off on the soft carrier: no syscall routing changes.
# #2645 slice B part 3: the soft carrier now runs its root in the in-guest
# zone through the shared HVF paths: process ASID, a carrier-scoped guest
# scheduler and slot kicker, root executor registration, slot occupancy
# and publication, and the BIND/open of the root's address space. Private
# futex waits are now served in the ring (syscall:futex): EL1 parks the
# root, the idle vCPU waits in WFI on a live virtual counter, and the soft
# runner serves EL1's idle exit by returning the vCPU to the idle loop.
# The soft_zone witnesses need the production EL1 image on an arm64 host
# (soft-aarch64-native job); set_tid_address and prlimit64 stay counted
# ENOSYS until the root is admitted as a native process (slice C).
# #2645 slice C: the soft carrier binds the kernel's births to its zone
# issuers (the shared RetainedBirthZone source HVF and x86 use) and
# publishes the root's own namespace PID, so EL1 admits the root's process
# owner on its first call. The ring serves set_tid_address, prlimit64,
# gettid, the identity getters, rt_sigaction dispositions and queries, and
# exit_group; exit_group
# crosses back through HVC #6 GRANT_OP_ROOT_EXIT, authenticated by the
# shared stopped-CPU readers (carrick-aarch64 stopped_abi), and ends the
# run with its full status. glibc hello and CPython now count only rseq
# (293, #1906); musl hello counts nothing. The soft root's MM is opened on
# the legacy venue, never admitted to the MM portal owner, so the owner
# cannot publish a signal frame: installing a caught handler stays a counted
# ENOSYS until slice D admits the MM and delivers it (#2814).
