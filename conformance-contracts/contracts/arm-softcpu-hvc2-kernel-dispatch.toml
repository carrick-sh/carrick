]
semantic_authority = [
  "Arm ARM DDI0487G.a D1.10 (exception entry and HVC), D5.4 and D5.8 (stage-1/stage-2 permissions and faults), and D5.10 (TLB maintenance).",
  "man 2 brk, mmap, mprotect, munmap, openat, fstat, read, write, close, clock_gettime, exit_group.",
]
fixture = "carrick-softcpu-aarch64-host::soft_dispatch_witness"
scale_points = [1]
rationale = "Single-process AArch64 guests on the soft CPU must route forwarded HVC #2 syscalls through the shared Aarch64EngineCore<SoftAarch64Vmm> and production SyscallDispatcher with zero fixture syscall replies, enforcing stage-1/stage-2 R/W/X permissions, post-mprotect/munmap synchronous faults, and ExtentTable code-page invalidations."
