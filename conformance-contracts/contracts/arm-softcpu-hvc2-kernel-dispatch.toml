scale_points = [1]
rationale = "Single-process AArch64 guests on the soft CPU must route forwarded HVC #2 syscalls through the shared Aarch64EngineCore<SoftAarch64Vmm> and production SyscallDispatcher with zero fixture syscall replies, taking a pending kernel signal's default action at the guest return boundary, enforcing stage-1/stage-2 R/W/X permissions, post-mprotect/munmap synchronous faults, and ExtentTable code-page invalidations. Before the root's first instruction the carrier publishes its thread lifecycle page and control slot, mapped (never copied) into the EL1 dynamic metadata aperture, and a carrier-bound MM portal; both lifecycle mappings retire with the carrier."
