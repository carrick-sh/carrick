# #2645 slice A: behaviour-preserving move of the HVF BIND/open helpers,
# stopped zone-slot publication and retained lifecycle publication into
# carrick-kernel dispatch/{carrier_loop,carrier_lifecycle}.rs behind
# carrick-hal retained_metadata. Probes, error states and gate semantics are
# unchanged; this contract's semantics, bindings and work budgets are
# unchanged.
# #2645 slice B: the soft carrier publishes the root's retained lifecycle
# page and control slot into its EL1 dynamic metadata aperture through the
# shared carrier lifecycle publisher, so the ring serves the per-thread
# setup calls (set_robust_list, sigaltstack, rt_sigprocmask) from the
# control slot, as on HVF. Bound below by the pre-entry publication witness.
