schema_version = 1
id = "core.entry.completion"
title = "A native entry has one exact-generation completion owner"
guest_surfaces = ["syscall:set_robust_list", "syscall:restart", "vmm:kvm", "vmm:hvf"]
semantic_authority = [
  "man 2 set_robust_list",
  "Linux syscall ABI: an unimplemented native ordinal is refused without effects",
  "Linux signal/restart ordering: a completed syscall with pending return work is not dispatched again",
]
fixture = "carrick-personality-linux:x86_wave2::x4_linux_common_entry"
scale_points = [1, 2, 8]
rationale = """
The ISA adapter retains the native frame and return convention while the Linux
personality decodes the native ordinal and arguments. Admission captures the
exact task, execution generation, MM and thread generation in one non-copying
completion token. Completion authenticates that complete binding. In-zone Born
entries use a distinct lifetime-bound token that authenticates the exact OnCpu
record/claim/incarnation and installed MM without fabricating host adoption.
A switched or parked turn authenticates its initiating execution binding and
exact scheduler record epoch against an owned receipt issued by the successful
existing park/retirement transition, then consumes its entry token. The existing
wait record retains the continuation. Stale handoff cannot publish completion
or work. Lifecycle results and original arguments publish only after successful
authentication in the Linux owner. Pending
return work marks the admitted call complete exactly once; it cannot send the
same syscall through a semantic host dispatcher. Unknown native ordinals are
counted refusals with zero Linux-side publication.
The syscall-ABI root also reexports signal wire records. Retiring the ARM
private wire exports preserves native completion: a valid public frame
restores its accumulator and blocked mask without a syscall result; a malformed
frame forces SIGSEGV without publishing either, and both retain the same-entry
return-work route. This binding does not change ARM production routing.
"""

[bindings]
vm_free = "carrick-personality-linux::x86_wave2::x4_linux_common_entry; carrick-personality-linux::signal_return_contract::public_arm_frame_preserves_same_entry_completion; carrick-el1::personality::native_process_runtime::tests::delayed_child_exit_notifies_adopter_when_selected_parent_exits_on_peer"

[bindings.unresolved]
native_exit_scope = "The native EL1 exit binding proves only lifecycle completion: a committed exit_group returns Transferred with exactly one handoff receipt and no run failure while its selected parent generation retires on a peer CPU, and the adopter's parked wait4 continuation resumes exactly once with that parent's pid. It does not cover set_robust_list, unknown ordinals or the x86 entry token."
embed_structural = "The x86 production binding is carrick-vmm-kvm::cpl0_entry::x4_linux_common_entry; the unchanged-ARM signed embed binding is director-owned."
docker = "Native Linux oracle qualification remains director-owned; this extraction preserves the existing set_robust_list result mapping."

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 0
per_unit = 1
layers = ["vm-free"]
rationale = "Each admitted syscall publishes exactly one semantic completion; refusals publish none."

[[structural_budgets]]
kind = "affine"
metric = "kernel_redispatches"
base = 0
per_unit = 0
layers = ["vm-free"]
rationale = "Pending work changes the return route, never the syscall's semantic owner."
