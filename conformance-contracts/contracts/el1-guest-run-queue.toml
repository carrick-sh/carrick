schema_version = 1
id = "kernel.el1.guest-run-queue"
title = "Where the guest schedules its threads, a thread the host makes runnable goes to an EL1 run queue and no host executor schedules it: host executors are per-vCPU drivers that wait in the guest"
guest_surfaces = [
  "syscall:futex",
  "syscall:read",
  "syscall:write",
  "syscall:exit_group",
  "syscall:execve",
  "syscall:clone",
  "syscall:wait4",
  "syscall:tgkill",
  "syscall:sched_setaffinity",
  "scheduler:preemption",
  "scheduler:vcpu-kick",
  "scheduler:el1-interrupts",
  "signal:asynchronous-delivery",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 read / man 7 pipe: a read of an empty pipe blocks until data arrives, then returns it; the blocked thread resumes",
  "man 2 futex: FUTEX_WAKE returns the number of waiters woken, each of which returns 0 from FUTEX_WAIT",
  "man 7 sched: SCHED_OTHER threads that share a CPU are time-sliced; a runnable thread is not starved by a thread that never blocks",
  "man 2 sched_setaffinity: a thread runs only on CPUs in its affinity mask",
  "man 2 exit_group / man 2 execve / man 2 wait4: every other thread terminates, the parent reaps the child's exit status",
  "man 7 signal: an asynchronous signal is delivered to a thread on its next return to user mode, including one blocked in a wait",
  "Arm ARM: an SGI made pending in a redistributor is taken when the PE's IRQs are unmasked; WFI wakes on a pending interrupt",
]
fixture = "embed:el1-sched pipe-pingpong|pipe-compute|two-process (and every 1c mode, which must keep passing); embed:zone-readers; unit:carrick-sched-core; unit:carrick-kernel::kernel::scheduler"
scale_points = [1000, 6000, 500, 3000]
rationale = "EL1 increment 1d. Before it, a thread the host made runnable (a completed host wait such as a pipe read, a host futex wake, a signal) went to a host run queue and an executor with no thread parked on a host condvar until the host scheduler handed it one: a pipe ping-pong blocked in host reads cost 2.0 host run-queue claims and 2.4 executor condvar parks per round trip. Now a host-runnable thread's row stays held and a service record stands for it in an EL1 run queue, on a vCPU slot whose executor runs it when EL1 reaches it; a host futex wake queues a thread ready at EL0 straight on a vCPU running its address space; a thread EL1 ran that exited to the host is its executor's to run next; and an executor with no thread waits in the guest's idle loop (steal, service threads, WFI) until its vCPU leaves for the host. The claim word stays the only owner of a thread: a host claim takes a queued (not running) thread off its run queue under that queue's lock, keeping its wake result or registers, and is refused only for a thread running on a vCPU; a record the host places in the guest moves by one compare-and-swap between EL1 states, never through host ownership, so no claimant takes a thread for runnable while EL1 may run it (the first version passed through Host and gave one thread two owners in the cross-process readers contract). A host-woken thread queued on a vCPU running a syscall-free loop gets that vCPU within the slice: the host arms the reschedule SGI on the next run and EL0 runs with IRQs unmasked while it is owed. A host waiter's CPU lent to a spare that waits in the guest is returned because the returning owner forces the spare's vCPU out. One executor per guest CPU is the default (CARRICK_BOUND_EXECUTORS the exact hatch); CARRICK_EL1_SCHED=0 restores host run queues and condvar parks. EL1 does not switch address spaces: two processes sharing vCPUs hand off through their executors (6.2-6.4 host exits per round trip, reported by el1_sched_two_processes_share_vcpus as the baseline for an in-guest address-space switch). A thread ready at EL0 in an address space its slot does not run stays queued there and its slot's executor loads it; a slot whose executor stopped running its vCPU (a blocking inline host call, or a mailbox lease that left with its task) takes no thread; a thread the host loads starts a fresh slice; a spare returns a lent CPU before it claims zone work; and /proc reads a zone thread's run state from the claim word."
