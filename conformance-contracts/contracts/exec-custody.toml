# #2070: shared signal-frame setup defers PortalOwnerWait/Busy contention via
# PendingSignalDelivery and clears pending_signal_deliveries on exec cutover /
# process close under kernel.el1.signal-delivery-owner; exec custody ordering and
# work budgets are unchanged.
# #1394: additional ABI bookkeeping witness only; existing semantic and
# work-budget bindings remain authoritative. Census publication reads counters
# after executor join and does not alter this contract's guest operation.
# #917: stage_exec_payload narrows partial-chunk user-copy faults from the
# known-good offset without re-probing copied prefixes, bounded by deterministic
# UserCopy call and probed-byte budgets across page-boundary strings and huge
# argv scaling (argc in [1, 16, 256, 2048]).
# #1028: type physical custody diagnostic reasons; no change to this
# contract's semantics or work budgets. The host dispatch test
# physical_custody_reasons_preserve_fatal_codes_and_debug_text checks
# reason codes and unchanged text; retain the existing execution controls.
# #898 diagnostic-only: entry_binding fatals now retain their invariant
# reason and caller coordinates. Existing bindings remain the semantic
# and work-budget evidence. Rerun the existing control:
# carrick-sched-core::process::exec::tests::rollback_settles_siblings_before_releasing_admission
# #1093 S3: the x86 CPL0 successor hooks share the neutral closed-slot,
# adoption and cancellation protocol (carrick_el1_linux::exec_successor) with
# the AArch64 owner. VM-free witnesses drive the x86 adopter over the real zone
# and reservation tables; the physical crossings stay refusals (no transport
# yet), so no x86 exec is guest-reachable and this contract's work budgets are
# unchanged.
schema_version = 1
id = "process.exec.custody"
title = "Exec settles predecessor siblings before releasing process admission"
guest_surfaces = ["syscall:execve", "syscall:execveat", "kernel:thread-lifecycle"]
semantic_authority = ["execve(2): failed preparation preserves the old image; after the point of no return the old image cannot resume"]
fixture = "Shared exec guard with two independently retained reservations and exact sibling-disposition/release observations"
scale_points = [1, 2]
# The unit fixture asserts exactly one disposition per drain. It does not emit
# a WorkObservation; do not manufacture an evaluator metric for these callbacks.
structural_budgets = []
rationale = "The production Kernel exec path consumes the shared no_std custody guard. Each admitted drain is consumed once; rollback resumes before admission release, while no-return terminates before release. This extraction preserves existing behavior and is a prerequisite for #785, not a ring exec implementation. The callback fixture proves resource ordering only, not two executing guest processes."

[bindings]
vm_free = [
  "carrick-sched-core::process::exec::tests::{rollback_settles_siblings_before_releasing_admission,no_return_drop_terminates_and_never_resumes_siblings,independent_custody_survives_peer_rollback_and_settles_once,second_drain_is_returned_without_losing_either_custody}",
  "carrick-core::exec::tests::{rollback_before_adoption_preserves_predecessor,adoption_has_one_infallible_point_of_no_return}; existing carrick-kernel and carrick-kernel-example exec tests exercise the production adapter",
  "carrick-el1-linux::aarch64_process_tests::first_exec_after_fork_exit_reuses_the_slot_with_a_fresh_root_incarnation (admit the successor notification source, open via the production finish path, publish exactly one Gate revision and install the successor before the refused test host settlement)",
  "carrick-el1-linux::exec_stage::tests::{partial_chunk_fault_narrows_from_known_good_offset_without_recopying,long_string_at_page_boundary_and_huge_argv_stay_within_copy_budget}",
  "carrick-el1-abi::refusal_census_tests::refusal_snapshot_preserves_caller_populations_without_changing_service_counts",
  "carrick-x86-cpl0::exec_successor::tests::{adopts_a_sealed_successor_and_switches_the_slot_at_finish,refuses_every_asid_but_the_untagged_one_before_the_crossing,refuses_an_entry_state_no_user_return_can_enter,a_host_refusal_rolls_back_leaving_the_old_image_installed,cancel_spends_the_receipt_and_the_dropped_slot_frees_the_successor} (#1093 S3: x86 adopt, cancel and rollback with the old image installed on every failure; ASID refusal precedes the consuming crossing)",
  "carrick-el1-linux::native_process_runtime::host_test_support::{host_request_during_service_park_yields_then_reparks,host_request_during_owner_wait_park_yields_then_reparks} (#1467: entry_binding no longer turns an Occupied service or owner-wait park into NativeServiceQuarantined; the exact operation stays bound to its record across the host handback; VM-free only)",
  "carrick-el1-linux::native_process_runtime::host_test_support::{post_arm_exec_adoption_failure_is_sigsegv,refused_exec_preparation_is_cancelled_exactly_once,lost_exec_race_keeps_winner_signal_instead_of_sigsegv,exit_group_wins_over_an_in_progress_native_exec_drain,sigkill_wins_over_an_in_progress_native_exec_drain} and carrick-signal-core::policy::tests::exec_past_no_return_verdict_is_terminal_sigsegv (#1093 S4c slice a: post-no-return exec failures terminate with ExecPastNoReturn::SIGNAL / SIGSEGV on both ISAs while concurrent exit_group and SIGKILL winners keep their own status; see docs/conformance-contracts/exec-past-no-return-sigsegv.md)",
]

[bindings.unresolved]
embed_structural = "Ring file/mapping services, nonleader replacement, CLOEXEC authority binding, and exact old-MM completion rejection remain #785 work. No signed ring exec witness is claimed."
docker = "No new Linux semantics in this guard extraction. The complete exec transaction still requires native arm64 errno and replacement differential witnesses."
