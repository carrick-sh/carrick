embed = "Exact signed source d31f07055 passes sequential growth/return and refusal recovery, four-user concurrent progress with 1,024 unrelated host services, and the IRQ boundary witness together. Real grants and returns complete with inline_hvc_traps == 0; entitlement negative control and both run-scoped cleanup checks pass. Artifact identities, raw red/green logs and non-claims are in docs/perf-results/2026-09-26-el1-allocator-host-boundary/."
docker = "Internal EL1 kernel metadata allocator operates inside guest EL1 and host VMM boundary; user-visible Linux syscall parity is maintained across higher-level interfaces."
embed_structural = "Structural bounds of bounded O(1) search inspections (<= 2), block splits (<= 2), coalescing merges (<= 2), and exact byte accounting are derived and asserted at runtime via VM-free unit tests across 1, 8, 32, and 128 extent scales."
