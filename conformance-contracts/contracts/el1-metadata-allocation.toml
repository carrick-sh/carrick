schema_version = 1
id = "kernel.el1.metadata-allocation"
title = "EL1 elastic metadata allocation, bounded reclamation, authenticated extent grants, and exact-once return"
guest_surfaces = [
  "kernel:el1_allocator",
  "kernel:metadata_grant",
  "kernel:stage1_mmu",
]
semantic_authority = [
  "Linux mm semantics: internal kernel metadata allocations satisfy requested size and alignment, reclaim and coalesce freed storage, and recover gracefully from dynamic extent allocation refusal without leaking resources or corrupting live state",
  "Arm Architecture Reference Manual Armv8-A: stage-1 translation and kernel metadata tables preserve architectural consistency and isolation across dynamic extent mapping and unmapping",
  "Hypervisor.framework hv_vm_map / hv_vm_unmap: host-authenticated extent grants establish stage-2 mappings for dynamic guest apertures and reclaim unused extents upon deallocation",
]
fixture = "embed:el1-sched metadata-allocator; unit:carrick-el1::alloc 1|8|32|128"
scale_points = [1, 8, 32, 128]
rationale = "EL1 metadata allocator replaces the dormant bump allocator with a bounded segregated-fit allocator supporting O(1) allocation and deallocation over admitted extents. It dynamically requests host extent grants via HVC #6 when capacity is exhausted and returns fully unused dynamic extents to the host exactly once upon complete deallocation. Bounded descriptor tables track up to 128 extents with O(1) lookup via block header metadata. Dynamic extent allocation refusal preserves existing allocations and enables subsequent successful retry. IRQ state is preserved during lock critical sections and released prior to host hypercalls."

structural_budgets = []

[bindings]
vm_free = "carrick-el1::alloc::tests::test_arbitrary_alignments_and_memory_writes; carrick-el1::alloc::tests::test_fragmentation_coalescing_and_reuse; carrick-el1::alloc::tests::test_extent_admission_validation_and_overlap_rejection; carrick-el1::alloc::tests::test_dynamic_growth_and_exact_once_return; carrick-el1::alloc::tests::test_grant_refusal_preserves_state_and_allows_subsequent_retry; carrick-el1::alloc::tests::test_bounded_operations_and_bytes_at_scales_1_8_32_128"

[bindings.unresolved]
embed = "Focused signed growth/return, denial recovery and concurrent allocation pass on source 5b2da6bef. Full allocator acceptance remains unresolved: el1_metadata_allocator_host_wait_requires_unmasked_irq samples live DAIF at both real guest HVC #6 boundaries and requires zero masked host waits; IRQ protocol correction is pending. All three witnesses live in crates/carrick-embed/tests/el1_sched.rs."
docker = "Internal EL1 kernel metadata allocator operates inside guest EL1 and host VMM boundary; user-visible Linux syscall parity is maintained across higher-level interfaces."
embed_structural = "Structural bounds of bounded O(1) search inspections (<= 2), block splits (<= 2), coalescing merges (<= 2), and exact byte accounting are derived and asserted at runtime via VM-free unit tests across 1, 8, 32, and 128 extent scales."
embed_timing = "Timing ratio is not asserted for internal kernel metadata allocation."

