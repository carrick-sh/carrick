schema_version = 1
id = "kernel.el1.metadata-allocation"
title = "EL1 elastic metadata allocation, bounded reclamation, authenticated extent grants, and exact-once return"
guest_surfaces = [
  "kernel:el1_allocator",
  "kernel:metadata_grant",
  "kernel:stage1_mmu",
]
semantic_authority = [
  "Linux mm semantics: internal kernel metadata allocations satisfy requested size and alignment, reclaim and coalesce freed storage, and recover gracefully from dynamic extent allocation refusal without leaking resources or corrupting live state",
  "Arm Architecture Reference Manual Armv8-A: stage-1 translation and kernel metadata tables preserve architectural consistency and isolation across dynamic extent mapping and unmapping",
  "Hypervisor.framework hv_vm_map / hv_vm_unmap: host-authenticated extent grants establish stage-2 mappings for dynamic guest apertures and reclaim unused extents upon deallocation",
]
fixture = "embed:el1-sched metadata-allocator; unit:carrick-el1::alloc 1|8|32|128"
scale_points = [1, 8, 32, 128]
rationale = "EL1 metadata allocation uses a bounded segregated-fit allocator over admitted extents. Capacity misses publish one carrier-wide single-flight request and unwind through the existing pending-host-work boundary before the host maps or unmaps anything; no synchronous host wait occurs on the masked EL1 allocator stack. Fully unused dynamic extents return exactly once. The descriptor table tracks at most 128 extents and block headers provide direct deallocation ownership. Host refusal preserves live allocations and a later boundary may retry."

