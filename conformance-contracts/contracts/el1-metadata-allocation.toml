# Request-lifetime follow-up: request words now carry 64-bit incarnation
# identities and HOST_REQUEST_PROTOCOL participates in ABI hashing. Record
# layout/hash regression bindings remain required; no new GIC/fault/page-table
# behavior is asserted by the request lifetime tests.
# Transfer-protocol review: the shared ABI hash now includes transfer claim
# encodings, so older images cannot decode an in-flight transfer as Free.
# No GIC, fault, metadata or page-table layout/algorithm changed here; retain
# those existing regression bindings. New transfer unit tests do not prove
# these contracts, and fresh signed promotion remains required.
schema_version = 1
id = "kernel.el1.metadata-allocation"
title = "EL1 elastic metadata allocation, bounded reclamation, authenticated extent grants, and exact-once return"
guest_surfaces = [
  "kernel:el1_allocator",
  "kernel:metadata_grant",
  "kernel:stage1_mmu",
]
semantic_authority = [
  "Linux mm semantics: internal kernel metadata allocations satisfy requested size and alignment, reclaim and coalesce freed storage, and recover gracefully from dynamic extent allocation refusal without leaking resources or corrupting live state",
  "Arm Architecture Reference Manual Armv8-A: stage-1 translation and kernel metadata tables preserve architectural consistency and isolation across dynamic extent mapping and unmapping",
  "Hypervisor.framework hv_vm_map / hv_vm_unmap: host-authenticated extent grants establish stage-2 mappings for dynamic guest apertures and reclaim unused extents upon deallocation",
]
fixture = "embed:el1-sched metadata-allocator; unit:carrick-el1::alloc 1|8|32|128"
scale_points = [1, 8, 32, 128]
rationale = "EL1 metadata allocation uses a bounded segregated-fit allocator over admitted extents. Capacity misses publish one carrier-wide single-flight request and unwind through the existing pending-host-work boundary before the host maps or unmaps anything; no synchronous host wait occurs on the masked EL1 allocator stack. The allocator test-control transaction parks its exact zone record on a request-incarnation queue while host work is pending, and completion publishes readiness and wakes that queue under one admission lock. It never spends userspace attempt budget waiting for another executor to finish the same request. Fully unused dynamic extents return exactly once. The descriptor table tracks at most 128 extents and block headers provide direct deallocation ownership. Host refusal preserves live allocations and a later boundary may retry."

[[structural_budgets]]
kind = "affine"
metric = "allocator_bins_checked"
base = 2
per_unit = 0
rationale = "Segregated-fit allocation checks at most the requested bin and one larger bin regardless of admitted extent count."

[[structural_budgets]]
kind = "affine"
metric = "allocator_blocks_inspected"
base = 2
per_unit = 0
rationale = "Each checked bin contributes at most one free-list head inspection."

[[structural_budgets]]
kind = "affine"
metric = "allocator_splits_performed"
base = 2
per_unit = 0
rationale = "Alignment and trailing remainder require at most two block splits."

[[structural_budgets]]
kind = "affine"
metric = "allocator_merges_performed"
base = 2
per_unit = 0
rationale = "Deallocation coalesces with at most the immediate predecessor and successor."

[[structural_budgets]]
kind = "affine"
metric = "allocator_capacity_bytes"
base = 0
per_unit = 65536
rationale = "The fixture admits one 64 KiB extent per scale unit and accounts every admitted byte exactly."

[bindings]
vm_free = "carrick-vmm-hvf::metadata_grant::tests::deferred_metadata_service_reauthenticates_retired_generation; carrick-sched-core::object_wait::host_tests::metadata_completion_follows_parked_record_after_slot_switch; carrick-sched-core::object_wait::host_tests::metadata_wait_cancellation_unlinks_its_reserved_queue; carrick-el1-abi::tests::metadata_mailbox_admits_wait_identity_before_host_claim; carrick-el1::alloc::tests::test_arbitrary_alignments_and_memory_writes; carrick-el1::alloc::tests::test_fragmentation_coalescing_and_reuse; carrick-el1::alloc::tests::test_extent_admission_validation_and_overlap_rejection; carrick-el1::alloc::tests::test_dynamic_growth_and_exact_once_return; carrick-el1::alloc::tests::test_grant_refusal_preserves_state_and_allows_subsequent_retry; carrick-el1::alloc::tests::test_bounded_operations_and_bytes_at_scales_1_8_32_128; carrick-el1-abi::tests::an_image_built_against_another_layout_is_refused (shared ABI identity now includes OnCpuRequested; image header acceptance/rejection only, no new el1-metadata-allocation semantic or signed acceptance claim)"

