schema_version = 1
id = "kernel.el1.gic"
title = "Every HVF carrier VM carries the in-kernel GICv3, invisible to guest EL0, and EL1 takes the virtual timer with no host exit"
guest_surfaces = ["vmm:hvf", "scheduler:vcpu-kick", "scheduler:el1-interrupts", "execution:linux-aarch64", "abi:el0-id-registers"]
semantic_authority = ["Arm ARM: an interrupt left pending while PSTATE.I is set is taken at the first context synchronization after the mask is cleared; taking an exception overwrites ELR_EL1 and SPSR_EL1; ICC_IAR1_EL1 acknowledges the highest-priority pending Group 1 interrupt and ICC_EOIR1_EL1 completes it", "Hypervisor.framework hv_gic.h: hv_gic_create after hv_vm_create and before any hv_vcpu_create; each vCPU sets its affinity in MPIDR_EL1; redistributor and ICC registers are written by the owning thread; once the VM's vCPUs run its topology is final", "Hypervisor.framework hv_vcpu.h: hv_vcpu_set_pending_interrupt returns HV_UNSUPPORTED if the VM was created with a GIC device", "libkrun (Apache-2.0) 85bed715: the same creation order, MPIDR on the owning thread, no host-side distributor programming", "Linux arm64 exposes the ID registers to EL0 through emulation and does not expose the GIC system-register field of ID_AA64PFR0_EL1 (reads 0), which is also what a GIC-less Hypervisor.framework vCPU reports"]
fixture = "unit:gic-setup-model; unit:vector-page-interpreter; embed:el0-id-view; embed:el1-vtimer-loop"
scale_points = [1, 18]
rationale = "EL1 plan 1a gives the carrier VM Hypervisor.framework's in-kernel GICv3 so the EL1 kernel can later preempt with the virtual timer and wake vCPUs with SGIs without host exits. The GIC is created inside the single VM-creation funnel right after hv_vm_create (its HV_NO_RESOURCES joins the funnel's park-and-retry), so every VM generation has it before its first vCPU; both vCPU-creation wrappers give each vCPU a distinct MPIDR (RES1 | Aff1 = index/16 | Aff0 = index%16) and configure its redistributor (kick SGI 15 and vtimer PPI 27 enabled in group 1 with priorities 0xa0/0x80) and CPU interface (PMR 0xf0, IGRPEN1) on the owning thread before handing it out; a failed configuration destroys the vCPU. The host writes no distributor register: the default GICD_CTLR (0x50) already delivers SGIs and PPIs (qualified live). The GIC's guest-physical window (0x2F_0000_0000, 256 MiB) is refused by the stage-2 map boundary and by stage-1 publication, and the boot stage-1 images leave its 1 GiB block untranslated, so guest EL0 never reaches the distributor or a redistributor as memory. With the GIC the vCPU reports the GIC interface in ID_AA64PFR0_EL1 bits 27:24; the EL0 view hides that field, so guest-visible ID registers are unchanged. EL1 takes GIC interrupts in exactly one place: the served-syscall return path of the EL1 syscall hook, before ELR/SPSR are reloaded from the TrapFrame, opens a one-instruction window (msr daifclr; isb; msr daifset) when ISR_EL1.I shows an interrupt pending. The current-EL SPx IRQ slot branches to a hand-encoded handler that checks it was taken in that window (else fail loud through hvc #3), acknowledges with ICC_IAR1_EL1, stops and counts the virtual timer, republishes an acknowledged kick SGI as the slot's pending host work (which the hook's check forwards to the host), and completes with ICC_EOIR1_EL1. Guest EL0 keeps DAIF masked. A signed probe arms the virtual timer 1 ms ahead on the vCPU resuming a forwarded marker syscall while the guest loops on EL1-served lseek: EL1 takes it exactly once with zero exits of that vCPU between arming and delivery other than host-initiated ones (kicks, work forwards), deterministically unloaded and under 1.5x host CPU oversubscription. CARRICK_HVF_GIC=0 (exact) restores the GIC-less VM, the SDK IRQ line and today's vector bytes for bisection."
structural_budgets = []

