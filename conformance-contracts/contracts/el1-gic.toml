embed = "carrick-embed::el1_gic (signed; el1_gic_vtimer_reaches_el1_without_host_exits: the timer is taken at EL1 exactly once with zero non-host-initiated exits of the probed vCPU between arming and delivery; el1_gic_el0_id_view_hides_the_gic: the production VM carries the GIC and the EL0 ID_AA64PFR0_EL1 GIC field reads 0)"
ecosystem = ["go:build", "go:testing", "cpython:threading"]

[bindings.unresolved]
docker = "The GIC is a host-internal hypervisor device. The one guest-visible fact it could change, the EL0 view of ID_AA64PFR0_EL1, is asserted against Linux's documented userspace view (GIC field hidden, reads 0) by the signed embed fixture; blessing a Docker oracle for a new generic probe needs a Docker phase that was not run in this session."
embed_structural = "GIC presence and the configured vCPU count are read through carrick_runtime::carrier_gic_snapshot(), EL1 interrupt deliveries through the EL1 counters (irq_taken), and the probed vCPU's exits through carrick_runtime::el1_vtimer_probe_report(); no WorkObservation metric is registered for them."
