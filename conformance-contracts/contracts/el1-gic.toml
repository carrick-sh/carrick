schema_version = 1
id = "kernel.el1.gic"
title = "Every HVF carrier VM carries the in-kernel GICv3, invisible to guest EL0"
guest_surfaces = ["vmm:hvf", "scheduler:vcpu-kick", "execution:linux-aarch64", "abi:el0-id-registers"]
semantic_authority = ["Hypervisor.framework hv_gic.h: hv_gic_create after hv_vm_create and before any hv_vcpu_create; each vCPU sets its affinity in MPIDR_EL1; redistributor and ICC registers are written by the owning thread; once the VM's vCPUs run its topology is final", "Hypervisor.framework hv_vcpu.h: hv_vcpu_set_pending_interrupt returns HV_UNSUPPORTED if the VM was created with a GIC device", "libkrun (Apache-2.0) 85bed715: the same creation order, MPIDR on the owning thread, no host-side distributor programming", "Linux arm64 exposes the ID registers to EL0 through emulation and does not expose the GIC system-register field of ID_AA64PFR0_EL1 (reads 0), which is also what a GIC-less Hypervisor.framework vCPU reports"]
fixture = "unit:gic-setup-model; embed:el0-id-view"
scale_points = [1, 18]
rationale = "EL1 plan 1a gives the carrier VM Hypervisor.framework's in-kernel GICv3 so the EL1 kernel can later preempt with the virtual timer and wake vCPUs with SGIs without host exits. The GIC is created inside the single VM-creation funnel right after hv_vm_create (its HV_NO_RESOURCES joins the funnel's park-and-retry), so every VM generation has it before its first vCPU; both vCPU-creation wrappers give each vCPU a distinct MPIDR (RES1 | Aff1 = index/16 | Aff0 = index%16) and configure its redistributor (kick SGI 15 and vtimer PPI 27 enabled in group 1 with priorities 0xa0/0x80) and CPU interface (PMR 0xf0, IGRPEN1) on the owning thread before handing it out; a failed configuration destroys the vCPU. The host writes no distributor register: the default GICD_CTLR (0x50) already delivers SGIs and PPIs (qualified live). The GIC's guest-physical window (0x2F_0000_0000, 256 MiB) is refused by the stage-2 map boundary and by stage-1 publication, and the boot stage-1 images leave its 1 GiB block untranslated, so guest EL0 never reaches the distributor or a redistributor as memory. With the GIC the vCPU reports the GIC interface in ID_AA64PFR0_EL1 bits 27:24; the EL0 view hides that field, so guest-visible ID registers are unchanged. CARRICK_HVF_GIC=0 (exact) restores the GIC-less VM for bisection."
structural_budgets = []

[bindings]
vm_free = "carrick-vmm-hvf::gic::tests::mpidr_carries_res1_and_sgi_addressable_affinity; carrick-vmm-hvf::gic::tests::geometry_must_fit_the_reserved_window; carrick-vmm-hvf::gic::tests::only_the_exact_hatch_value_disables_the_gic; carrick-vmm-hvf::gic::tests::el0_view_of_id_aa64pfr0_hides_only_the_gic_field; carrick-vmm-hvf::gic::tests::raw_hv_gic_calls_stay_in_gic_rs; carrick-vmm-hvf::gic::tests::gic_is_created_inside_the_vm_creation_funnel; carrick-vmm-hvf::gic::tests::every_vcpu_is_configured_by_its_creation_wrapper; carrick-vmm-hvf::trap::stage2_backend::stage2_map_refuses_the_gic_window; carrick-mem::page_table::tests::stage1_publication_refuses_outputs_in_the_gic_window; carrick-mem::page_table::tests::boot_stage1_images_leave_the_gic_window_untranslated; carrick-mem::memory::kernel_only_range_tests::gic_window_is_below_the_trampoline_and_above_the_vdso"
embed = "carrick-embed::el1_gic::el1_gic_el0_id_view_hides_the_gic (signed; production VM carries the GIC, EL0 ID_AA64PFR0_EL1 GIC field reads 0)"
ecosystem = ["go:build", "go:testing", "cpython:threading"]

[bindings.unresolved]
docker = "The GIC is a host-internal hypervisor device. The one guest-visible fact it could change, the EL0 view of ID_AA64PFR0_EL1, is asserted against Linux's documented userspace view (GIC field hidden, reads 0) by the signed embed fixture; blessing a Docker oracle for a new generic probe needs a Docker phase that was not run in this session."
embed_structural = "GIC presence and the configured vCPU count are read through carrick_runtime::carrier_gic_snapshot(); no WorkObservation metric is registered for them."
