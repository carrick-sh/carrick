schema_version = 1
id = "kernel.scheduler.preemption-lifecycle"
title = "Preemption lifecycle and stale-request protection"
guest_surfaces = ["scheduler:preemption", "scheduler:host_wait", "scheduler:lifecycle"]
semantic_authority = [
  "man 7 sched",
  "man 2 sigaction",
]
fixture = "fixture:scheduler_preemption"
scale_points = [1, 2, 4, 8]
rationale = "A stale request never affects a successor; control reasons survive fairness cancellation; handoff preserves slot ownership."

[bindings]
vm_free = "carrick-kernel-example::scheduler_lifecycle_contract; carrick-kernel::kernel::scheduler::tests::{a_deferred_zone_handback_does_not_audit_a_reaped_target,zone_handback_authenticates_the_registered_continuation,zone_handback_before_registration_kicks_the_running_owner_once} (zone delivery target authentication, retired no-op, and one kick/zero queue rows before enrollment; no new preemption-policy or runtime-cost acceptance)"
embed = "carrick-embed::scheduler_lifecycle_contract"
docker = "fixture:scheduler_preemption"
ecosystem = ["go:runtime", "cpython:threading"]

[[structural_budgets]]
kind = "exact"
metric = "vcpu_migrations"
value = 0
rationale = "Preemption lifecycle transitions preserve CPU affinity and do not perform spurious vCPU migrations."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
