schema_version = 1
id = "kernel.wait.child-rusage"
title = "Consuming child waits preserve subtree CPU usage"
guest_surfaces = ["syscall:wait4", "syscall:getrusage", "syscall:times"]
semantic_authority = ["man 2 wait4", "man 2 getrusage"]
fixture = "unit:wait4_preserves_subtree_usage_and_charges_children_once"
scale_points = [1]
structural_budgets = []
rationale = "The exact-generation zombie is the single reap authority. A consuming wait adds its own process CPU, including threads, plus already-reaped descendants to the parent once. The returned receipt carries that same total. Observing a zombie and repeating a consumed wait never charge the parent. Rendering two timevals adds constant work and no population scan. The VM-free binding asserts exact CPU totals and exactly-once charge directly."

[bindings]
vm_free = "carrick-kernel::dispatch::proc::kernel_process_dispatch_tests::wait4_preserves_subtree_usage_and_charges_children_once; carrick-el1-linux::process_owner::tests::pending_reparented_child_charges_adopter_once_and_never_departed_parent; carrick-el1-linux::native_process_runtime::tests::wait4::native_wait4_nonnull_rusage_reaps_child; carrick-el1-linux::native_process_runtime::tests::wait4::native_wait4_untraced_continued_reaps_child; carrick-el1-linux::native_process_runtime::tests::wait4::native_wait4_rusage_fault_consumes_child_after_status"
embed = "carrick-conformance-next::generic_probe_shard_1 filtered to childrusage, arm64 gnu and musl"

[bindings.unresolved]
native_runtime = "The native EL1 runtime records no per-task CPU (own usage stays TaskRusage::default). Its wait4 binding renders the shared owner's retained subtree ledger, accepts WUNTRACED/WCONTINUED for exiting children and retains output pointers through parking. Native stop/continue event production and native CPU measurement remain unresolved. The owner-level reparent binding proves the shared charge ledger across a pending MM retirement."
docker = "Predicted all-true CPU oracle awaits director blessing on native arm64 Docker."
observation = "No WorkObservation metric is registered for child-CPU ledger additions; the deterministic test checks exact totals and no second charge."
faults_and_switches = "Director restricted this slice to CPU. Per-task minor-fault and context-switch accounting requires execution-boundary ledgers in both EL1 and host paths."
