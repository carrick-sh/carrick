# #1338 step 2 (design v3, confirmation 7102425065): ring-served MAP_SHARED
# file mappings as windows onto the host page cache. Red first: on main the
# x86 ring answers every writable MAP_SHARED mmap ENOSYS, and the ARM
# dispatcher's snapshot arm loses a MAP_FIXED write. The VM-free bindings
# cover the neutral window record only; the carrier installs and the
# mmap, fault, munmap and size-change paths that use it come with PR A.
schema_version = 1
id = "kernel.mm.shared-file-window"
title = "A shared file mapping is a live view of the file in every process"
guest_surfaces = [
  "syscall:mmap",
  "syscall:munmap",
  "syscall:mprotect",
  "syscall:msync",
  "syscall:ftruncate",
  "syscall:truncate",
  "syscall:fallocate",
  "syscall:fork",
  "syscall:futex",
]
semantic_authority = [
  "man 2 mmap: MAP_SHARED updates are visible to other processes mapping the same region and are carried through to the underlying file; access past the end of the file is SIGBUS",
  "man 2 msync: MS_SYNC requests an update and waits for it to complete",
  "man 2 truncate: if the file shrinks, the extra data is lost",
  "man 2 mprotect: changes the access protections of the calling process's pages in the range",
  "man 5 proc: /proc/pid/maps shows a shared mapping's permissions as rw-s",
  "man 2 fork: the child inherits MAP_SHARED mappings, shared with the parent",
]
fixture = "embed:carrick-cli::x86_kvm_run::mounted_static_x86_writable_shared_file_mapping_matches_native"
scale_points = [1, 2]
structural_budgets = []
rationale = """
Linux: every MAP_SHARED mapping of a file, in any process, reaches the same
page-cache pages, so a write through one is at once in the file and in every
other mapping, with or without msync. Carrick serves these mappings as
windows: a carrier's view of the host file's page cache in fixed 2 MiB
chunks, with no copy and no write-back state. One neutral model
(carrick_core::mm::window) specifies chunk geometry, per-mapping edges,
SIGBUS past EOF, and shrink/park/epoch state transitions; A1 production
enforces shrink safety through the host-inode size fence (carrick_vfs::host_size)
and carrier window-slot custody (A3 will wire live shrink revocation). The
active KVM fixture runs the Go linker's sequence, two live processes sharing
one writable file mapping, MAP_SHARED|MAP_POPULATE|MAP_FIXED with a read by
path, a chunk mapped twice, mprotect read-only and back over faulted window
pages, and SIGBUS past EOF (root and forked child), comparing every active
row with native Linux; the three separate KVM cases for /dev/zero, msync,
and /proc/self/maps rw-s remain ignored pending #2958, A3, and #2808.
"""

[bindings]
vm_free = [
  "carrick-core::mm::window::tests; neutral model only: per-mapping edges (C3), SIGBUS past EOF, Shrinking parks faults past the new size including from a mapping made mid-shrink, a second size change is Busy, a failed shrink keeps the old size, stale epochs are refused (production A1 enforces shrink refusal via host_size + slot custody)",
]
embed = [
  "carrick-cli::x86_kvm_run::mounted_static_x86_writable_shared_file_mapping_matches_native (red on main: every writable MAP_SHARED mmap is ENOSYS)",
  "carrick-cli::x86_kvm_run::mounted_static_x86_shared_file_window_futex_is_fenced_never_hangs (A1 fence, v3 C5: a non-private futex WAIT and WAKE on a window are a counted ENOSYS, never a hang)",
  "carrick-cli::x86_kvm_run::mounted_static_x86_shared_file_window_shrink_is_fenced_before_the_host (A1 interim fence until A3 revokes: ftruncate, fallocate punch and collapse by a forked child, truncate and O_TRUNC by the root, of a window-mapped file are a counted ENOSYS before the host shrinks; growth and an unmapped shrink are served)",
  "carrick-cli::x86_kvm_run::mounted_static_x86_shared_file_window_shrink_through_a_bind_mount_is_fenced (A1 fence keyed on the host inode a path routes to: truncate and O_TRUNC by name through a bind mount are a counted ENOSYS before the mount's host call; red before #2977's fix)",
  "carrick-cli::x86_kvm_run::mounted_static_x86_shared_file_window_mixed_range_edits_are_served_or_counted (the served range-edit surface: a munmap of a private and a window page is served unless both are faulted, a counted ENOSYS then; PROT_NONE over a faulted window page is a counted ENOSYS, over an unfaulted one served)",
]

[bindings.unresolved]
docker = "Native Linux is the oracle: the KVM test compares each row with a native run of the same fixture."
embed_timing = "No ratio is claimed until PR B (the ratio row's tuning)."
