schema_version = 1
id = "kernel.fs.directory-copyout"
title = "Directory streams commit complete records into private destinations"
guest_surfaces = ["syscall:getdents64", "syscall:openat"]
semantic_authority = ["https://man7.org/linux/man-pages/man2/getdents.2.html: count is capacity, successful calls return bytes read; EFAULT is an invalid result buffer, EINVAL is too small for a record", "Issue #711 owner-wait rule 1: owner-memory waits end on SIGKILL or group exit, with other signals deferred", "Issue #711 owner-wait rule 4: transient owner refusal is not EFAULT"]
fixture = "unit:real-lower-directory-private-destination"
scale_points = [10, 100, 400, 4096]
rationale = "Directory records are repeatable until the shared description cursor commits. Each copyout authority is bounded by the existing 4096-byte PREPARE capacity. A batch ends on complete records before a guest-page boundary; a crossing record is prepared separately. Offset publication follows infallible prepared commit. Before progress an owner wait retains the selected description, functional lease and exact thread; after progress a refusal may return only actually delivered complete records, never synthesize EFAULT or replay a numeric fd."
structural_budgets = []

[bindings]
vm_free = "carrick-kernel::dispatch::fs::tests::getdents64_fault_preserves_cursor_for_untouched_private_destination: real immutable HostFs lower and production sparse AddressSpace (Legacy venue), no fake backend. directory_record_batches_fit_production_owner_admission uses production encoder and PreparedStreamRanges with mixed-width records and page-proportional batch bounds. directory_retained_selection_survives_sibling_fd_reuse_and_releases_on_drop uses an explicitly test-only refusal adapter through production dispatch/resume; it does not prove live owner enrollment. carrick-runtime::vcpu_loop::binding::tests::serial_host_directory_physical_dependency_sigkill_uses_owner_physical_resume uses production dispatch, physical owner-wait enrollment, scheduler settlement, runtime resume and terminal publication with the real VM-free CodeContent/PendingContentWrite dependency and test-engine preparation; SIGKILL terminates before reader release, with no cursor progress or output commit and no retained writer custody. serial_host_directory_physical_sigkill_during_enrollment_precedes_ready_retry publishes SIGKILL and releases the reader during enrollment: fatal cancellation must precede re-preparation/output/cursor consumption. serial_host_directory_physical_resume_releases_writer_before_retry and serial_host_directory_physical_immediate_resume_releases_writer_before_retry require writer count zero and successful sibling instruction observation before re-preparation, then exactly one commit/completion. serial_host_directory_physical_nonleader_process_sigkill_precedes_ready_retry and serial_host_directory_physical_nonleader_process_sigkill_during_enrollment retain a live carrier-owned leader with SIGKILL unblocked while the non-leader waits. Process-wide SIGKILL is visible to the waiter but its delivery reservation belongs to the leader; both ready paths must terminate without retry, output or cursor advancement."

[bindings.unresolved]
embed_structural = "carrick-conformance-next::directory_copyout::case_libpython_directory_copyout reports openat, fstat and getdents64 errno numbers into fresh mmap, large malloc and normal buffers. Live sibling-editor contention, handled-signal deferral, live HVF SIGKILL/group exit (VM-free physical-dependency cancellation is bound above), and the owner-holder audit/model remain unproved. HVF unavailable on ctb-w4; signed pre-fix RED, candidate output and work/timing remain director-owned."
docker = "Native ARM64 python:3.12-slim exact-output bless required; no Docker on ctb-w4."
embed_timing = "Paired same-image uninstrumented runtime ratio and signed promotion remain open."
