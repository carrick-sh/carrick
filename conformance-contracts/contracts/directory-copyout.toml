schema_version = 1
id = "kernel.fs.directory-copyout"
title = "Directory streams commit complete records into private destinations"
guest_surfaces = ["syscall:getdents64", "syscall:openat"]
semantic_authority = ["https://man7.org/linux/man-pages/man2/getdents.2.html: count is capacity, successful calls return bytes read; EFAULT is an invalid result buffer, EINVAL is too small for a record", "Issue #711 owner-wait rule 1: owner-memory waits end on SIGKILL or group exit, with other signals deferred", "Issue #711 owner-wait rule 4: transient owner refusal is not EFAULT"]
fixture = "unit:real-lower-directory-private-destination"
scale_points = [10, 100, 400, 4096]
rationale = "Directory records are repeatable until the shared description cursor commits. Each copyout authority is bounded by the existing 4096-byte PREPARE capacity. A batch ends on complete records before a guest-page boundary; a crossing record is prepared separately. Offset publication follows infallible prepared commit under the same #802 ProcessEffect custody. All owner waits use the shared OwnerWait settlement, including already-ready enrollment. Before progress an owner wait retains the selected description, functional lease and exact execution binding; after progress a refusal may return only actually delivered complete records, never synthesize EFAULT or replay a numeric fd."
structural_budgets = []

[bindings]
vm_free = [
  "carrick-runtime::vcpu_loop::binding::tests::serial_host_directory_shared_route_transfers_only_dependency_custody: production dispatch and routing leave exactly two physical dependency references (external witness plus routed wait), with none retained by the operation. carrick-kernel::dispatch::copyout_tests::{directory_shared_output_repeated_refusals_release_before_preparation,directory_shared_output_returns_complete_prefix_on_refusal_or_fault,directory_shared_output_rejects_stale_handoff_and_cancellation_before_access,directory_shared_output_relocks_live_cursor_and_requires_owner_lease,directory_shared_output_preserves_internal_preparation_error}: owner then supply then physical refusal give 1/2/3 preparations, zero commits and cursor zero; successful retry releases the dependency before preparation 4 and commits the one-batch fixture exactly once. Refusal and genuine fault after a complete record return precisely 24 bytes and cursor 1, with no suspension. Injected stale task/ASID handoffs and terminal cancellation perform zero resumed reads, preparations or commits, leave the cursor untouched and release the functional lease. These are internal handoff witnesses, not evidence of a spontaneous guest scheduling defect. carrick-kernel::dispatch::fs::tests::getdents64_fault_preserves_cursor_for_untouched_private_destination: real immutable HostFs lower and production sparse AddressSpace (Legacy venue), no fake backend. directory_record_batches_fit_production_owner_admission uses production encoder and PreparedStreamRanges with mixed-width records and page-proportional batch bounds. directory_retained_selection_survives_sibling_fd_reuse_and_releases_on_drop uses an explicitly test-only refusal adapter through production dispatch/resume; it does not prove live owner enrollment. carrick-kernel::dispatch::fs::tests::fs_queries_and_signalfd_wait_for_owner_refused_copyout_without_consuming_state proves that fs.rs/mount.rs/xattr.rs copyout paths (read_signalfd, getcwd, getxattr, listxattr) prepare before side effects and return OwnerMemoryWait on an owner refusal without consuming pending signalfd state. carrick-kernel::dispatch::fs::tests::xattr_partial_copyout_resumes_after_owner_wait_when_output_overlaps_name_or_fd_is_replaced, carrick-kernel::dispatch::fs::tests::signalfd_read_bounds_permit_secures_available_records_and_consumes_on_genuine_fault and carrick-kernel::dispatch::signal::tests::signalfd_read_entry_points_share_owner_copyout_fault_and_multi_permit_semantics prove multi-permit xattr continuation across owner suspension and unified per-record signalfd permit bounding, refusal preservation and genuine-fault consumption across both FsView and SignalView entry points. carrick-runtime::vcpu_loop::binding::tests::serial_host_directory_physical_dependency_sigkill_uses_owner_physical_resume uses production dispatch, physical owner-wait enrollment, scheduler settlement, runtime resume and terminal publication with the real VM-free CodeContent/PendingContentWrite dependency and test-engine preparation; SIGKILL terminates before reader release, with no cursor progress or output commit and no retained writer custody. serial_host_directory_physical_kill_after_ready_before_effect_admission publishes fatal cancellation during re-preparation and requires zero commits and an unchanged cursor. serial_host_directory_physical_sigkill_during_enrollment_precedes_ready_retry publishes SIGKILL and releases the reader during enrollment: fatal cancellation must precede re-preparation/output/cursor consumption. serial_host_directory_physical_resume_releases_writer_before_retry and serial_host_directory_physical_immediate_resume_releases_writer_before_retry require writer count zero and successful sibling instruction observation before re-preparation, then exactly one commit/completion. serial_host_directory_physical_nonleader_process_sigkill_precedes_ready_retry and serial_host_directory_physical_nonleader_process_sigkill_during_enrollment retain a live carrier-owned leader with SIGKILL unblocked while the non-leader waits. Process-wide SIGKILL is visible to the waiter but its delivery reservation belongs to the leader; both ready paths must terminate without retry, output or cursor advancement.",
]

