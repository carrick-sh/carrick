# #1090 shared-file scope (classification acknowledgement, not runtime acceptance).
# Thread control gains constant-size restart custody, cleared at rebirth.
# forwarded_restart_is_consumed_once_and_cleared_at_rebirth is the new
# lifecycle binding; its focused crate gate is recorded separately.
# Checkpoint predicates also recognize an armed restart witness. The new
# x86_empty_ignored_and_blocked_checkpoints_consume_restart_once and default-
# fatal signal-return controls passed through the real registered native owner.
# Existing semantic bindings and work budgets below are retained. These scope
# notes do not replace their contract-specific acceptance. Live continuation
# and reservation-transfer evidence remains unresolved under
# kernel.el1.signal-delivery-owner; see
# docs/conformance-contracts/continuation-signal-return.md.
# #1044: owned-yield replies are typed separately from memory preparation.
# The retained IPC/CarrierWork seam bindings below cover that API change;
# existing fork, lifecycle, file and inotify acceptance remains unchanged.
# #1101: fork lifecycle backing uses retained metadata custody.
# Scheduler dispatch, request enrollment, and queue policy are unchanged; the pending-work enrollment lead is tracked separately in #1123.
# The component ownership/counter witnesses are registered under
# kernel.el1.metadata-allocation; retain every existing family binding below.
# These VM-free component checks do not confer signed acceptance for this family.
# #1106: mixed host fallback and guest-service rows share the scheduler's
# enqueue ordering. A compute successor must yield to already-waiting work
# across the two queues; reversing permanent priority is also a failure.
# VM-free bounded selection witnesses require progress within two picks and
# at most two service placements. Signed host-compute 10/10 remains required.
# #1134: an inline host wait no longer refunds the run budget. Run time
# spent before a step-away carries into the resumed residency (the wait is
# not charged), so a thread whose every syscall is host-served exhausts its
# quantum while a same-CPU sibling waits. The kernel-example witness drives
# the production begin/end_host_wait path and requires preemption at the
# fourth run millisecond, then the sibling claimed next. A guest service
# handed back unplaced moves its held row to a host CPU queue; that move is
# fairness demand and now schedules the running thread's deadline, as an
# ordinary enqueue does (serial kernel witness below).
# #1028: type physical custody diagnostic reasons; no change to this
# contract's semantics or work budgets. The host dispatch test
# physical_custody_reasons_preserve_fatal_codes_and_debug_text checks
# reason codes and unchanged text; retain the existing execution controls.
# #898 diagnostic-only: entry_binding fatals now retain their invariant
# reason and caller coordinates. Existing bindings remain the semantic
# and work-budget evidence. Rerun the existing control:
# carrick-core-abi::service::tests::prepared_delivery_retains_cancelled_resources_until_cleanup_ack
schema_version = 1
id = "kernel.scheduler.runnable-progress"
title = "Runnable scheduler affinity and preemption progress"
guest_surfaces = ["syscall:clone", "syscall:sched_setaffinity", "syscall:sched_getaffinity", "scheduler:preemption", "scheduler:rotation", "scheduler:executor-pool", "scheduler:native-service"]
semantic_authority = [
  "man 2 clone: a refused clone publishes no new thread; Carrick reservation rollback releases registry and settlement guards before notifying reservation subscribers",
  "man 7 sched",
  "man 2 sched_yield",
  "man 2 sched_setaffinity: a thread running on a CPU excluded by the new mask migrates to an allowed CPU before the call returns",
  "man 2 sched_setaffinity: pid specifies an exact thread; zero specifies the calling thread",
]
fixture = "fixture:scheduler_preemption"
scale_points = [1, 8, 32, 128]
rationale = "Eligible syscall-free tasks rotate under a finite execution budget; affinity and thread identity remain exact. Set/getaffinity name the exact TaskKey and ThreadKey incarnation, including sibling threads and other guest processes; only the named mask changes. Host scheduler claims cannot enter an excluded CPU, including a mask change between queue placement, claim, and backend load. An excluded host-running residency receives an exact executor kick without queue demand, timer advance, or a syscall, then migrates before its next guest entry. Widening, unrelated tasks, and retired exec predecessors require zero kicks; exec successors inherit the kick capability. Guest-switched tasks inspect their own live authority at the return boundary and requeue onto an allowed CPU without waiting for queue demand or a timer. Pool admission must reject bound-worker capacity below the scheduler CPU count before publishing any preemption driver, resolver or worker; spare workers cannot cover missing bound CPUs and the policy must not be silently clamped. Native service intake uses the birth-bound MM identity without acquiring a contended reservation root. Native service waits release execution capacity; one record owns one non-wrapping operation sequence and retains its MM/member until exact physical acknowledgment and ring consumption. Cancellation cannot recycle backing before acknowledgment, and an old execution generation cannot complete its successor."

