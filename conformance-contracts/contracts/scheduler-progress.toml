schema_version = 1
id = "kernel.scheduler.runnable-progress"
title = "Runnable scheduler preemption progress"
guest_surfaces = ["scheduler:preemption", "scheduler:rotation"]
semantic_authority = [
  "man 7 sched",
  "man 2 sched_yield",
  "man 2 sched_setaffinity",
]
fixture = "fixture:scheduler_preemption"
scale_points = [1, 8, 32, 128]
rationale = "Eligible syscall-free tasks rotate under a finite execution budget; affinity and thread identity remain exact."

[bindings]
vm_free = "carrick-kernel-example::scheduler_progress_contract; carrick-kernel::kernel::scheduler::tests::{a_deferred_zone_handback_does_not_audit_a_reaped_target,zone_handback_authenticates_the_registered_continuation,zone_handback_before_registration_kicks_the_running_owner_once} (zone delivery target authentication, retired no-op, and one kick/zero queue rows before enrollment; no new preemption-policy or runtime-cost acceptance)"
embed = "carrick-embed::scheduler_progress_contract"
docker = "fixture:scheduler_preemption"
ecosystem = ["go:runtime", "cpython:threading"]

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 0
per_unit = 1
rationale = "Each runnable task receives at least one dispatch in a rotation round."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20
