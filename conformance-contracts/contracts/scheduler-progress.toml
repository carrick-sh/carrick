schema_version = 1
id = "kernel.scheduler.runnable-progress"
title = "Runnable scheduler affinity and preemption progress"
guest_surfaces = ["syscall:sched_setaffinity", "syscall:sched_getaffinity", "scheduler:preemption", "scheduler:rotation", "scheduler:executor-pool"]
semantic_authority = [
  "man 7 sched",
  "man 2 sched_yield",
  "man 2 sched_setaffinity: a thread running on a CPU excluded by the new mask migrates to an allowed CPU before the call returns",
  "man 2 sched_setaffinity: pid specifies an exact thread; zero specifies the calling thread",
]
fixture = "fixture:scheduler_preemption"
scale_points = [1, 8, 32, 128]
rationale = "Eligible syscall-free tasks rotate under a finite execution budget; affinity and thread identity remain exact. Set/getaffinity name the exact TaskKey and ThreadKey incarnation, including sibling threads and other guest processes; only the named mask changes. Host scheduler claims cannot enter an excluded CPU, including a mask change between queue placement, claim, and backend load. An excluded host-running residency receives an exact executor kick without queue demand, timer advance, or a syscall, then migrates before its next guest entry. Widening, unrelated tasks, and retired exec predecessors require zero kicks; exec successors inherit the kick capability. Guest-switched tasks which are host-Blocked and guest-OnCpu remain outside this host-scheduler binding, sequenced after the N1 owner cutover. Pool admission must reject bound-worker capacity below the scheduler CPU count before publishing any preemption driver, resolver or worker; spare workers cannot cover missing bound CPUs and the policy must not be silently clamped."

[bindings]
vm_free = "carrick-runtime::vcpu_loop::executor::tests::{insufficient_bound_workers_cannot_strand_a_pinned_task,pool_admission_covers_overrides_ceilings_reserves_and_small_hosts} (pool admission: zero worker creations and no driver/resolver publication on refusal; bounded CPU-3 strand witness with two workers/four CPUs; highest-CPU execution on valid and corrected topologies); carrick-kernel-example::scheduler_affinity::{sibling_setaffinity_changes_only_the_named_thread,other_process_setaffinity_changes_only_the_named_thread,getaffinity_reads_the_named_thread_including_the_leader_from_a_sibling,affinity_errors_leave_both_masks_unchanged,affinity_permission_uses_the_named_threads_credentials}; carrick-kernel-example::scheduler_handoff::{queued_affinity_change_requires_migration_before_claim,remote_affinity_exclusion_kicks_the_exact_running_thread,self_affinity_change_requires_migration_before_return} (two live processes or threads, no timer advance, one exact kick and migration, zero unrelated or widening kicks); carrick-runtime::vcpu_loop::executor::tests::{self_affinity_syscall_migrates_before_the_next_guest_entry,remote_affinity_change_migrates_a_compute_task_without_a_tick_or_syscall,affinity_change_after_claim_migrates_before_the_first_guest_entry,exec_replacement_keeps_worker_identity_and_swaps_thread_mm_asid_binding} (zero excluded entries, exact exec successor capability and retired predecessor no-op); carrick-kernel-example::scheduler_progress_contract; carrick-kernel::kernel::scheduler::tests::{a_deferred_zone_handback_does_not_audit_a_reaped_target,zone_handback_authenticates_the_registered_continuation,zone_handback_before_registration_kicks_the_running_owner_once} (zone delivery target authentication, retired no-op, and one kick/zero queue rows before enrollment; no new preemption-policy or runtime-cost acceptance); carrick-kernel::kernel::scheduler::tests::serial_host::failed_zone_load_settlement_retires_only_its_owned_continuation (test-only extension: exact continuation transfer and failed-load retirement, zero queued rows after failure/stale delivery; no new preemption, scaling or runtime-ratio acceptance); carrick-core::x86_acceleration::x3_shared_protocol (orders 3a/3b components only: both descriptor ISAs at 16/64/256 pages, exact grant generation and rollback; 4 KiB/16 KiB backing, logical leaf references and pin-before-return; dirty-load closure/drain, stale invalidation refusal, exact root nonce, failed arena retirement quarantine, and 20000-mapping retirement receipt authentication; no signed physical mapping census, production pool-exhaustion, exec/clear-tid or order-4 wait acceptance)"
embed = "carrick-conformance-next::scheduler_affinity::cross_thread_affinity_changes_only_the_named_thread (both libcs, both querying threads, unchanged caller, numeric errnos); carrick-embed::scheduler_progress_contract; carrick-embed::el1_sched::el1_sched_futex_handoff_after_self_affinity_change (inherited CPU-1 start, both futex partners request CPU 0; zero cross-vCPU wakes and at least 5000 in-guest switches)"
docker = "probe:schedaffinitysibling; fixture:scheduler_preemption"
ecosystem = ["go:runtime", "cpython:threading"]

[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 0
per_unit = 1
rationale = "Each runnable task receives at least one dispatch in a rotation round."

[runtime_ratio]
maximum = 2.0
statistic = "p50"
minimum_samples = 20

[bindings.unresolved]
x86_cpl0 = "Order 3 custody components now have a VM-free binding. Exact in-CPL0 X3 remains pending order 4, release-before-enroll, default-pool exhaustion and exec/clear-tid; no KVM or signed acceptance is conferred."
