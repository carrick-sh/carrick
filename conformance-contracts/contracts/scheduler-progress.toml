  "carrick-core::x86_acceleration::x3_shared_protocol (orders 3a/3b components only: both descriptor ISAs at 16/64/256 pages, exact grant generation and rollback; 4 KiB/16 KiB backing, logical leaf references and pin-before-return; dirty-load closure/drain, stale invalidation refusal, exact root nonce, failed arena retirement quarantine, and 20000-mapping retirement receipt authentication; no signed physical mapping census, production pool-exhaustion, exec/clear-tid or order-4 wait acceptance)",
  "carrick-el1-linux::aarch64_process_tests::native_child_handoff_tests::arm_native_wait_runs_ready_child_before_host_handoff (accepted loan aliases survive guest initialization, inherited CPU-0 mask and real child handoff)",
