# #1394: additional ABI bookkeeping witness only; existing semantic and
# work-budget bindings remain authoritative. Census publication reads counters
# after executor join and does not alter this contract's guest operation.
schema_version = 1
id = "kernel.el1.ipc-two-process"
title = "Two-process blocking pipe and eventfd IPC is served and parked in the guest"
guest_surfaces = [
  "syscall:read",
  "syscall:readv",
  "syscall:write",
  "syscall:writev",
  "syscall:eventfd2",
  "syscall:pipe2",
  "syscall:clone",
  "syscall:kill",
  "syscall:epoll_pwait",
  "kernel:continuation",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 readv and native Linux oracle: buffers are filled in array order; a scatter fault leaves the incomplete pipe buffer unread while earlier complete buffers remain consumed; imported headers and the committed byte cursor belong to the retained operation",
  "man 2 writev: vectors are consumed in order as one write; pipe atomicity applies to their aggregate length, and imported vector headers survive suspension",
  "man 2 pipe / man 7 pipe: a read on an empty pipe with a live writer blocks until data is written, and returns EOF after every writer closes; writes of at most PIPE_BUF bytes are atomic",
  "man 2 eventfd: a read blocks while the counter is zero and returns the counter value once it is nonzero",
  "man 2 fork: parent and child hold independent descriptor tables over the same open descriptions",
  "man 7 signal / man 2 read: a caught signal interrupts a blocked pipe read with EINTR (4), or the read restarts after the handler under SA_RESTART; transferred bytes are returned",
  "man 7 signal / man 2 epoll_wait: an interrupted epoll wait returns EINTR regardless of SA_RESTART",
]
fixture = "embed:el1-sched ipc-processes pipe|eventfd 1|8|64 128"
scale_points = [1, 8, 64]
rationale = "Request/response IPC between forked processes (`pairs` concurrent pairs, 128 rounds each) must be carried by the in-guest scheduler: each read and write is served at EL1, and a read that would block parks the thread in the guest and is woken by the peer's write without a host exit. `el1_ipc_two_processes_blocking` asserts, per kind and pair count, served read[63] and write[64] each at least 2 * pairs * rounds, at least pairs * rounds guest parks, and fewer forwarded reads than pairs * rounds (a continuation that fell back forwards one read per round). Forwarding every blocking read instead would cost one host park and wake per round, growing with the loop."

[bindings]
vm_free = [
  "carrick-el1-abi::ipc::tests::{pending_pipe_pair_publishes_after_copyout_and_forks_exact_endpoints,pending_pipe_pair_copy_fault_cancels_claims_without_closing_reused_numbers,pending_pipe_pair_publication_busy_once_retains_both_endpoints,pending_pipe_pair_finish_object_busy_keeps_release_custody,pending_pipe_pair_partial_ofd_preparation_cancels_both_object_references,pending_pipe_pair_retired_namespace_cannot_redirect_cancel_to_reused_table,pending_pipe_pair_resume_uses_current_execution_holder,pending_pipe_pair_foreign_view_refuses_before_custody_changes,pending_pipe_pair_publication_uses_current_descriptor_ceiling}",
  "carrick-el1-abi::ipc_window::tests::{ipc_binding_refuses_zero_carrier_identity,ipc_binding_refuses_each_unaligned_address_and_wrong_length,ipc_binding_derives_x86_table_map_from_its_region} (typed geometry admission only; does not prove guest venue construction or publication)",
  "carrick-el1-linux::ipc::tests::native_final_pipe_pin_release_uses_execution_transport (public transfer entry retains a reader pin across descriptor close and park refusal; native retirement drops the final endpoint and delivers its wake through the execution transport)",
  "carrick-el1-abi::ipc::tests::{ring_pipe_creation_is_backed_before_publication,ring_pipe_creation_reuses_or_returns_retained_storage,ring_pipe_creation_rejects_bad_storage_without_spending_the_record,ring_pipe_creation_refuses_overlap_and_preserves_retained_storage} (shared backed object construction: immediate exact-once transfer, retained extent reuse, displaced extent ownership and failure rollback; not descriptor publication or x86 execution)",
  "carrick-el1-linux::ipc::tests::{el1_ipc_readv_without_native_custody_declines_before_effects,el1_ipc_readv_scatters_and_consumes_each_byte_once,el1_ipc_readv_payload_fault_preserves_the_incomplete_pipe_buffer,two_live_process_pipe_readv_owner_wait_retains_headers_and_cursor,two_live_process_pipe_readv_owner_wait_returns_prefix_if_peer_drains} (shared scatter transfer: ordered output, exact-once consumption, retained headers and cursor through owner wait, disjoint live MMs)",
  "carrick-el1-linux::native_process_runtime::host_test_support::portal_wait_terminal_cancellation_resumes_exact_native_service_waiter (portal service cancellation component: caught-signal interruption retains committed CarrierWork; typed terminal cancellation detaches its exact enrolled portal queue, resumes the waiter and preserves completed result 65; outside the scalar IPC fence)",
  "carrick-el1-linux::ipc::tests::ipc_operation_completion_uses_execution_transport (production transfer completion delivers the operation-slot release through its exact execution transport)",
  "carrick-sched-core::spaces::notification::tests::actual_gate_refusal_during_final_release_cannot_park_after_it (#1773: shared notification publication preserves exact operation custody and prevents a stranded scheduler record after final release; no change to queue delivery, IPC semantics or handback identity)",
  "carrick-el1-linux::ipc::tests::{ipc_operation_slot_native_finish_and_retire_publish,ipc_operation_slot_epoll_retry_publishes} (independent production native completion, exec/exit retirement and epoll Retry release publications)",
  "carrick-kernel::kernel::continuation::ipc::tests::serial_host_zone_operation_slot_release_reaches_bound_source (carrier source binding followed by production host finish and ZoneHostServices release; exact epoch and stale retry)",
  "carrick-el1-linux::ipc::tests::ipc_operation_slot_busy_once_then_success (full shared operation arena; real retirement wakes an enrolled scheduler record and admits the unchanged operation)",
  "carrick-sched-core::object_wait::host_tests::{ipc_operation_slot_source_is_bound_before_admission,ipc_operation_slot_release_under_queue_contention_is_delivered_once,ipc_operation_slot_release_before_enrollment_cannot_park_stale_probe} (source bound before publication; no source-admission Busy; durable release under a held queue; original operation identity retained)",
  "carrick-kernel::kernel::continuation::ipc::tests::el1_ipc_host_finish_publishes_operation_slot_release_once (host retirement publishes once; stale retry publishes nothing)",
  "carrick-el1-abi::ipc::tests::el1_ipc_operation_release_only_follows_a_reusable_slot_push (publication after free-list visibility; no publication for stale tokens or generation quarantine)",
  "carrick-el1-linux::aarch64_process_tests::native_ipc_wake_tests::{serial_host_two_native_children_pipe_eof_wake_without_a_guest_executor,serial_host_two_native_children_pipe_eof_wake_with_the_executor_away,serial_host_two_native_children_pipe_signal_with_the_executor_away,serial_host_two_native_children_pipe_signal_sa_restart_with_the_executor_away,serial_host_two_native_children_pipe_signal_without_executor_release,serial_host_two_native_children_pipe_signal_before_enrollment,serial_host_two_native_children_timed_epoll_signal_never_restarts,serial_host_two_native_children_pipe_partial_read_preserves_committed_byte,serial_host_two_native_children_pipe_signal_races_peer_eof_exactly_once,serial_host_deliverable_signal_does_not_cancel_mm_edit_conflict} (IPC cases: production forks and descriptor custody, two reader children and a sender on a separate live driver; exactly two parks, exact token retention and one publication, EINTR/handler frames, decoded SA_RESTART read completing after peer write, committed-byte preservation, and bounded peer EOF race; separate MM fence: one registered native root retains its prepared-edit conflict park and operation across a deliverable signal until transfer-owner release; no signed instruction or throughput claim)",
  "carrick-kernel::kernel::scheduler::tests::{enqueuing_onto_a_busy_cpu_wakes_one_guest_idle_stealer_and_propagates,releasing_a_zone_row_onto_a_busy_cpu_wakes_a_guest_idle_stealer,releasing_a_handoff_with_a_row_already_host_queued_wakes_a_guest_idle_stealer} (host fallback wake reachability and exactly-one chain only; no new in-guest IPC semantics or throughput acceptance)",
  "carrick-el1-abi::refusal_census_tests::refusal_snapshot_preserves_caller_populations_without_changing_service_counts",
  "carrick-el1-linux::ipc::tests::{el1_ipc_writev_invalid_payload_range_has_no_pipe_effects,el1_ipc_writev_preserves_vector_order_on_a_pipe,el1_ipc_writev_park_retains_imported_headers_and_exact_progress,el1_ipc_writev_atomic_admission_and_import_failure_reclaim_storage}",
  "carrick-el1-abi::ipc::tests::imported_vectors_scale_and_reclaim_with_the_operation_slot",
  "carrick-el1-abi::ipc::vectors::publication_tests::vector_custody_publishes_initialized_headers (Loom executes production custody publication and acquisition)",
  "carrick-el1-linux::ipc::tests::el1_ipc_writev_header_first_touch_retries_through_dispatch",
  "carrick-kernel::kernel::continuation::ipc::tests::el1_ipc_vector_handback_preserves_short_prefix_at_vector_boundary",
  "carrick-personality-linux::dispatch::ring_first_tests::x86_writev_remains_counted_enosys_under_strict_ring_first",
  "carrick-kernel::kernel::continuation::ipc::tests::el1_ipc_vector_handback_prefetch_preserves_imported_order_and_reclaims_storage",
  "carrick-el1-linux::aarch64_process_tests::native_exec_pipe_tests::serial_host_native_fork_exec_pipe_writer_reaches_its_parent",
  "carrick-personality-linux::dispatch::ring_first_tests::writev_dispatches_through_the_ipc_writer_without_scalar_file_fallback",
]
# #1507: imported pipe writev uses the existing owned pipe operation.
# The VM-free bounds are zero host calls and reclamation to the exact
# pre-import allocation count after completion or failure.
embed = [
  "carrick-embed::el1_sched::el1_ipc_two_processes_blocking",
]

[bindings.unresolved]
docker = "Linux semantics of pipe and eventfd blocking are fixed by man pages; the fixture checks the completed round count itself. Same-source Docker differential binding remains open."
x86_kvm = "#1756 red-first fixture: carrick-vmm-kvm::cpl0_initial_mm::in_zone_two_process_pipe_vectors_move_bytes_exactly_once is ignored until the shared venue is wired. Native Linux runs the same native_pipe_vectors.S and returns exit 0 with pipe-vectors=once. The fixture now asserts served/refusal census and has an independent non-venue writev refusal witness; the production venue and a passing served witness are still absent. Native assembly tests aggregate vector order, EAGAIN (11) after exactly one transfer and EOF after last writer close."
embed_structural = "Not yet a registered WorkObservation binding: the signed test asserts served[63]/[64] >= 2*pairs*rounds, zero-fallback parks >= pairs*rounds, and forwarded read[63] < pairs*rounds outside the contract evaluator. Native scalar pipe signal/SA_RESTART execution and timed-epoll signal integration remain director-owned signed acceptance; the VM-free signal-frame witness does not execute guest handler instructions."

# Integer-expressible form of "forwarded reads < rounds per pair": every scale
# unit is one pair, and the fixture may forward fewer than `rounds` (128) reads
# per pair, so host dispatches for one pair stay below that plus a fixed
# start-up base. Served lower bounds and parks are asserted by the embed test.
[[structural_budgets]]
kind = "affine"
metric = "kernel_dispatches"
base = 512
per_unit = 127
layers = ["embed-structural"]
rationale = "Forwarded reads stay below pairs * rounds (127 per pair for 128 rounds, plus fixed scaffolding for fork, thread start and join): blocking reads are parked and woken in the guest instead of forwarded per round. The per-pair coefficient is an upper bound on the dispatch population the test's forwarded-read assertion admits, not an allowance for the writes, which are served at EL1."
