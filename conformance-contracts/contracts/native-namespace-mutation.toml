schema_version = 1
id = "kernel.native.namespace-mutation"
title = "Native descendants retain ownership of host namespace mutations"
guest_surfaces = ["syscall:mkdirat", "syscall:unlinkat", "syscall:renameat", "syscall:symlinkat", "syscall:readlinkat", "syscall:fchmodat"]
semantic_authority = ["man 2 mkdirat", "man 2 unlinkat", "man 2 renameat", "man 2 symlinkat", "man 2 readlinkat", "man 2 fchmodat"]
fixture = "unit:native_namespace_mutation_baseline_two_live_children"
scale_points = [1, 2]
structural_budgets = []
rationale = "A native child has no host task. Typed operations must retain its exact task, execution, file-table generation, fs context and credentials. One admitted operation may commit at most one mutation and one terminal reply, with zero effects before admission. Busy retains that same operation on the existing release notification. Slice 1 measures the missing service: each of two real fork children receives errno 38 once per ordinal, counted once as served and refused in the descendant ring population, with zero carrier refusals and no carrier notice. Those assertions describe a defect baseline, not Linux conformance or a numerical budget for a future implementation."

[bindings]
vm_free = [
  "carrick-el1-linux::aarch64_process_tests::native_child_handoff_tests::native_namespace_mutation_baseline_two_live_children",
  "carrick-el1-linux::native_process_runtime::host_test_support::native_namespace_mutation_baseline_exec_successor (six namespace refusals after successful real owner exec adoption, then exit/reap and slot reuse)",
  "carrick-el1-linux::dispatch::tests::native_fork_child_unclaimed_syscall_is_refused_before_any_crossing (negative control remains authoritative for genuinely unclaimed calls)",
]

[bindings.unresolved]
semantics = "Baseline only: all six ordinals return errno 38. Slice 2 must first assert successful mkdirat through this production entry and retain its red result, then add the typed service. No mutation is implemented by slice 1."
exec_successor = "The successful exec binding uses the shared VM-free x86 process owner and production dispatcher with an ARM syscall frame; real ELF execution and ARM hardware MM installation remain signed evidence."
embed = "Director Mac reference: fork-child mkdirat, unlinkat, renameat, symlinkat, readlinkat and fchmodat return ENOSYS; statx, getdents64, openat O_CREAT and write work. This worker has not repeated the signed observation."
embed_structural = "No registered signed WorkObservation binding measures namespace mutation work yet. The VM-free refusal census is a defect baseline, not signed structural evidence; exact-artifact signed population and venue attribution remain director-owned."
docker = "Native ARM Docker differential and pinned image identity remain director-owned."
ecosystem = "The production carrick run MKDIR-OK/LS-OK regression and smoke/full promotion remain slice 4 and director work."
observation = "The VM-free counters prove attempted/completed/refused populations for this fixture only, not the signed workload census or carrier service success."
