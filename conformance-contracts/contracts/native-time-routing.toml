[bindings.unresolved]
vm_free = "Successful realtime read, x86 entry binding, retained copy, sleep continuation and timex state remain unimplemented. Null-pointer routing evidence alone does not satisfy #1808."
embed_structural = "UNRUN: retained clock-output and sleep work meters have no signed binding yet."
embed = "UNRUN (director): original pipeline syscall census, signed pipeline reproduction and paired signed populations."
