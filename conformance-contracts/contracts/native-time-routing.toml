schema_version = 1
id = "kernel.time.native-routing"
title = "Native fork children reach the shared time service"
guest_surfaces = ["syscall:clock_gettime", "syscall:clock_adjtime", "syscall:adjtimex", "syscall:nanosleep", "syscall:clock_nanosleep"]
semantic_authority = ["man 2 clock_gettime", "man 2 clock_adjtime", "man 2 adjtimex", "man 2 nanosleep", "man 2 clock_nanosleep", "native Linux x86_64 null-pointer syscall oracle"]
fixture = "native-fork-child-time-handler"
scale_points = [2]
structural_budgets = []
rationale = "One production native fork leaves the parent and child alive with distinct MMs. Each child call must reach time argument validation, returning EFAULT for null pointers and counting zero ENOSYS refusals. Child nanosleep/clock_nanosleep sleep in ring on the signal wait owner: with the exec leader parked in a timed futex, the sleeping clone parks, keeps its original deadline across executor departure, expires once, and EINTR writes rem; an expired absolute deadline or a zero interval returns 0 without a timer lease. The run root keeps its host sleep. This does not prove successful clock reads, timex sharing, work scaling or runtime ratios. See docs/conformance-contracts/native-time-routing.md."

