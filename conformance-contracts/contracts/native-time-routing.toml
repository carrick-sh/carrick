structural_budgets = []
rationale = "One production native fork leaves the parent and child alive with distinct MMs. Routed child sleep calls must reach time argument validation, returning EFAULT for a null request and counting zero ENOSYS refusals. Child nanosleep/clock_nanosleep sleep in ring on the signal wait owner: with the exec leader parked in a timed futex, the sleeping clone parks, keeps its original deadline across executor departure, expires once, and EINTR writes rem as a retained output (lazy page prepared, Busy once retained); an expired absolute deadline or a zero interval returns 0 without a timer lease. A resumed sleep is one complete decision: a deadline crossing between its checks re-parks and returns 0, never EAGAIN; a signal published after its empty check returns EINTR with rem. Clocks and flags follow Linux errno numbers; absolute REALTIME/TAI deadlines (#1981), clocks the ring cannot measure, and x86 absolute BOOTTIME deadlines keep the counted ENOSYS refusal. x86 absolute MONOTONIC uses the same zero-offset guest TSC epoch as the vDSO and raw syscall. The run root keeps its host sleep. The resolution query accepts a null destination for a valid clock or copies one timespec to the caller's MM, with no host syscall. An invalid clock returns EINVAL. clock_gettime serves every clock id in ring (#2028), classified once by carrick-syscall-abi's linux_clock_read for the host dispatcher and both ring entries: an unknown id, a posix-clock fd (carrick has none) and an invalid CPUCLOCK_WHICH are EINVAL before the output is touched, and a valid clock faults a null output with EFAULT (native Linux 6.12 x86_64 errno probe); clockid_t is a C int, so the register's upper half is ignored. CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, CLOCK_BOOTTIME and CLOCK_BOOTTIME_ALARM in ring use the guest counter (the vDSO's epoch: a guest does not suspend apart from its counter) and the same retained timespec output path; CLOCK_MONOTONIC_COARSE is that counter on the 1 ms coarse grid. CLOCK_REALTIME_ALARM and CLOCK_TAI read the realtime calibration (TAI offset 0, Linux's default). The caller's CPU clocks are served by static id and by dynamic id naming pid 0, its own pid or its own tid (PROF or SCHED); another task's CPU clock and a user-time-only (VIRT) clock keep the counted ENOSYS refusal. The ARM VM-free binding validates its descendant route with a null output. The KVM binding samples through writable outputs in both the native root and fork child. Realtime reads sample the ring counter and add the carrier's zone-published realtime calibration, never reading user memory; every container clock change republishes that calibration before it returns: the offset has one writer (GuestRealtime::commit) that stores, bumps the vvar epoch and republishes. Guest clock_settime and settimeofday return ENOSYS on x86 today (#2700), so no guest set can move the clock yet. The KVM bindings cover raw root realtime, survival after unmapping the user vvar page, bracketing realtime vDSO results with raw samples, coarse rounding, and preserving the realtime-to-monotonic offset across fork and exec. The gettimeofday and x86 time aliases reuse the same calibrated sample and retain the result and optional outputs across owner waits. The bindings do not prove timex sharing, work scaling or runtime ratios. See docs/conformance-contracts/native-time-routing.md."

