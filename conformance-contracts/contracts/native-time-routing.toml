schema_version = 1
id = "kernel.time.native-routing"
title = "Native fork children reach the shared time service"
guest_surfaces = ["syscall:clock_gettime", "syscall:clock_getres", "syscall:gettimeofday", "syscall:time", "syscall:times", "syscall:clock_adjtime", "syscall:adjtimex", "syscall:nanosleep", "syscall:clock_nanosleep"]
