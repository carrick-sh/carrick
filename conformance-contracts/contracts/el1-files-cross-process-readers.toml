schema_version = 1
id = "kernel.el1.files.cross-process-readers"
title = "EL1 serves a thread's fds only through that thread's own file table"
guest_surfaces = [
  "syscall:openat",
  "syscall:read",
  "syscall:pread64",
  "syscall:write",
  "syscall:close",
  "syscall:clone",
  "syscall:wait4",
  "vmm:hvf",
]
semantic_authority = [
  "man 2 open",
  "man 2 read",
  "man 2 pread64",
  "man 2 write",
  "man 2 fork",
  "man 7 credentials",
]
fixture = "probe:el1_files_cross_process_readers"
scale_points = [4]
structural_budgets = []
rationale = "A file descriptor number means an open file description in the calling process's file table only (open(2); fork(2) gives each process its own table). EL1 resolves an fd through the file table named by its vCPU's current-task record, so that record may name only the thread loaded on the vCPU that leases the record's mailbox slot, or nobody (EL1 then forwards, costing one host boundary). M:N reclaim and fork rebuild move a running thread's vCPU to a fresh mailbox lease while another vCPU takes the old slot: a slot number cached across that move, or a record that outlived or predated its lease, made EL1 serve one process's reads and writes with another process's files. go build read wrong GOROOT sources and cache archives (\"package statement must be first\", \"not the start of an archive file\"), and the fixture saw wrong bytes, early EOFs and EBADF writes. The record's lifetime is the lease's (empty when the lease begins and ends), and the executor derives the slot from its vCPU's live lease at every publish and clear. A fresh root-owned read destination also remains a valid Linux buffer before its first touch: prevalidation asks its exact MM for current access intent, and actual copyout obtains or commits backing through the same revalidated EL1 grant service, rather than requiring a host VMA or returning EFAULT for missing host provenance."

[bindings]
vm_free = "carrick-vmm-hvf::trap::sparse_materialization::tests::{frame_grant_backend_accepts_copyout_without_a_mailbox_claim,partial_frame_grant_keeps_authenticated_predecessor_fragments,a_live_physical_owner_without_an_mm_alias_is_not_a_grant_predecessor}; carrick-vmm-hvf::syscall_mailbox::tests::a_mailbox_lease_owns_its_el1_current_task_record; carrick-aarch64::engine::tests::{lazy_root_copyout_prevalidation_needs_no_host_mapping,prepared_root_copyout_prevalidation_keeps_the_leaf_permission_ceiling,host_copyout_asks_the_grant_service_once_per_absent_run}; carrick-kernel::dispatch::mem::delegated_tests::delegated_host_copyout_is_one_root_grant_per_run"
