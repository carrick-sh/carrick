# PR-scoped retired or renamed gated tests (docs/ci/mac-hvf-runner.md#retiring-or-renaming-gated-tests-githubretired-teststoml).

[[retired]]
test = "carrick_el1_linux::native_process_runtime::host_test_support::native_child_exec_after_ring_setuid_is_refused_before_service"
reason = "#1392: a child's exec after a ring setuid is now served with the child's own credentials instead of refused, so the refusal witness became a credential-carrying witness."
replaced_by = "carrick_el1_linux::native_process_runtime::host_test_support::native_child_exec_after_ring_setuid_carries_the_new_credentials"
pr = 1409

[[retired]]
test = "carrick_el1_linux::native_process_runtime::host_test_support::portal_wait_cancellation_resumes_exact_native_service_waiter"
reason = "#1691: carrier-work cancellation and terminal cancellation now resume a parked native service waiter differently (nonterminal interruption leaves CarrierWork parked), so the witness was split and renamed to name the terminal case it proves (d0ddf25d2e)."
replaced_by = "carrick_el1_linux::native_process_runtime::host_test_support::portal_wait_terminal_cancellation_resumes_exact_native_service_waiter"
pr = 1701

[[retired]]
test = "carrick_el1_linux::ipc::tests::el1_ipc_io_first_write_to_an_unbacked_pipe_forwards_before_effects"
reason = "#1506: native-child pipe2 is now served in ring with owned descriptor publication, so the first write to an unbacked pipe supplies shared storage (or returns ENOMEM) instead of forwarding; the witness was renamed for what it proves (ae515b5b91)."
replaced_by = "carrick_el1_linux::ipc::tests::el1_ipc_io_first_write_supplies_shared_storage_or_returns_enomem"
pr = 1740

[[retired]]
test = "carrick_el1_linux::sched::tests::timed_waits_this_vcpu_cannot_keep_forward"
reason = "#1894: a switched-in thread's timed wait is now served in ring on its own timer lease (`timed_wait_allowed` no longer forwards when the thread is not the vCPU's host record), so the forwarding witness became a witness that the wait times out in ring with ETIMEDOUT and consumes its lease; the invalid-timespec refusal is still asserted in the same test."
replaced_by = "carrick_el1_linux::sched::tests::switched_in_timed_wait_uses_its_own_timer_lease"
pr = 1894

[[retired]]
test = "cpl0_initial_mm::in_zone_child_host_read_is_refused_not_served_under_root_context"
reason = "#2157 B0: an x86 fork child's unstaged crossing is now answered in ring with a counted ENOSYS, like ARM, instead of being refused for its host task context, so the witness was renamed for what it proves (d79573dd4)."
replaced_by = "main::cpl0_initial_mm::in_zone_child_host_read_is_counted_enosys_not_served_under_root_context"
pr = 2167

[[retired]]
test = "cpl0_initial_mm::in_zone_child_pipe_write_without_ipc_execution_is_counted_enosys_in_ring"
reason = "#1671: an in-zone child's pipe write on x86 CPL0 is now served through the shared IPC owner instead of returning a counted ENOSYS, so the refusal witness became a witness that the write is served (9968c4138)."
replaced_by = "main::cpl0_initial_mm::in_zone_child_pipe_write_uses_shared_ipc_execution"
pr = 2153

[[retired]]
test = "x86_production_forward::x86_child_exec_is_staged_then_counted_enosys"
reason = "#2273: x86 fork-child exec now serves the staged payload through the native owner, so the counted-ENOSYS witness became a payload-staging and fault witness."
replaced_by = "x86_production_forward::x86_child_exec_stages_its_payload_or_faults"
pr = 2273

[[retired]]
test = "carrick_el1_linux::native_process_runtime::host_test_support::x86_native_exec_completion_stages_the_fork_child_and_refuses_the_root"
reason = "#2273: native exec completion now claims the x86 fork child for service instead of only staging it; root exec remains refused."
replaced_by = "carrick_el1_linux::native_process_runtime::host_test_support::x86_native_exec_completion_claims_the_fork_child_and_refuses_the_root"
pr = 2273

[[retired]]
test = "carrick_el1_linux::native_fork_refusal::tests::parent_gate_refusal_preserves_observed_state_and_busy_policy"
reason = "#2306: contention at the parent gate now parks via NativeContention instead of returning an errno, so the Busy-policy errno witness was replaced by one that asserts the observed state is preserved as contention."
