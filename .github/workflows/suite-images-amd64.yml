name: Suite images (amd64)

# Builds the linux/amd64 OCI archives the language-suite census needs
# (#1837, plan in #2596): docker/cpython-test, docker/go-conformance
# (GOARCH=amd64) and docker/nodejs-conformance. It runs on a hosted
# ubuntu-latest runner (native amd64), so no shared Carrick host and no
# Docker-only window is involved. Nothing is pushed to a registry: consumers
# check SHA256SUMS and import each archive into their local fixture registry
# with `skopeo copy --preserve-digests oci-archive:<file> docker://<tag>`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the dispatched ref)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: suite-images-amd64-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build linux/amd64 suite images
    runs-on: ubuntu-latest
    # Node 24 and Node 26 compile from source inside the image.
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Free runner disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      # Digest pins from #2596 (comment 7026042183), applied here only: the
      # Dockerfile pin change lands in its own PR.
      - name: Apply base image digest pins
        run: |
          set -euo pipefail
          sed -i 's/sha256:1cdca4a722dc7efb5f63c002a0bcf458e99cb1cbbe04d92493438f24642ba700/sha256:dd4fe98ab39f91e936f8e7e7a65a3ce59ecfb11e32f9a125b3132779920ba7f7/' docker/cpython-test/Dockerfile
          sed -i 's|^FROM golang:1.24-bookworm$|FROM golang:1.24-bookworm@sha256:1a6d4452c65dea36aac2e2d606b01b4a029ec90cc1ae53890540ce6173ea77ac|' docker/go-conformance/Dockerfile
          grep -q 'sha256:dd4fe98ab39f91e936f8e7e7a65a3ce59ecfb11e32f9a125b3132779920ba7f7' docker/cpython-test/Dockerfile
          grep -q '^FROM golang:1.24-bookworm@sha256:1a6d4452c65dea36aac2e2d606b01b4a029ec90cc1ae53890540ce6173ea77ac$' docker/go-conformance/Dockerfile
          git diff -- docker/cpython-test/Dockerfile docker/go-conformance/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check skopeo
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          skopeo --version

      - name: Build OCI archives
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/suiteboard-amd64"
          mkdir -p "$bundle"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"

          build() {
            local name="$1" context="$2"
            shift 2
            echo "::group::build $name"
            if ! docker buildx build --platform linux/amd64 --provenance=false \
                "$@" --output "type=oci,dest=$bundle/$name.oci.tar" "$context" \
                > "$bundle/$name-build.log" 2>&1; then
              echo "::error::$name build failed; see $name-build.log in the artifact"
              cat "$bundle/$name-build.log"
              echo "::endgroup::"
              return 1
            fi
            echo "::endgroup::"
            docker buildx prune --all --force > /dev/null
            ls -l "$bundle/$name.oci.tar"
            df -h /
          }

          build cpython docker/cpython-test
          build go docker/go-conformance --build-arg GOARCH=amd64
          build node docker/nodejs-conformance

      - name: Record digests and checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          cd "$BUNDLE"
          {
            echo "# linux/amd64 suite image digests"
            echo "# source ref: $SOURCE_REF"
            echo "# source commit: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "# workflow commit: $SOURCE_SHA"
            echo "# archive  tag  digest"
            for entry in \
                cpython:localhost:5050/cpython-test:3.12.13 \
                go:localhost:5005/carrick-go-conformance:1.24 \
                node:localhost:5005/carrick-nodejs-conformance:24.16.0-26.2.0; do
              name="${entry%%:*}"
              tag="${entry#*:}"
              digest="$(skopeo inspect --format '{{.Digest}}' "oci-archive:$name.oci.tar")"
              case "$digest" in sha256:*) ;; *) echo "::error::bad digest for $name: $digest"; exit 1 ;; esac
              echo "$name.oci.tar $tag $digest"
            done
          } > suiteboard-amd64-digests.txt
          sha256sum cpython.oci.tar go.oci.tar node.oci.tar suiteboard-amd64-digests.txt > SHA256SUMS
          cat suiteboard-amd64-digests.txt SHA256SUMS
          {
            echo '```'
            cat suiteboard-amd64-digests.txt
            echo
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archives
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suiteboard-amd64
          path: ${{ env.BUNDLE }}
          retention-days: 14
          # The OCI layers are already compressed.
          compression-level: 0
          if-no-files-found: error
