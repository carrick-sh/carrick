# A separate workflow file is required because a same-named job inside a workflow
# that also runs on merge_group would be skipped there, and a skipped required
# check counts as passing.
#
# Having this placeholder trigger only on pull_request ensures pull requests
# satisfy the check name while post-landing pushes to main evaluate it on real
# hardware via .github/workflows/kernel-runtime.yml.

name: Trusted hardware (PR placeholder)

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  trusted-hardware-ok:
    name: Trusted hardware OK
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Trusted hardware lanes (HVF signed + KVM) run post-landing on push to main and owner dispatch: .github/workflows/kernel-runtime.yml. This placeholder lets a pull request satisfy the check name."
