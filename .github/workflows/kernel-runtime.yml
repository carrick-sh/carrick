name: Kernel runtime · trusted hardware

# Per landed commit (push to main): the exact-SHA signed fixture bundle
# (`signed-fixtures`, which every merge group's `base-fixtures` job downloads),
# the KVM and EL1-native lanes and their receipt gates. The cloudmac HVF lane
# (`hvf-kernel`, `hvf-closure`) is too expensive for every push, so it runs
# nightly (`schedule`, 09:00 UTC) and on an owner-triggered dispatch on main
# (owner decision, #2057); per-merge HVF attribution comes from each merge
# group's own Signed queue gate. There is no pull_request trigger: the
# persistent HVF runner (`carrick-hvf`), the standing KVM controller
# (`carrick-xtask ci-scaler standing`), and each runner's job-start hook admit
# only push, schedule (on main) and owner dispatch for this workflow file
# (docs/ci/mac-hvf-runner.md, docs/ci/willow-pilot.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Scoreboard-only mode (#2251): an owner dispatch ON MAIN that names a
    # same-repository branch and its exact head SHA builds that commit,
    # signed, on the HVF runner and scores it with the goal scoreboard.
    # Every other lane, receipt, fixture, baseline and the #231 post is
    # skipped. The workflow file and its guards always come from main, so the
    # runner group pin (`kernel-runtime.yml@refs/heads/main`) and the
    # job-start `admit-job` hook admit it unchanged. A `--ref <branch>`
    # dispatch is still refused before any step runs.
    inputs:
      scoreboard_branch:
        description: "Scoreboard only: same-repository branch to build and score (empty = full main dispatch)"
        type: string
        default: ''
      scoreboard_sha:
        description: "Scoreboard only (required with a branch): the exact 40-hex head SHA you reviewed"
        type: string
        default: ''

permissions:
  contents: read
  # Read per-SHA receipt artifacts of earlier runs (baselines).
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Harden registry transport against intermittent network errors without retrying tests.
  CARGO_HTTP_MULTIPLEXING: "false"   # avoid HTTP/2 framing failures against the crates.io index
  CARGO_NET_RETRY: "10"              # transport retries for registry/download fetches only
  RUST_BACKTRACE: 1

jobs:
  # Scoreboard-only mode, step 1 (hosted): pin the target. Only an owner
  # dispatch on main gets here. The branch must exist as `refs/heads/<name>`
  # in this repository (fork commits live only under `refs/pull/*`, which this
  # never reads), so only someone with push access can have created it, and
  # its head must equal the SHA the owner named. Nothing later reads the
  # branch again: the Mac builds exactly this SHA.
  scoreboard-target:
    name: HVF · pin owner scoreboard branch
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.scoreboard_branch != '' &&
          github.repository == 'carrick-sh/carrick' && github.ref == 'refs/heads/main' &&
          github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve and pin the same-repository branch head
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.scoreboard_branch }}
          EXPECTED_SHA: ${{ inputs.scoreboard_sha }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error title=Scoreboard branch refused::$1"
            exit 1
          }
          # Conservative branch-name grammar (a subset of git check-ref-format).
          [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || refuse "branch name has characters outside [A-Za-z0-9._/-]"
          case "$BRANCH" in
            main) refuse "main is scored by the nightly and full dispatch, not scoreboard-only mode" ;;
            *..* | *//* | */ | *.lock | */.* | *.) refuse "malformed branch name" ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || refuse "scoreboard_sha is required: the full lowercase 40-hex head SHA you reviewed"
          # The singular git/ref endpoint matches exactly one ref, never a prefix.
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH")" || refuse "no branch refs/heads/$BRANCH in $GITHUB_REPOSITORY"
          ref="$(jq -r '.ref' <<<"$ref_json")"
          type="$(jq -r '.object.type' <<<"$ref_json")"
          sha="$(jq -r '.object.sha' <<<"$ref_json")"
          [ "$ref" = "refs/heads/$BRANCH" ] || refuse "API returned $ref, not refs/heads/$BRANCH"
          [ "$type" = commit ] || refuse "refs/heads/$BRANCH points at a $type, not a commit"
          [ "$sha" = "$EXPECTED_SHA" ] || refuse "refs/heads/$BRANCH is at $sha, not the requested $EXPECTED_SHA"
          printf 'branch=%s\nsha=%s\n' "$BRANCH" "$sha" >> "$GITHUB_OUTPUT"
          {
            printf '## Scoreboard-only target\n\n'
            printf -- '- Branch: `%s` (carrick-sh/carrick)\n' "$BRANCH"
            printf -- '- Pinned head SHA: `%s`\n' "$sha"
            printf -- '- Workflow and guards from main at `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  signed-fixtures:
    name: Linux ARM64 · exact-SHA signed fixtures
    if: >-
      ${{ !cancelled() &&
          vars.CARRICK_SELF_HOSTED == 'true' &&
          (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' && inputs.scoreboard_branch == '')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      bundle-name: ${{ steps.bundle.outputs.name }}
      bundle-sha256: ${{ steps.bundle.outputs.sha256 }}
      bundle-parts: ${{ steps.bundle.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify native ARM Linux publisher
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64

      - name: Test fixture relay transport and fallback
        run: scripts/ci/test-fixture-relay.sh

      - name: Install pinned Rust toolchain and guest targets
        run: rustup show active-toolchain

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Install per-user compiler cache
        uses: ./.github/actions/install-tools
        with:
          tools: sccache

      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Publish exact-SHA fixture bundle
        run: just fixtures-publish "$GITHUB_SHA"

      # The archive basename is the manifest digest, not the archive digest.
      # Pass transport identity through the trusted publisher, never the relay.
      - name: Record fixture archive transport identity
        id: bundle
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(target/fixtures/published/"$GITHUB_SHA"/*.tar.gz)
          test "${#bundles[@]}" -eq 1
          digest=$(sha256sum "${bundles[0]}")
          bytes=$(wc -c < "${bundles[0]}")
          test "$bytes" -gt 0
          printf 'name=%s\nsha256=%s\nparts=%s\n' \
            "${bundles[0]##*/}" "${digest%% *}" "$(( (bytes + 268435455) / 268435456 ))" >> "$GITHUB_OUTPUT"

      - name: Upload fixture parts to R2
        if: >-
          ${{ github.repository == 'carrick-sh/carrick' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        # R2 is an accelerator; GitHub remains available if publication fails.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: scripts/ci/upload-fixture-parts.sh

      - name: Upload exact-SHA fixture bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-fixtures-${{ github.sha }}
          path: target/fixtures/published/${{ github.sha }}/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # Focused signed execution on physical Apple Silicon (cloudmac persistent
  # `carrick-hvf` runner on its dedicated internal APFS volume; see
  # docs/ci/mac-hvf-runner.md). This is deliberately separate from public
  # pull-request CI: hosted macOS Arm64 does not support the nested
  # virtualization HVPatch requires. It runs only on the nightly `schedule`
  # and on an owner `workflow_dispatch` on main, never on `push` (#2057).
  # Job-level concurrency (`cancel-in-progress: false`, keyed by
  # `github.event_name`) keeps a running job intact and lets a dispatch queue
  # beside, not displace, a scheduled run.
  hvf-kernel:
    name: HVF · signed embed + cached probes
    if: >-
      ${{ !cancelled() && needs.signed-fixtures.result == 'success' &&
          ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' && inputs.scoreboard_branch == '')) }}
    needs: [signed-fixtures]
    runs-on: [self-hosted, macOS, ARM64, carrick-hvf]
    concurrency:
      group: hvf-kernel-${{ github.event_name }}
      cancel-in-progress: false
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      # Disk admission and the checkout build both need the root-owned lease
      # supervisor. There is deliberately no unleased fallback: measuring free
      # space beside a running build is the #1693 race. Fail with the runbook
      # step instead of a bare "No such file or directory".
      - name: Verify installed host-lease supervisor
        run: |
          set -euo pipefail
          xtask=/usr/local/bin/carrick-xtask
          if [ ! -x "$xtask" ] || [ -L "$xtask" ] || [ "$(/usr/bin/stat -f %u "$xtask")" != 0 ]; then
            echo "::error title=host-lease supervisor missing::$xtask is not an installed root-owned binary; install it per docs/ci/mac-hvf-runner.md, setup step 3 (Root-owned carrick-xtask)"
            exit 1
          fi
          if ! "$xtask" host-lease --help >/dev/null 2>&1; then
            echo "::error title=host-lease supervisor stale::$xtask has no host-lease subcommand; reinstall it per docs/ci/mac-hvf-runner.md, setup step 3 (Root-owned carrick-xtask)"
            exit 1
          fi

      - name: Disk admission
        env:
          HVF_DISK_FLOOR_GIB: "60"
        run: |
          /usr/local/bin/carrick-xtask host-lease --mode gate -- bash -s <<'DISK_ADMISSION'
          set -euo pipefail
          if [ -z "${RUNNER_WORKSPACE:-}" ] || [ ! -d "$RUNNER_WORKSPACE" ]; then
            echo "::error title=HVF disk admission failed::RUNNER_WORKSPACE is unset or missing: ${RUNNER_WORKSPACE:-<unset>}"
            exit 1
          fi
          avail_kib="$(df -Pk "$RUNNER_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          case "$avail_kib" in
            '' | *[!0-9]*)
              echo "::error title=HVF disk admission failed::unable to parse available KiB from df -Pk for $RUNNER_WORKSPACE"
              exit 1
              ;;
          esac
          floor_kib="$(( HVF_DISK_FLOOR_GIB * 1048576 ))"
          avail_gib="$(( avail_kib / 1048576 ))"
          if [ "$avail_kib" -lt "$floor_kib" ]; then
            echo "::error title=HVF disk admission failed::only ${avail_gib} GiB (${avail_kib} KiB) free on $RUNNER_WORKSPACE, below the ${HVF_DISK_FLOOR_GIB} GiB floor"
            exit 1
          fi
          echo "disk admission passed: ${avail_gib} GiB free on $RUNNER_WORKSPACE (floor ${HVF_DISK_FLOOR_GIB} GiB)"
          DISK_ADMISSION

      - uses: actions/checkout@v4

      - name: Verify Apple Silicon host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          command -v codesign
          command -v otool

      # cloudmac provides a root-owned, read-only rustup toolchain (pinned by
      # rust-toolchain.toml, with sccache) and a runner-private CARGO_HOME;
      # jobs never install or update toolchains there (docs/ci/mac-hvf-runner.md).
      - name: Verify the read-only toolchain (infrastructure)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUSTUP_HOME"
          test ! -w "$RUSTUP_HOME"
          command -v sccache
          verify_toolchain() {
            rustup show active-toolchain
          }
          export -f verify_toolchain
          if ! python3 - <<'PYTHON'
          import os, signal, subprocess, sys
          child = subprocess.Popen(["bash", "-c", "verify_toolchain"], start_new_session=True)
          try:
              sys.exit(child.wait(timeout=600))
          except subprocess.TimeoutExpired:
              os.killpg(child.pid, signal.SIGKILL)
              child.wait()
              sys.exit(75)
          PYTHON
          then
            echo '::error title=Infrastructure::Rust toolchain verification failed; tests did not run'
            exit 75
          fi
          echo 'RUSTUP_AUTO_INSTALL=0' >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hvf-arm64-release

      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Download exact-SHA fixture bundle
        id: relay
        continue-on-error: true
        env:
          BUNDLE_NAME: ${{ needs.signed-fixtures.outputs.bundle-name }}
          BUNDLE_SHA256: ${{ needs.signed-fixtures.outputs.bundle-sha256 }}
          BUNDLE_PARTS: ${{ needs.signed-fixtures.outputs.bundle-parts }}
        run: scripts/ci/download-fixture-bundle.sh relay

      - name: Fall back to the GitHub fixture artifact
        if: ${{ steps.relay.outcome != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: signed-fixtures-${{ github.sha }}
          path: target/fixtures/incoming

      - name: Verify fixture archive transport digest
        env:
          BUNDLE_NAME: ${{ needs.signed-fixtures.outputs.bundle-name }}
          BUNDLE_SHA256: ${{ needs.signed-fixtures.outputs.bundle-sha256 }}
        run: scripts/ci/download-fixture-bundle.sh verify

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Build checkout xtask under shared lease
        run: |
          /usr/local/bin/carrick-xtask host-lease --mode carrick -- cargo build --locked -p carrick-xtask --target-dir target/lease-tools
          echo "CARRICK_XTASK_BIN=$GITHUB_WORKSPACE/target/lease-tools/debug/carrick-xtask" >> "$GITHUB_ENV"

      - name: Fetch fixture lockfile dependencies
        run: just xtask fixtures fetch

      # `Signed acceptance receipt` populates ~27.86 GiB in `target/release`
      # (including ~21.08 GiB of `.dSYM` bundles needed for crash post-mortem
      # and `carrick-lldb`); do not trim debuginfo to fit.
      - name: Check disk headroom before signed acceptance
        id: signed-disk
        run: CARRICK_DISK_FLOOR_GIB=35 just check-disk

      # The landing gate's signed phase (`xtask accept`): build + artifact
      # identity, el1 embed, fresh executable page, probe shards and cases,
      # with scoped cleanup per step. Its receipt is the lane's per-SHA
      # record; a FAIL receipt is still a receipt. Main is not green under
      # the strict signed gate, so this lane gates on NEW failures against
      # the base SHA's receipt, not on the absolute verdict. This lane no
      # longer has a hosted receipt gate (#2057): nightly receipts are ~160
      # commits apart, past the baseline selector's 50-commit walk.
      # `if: ${{ !cancelled() && steps.signed-disk.outcome == 'success' }}` ensures
      # a failed 60 GiB or 35 GiB disk check stops before the ~28 GiB build.
      - name: Signed acceptance receipt
        id: signed-receipt
        if: ${{ !cancelled() && steps.signed-disk.outcome == 'success' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(target/fixtures/incoming/*.tar.gz)
          test "${#bundles[@]}" -eq 1
          just lease gate just fixtures-restore "${bundles[0]}"
          # Persistent workspaces: a stale receipt must not stand in for this run.
          rm -rf target/ci-receipts
          mkdir -p target/ci-receipts
          status=0
          just accept --phase signed --receipt target/ci-receipts/receipt.json || status=$?
          echo "xtask accept exited $status"
          # A FAIL receipt is intentionally published without failing this
          # step; retain its evidence even if the later signed tests pass.
          if [ "$status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          test -s target/ci-receipts/receipt.json

      # Lane jobs only produce and upload receipts; they never wait for a
      # base receipt, so a queued entry can never hold the runner its base
      # entry needs. The hosted `*-gate` jobs compare.
      - name: Upload per-SHA receipt
        if: ${{ !cancelled() && steps.signed-receipt.outcome == 'success' && hashFiles('target/ci-receipts/receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          # The attempt keeps a re-run from colliding with an earlier upload;
          # the gate picks the newest attempt.
          name: receipt-hvf-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci-receipts/receipt.json
          if-no-files-found: error

      # After publishing the receipt, run the full signed coverage, reusing
      # target/release (including .dSYM bundles) from signed acceptance.
      - name: Signed embedded guest tests
        run: |
          shopt -s nullglob
          bundles=(target/fixtures/incoming/*.tar.gz)
          test "${#bundles[@]}" -eq 1
          export CARRICK_RUN_ID="signed-fixtures-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          just lease gate bash -c '
            set -euo pipefail
            cleanup() {
              status=$?
              trap - EXIT
              if ! scripts/sudo/kill.sh "$CARRICK_RUN_ID"; then
                exit 1
              fi
              exit "$status"
            }
            trap cleanup EXIT
            just fixtures-restore "$1"
            just build
            codesign -d --entitlements - target/release/carrick \
              > target/fixtures/signed-entitlements.txt 2>&1
            grep -q com.apple.security.hypervisor target/fixtures/signed-entitlements.txt
            otool -l target/release/carrick > target/fixtures/signed-load-commands.txt
            grep -q __dof_carrick target/fixtures/signed-load-commands.txt
            RUST_TEST_THREADS=1 just test-embed
            RUST_TEST_THREADS=1 CARRICK_PROBE_WORKERS=1 just conformance-probes
          ' signed-fixtures "${bundles[0]}"

      - name: Goal scoreboard (nightly)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine')) && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "${CARRICK_XTASK_BIN:-}"
          test -x "$CARRICK_XTASK_BIN"
          test -x target/release/carrick
          rm -rf target/scoreboard
          mkdir -p target/scoreboard
          export CARRICK_RUN_ID="scoreboard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          just lease gate "$CARRICK_XTASK_BIN" scoreboard --carrick target/release/carrick \
            --sha "$GITHUB_SHA" \
            --out target/scoreboard/receipt.json \
            | tee target/scoreboard/table.txt
          test -s target/scoreboard/receipt.json
          test -s target/scoreboard/table.txt

      - name: Upload scoreboard receipt
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine')) && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-${{ github.sha }}-${{ github.run_attempt }}
          path: target/scoreboard/
          if-no-files-found: warn

      - name: Upload signed failure evidence
        if: ${{ failure() || steps.signed-receipt.outputs.failed == 'true' }}
        # Evidence upload must never change the job verdict: a transient
        # upload error would otherwise fail a job whose tests passed.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hvf-failure-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/el1-gate/*/*.log
            target/embed-post-mortem/**
            target/embed-logs/**
          if-no-files-found: warn

  # Scoreboard-only mode, step 2 (cloudmac, `carrick-hvf`): build the pinned
  # branch SHA, signed, and score it. This job runs unlanded (owner-pinned)
  # code, so it is built so that code can reach nothing worth taking:
  # - no token and no Node action after branch code starts: both trees are
  #   fetched with anonymous git (the repository is public), there is no
  #   actions/checkout (whose post step would run last, with the token), no
  #   rust-cache and no artifact upload; results leave only as job outputs,
  #   published by the hosted `scoreboard-publish` job, which runs no
  #   repository code;
  # - `permissions: contents: read`, and no relay, fixture or cache step;
  # - composite actions and the scoreboard instrument (`carrick-xtask
  #   scoreboard`) come from main's tree, built before branch code runs;
  # - the branch builds under RUNNER_TEMP (cleared by the root-owned
  #   job-completed hook) with a private CARGO_HOME and sccache off, so its
  #   build never writes the runner's shared Cargo home, sccache or
  #   persistent workspace target.
  # Residual: the code still runs as the `carrick-hvf` user. Root-owned
  # runner files, hooks and policy are out of its reach; files that user owns
  # are not. The exact-SHA pin is the control: dispatch only a commit you
  # would push to main.
  hvf-scoreboard:
    name: HVF · scoreboard-only branch head
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.scoreboard_branch != '' &&
          github.repository == 'carrick-sh/carrick' && github.ref == 'refs/heads/main' &&
          github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' &&
          needs.scoreboard-target.result == 'success' && needs.scoreboard-target.outputs.sha != '' }}
    needs: [scoreboard-target]
    runs-on: [self-hosted, macOS, ARM64, carrick-hvf]
    concurrency:
      group: hvf-kernel-${{ github.event_name }}
      cancel-in-progress: false
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      receipt: ${{ steps.score.outputs.receipt }}
      table: ${{ steps.score.outputs.table }}
      binary-sha256: ${{ steps.build.outputs.binary-sha256 }}
      identity: ${{ steps.build.outputs.identity }}
    env:
      SCORE_SHA: ${{ needs.scoreboard-target.outputs.sha }}
    steps:
      - name: Verify installed host-lease supervisor
        run: |
          set -euo pipefail
          xtask=/usr/local/bin/carrick-xtask
          if [ ! -x "$xtask" ] || [ -L "$xtask" ] || [ "$(/usr/bin/stat -f %u "$xtask")" != 0 ]; then
            echo "::error title=host-lease supervisor missing::$xtask is not an installed root-owned binary; install it per docs/ci/mac-hvf-runner.md, setup step 3 (Root-owned carrick-xtask)"
            exit 1
          fi
          "$xtask" host-lease --help >/dev/null

      - name: Disk admission
        env:
          HVF_DISK_FLOOR_GIB: "60"
        run: |
          /usr/local/bin/carrick-xtask host-lease --mode gate -- bash -s <<'DISK_ADMISSION'
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}" && test -d "$RUNNER_TEMP"
          avail_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          case "$avail_kib" in
            '' | *[!0-9]*) echo "::error title=HVF disk admission failed::unable to parse df -Pk for $RUNNER_TEMP"; exit 1 ;;
          esac
          if [ "$avail_kib" -lt "$(( HVF_DISK_FLOOR_GIB * 1048576 ))" ]; then
            echo "::error title=HVF disk admission failed::only $(( avail_kib / 1048576 )) GiB free on $RUNNER_TEMP, below ${HVF_DISK_FLOOR_GIB} GiB"
            exit 1
          fi
          DISK_ADMISSION

      - name: Verify Apple Silicon host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          command -v codesign
          command -v otool

      # Anonymous fetches: no credential helper, no global or system git
      # config, no prompt. Each tree must land on exactly its SHA.
      - name: Fetch main's tree and the pinned branch tree (no credentials)
        run: |
          set -euo pipefail
          sb="$RUNNER_TEMP/scoreboard"
          main_tree="$GITHUB_WORKSPACE/.scoreboard-main"
          rm -rf "$sb" "$main_tree"
          mkdir -p "$sb/cargo-home" "$sb/sccache" "$sb/out"
          fetch() { # <dir> <sha>
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 bash -c '
              set -euo pipefail
              git init -q "$1"
              git -C "$1" -c credential.helper= fetch -q --depth=1 --no-tags https://github.com/carrick-sh/carrick.git "$2"
              git -C "$1" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
              test "$(git -C "$1" rev-parse HEAD)" = "$2"
            ' fetch "$1" "$2"
          }
          fetch "$main_tree" "$GITHUB_SHA"
          fetch "$sb/branch" "$SCORE_SHA"
          {
            echo "SB=$sb"
            echo "SB_MAIN=$main_tree"
            echo "CARGO_HOME=$sb/cargo-home"
            echo "SCCACHE_DIR=$sb/sccache"
            echo "SCCACHE_SERVER_UDS=$sb/sccache/server.sock"
            echo "CARRICK_SCCACHE=0"
            echo "RUSTC_WRAPPER="
            echo "CARGO_BUILD_RUSTC_WRAPPER="
            echo "RUSTUP_AUTO_INSTALL=0"
          } >> "$GITHUB_ENV"

      # From main's tree, before any branch code runs.
      - name: Install just (main's composite action)
        uses: ./.scoreboard-main/.github/actions/install-tools
        with:
          tools: just

      - name: Verify the read-only toolchain
        working-directory: ${{ runner.temp }}/scoreboard/branch
        run: |
          set -euo pipefail
          test -n "$RUSTUP_HOME"
          test ! -w "$RUSTUP_HOME"
          rustup show active-toolchain

      # The scoreboard instrument is main's, built before branch code runs.
      - name: Build main's scoreboard xtask
        working-directory: ${{ github.workspace }}/.scoreboard-main
        run: |
          /usr/local/bin/carrick-xtask host-lease --mode carrick -- \
            cargo build --locked -p carrick-xtask --target-dir "$SB/main-target"
          test -x "$SB/main-target/debug/carrick-xtask"

      # First branch code: build.rs, just recipes and scripts of the pinned SHA.
      - name: Signed build of the pinned branch head
        id: build
        working-directory: ${{ runner.temp }}/scoreboard/branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCORE_SHA"
          just build
          codesign -d --entitlements - target/release/carrick > "$SB/out/entitlements.txt" 2>&1
          grep -q com.apple.security.hypervisor "$SB/out/entitlements.txt"
          otool -l target/release/carrick > "$SB/out/load-commands.txt"
          grep -q __dof_carrick "$SB/out/load-commands.txt"
          digest="$(shasum -a 256 target/release/carrick | awk '{ print $1 }')"
          cdhash="$(codesign -dvvv target/release/carrick 2>&1 | awk -F= '/^CDHash=/ { print $2 }')"
          uuid="$(otool -l target/release/carrick | awk '/LC_UUID/ { f = 1 } f && /uuid/ { print $2; exit }')"
          printf 'binary-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'identity=sha256=%s cdhash=%s lc_uuid=%s entitlement=com.apple.security.hypervisor dof=__dof_carrick\n' \
            "$digest" "$cdhash" "$uuid" >> "$GITHUB_OUTPUT"

      - name: Goal scoreboard (pinned branch head)
        id: score
        working-directory: ${{ github.workspace }}/.scoreboard-main
        run: |
          set -euo pipefail
          export CARRICK_RUN_ID="scoreboard-branch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/local/bin/carrick-xtask host-lease --mode gate -- \
            "$SB/main-target/debug/carrick-xtask" scoreboard \
            --carrick "$SB/branch/target/release/carrick" \
            --sha "$SCORE_SHA" \
            --reaper "$SB_MAIN/scripts/sudo/kill.sh" \
            --out "$SB/out/receipt.json" > "$SB/out/table.txt"
          test -s "$SB/out/receipt.json"
          test -s "$SB/out/table.txt"
          cat "$SB/out/table.txt"
          printf 'receipt=%s\n' "$(base64 < "$SB/out/receipt.json" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          printf 'table=%s\n' "$(base64 < "$SB/out/table.txt" | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Remove the scoreboard trees
        if: ${{ always() }}
        run: |
          for d in "${SB:-}" "${SB_MAIN:-}"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              chmod -R u+w "$d" 2>/dev/null || true
              rm -rf "$d"
            fi
          done

  # Scoreboard-only mode, step 3 (hosted): publish. It runs no repository
  # code and holds the only write-capable token of this mode. It reads the
  # Mac job's outputs as data (never interpolated into a script), uploads
  # `scoreboard-branch-<sha>-<attempt>` (never a `receipt-*`,
  # `signed-fixtures-*` or `scoreboard-<main sha>` name that main's gates or
  # nightly read) and comments on the branch's single open same-repository PR.
  # It never posts to #231.
  scoreboard-publish:
    name: HVF · publish scoreboard-only result
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && inputs.scoreboard_branch != '' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' &&
          needs.scoreboard-target.result == 'success' && needs.hvf-scoreboard.result != 'skipped' }}
    needs: [scoreboard-target, hvf-scoreboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Write provenance, summary and comment
        env:
          SCORE_BRANCH: ${{ needs.scoreboard-target.outputs.branch }}
          SCORE_SHA: ${{ needs.scoreboard-target.outputs.sha }}
          HVF_RESULT: ${{ needs.hvf-scoreboard.result }}
          RECEIPT_B64: ${{ needs.hvf-scoreboard.outputs.receipt }}
          TABLE_B64: ${{ needs.hvf-scoreboard.outputs.table }}
          BINARY_SHA256: ${{ needs.hvf-scoreboard.outputs.binary-sha256 }}
          IDENTITY: ${{ needs.hvf-scoreboard.outputs.identity }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scoreboard-branch"
          mkdir -p "$out"
          if [ -n "$RECEIPT_B64" ]; then base64 -d <<<"$RECEIPT_B64" > "$out/receipt.json"; fi
          if [ -n "$TABLE_B64" ]; then base64 -d <<<"$TABLE_B64" > "$out/table.txt"; fi
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg branch "$SCORE_BRANCH" --arg sha "$SCORE_SHA" \
            --arg workflow_sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg actor "$GITHUB_TRIGGERING_ACTOR" --arg hvf_result "$HVF_RESULT" \
            --arg binary_sha256 "$BINARY_SHA256" --arg identity "$IDENTITY" \
            '{mode: "scoreboard-only", repository: $repository, branch: $branch, sha: $sha,
              workflow_sha: $workflow_sha, run_id: $run_id, run_attempt: $run_attempt,
              triggering_actor: $actor, hvf_scoreboard_result: $hvf_result,
              binary_sha256: $binary_sha256, identity: $identity}' > "$out/provenance.json"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            printf '### Goal scoreboard (branch `%s`)\n\n' "$SCORE_BRANCH"
            printf 'Scored commit `%s` on branch `%s` ([workflow run](%s), HVF job: %s). ' \
              "$SCORE_SHA" "$SCORE_BRANCH" "$run_url" "$HVF_RESULT"
            printf 'Owner scoreboard-only dispatch with the workflow from main at `%s`: no receipts, gates or baselines. ' "$GITHUB_SHA"
            printf 'The table'"'"'s `main` label names the scored commit.\n\n'
            if [ -s "$out/table.txt" ]; then
              printf '```text\n'
              cat "$out/table.txt"
              printf '```\n\n'
            else
              printf 'No scoreboard table was produced; see the workflow run.\n\n'
            fi
            printf '<details><summary>Binary identity</summary>\n\n```text\n%s\n```\n</details>\n' "${IDENTITY:-none}"
          } > "$out/comment.md"
          cat "$out/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scoreboard-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-branch-${{ needs.scoreboard-target.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard-branch/
          if-no-files-found: error

      - name: Post to the branch's open same-repository PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCORE_BRANCH: ${{ needs.scoreboard-target.outputs.branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SCORE_BRANCH" --state open \
            --json number,isCrossRepository,headRefName \
            --jq '[.[] | select(.isCrossRepository == false and .headRefName == env.SCORE_BRANCH)] | if length == 1 then .[0].number else empty end')"
          if [ -z "$pr" ]; then
            echo "no single open same-repository PR for $SCORE_BRANCH; summary and artifact only"
            exit 0
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/scoreboard-branch/comment.md"

  # The focused job above is not suite closure. This separate baseline-free
  # gate is intentionally expensive, trusted-event-only, and dormant until the
  # canonical image/oracle host is explicitly enabled.
  hvf-closure:
    name: HVF · strict 2,127-suite closure
    if: >-
      ${{ vars.CARRICK_SELF_HOSTED == 'true' &&
          vars.CARRICK_SELF_HOSTED_FULL_CONFORMANCE == 'true' &&
          github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' &&
          inputs.scoreboard_branch == '' }}
    needs: hvf-kernel
    # Its own label (`ci_scaler::HVF_CLOSURE_LABELS`): the persistent `carrick-hvf`
    # runner never serves it, so the 24-hour closure can never occupy the main-push runner.
    runs-on: [self-hosted, macOS, ARM64, carrick-hvf-closure]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical closure host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          command -v codesign
          command -v otool
          command -v docker
          docker version

      - name: Install repository Rust toolchain (infrastructure)
        shell: bash
        run: |
          set -euo pipefail
          install_toolchain() {
            rustup show active-toolchain
          }
          export -f install_toolchain
          if ! python3 - <<'PYTHON'
          import os, signal, subprocess, sys
          child = subprocess.Popen(["bash", "-c", "install_toolchain"], start_new_session=True)
          try:
              sys.exit(child.wait(timeout=600))
          except subprocess.TimeoutExpired:
              os.killpg(child.pid, signal.SIGKILL)
              child.wait()
              sys.exit(75)
          PYTHON
          then
            echo '::error title=Infrastructure::Rust toolchain installation failed; tests did not run'
            exit 75
          fi
          echo 'RUSTUP_AUTO_INSTALL=0' >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Install per-user compiler cache
        uses: ./.github/actions/install-tools
        with:
          tools: sccache
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Build and verify frozen closure scope
        run: |
          just build
          just conformance-closure-scope

      - name: Strict 2,127-suite closure
        run: |
          just conformance full --closure --force
          # `just conformance` re-signs its build dependency. Re-check scope on
          # the exact post-gate artifact rather than relying only on preflight.
          just conformance-closure-scope

  # A real KVM device is the contract. An incidental or software-emulated
  # hosted environment is not accepted as this lane. Every `kvm`-lane test
  # target runs (`just test-kvm`, derived from Cargo metadata) on a real
  # /dev/kvm, on push to main or owner dispatch (not the nightly schedule,
  # which would only rerun an already-tested SHA), on Willow JIT clones
  # (`ci-scaler standing`, docs/ci/willow-pilot.md, docs/ci/contabo-kvm.md).
  # Its labels are `ci_scaler::LABELS`; a test keeps them identical.
  # Pull requests and merge groups are not run here; only main pushes and
  # owner dispatches may reach the hardware.
  kvm-tests-willow:
    name: KVM · x86 kvm-lane tests (Willow)
    if: >-
      ${{ !cancelled() &&
          vars.CARRICK_SELF_HOSTED_KVM == 'true' && github.event_name != 'schedule' &&
          (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' && inputs.scoreboard_branch == '')) }}
    runs-on: [self-hosted, Linux, X64, willow-kvm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify KVM host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Install per-user compiler cache
        uses: ./.github/actions/install-tools
        with:
          tools: sccache
      - name: Install x86 image and fixture targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-linux-musl

      # `xtask accept --profile kvm` runs `just test-kvm` and records every
      # failing `<test-binary>::<test>` in the receipt (one format with the
      # signed lane).
      - name: KVM-lane receipt (CARRICK_REQUIRE_KVM=1)
        run: |
          set -euo pipefail
          # Persistent workspaces: a stale receipt must not stand in for this run.
          rm -rf target/ci-receipts target/el1-gate
          mkdir -p target/ci-receipts
          status=0
          just accept --profile kvm --receipt target/ci-receipts/receipt.json || status=$?
          echo "xtask accept exited $status"
          test -s target/ci-receipts/receipt.json

      # Lane jobs only produce and upload receipts; they never wait for a
      # base receipt, so a queued entry can never hold the runner its base
      # entry needs. The hosted `*-gate` jobs compare.
      - name: Upload per-SHA receipt
        if: ${{ !cancelled() && hashFiles('target/ci-receipts/receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          # The attempt keeps a re-run from colliding with an earlier upload;
          # the gate picks the newest attempt.
          name: receipt-kvm-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci-receipts/receipt.json
          if-no-files-found: error

      # `xtask accept --profile kvm` writes per-step logs (e.g.
      # `01-kvm-tests.log`) under `target/el1-gate/<short-sha>/`.
      - name: Upload step logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kvm-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: target/el1-gate/
          if-no-files-found: ignore

  # x86 rows on the main scoreboard (owner, 2026-11-14, #231; #2327): the same
  # rows through the same `carrick-xtask scoreboard` runner, on the x86 KVM
  # lane, for the same main commit and on the same events as the HVF nightly
  # scoreboard. It only produces a receipt; `scoreboard-post` publishes both
  # ISAs in one #231 comment. It never gates anything.
  kvm-scoreboard:
    name: KVM · x86 scoreboard (nightly)
    if: >-
      ${{ !cancelled() && vars.CARRICK_SELF_HOSTED_KVM == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' && inputs.scoreboard_branch == '')) }}
    runs-on: [self-hosted, Linux, X64, willow-kvm]
    continue-on-error: true
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify KVM host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Install per-user compiler cache
        uses: ./.github/actions/install-tools
        with:
          tools: sccache
      - name: Install x86 image and fixture targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-linux-musl

      - name: Build carrick (platform-linux) and carrick-xtask
        run: |
          set -euo pipefail
          just build
          cargo build --release --locked -p carrick-xtask
          test -x target/release/carrick
          test -x target/release/carrick-xtask

      - name: Goal scoreboard (x86 KVM)
        run: |
          set -euo pipefail
          rm -rf target/scoreboard-x86
          mkdir -p target/scoreboard-x86
          export CARRICK_RUN_ID="scoreboard-x86-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          just lease gate target/release/carrick-xtask scoreboard --isa x86_64 \
            --carrick target/release/carrick \
            --sha "$GITHUB_SHA" \
            --out target/scoreboard-x86/receipt.json \
            | tee target/scoreboard-x86/table.txt
          test -s target/scoreboard-x86/receipt.json
          test -s target/scoreboard-x86/table.txt

      - name: Upload x86 scoreboard receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-x86-${{ github.sha }}-${{ github.run_attempt }}
          path: target/scoreboard-x86/
          if-no-files-found: warn

  # Publishes the nightly scoreboard: one #231 comment with an `arm64` (HVF)
  # and an `x86_64` (KVM) block (#2327). It runs no repository code (no
  # checkout) and holds the only issues-write token of the nightly path. A
  # lane that produced no table is reported as missing with its job result,
  # never silently dropped. Each table line leads with its ISA column, so
  # `director/scoreboard-rows.sh` (carrick-sh/agy-director) reads both blocks.
  scoreboard-post:
    name: "Scoreboard · post both ISAs to #231"
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' && inputs.scoreboard_branch == '')) &&
          (needs.hvf-kernel.result != 'skipped' || needs.kvm-scoreboard.result != 'skipped') }}
    needs: [hvf-kernel, kvm-scoreboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Download the arm64 scoreboard
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scoreboard-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard/arm64

      - name: Download the x86_64 scoreboard
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scoreboard-x86-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoreboard/x86_64

      - name: "Post scoreboard to #231"
        env:
          GH_TOKEN: ${{ github.token }}
          HVF_RESULT: ${{ needs.hvf-kernel.result }}
          KVM_RESULT: ${{ needs.kvm-scoreboard.result }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/scoreboard"
          mkdir -p "$d"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          block() { # block <isa> <lane label> <job result>
            printf '#### %s (%s)\n\n' "$1" "$2"
            if [ -s "$d/$1/table.txt" ]; then
              printf '```text\n'
              cat "$d/$1/table.txt"
              printf '```\n\n'
              # Each failing row's key stderr line (#2327): why it died, from the receipt (data, never run).
              if [ -s "$d/$1/receipt.json" ] && keys=$(jq -r '.rows[] | select(.passed == false and .key_stderr_line != "") |
                  "\(.name): \(.key_stderr_line)"' "$d/$1/receipt.json" 2>/dev/null) && [ -n "$keys" ]; then
                printf 'Key stderr:\n\n```stderr\n%s\n```\n\n' "$keys"
              fi
            else
              printf 'missing: no %s scoreboard table (job result: %s)\n\n' "$1" "$3"
            fi
          }
          {
            printf '### Goal scoreboard (nightly)\n\n'
            printf 'Commit: %s ([workflow run](%s))\n\n' "$GITHUB_SHA" "$run_url"
            block arm64 HVF "$HVF_RESULT"
            block x86_64 KVM "$KVM_RESULT"
          } > "$d/comment.md"
          cat "$d/comment.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 231 --repo "$GITHUB_REPOSITORY" --body-file "$d/comment.md"

  # carrick-el1-linux's native-process tests are `not(target_os = "macos")`
  # (macOS refuses their EL1 metadata window), so no macOS shard runs them
  # (#1297). This hosted Linux aarch64 lane receipts them per SHA; the
  # `el1-native-gate` job compares against the receipted main ancestor.
  el1-native-tests:
    name: EL1 · native-process tests (Linux ARM64)
    if: >-
      ${{ !cancelled() && github.event_name != 'schedule' &&
          (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == 'tjfontaine' && github.triggering_actor == 'tjfontaine' && inputs.scoreboard_branch == '')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # Hosted and discarded with the job: no per-user cache server to share.
      CARRICK_SCCACHE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      # `xtask accept --profile el1-native` runs `just test-el1-native` and
      # records every failing `<test-binary>::<test>` in the receipt.
      - name: EL1 native-process receipt
        run: |
          set -euo pipefail
          rm -rf target/ci-receipts target/el1-gate
          mkdir -p target/ci-receipts
          status=0
          just accept --profile el1-native --receipt target/ci-receipts/receipt.json || status=$?
          echo "xtask accept exited $status"
          test -s target/ci-receipts/receipt.json

      - name: Upload per-SHA receipt
        if: ${{ !cancelled() && hashFiles('target/ci-receipts/receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: receipt-el1-native-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci-receipts/receipt.json
          if-no-files-found: error

      - name: Upload step logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: el1-native-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: target/el1-gate/
          if-no-files-found: ignore

  # There is no `hvf-gate` receipt gate (#2057). It compared each push's HVF
  # receipt with the receipted first-parent ancestor, which only works while
  # every push produces a receipt. The nightly lane's receipts are ~160 main
  # commits apart, beyond the baseline selector's 50-commit walk, and receipts
  # from this host cannot serve as a queue gate base (#1884). Per-merge HVF
  # attribution is the merge group's own Signed queue gate.
  kvm-gate:
    name: KVM · receipt gate vs receipted main ancestor
    permissions:
      contents: read
      actions: read
    needs: [kvm-tests-willow]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.kvm-tests-willow.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Reject an invalid push before checkout
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ || "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            echo "::error title=Invalid push history::Missing, zero or malformed event.before; refusing to execute repository code"
            printf '## Invalid push history\n\nMissing, zero or malformed event.before; no comparison was made.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check out the trusted pre-push commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          path: selector
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: gate-xtask-release
          workspaces: selector -> target
          cache-workspace-crates: "true"
          save-if: false
      - name: Prepare locked Cargo cache (infrastructure)
        # Trusted-tree checkouts (selector/baseline) may predate the
        # prepare-cargo action (#1571), so their root-only preparation is
        # inline: one bounded locked fetch, exit 75 as infrastructure.
        working-directory: selector
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 600 bash -c 'cargo fetch --locked --offline || CARGO_NET_OFFLINE=false CARGO_NET_RETRY=0 CARGO_HTTP_TIMEOUT=30 cargo fetch --locked'; then
            echo '::error title=Infrastructure::Cargo cache preparation failed; tests did not run'
            exit 75
          fi
          echo 'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"
      - name: Build the trusted selector (owner seeding required at rollout)
        working-directory: selector
        run: |
          cargo build --locked --offline --release -p carrick-xtask
          target/release/carrick-xtask ci-receipt --help > "$RUNNER_TEMP/receipt-help"
          if ! grep -q select-baseline "$RUNNER_TEMP/receipt-help"; then
            echo "::error title=Baseline selector unavailable::The trusted pre-push commit predates the selector. Seed current main with an owner dispatch; subsequent pushes can compare."
            printf '## Baseline selector unavailable\n\nTrusted event.before predates select-baseline. Seed current main with an owner dispatch for subsequent pushes. No comparison was made.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Select the nearest trusted receipt baseline
        id: baseline
        working-directory: selector
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          target/release/carrick-xtask ci-receipt select-baseline --lane kvm
          --before-sha "$BEFORE_SHA" --candidate-sha "$GITHUB_SHA"
          --wait-minutes 90 --poll-seconds 60
      - name: Check out the selected baseline cleanly
        if: ${{ steps.baseline.outputs.reuse != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          clean: true
          persist-credentials: false
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        if: ${{ steps.baseline.outputs.reuse != 'true' }}
        with:
          shared-key: gate-xtask-release
          workspaces: baseline -> target
          cache-workspace-crates: "true"
          save-if: false
      - name: Prepare locked Cargo cache (infrastructure)
        if: ${{ steps.baseline.outputs.reuse != 'true' }}
        # Trusted-tree checkouts (selector/baseline) may predate the
        # prepare-cargo action (#1571), so their root-only preparation is
        # inline: one bounded locked fetch, exit 75 as infrastructure.
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 600 bash -c 'cargo fetch --locked --offline || CARGO_NET_OFFLINE=false CARGO_NET_RETRY=0 CARGO_HTTP_TIMEOUT=30 cargo fetch --locked'; then
            echo '::error title=Infrastructure::Cargo cache preparation failed; tests did not run'
            exit 75
          fi
          echo 'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"
      - name: Build the selected baseline xtask with its own lockfile
        if: ${{ steps.baseline.outputs.reuse != 'true' }}
        working-directory: baseline
        run: cargo build --locked --offline --release -p carrick-xtask
      - name: Download candidate receipt data
        uses: actions/download-artifact@v4
        with:
          pattern: receipt-kvm-${{ github.sha }}-*
          path: ${{ runner.temp }}/candidate
      - name: Compare using the selected baseline's code
        working-directory: ${{ steps.baseline.outputs.reuse == 'true' && 'selector' || 'baseline' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: >-
          target/release/carrick-xtask ci-receipt gate --lane kvm
          --base-sha "$BASE_SHA" --candidate-dir "$RUNNER_TEMP/candidate"
          --candidate-sha "$GITHUB_SHA" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --download-dir "$RUNNER_TEMP/baseline" --wait-minutes 0

