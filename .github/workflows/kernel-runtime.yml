  # Post-landing aggregate (not a merge requirement). Each event has an exact
  # expectation per job; anything else, including an unexpected skip, fails
  # visibly. The HVF jobs are skipped by design on push, and only there may a
  # skip stand in for success: KVM, EL1-native and fixtures are still required.
  trusted-hardware-ok:
    name: Trusted hardware OK
    if: ${{ always() }}
    needs: [scoreboard-target, signed-fixtures, hvf-kernel, hvf-closure, kvm-tests-willow, kvm-gate, el1-native-tests, el1-native-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the lanes this event runs (and skip the rest)
        env:
          SCOREBOARD_TARGET: ${{ needs.scoreboard-target.result }}
          SCOREBOARD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.scoreboard_branch != '' }}
          FIXTURES: ${{ needs.signed-fixtures.result }}
          HVF: ${{ needs.hvf-kernel.result }}
          HVF_CLOSURE: ${{ needs.hvf-closure.result }}
          KVM: ${{ needs.kvm-tests-willow.result }}
          KVM_GATE: ${{ needs.kvm-gate.result }}
          EL1N: ${{ needs.el1-native-tests.result }}
          EL1N_GATE: ${{ needs.el1-native-gate.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "event=$EVENT signed-fixtures=$FIXTURES hvf-kernel=$HVF hvf-closure=$HVF_CLOSURE kvm=$KVM kvm-gate=$KVM_GATE el1-native=$EL1N el1-native-gate=$EL1N_GATE"
          require() { # name actual expected
            if [ "$2" != "$3" ]; then
              echo "::error title=Trusted hardware::$1 is '$2', expected '$3' on $EVENT"
              failed=1
            fi
          }
          failed=0
          if [ "$SCOREBOARD_MODE" = true ]; then
            # Scoreboard-only owner dispatch: the branch resolver and the HVF
            # scoreboard job, nothing else (no fixtures, receipts or gates).
            require scoreboard-target "$SCOREBOARD_TARGET" success
            require hvf-kernel "$HVF" success
            require signed-fixtures "$FIXTURES" skipped
            require hvf-closure "$HVF_CLOSURE" skipped
            require kvm-tests-willow "$KVM" skipped
            require kvm-gate "$KVM_GATE" skipped
            require el1-native-tests "$EL1N" skipped
            require el1-native-gate "$EL1N_GATE" skipped
            exit "$failed"
          fi
          require scoreboard-target "$SCOREBOARD_TARGET" skipped
          require signed-fixtures "$FIXTURES" success
          case "$EVENT" in
            push)
              # Every push: fixtures, KVM and EL1-native with their gates.
              # The HVF lane is nightly/dispatch only, so it must be skipped,
              # not failed, cancelled or (unexpectedly) run.
              require kvm-tests-willow "$KVM" success
              require kvm-gate "$KVM_GATE" success
              require el1-native-tests "$EL1N" success
              require el1-native-gate "$EL1N_GATE" success
              require hvf-kernel "$HVF" skipped
              require hvf-closure "$HVF_CLOSURE" skipped
              ;;
            schedule)
              # Nightly: the HVF lane only. KVM and EL1-native were already
              # exercised on this SHA by its push.
              require hvf-kernel "$HVF" success
              require hvf-closure "$HVF_CLOSURE" skipped
              require kvm-tests-willow "$KVM" skipped
              require kvm-gate "$KVM_GATE" skipped
              require el1-native-tests "$EL1N" skipped
              require el1-native-gate "$EL1N_GATE" skipped
              ;;
            workflow_dispatch)
              # Owner dispatch: every lane, no push-only receipt gates. The
              # closure is dormant unless its host variable enables it.
              require hvf-kernel "$HVF" success
              if [ "$HVF_CLOSURE" != success ]; then
                require hvf-closure "$HVF_CLOSURE" skipped
              fi
              require kvm-tests-willow "$KVM" success
              require kvm-gate "$KVM_GATE" skipped
              require el1-native-tests "$EL1N" success
              require el1-native-gate "$EL1N_GATE" skipped
              ;;
            *)
              echo "::error title=Trusted hardware::unknown event '$EVENT'"
              failed=1
              ;;
          esac
          exit "$failed"
