      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Install BSD C cross toolchain
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        timeout-minutes: 8
        uses: ./.github/actions/ci-fetch
        with:
          recipe: ci-install-freebsd-cross
          path: ~/.cache/carrick-ci/apt
          key: ci-apt-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-bsd-cross-${{ hashFiles('justfile') }}
      - name: Restore NetBSD sysroot input
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        timeout-minutes: 8
        uses: ./.github/actions/ci-fetch
        with:
          recipe: ci-netbsd-sysroot
          path: ~/.cache/carrick-ci/netbsd
          key: ci-netbsd-${{ hashFiles('scripts/ci/inputs/sysroots.json') }}
      - name: Cross-check NetBSD NVMM backend (including tests)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just check-netbsd
      - name: Enforce live NetBSD authority ceilings
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just authority-check-cross x86_64-unknown-netbsd clang "--target=x86_64-unknown-netbsd --sysroot=${{ env.NBSD_SYSROOT }}" llvm-ar

      - name: Compiler cache statistics
        if: ${{ always() }}
