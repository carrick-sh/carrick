name: Hosted CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # Nightly catches hosted runner-image drift with the repository toolchain.
  schedule:
    - cron: "0 7 * * *"

# Superseding a PR saves minutes; main and merge-group runs must finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ephemeral hosted runners persist this bounded compiler cache via rust-cache.
  SCCACHE_CACHE_SIZE: "1G"
  # Harden registry transport against intermittent network errors without retrying tests.
  CARGO_HTTP_MULTIPLEXING: "false"   # avoid HTTP/2 framing failures against the crates.io index
  CARGO_HTTP_TIMEOUT: "30"
  CARGO_NET_RETRY: "5"              # transport retries for registry/download fetches only
  RUST_BACKTRACE: 1
  CARRICK_PROBE_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  CARRICK_AUTHORITY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
      heavy: ${{ steps.filter.outputs.heavy }}
      macos: ${{ steps.filter.outputs.macos }}
      workflows: ${{ steps.filter.outputs.workflows }}
      lower_layer: ${{ steps.filter.outputs.lower_layer }}
      child_pr: ${{ steps.filter.outputs.child_pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Detect changed surfaces
        id: filter
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CI_BASE_REF: ${{ github.event.merge_group.base_ref }}
          CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: just ci-changes
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
        with:
          toolchain: 'false'
          tools: ''
          cargo: 'false'
      - name: Restore actionlint input
        uses: ./.github/actions/ci-fetch
        timeout-minutes: 20
        with:
          recipe: ci-install-actionlint
          path: ~/.cache/carrick-ci/actionlint
          key: ci-actionlint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('justfile') }}
      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  # GitHub-first rule: a non-docs PR must link an issue. Runs on every event so
  # ci-ok can require plain success; it passes trivially in the merge queue.

  linked-issue:
    name: linked-issue
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
        with:
          toolchain: 'false'
          tools: ''
          cargo: 'false'
      - name: Self-test the gate
        run: scripts/ci/test-require-linked-issue.sh
      - name: Require a linked issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/require-linked-issue.sh

      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  # Enforce canonical Co-Authored-By trailers on all non-merge PR commits.
  # Runs on every event so ci-ok can require plain success; it passes trivially
  # outside pull_request.

  commit-trailers:
    name: commit-trailers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Skip non-pull-request events
        if: github.event_name != 'pull_request'
        run: echo "commit-trailers (${{ github.event_name }}) is not a pull_request; passing."
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        if: github.event_name == 'pull_request'
        with:
          shared-key: gate-xtask-release
          cache-workspace-crates: "true"
          save-if: false
      - name: Build xtask
        if: github.event_name == 'pull_request'
        run: cargo build --locked --release -p carrick-xtask
      - name: Enforce Co-Authored-By trailers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: target/release/carrick-xtask commit-trailers check-range "$BASE_SHA..$HEAD_SHA"

      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  # Independent checks keep reporting after an earlier check fails. No
  # continue-on-error: every failure still makes its job (and ci-ok) fail.

  lint:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
        with:
          tools: sccache cargo-deny
      - name: Fetch and validate probe coverage base commit
        env:
          CI_EVENT: ${{ github.event_name }}
        run: just ci-probe-coverage-base
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Install Semgrep
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        timeout-minutes: 12
        uses: ./.github/actions/ci-fetch
        with:
          recipe: ci-install-semgrep
          path: ~/.cache/carrick-ci/semgrep
          key: ci-semgrep-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.python }}-${{ hashFiles('scripts/ci/inputs/semgrep.txt') }}
      - name: Exact Linux and macOS unit shard coverage
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just check-test-shards
      - name: Xtask unit and CI gate tests
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just test-xtask
      - name: Formatting
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just fmt-check
      - name: Clippy (no-panic gate)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just clippy
      - name: Dependency audit
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just deny
      - name: Support matrix drift
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just check-matrix
      - name: Layering and product feature closure
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just check-layering
      - name: Conformance contract coverage (PR changed surfaces)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' && github.event_name == 'pull_request' }}
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: just check-contract-change "$CI_BASE" "$GITHUB_SHA"
      - name: Host-independent typed-domain checks and contract registry
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just lint-domains-source

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  portable:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Compiler cache fallback without sccache
        run: cargo test -p carrick-xtask --test build_cache
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Install Linux C cross toolchain
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        timeout-minutes: 8
        uses: ./.github/actions/ci-fetch
        with:
          recipe: ci-install-linux-cross
          path: ~/.cache/carrick-ci/apt
          key: ci-apt-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-linux-cross-${{ hashFiles('justfile') }}
      - name: Portable kernel compile (aarch64-linux lib, tests and semantics)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: just check-kernel-portable
      - name: Kernel semantics on x86_64 Linux
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just test-kernel-semantics

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  linux-doc:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Linux crate rustdoc (including Linux host and KVM modules)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just doc
      - name: Fuzz harness compile-check
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just check-fuzz

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  macos-clippy:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Fetch and validate authority debt base commit
        env:
          CI_EVENT: ${{ github.event_name }}
        run: just ci-probe-coverage-base
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Clippy (no-panic gate)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just clippy
      - name: Live host-authority compiler census
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: cargo run --locked -p carrick-xtask -- authority-debt

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  macos-build:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Workspace build
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just check --workspace
      # The live census and rustdoc retain macOS cfg/backend coverage.
      # Linux runs source-only authority checks and its own rustdoc separately.
      - name: Workspace rustdoc
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just doc

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  macos-unit-a:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Unit tests shard A (host test lanes)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just ci-macos-test test-shard-a

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  macos-unit-b:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Unit tests shard B (workspace + mm-owner + CLI + host + VFS + kernel + runtime + HVF + EL1)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just ci-macos-test test-shard-b

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  macos-integration:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Host integration tests (no HVF)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just ci-macos-test test-integration

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  cross-check-linux:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: aarch64 Linux cross-check and no-HVF closure
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just check-linux
      - name: Native Linux host backend tests
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just test-host-linux

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  # Native Linux run of the kernel-semantics suites (crates/carrick-kernel-example):
  # scripted two-process Linux semantics against the public kernel API with no
  # VMM, no codesign, no Docker. The kernel is portable by construction
  # (`just check-kernel-portable` above proves the source; this proves the
  # SEMANTICS on a Linux host), and an aarch64 runner matches the kernel's guest
  # ABI and the portable-check target. It is the fast, independent signal beside
  # the macOS job: ~5 s of tests after the build. Measured 2026-09-17 in the lima
  # aarch64 VM before wiring: 94 passed, 0 failed.
  #
  # NOT yet run here: the kernel lib lane (`cargo test -p carrick-kernel --lib
  # --features test-support -- --skip serial_host`). On Linux it passes 1957/1964;
  # the seven failures are host-specific expectations, each a named follow-up
  # (fix the Linux host path or gate the Darwin expectation), never a skip list:
  #   dispatch::fs::tests::lseek_data_and_hole_across_backends
  #   dispatch::mem::backing::tests::readonly_host_fd_cannot_carry_a_writable_shared_file_mapping
  #   dispatch::net::support::tests::host_to_linux_sockaddr_unix_does_not_leak_private_hash_path_without_metadata
  #   dispatch::net::support::tests::host_to_linux_sockaddr_unix_falls_back_to_xattr_across_processes
  #   dispatch::overlay_dispatch_tests::epoll_et_delivers_listener_edge_without_read_byte_growth
  #   dispatch::overlay_dispatch_tests::large_nonblocking_host_pipe_write_uses_small_ready_window
  #   dispatch::overlay_dispatch_tests::large_nonblocking_host_socket_write_uses_small_ready_window
  # When those are green, replace `test-kernel-semantics` below with `test-kernel`.

  kernel-linux-native:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Kernel semantics natively on ARM Linux
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just test-kernel-semantics

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  cross-check-freebsd:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FBSD_VERSION: 14.3-RELEASE
      FBSD_MAJOR: "14"
      FBSD_SYSROOT: ${{ github.workspace }}/.freebsd-sysroot
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Install FreeBSD C cross toolchain
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        timeout-minutes: 8
        uses: ./.github/actions/ci-fetch
        with:
          recipe: ci-install-freebsd-cross
          path: ~/.cache/carrick-ci/apt
          key: ci-apt-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-bsd-cross-${{ hashFiles('justfile') }}
      - name: Restore FreeBSD sysroot input
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        timeout-minutes: 8
        uses: ./.github/actions/ci-fetch
        with:
          recipe: ci-freebsd-sysroot
          path: ~/.cache/carrick-ci/freebsd
          key: ci-freebsd-${{ env.FBSD_VERSION }}-${{ hashFiles('justfile') }}
      - name: Cross-check FreeBSD CLI and runtime (including tests)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        env:
          CC_x86_64_unknown_freebsd: clang
          CXX_x86_64_unknown_freebsd: clang++
          AR_x86_64_unknown_freebsd: llvm-ar
          CFLAGS_x86_64_unknown_freebsd: --target=x86_64-unknown-freebsd${{ env.FBSD_MAJOR }} --sysroot=${{ env.FBSD_SYSROOT }}
          CXXFLAGS_x86_64_unknown_freebsd: --target=x86_64-unknown-freebsd${{ env.FBSD_MAJOR }} --sysroot=${{ env.FBSD_SYSROOT }}
        run: just check-freebsd
      - name: Enforce live FreeBSD authority ceilings
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just authority-check-cross x86_64-unknown-freebsd clang "--target=x86_64-unknown-freebsd${{ env.FBSD_MAJOR }} --sysroot=${{ env.FBSD_SYSROOT }}" llvm-ar

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  cross-check-netbsd:
