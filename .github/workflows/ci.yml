name: Hosted CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # Nightly catches hosted runner-image drift with the repository toolchain.
  schedule:
    - cron: "0 7 * * *"

# Superseding a PR saves minutes; main and merge-group runs must finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Detect docs-only PR
        id: filter
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: just ci-changes

  # Independent checks keep reporting after an earlier check fails. No
  # continue-on-error: every failure still makes its job (and ci-ok) fail.

  lint:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,cargo-deny
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Install Semgrep
        if: ${{ !cancelled() }}
        run: just ci-install-semgrep
      - name: Exact unit shard coverage
        if: ${{ !cancelled() }}
        run: just check-test-shards
      - name: Formatting
        if: ${{ !cancelled() }}
        run: just fmt-check
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: just deny
      - name: Support matrix drift
        if: ${{ !cancelled() }}
        run: just check-matrix
      - name: Layering and product feature closure
        if: ${{ !cancelled() }}
        run: just check-layering
      - name: Conformance contract coverage (PR changed surfaces)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: just check-contract-change "$CI_BASE" "$GITHUB_SHA"
      - name: Host-independent typed-domain checks and contract registry
        if: ${{ !cancelled() }}
        run: just lint-domains-source

  portable:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Install Linux C cross toolchain
        if: ${{ !cancelled() }}
        run: just ci-install-linux-cross
      - name: Portable kernel compile (aarch64-linux lib, tests and semantics)
        if: ${{ !cancelled() }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: just check-kernel-portable
      - name: Kernel semantics on x86_64 Linux
        if: ${{ !cancelled() }}
        run: just test-kernel-semantics

  linux-doc:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Linux crate rustdoc (including Linux host and KVM modules)
        if: ${{ !cancelled() }}
        run: just doc

  macos-clippy:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: macos-host
      - name: Exact unit shard coverage
        if: ${{ !cancelled() }}
        run: just check-test-shards
      - name: Clippy (no-panic gate)
        if: ${{ !cancelled() }}
        run: just clippy
      - name: Live host-authority compiler census
        if: ${{ !cancelled() }}
        run: just lint-domains-host

  macos-build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: macos-host
      - name: Workspace build
        if: ${{ !cancelled() }}
        run: just check --workspace
      - name: Workspace rustdoc
        if: ${{ !cancelled() }}
        run: just doc
      - name: Fuzz harness compile-check
        if: ${{ !cancelled() }}
        run: just check-fuzz

  macos-unit-a:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: macos-host
      - name: Unit shard a (host fd headroom)
        if: ${{ !cancelled() }}
        run: just ci-macos-test test-shard-a

  macos-unit-b:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: macos-host
      - name: Unit shard b (host fd headroom)
        if: ${{ !cancelled() }}
        run: just ci-macos-test test-shard-b

  macos-unit-c:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: macos-host
      - name: Unit shard c (host fd headroom)
        if: ${{ !cancelled() }}
        run: just ci-macos-test test-shard-c

  macos-unit-d:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: macos-host
      - name: Unit shard d (host fd headroom)
        if: ${{ !cancelled() }}
        run: just ci-macos-test test-shard-d

  macos-integration:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: macos-host
      - name: Host integration tests (no HVF)
        if: ${{ !cancelled() }}
        run: just ci-macos-test test-integration

  cross-check-linux:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: aarch64 Linux cross-check and no-HVF closure
        if: ${{ !cancelled() }}
        run: just check-linux
      - name: Native Linux host backend tests
        if: ${{ !cancelled() }}
        run: just test-host-linux

  # Native Linux run of the kernel-semantics suites (crates/carrick-kernel-example):
  # scripted two-process Linux semantics against the public kernel API with no
  # VMM, no codesign, no Docker. The kernel is portable by construction
  # (`just check-kernel-portable` above proves the source; this proves the
  # SEMANTICS on a Linux host), and an aarch64 runner matches the kernel's guest
  # ABI and the portable-check target. It is the fast, independent signal beside
  # the macOS job: ~5 s of tests after the build. Measured 2026-09-17 in the lima
  # aarch64 VM before wiring: 94 passed, 0 failed.
  #
  # NOT yet run here: the kernel lib lane (`cargo test -p carrick-kernel --lib
  # --features test-support -- --skip serial_host`). On Linux it passes 1957/1964;
  # the seven failures are host-specific expectations, each a named follow-up
  # (fix the Linux host path or gate the Darwin expectation), never a skip list:
  #   dispatch::fs::tests::lseek_data_and_hole_across_backends
  #   dispatch::mem::backing::tests::readonly_host_fd_cannot_carry_a_writable_shared_file_mapping
  #   dispatch::net::support::tests::host_to_linux_sockaddr_unix_does_not_leak_private_hash_path_without_metadata
  #   dispatch::net::support::tests::host_to_linux_sockaddr_unix_falls_back_to_xattr_across_processes
  #   dispatch::overlay_dispatch_tests::epoll_et_delivers_listener_edge_without_read_byte_growth
  #   dispatch::overlay_dispatch_tests::large_nonblocking_host_pipe_write_uses_small_ready_window
  #   dispatch::overlay_dispatch_tests::large_nonblocking_host_socket_write_uses_small_ready_window
  # When those are green, replace `test-kernel-semantics` below with `test-kernel`.

  kernel-linux-native:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Kernel semantics natively on ARM Linux
        if: ${{ !cancelled() }}
        run: just test-kernel-semantics

  cross-check-freebsd:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FBSD_VERSION: 14.3-RELEASE
      FBSD_MAJOR: "14"
      FBSD_SYSROOT: ${{ github.workspace }}/.freebsd-sysroot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Install FreeBSD C cross toolchain
        if: ${{ !cancelled() }}
        run: just ci-install-freebsd-cross
      - name: Cache FreeBSD sysroot
        id: fbsd-sysroot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.FBSD_SYSROOT }}
          key: freebsd-sysroot-${{ env.FBSD_VERSION }}
      - name: Fetch FreeBSD headers and libraries from permanent archive
        if: ${{ !cancelled() && steps.fbsd-sysroot.outputs.cache-hit != 'true' }}
        run: just ci-freebsd-sysroot
      - name: Cross-check FreeBSD CLI and runtime (including tests)
        if: ${{ !cancelled() }}
        env:
          CC_x86_64_unknown_freebsd: clang
          CXX_x86_64_unknown_freebsd: clang++
          AR_x86_64_unknown_freebsd: llvm-ar
          CFLAGS_x86_64_unknown_freebsd: --target=x86_64-unknown-freebsd${{ env.FBSD_MAJOR }} --sysroot=${{ env.FBSD_SYSROOT }}
          CXXFLAGS_x86_64_unknown_freebsd: --target=x86_64-unknown-freebsd${{ env.FBSD_MAJOR }} --sysroot=${{ env.FBSD_SYSROOT }}
        run: just check-freebsd

  cross-check-netbsd:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Cross-check NetBSD NVMM backend (including tests)
        if: ${{ !cancelled() }}
        run: just check-netbsd

  # Single ruleset check. Only a successful docs-only PR filter permits skips;
  # a failed/cancelled filter or an unexpectedly skipped dependency is red.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - lint
      - portable
      - linux-doc
      - macos-clippy
      - macos-build
      - macos-unit-a
      - macos-unit-b
      - macos-unit-c
      - macos-unit-d
      - macos-integration
      - cross-check-linux
      - kernel-linux-native
      - cross-check-freebsd
      - cross-check-netbsd
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Require every applicable job to succeed
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: just ci-results
