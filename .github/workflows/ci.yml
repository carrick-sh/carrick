  cross-check-macos:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      infrastructure: ${{ steps.infrastructure.outputs.failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Install Clang C cross toolchain
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        timeout-minutes: 8
        uses: ./.github/actions/ci-fetch
        with:
          recipe: ci-install-freebsd-cross
          path: ~/.cache/carrick-ci/apt
          key: ci-apt-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-bsd-cross-${{ hashFiles('justfile') }}
      - name: Cross-check and clippy macOS closure (including tests)
        if: ${{ !cancelled() && env.CARRICK_CI_FETCH_FAILURE == '' }}
        run: just cross-check-macos
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

      - name: Report infrastructure fetch status
        id: infrastructure
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report

  # Single ruleset check. Only a successful docs-only PR filter permits skips;
  # a failed/cancelled filter or an unexpectedly skipped dependency is red.

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - actionlint
      - linked-issue
      - commit-trailers
      - lint
      - portable
      - linux-doc
      - macos-clippy
      - macos-build
      - macos-unit-a
      - macos-unit-b
      - macos-integration
      - cross-check-linux
      - kernel-linux-native
      - cross-check-freebsd
      - cross-check-netbsd
      - cross-check-macos
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore CI inputs
        id: setup
        uses: ./.github/actions/ci-setup
        timeout-minutes: 12
        with:
          toolchain: 'false'
          tools: ''
          cargo: 'false'
      - name: Require every applicable job to succeed
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_LOWER_LAYER: ${{ needs.changes.outputs.lower_layer }}
          CI_CHILD_PR: ${{ needs.changes.outputs.child_pr }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: just ci-results
      - name: Report infrastructure fetch status
        if: ${{ always() }}
        uses: ./.github/actions/ci-fetch-report
