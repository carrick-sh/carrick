  # Single ruleset check. Only a successful docs-only PR filter permits skips;
  # a failed/cancelled filter or an unexpectedly skipped dependency is red.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - xtask-build
      - xtask-tests-build
      - actionlint
      - linked-issue
      - commit-trailers
      - lint-clippy
      - lint-gates
      - lint-domains
      - portable
      - loom
      - linux-doc
      - macos-clippy
      - macos-authority
      - macos-build
      - macos-unit-a
      - macos-unit-b
      - macos-integration
      - cross-check-linux
      - kernel-linux-native
      - cross-check-freebsd
      - cross-check-netbsd
      - cross-check-macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Require every applicable job to succeed
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_LOWER_LAYER: ${{ needs.changes.outputs.lower_layer }}
          CI_CHILD_PR: ${{ needs.changes.outputs.child_pr }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: just ci-results
