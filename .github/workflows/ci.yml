            sccache-linux-x64-
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug-v2
          cache-workspace-crates: "true"
          cache-targets: false
          save-if: false
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Download xtask
        uses: actions/download-artifact@v4
        with:
          name: xtask-linux-x64
          path: ${{ runner.temp }}/xtask
      - name: Configure xtask artifact
        run: |
          chmod +x "$RUNNER_TEMP/xtask/carrick-xtask"
          echo "CARRICK_XTASK_BIN=$RUNNER_TEMP/xtask/carrick-xtask" >> "$GITHUB_ENV"
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Identify the runner image for the apt cache
        id: runner-image
        if: ${{ !cancelled() }}
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore cross toolchain packages
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-cross
          key: apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}
          restore-keys: apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-
      - name: Install FreeBSD C cross toolchain
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: just ci-install-freebsd-cross
      # Saved even when the download timed out, so a throttled mirror's
      # progress carries to the next run; only a complete set takes the key.
      - name: Choose the cross toolchain package cache key
        id: apt-cross-key
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/apt-cross/complete" ]]; then
            echo "key=apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}" >> "$GITHUB_OUTPUT"
          else
            echo "key=apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Save cross toolchain packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-cross
          key: ${{ steps.apt-cross-key.outputs.key }}
      - name: Cache FreeBSD sysroot
        id: fbsd-sysroot
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.FBSD_SYSROOT }}
          key: freebsd-sysroot-${{ env.FBSD_VERSION }}
      - name: Fetch FreeBSD headers and libraries from permanent archive
        if: ${{ !cancelled() && steps.fbsd-sysroot.outputs.cache-hit != 'true' }}
        run: just ci-freebsd-sysroot
      - name: Save FreeBSD sysroot on trusted main runs
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.FBSD_SYSROOT }}
          key: freebsd-sysroot-${{ env.FBSD_VERSION }}
      - name: Cross-check FreeBSD CLI and runtime (including tests)
        if: ${{ !cancelled() }}
        env:
          CC_x86_64_unknown_freebsd: clang
          CXX_x86_64_unknown_freebsd: clang++
          AR_x86_64_unknown_freebsd: llvm-ar
          CFLAGS_x86_64_unknown_freebsd: --target=x86_64-unknown-freebsd${{ env.FBSD_MAJOR }} --sysroot=${{ env.FBSD_SYSROOT }}
          CXXFLAGS_x86_64_unknown_freebsd: --target=x86_64-unknown-freebsd${{ env.FBSD_MAJOR }} --sysroot=${{ env.FBSD_SYSROOT }}
