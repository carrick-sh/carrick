  cross-check-netbsd:
    needs: [changes, xtask-build]
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R2 reader for the compiler cache (#858).
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      NBSD_VERSION: "10.1"
      NBSD_SYSROOT: ${{ github.workspace }}/.netbsd-sysroot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        id: compiler-cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/ci/compiler-cache-env.sh linux-x64 read-only
      - name: Restore shared compiler cache (read-only)
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            sccache-linux-x64-
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug-v2
          cache-workspace-crates: "true"
          cache-targets: false
          save-if: false
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Download xtask
        uses: actions/download-artifact@v4
        with:
          name: xtask-linux-x64
          path: ${{ runner.temp }}/xtask
      - name: Configure xtask artifact
        run: |
          chmod +x "$RUNNER_TEMP/xtask/carrick-xtask"
          echo "CARRICK_XTASK_BIN=$RUNNER_TEMP/xtask/carrick-xtask" >> "$GITHUB_ENV"
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Identify the runner image for the apt cache
        id: runner-image
        if: ${{ !cancelled() }}
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore cross toolchain packages
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-cross
          key: apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}
          restore-keys: apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-
      - name: Install BSD C cross toolchain
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: just ci-install-freebsd-cross
      # Saved even when the download timed out, so a throttled mirror's
      # progress carries to the next run; only a complete set takes the key.
      - name: Choose the cross toolchain package cache key
        id: apt-cross-key
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/apt-cross/complete" ]]; then
            echo "key=apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}" >> "$GITHUB_OUTPUT"
          else
            echo "key=apt-ci-install-freebsd-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Save cross toolchain packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-cross
          key: ${{ steps.apt-cross-key.outputs.key }}
      - name: Cache NetBSD sysroot
        id: nbsd-sysroot
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NBSD_SYSROOT }}
          key: netbsd-authority-sysroot-${{ env.NBSD_VERSION }}
      - name: Fetch NetBSD C headers from permanent archive
        if: ${{ !cancelled() && steps.nbsd-sysroot.outputs.cache-hit != 'true' }}
        run: just ci-netbsd-sysroot
      - name: Save NetBSD sysroot on trusted main runs
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NBSD_SYSROOT }}
          key: netbsd-authority-sysroot-${{ env.NBSD_VERSION }}
      - name: Cross-check NetBSD NVMM backend (including tests)
        if: ${{ !cancelled() }}
        run: just check-netbsd
      - name: Enforce live NetBSD authority ceilings
        if: ${{ !cancelled() }}
        run: just authority-check-cross x86_64-unknown-netbsd clang "--target=x86_64-unknown-netbsd --sysroot=${{ env.NBSD_SYSROOT }}" llvm-ar

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

