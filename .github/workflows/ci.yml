          restore-keys: apt-ci-install-linux-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-
      - name: Install Linux C cross toolchain
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: just ci-install-linux-cross
      # Saved even when the download timed out, so a throttled mirror's
      # progress carries to the next run; only a complete set takes the key.
      - name: Choose the cross toolchain package cache key
        id: apt-cross-key
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/apt-cross/complete" ]]; then
            echo "key=apt-ci-install-linux-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}" >> "$GITHUB_OUTPUT"
          else
            echo "key=apt-ci-install-linux-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Save cross toolchain packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
