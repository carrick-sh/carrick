name: Hosted CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # Nightly catches hosted runner-image drift with the repository toolchain.
  schedule:
    - cron: "0 7 * * *"

# Superseding a PR saves minutes; main and merge-group runs must finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Swatinem/rust-cache exports CARGO_INCREMENTAL=0 in the jobs that use it, and
  # sccache hashes every CARGO_* variable into its key. Pin it workflow-wide so
  # cache-warm (which has no rust-cache) writes entries the PR/merge-group jobs
  # can hit.
  CARGO_INCREMENTAL: "0"
  # Only cache-warm publishes the three bounded hosted compiler caches.
  SCCACHE_CACHE_SIZE: "3G"
  # Hosted jobs share one unbounded compiler cache in Cloudflare R2 (#858);
  # scripts/ci/compiler-cache-env.sh selects it per job. The reader
  # credentials are job-level env on each GitHub-hosted job that compiles,
  # never workflow-wide: jobs that do not compile and jobs on the self-hosted
  # Mac never receive them. Only cache-warm gets the writer pair. Forks and
  # Dependabot see empty secrets and fall back to the bounded GitHub cache.
  CARRICK_SCCACHE_R2_BUCKET: carrick-sccache
  CARRICK_SCCACHE_R2_ENDPOINT: https://687f8b8c824af34922f7bb4d1776f1a7.r2.cloudflarestorage.com
  # Harden registry transport against intermittent network errors without retrying tests.
  CARGO_HTTP_MULTIPLEXING: "false"   # avoid HTTP/2 framing failures against the crates.io index
  CARGO_NET_RETRY: "10"              # transport retries for registry/download fetches only
  RUST_BACKTRACE: 1
  CARRICK_PROBE_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  CARRICK_AUTHORITY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  xtask-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # R2 reader for the compiler cache (#858).
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,sccache@0.18.0
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure compiler cache
        id: compiler-cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/ci/compiler-cache-env.sh linux-x64 read-only
      - name: Restore shared compiler cache (read-only)
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            sccache-linux-x64-
      - name: Build lean xtask
        run: just ci-prebuild-xtask
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: xtask-linux-x64
          path: target/debug/carrick-xtask
          retention-days: 1
          overwrite: true

  # Trusted default-branch publishers only; PR and queue jobs never save.
  cache-warm:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: linux-x64
            runner: ubuntu-latest
            cache-size: 3G
          - family: darwin-hosted
            runner: macos-15
            cache-size: 2G
          - family: linux-arm64
            runner: ubuntu-24.04-arm
            cache-size: 512M
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # The R2 writer token is an environment secret, readable only by jobs
    # running from main under this environment's deployment-branch rule; a
    # workflow edited on another branch cannot reach it (repository secrets
    # ignore this job's `if:`).
    environment: sccache-writer
    env:
      # Reserve quota for the two retained target caches and package/sysroot caches.
      SCCACHE_CACHE_SIZE: ${{ matrix.cache-size }}
      # The only R2 writer; PR and queue jobs keep the read-only token.
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_WRITER_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_WRITER_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,sccache@0.18.0
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure compiler cache
        id: compiler-cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/ci/compiler-cache-env.sh ${{ matrix.family }} read-write
      - name: Restore shared compiler cache (read-only)
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ matrix.family }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.family }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            sccache-${{ matrix.family }}-
      - name: Identify runner image for warm cross toolchains
        id: warm-runner-image
        if: matrix.family == 'linux-x64'
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Linux cross toolchain packages for warming
        if: matrix.family == 'linux-x64'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-cross
          key: apt-ci-install-linux-cross-${{ steps.warm-runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}
          restore-keys: apt-ci-install-linux-cross-${{ steps.warm-runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-
      - name: Restore BSD cross toolchain packages for warming
        if: matrix.family == 'linux-x64'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-bsd
          key: apt-ci-install-freebsd-cross-${{ steps.warm-runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}
          restore-keys: apt-ci-install-freebsd-cross-${{ steps.warm-runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-
      - name: Install the cross compiler union from existing package caches
        if: matrix.family == 'linux-x64'
        run: |
          scripts/ci/apt-cached-install.sh "$RUNNER_TEMP/apt-cross" gcc-aarch64-linux-gnu
          scripts/ci/apt-cached-install.sh "$RUNNER_TEMP/apt-bsd" clang llvm
      - name: Warm native build and test compilation union
        env:
          FAMILY: ${{ matrix.family }}
          RUSTC_WRAPPER: sccache
          FBSD_VERSION: 14.3-RELEASE
          FBSD_MAJOR: "14"
          FBSD_SYSROOT: ${{ github.workspace }}/.freebsd-sysroot
          NBSD_VERSION: "10.1"
          NBSD_SYSROOT: ${{ github.workspace }}/.netbsd-sysroot
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          case "$FAMILY" in
            darwin-hosted)
              just build
              just doc
              # Debug PR checks/tests run last to survive bounded-cache eviction.
              just check
              # Fresh Cargo outputs skip sccache entirely. Replay the critical
              # graph after clearing only this ephemeral hosted target directory.
              cargo clean
              just ci-prebuild-xtask
              export CARRICK_XTASK_BIN="$PWD/target/debug/carrick-xtask"
              just xtask test-batch --no-run test
              just xtask test-batch --no-run test-integration
              just clippy
              just test-xtask --no-run
              ;;
            linux-x64)
              just check-kernel-portable
              just ci-freebsd-sysroot
              just ci-netbsd-sysroot
              just check-linux
              CC_x86_64_unknown_freebsd=clang CXX_x86_64_unknown_freebsd=clang++ AR_x86_64_unknown_freebsd=llvm-ar CFLAGS_x86_64_unknown_freebsd="--target=x86_64-unknown-freebsd14 --sysroot=$FBSD_SYSROOT" CXXFLAGS_x86_64_unknown_freebsd="--target=x86_64-unknown-freebsd14 --sysroot=$FBSD_SYSROOT" just check-freebsd
              just check-netbsd
              just cross-check-macos
              just check-fuzz
              just doc
              # Cross/release/doc entries yield to the debug PR-critical set.
              just check
              just test-loom --no-run
              just test-kernel-semantics --no-run
              cargo test --locked --no-run -p carrick-host-linux
              cargo test --locked --no-run -p carrick-softcpu-x86 --lib --tests
              just clippy
              # Refresh compiler-cache LRU even when earlier Cargo outputs are
              # fresh. Keep the default admission build and the exact all-feature
              # test artifact consumed by lint-gates/lint-domains last.
              cargo clean
              just ci-prebuild-xtask
              export CARRICK_XTASK_BIN="$PWD/target/debug/carrick-xtask"
              just xtask test-batch --no-run test
              just xtask test-batch --no-run test-integration
              just ci-build-xtask-tests
              ;;
            linux-arm64)
              just ci-prebuild-xtask
              cargo check --locked -p carrick-kernel-example --tests
              cargo build --locked -p carrick-kernel-example --tests
              cargo test --locked --no-run -p carrick-kernel-example --tests
              ;;
          esac
      - name: Compiler cache statistics after critical replay
        run: just build-cache
      - name: Save shared compiler cache
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ matrix.family }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}

  changes:
    name: changes
    runs-on: ubuntu-latest
    # Restoring the 3 GiB shared compiler cache and building xtask can take
    # over five minutes on a slow runner; a cancelled `changes` fails ci-ok.
    timeout-minutes: 12
    env:
      # R2 reader for the compiler cache (#858).
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      macos: ${{ steps.filter.outputs.macos }}
      workflows: ${{ steps.filter.outputs.workflows }}
      lower_layer: ${{ steps.filter.outputs.lower_layer }}
      child_pr: ${{ steps.filter.outputs.child_pr }}
      # Only same-repository pull_request jobs run on the self-hosted
      # carrick-m4 ci runner (dedicated non-admin user, no sudo; #650).
      # Fork PRs, merge groups (which may queue fork code) and the
      # cache-saving schedule events stay hosted, so no trusted or
      # cache-publishing job shares that persistent host with PR code.
      macos_runner: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","macOS","ARM64","carrick-macos-ci"]' || '"macos-15"' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,sccache@0.18.0
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure compiler cache
        id: compiler-cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/ci/compiler-cache-env.sh linux-x64 read-only
      - name: Restore shared compiler cache (read-only)
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            sccache-linux-x64-
      - name: Detect changed surfaces
        id: filter
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CI_BASE_REF: ${{ github.event.merge_group.base_ref }}
          CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: just ci-changes

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  xtask-tests-build:
    needs: [changes, xtask-build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R2 reader for the compiler cache (#858).
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,sccache@0.18.0
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure compiler cache
        id: compiler-cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/ci/compiler-cache-env.sh linux-x64 read-only
      - name: Restore shared compiler cache (read-only)
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            sccache-linux-x64-
      - name: Download xtask
        uses: actions/download-artifact@v4
        with:
          name: xtask-linux-x64
          path: ${{ runner.temp }}/xtask
      - name: Configure xtask artifact
        run: |
          chmod +x "$RUNNER_TEMP/xtask/carrick-xtask"
          echo "CARRICK_XTASK_BIN=$RUNNER_TEMP/xtask/carrick-xtask" >> "$GITHUB_ENV"
      - name: Compile the all-features xtask test union once
        run: just ci-build-xtask-tests
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: xtask-tests-linux-x64
          path: target/xtask-tests.tar.gz
          # The tarball is already compressed; avoid compressing it again.
          compression-level: 0
          retention-days: 1
          overwrite: true

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # install-action's pinned manifest lacks actionlint and falls back to
      # cargo-binstall (not a crate); fetch the official release, pinned.
      - name: Install actionlint 1.7.12 (checksum-pinned)
        run: |
          set -euo pipefail
          v=1.7.12
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${v}/$f"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

  # GitHub-first rule: a non-docs PR must link an issue. Runs on every event so
  # ci-ok can require plain success; it passes trivially in the merge queue.
  linked-issue:
    name: linked-issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test the gate
        run: scripts/ci/test-require-linked-issue.sh
      - name: Require a linked issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/require-linked-issue.sh

  # Enforce canonical Co-Authored-By trailers on all non-merge PR commits.
  # Runs on every event so ci-ok can require plain success; it passes trivially
  # outside pull_request.
  commit-trailers:
    needs: xtask-build
    name: commit-trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skip non-pull-request events
        if: github.event_name != 'pull_request'
        run: echo "commit-trailers (${{ github.event_name }}) is not a pull_request; passing."
      - name: Download xtask
        uses: actions/download-artifact@v4
        with:
          name: xtask-linux-x64
          path: ${{ runner.temp }}/xtask
      - name: Configure xtask artifact
        run: |
          chmod +x "$RUNNER_TEMP/xtask/carrick-xtask"
          echo "CARRICK_XTASK_BIN=$RUNNER_TEMP/xtask/carrick-xtask" >> "$GITHUB_ENV"
      - name: Enforce Co-Authored-By trailers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$CARRICK_XTASK_BIN" commit-trailers check-range "$BASE_SHA..$HEAD_SHA"'

  # Independent checks keep reporting after an earlier check fails. No
  # continue-on-error: every failure still makes its job (and ci-ok) fail.

  lint-clippy:
    needs: [changes, xtask-build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R2 reader for the compiler cache (#858).
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        id: compiler-cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/ci/compiler-cache-env.sh linux-x64 read-only
      - name: Restore shared compiler cache (read-only)
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-x64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            sccache-linux-x64-
      - id: lint-target-cache
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug-v2
          cache-workspace-crates: "true"
          cache-targets: true
          save-if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Download xtask
        uses: actions/download-artifact@v4
        with:
          name: xtask-linux-x64
          path: ${{ runner.temp }}/xtask
      - name: Configure xtask artifact
        run: |
          chmod +x "$RUNNER_TEMP/xtask/carrick-xtask"
          echo "CARRICK_XTASK_BIN=$RUNNER_TEMP/xtask/carrick-xtask" >> "$GITHUB_ENV"
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Report retained clippy target cache
        run: echo "target-cache-hit=${{ steps.lint-target-cache.outputs.cache-hit }}"
      - name: Clippy (no-panic gate)
        if: ${{ !cancelled() }}
        run: just clippy
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  lint-gates:
    needs: [changes, xtask-build, xtask-tests-build]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R2 reader for the compiler cache (#858).
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,cargo-deny
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        id: compiler-cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/ci/compiler-cache-env.sh linux-x64 read-only
      - name: Restore shared compiler cache (read-only)
        if: steps.compiler-cache.outputs.backend == 'gha'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
