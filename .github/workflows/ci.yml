name: Hosted CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # Nightly catches hosted runner-image drift with the repository toolchain.
  schedule:
    - cron: "0 7 * * *"

# Superseding a PR saves minutes; main and merge-group runs must finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ephemeral hosted runners persist this bounded compiler cache via rust-cache.
  SCCACHE_CACHE_SIZE: "1G"
  # Harden registry transport against intermittent network errors without retrying tests.
  CARGO_HTTP_MULTIPLEXING: "false"   # avoid HTTP/2 framing failures against the crates.io index
  CARGO_NET_RETRY: "10"              # transport retries for registry/download fetches only
  RUST_BACKTRACE: 1
  CARRICK_PROBE_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  CARRICK_AUTHORITY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      macos: ${{ steps.filter.outputs.macos }}
      workflows: ${{ steps.filter.outputs.workflows }}
      lower_layer: ${{ steps.filter.outputs.lower_layer }}
      child_pr: ${{ steps.filter.outputs.child_pr }}
      # Only same-repository pull_request jobs run on the self-hosted
      # carrick-m4 ci runner (dedicated non-admin user, no sudo; #650).
      # Fork PRs, merge groups (which may queue fork code) and the
      # cache-saving push/schedule events stay hosted, so no trusted or
      # cache-publishing job shares that persistent host with PR code.
      macos_runner: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","macOS","ARM64","carrick-macos-ci"]' || '"macos-15"' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Detect changed surfaces
        id: filter
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CI_BASE_REF: ${{ github.event.merge_group.base_ref }}
          CI_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: just ci-changes
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # install-action's pinned manifest lacks actionlint and falls back to
      # cargo-binstall (not a crate); fetch the official release, pinned.
      - name: Install actionlint 1.7.12 (checksum-pinned)
        run: |
          set -euo pipefail
          v=1.7.12
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${v}/$f"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

  # GitHub-first rule: a non-docs PR must link an issue. Runs on every event so
  # ci-ok can require plain success; it passes trivially in the merge queue.
  linked-issue:
    name: linked-issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test the gate
        run: scripts/ci/test-require-linked-issue.sh
      - name: Require a linked issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/require-linked-issue.sh

  # Enforce canonical Co-Authored-By trailers on all non-merge PR commits.
  # Runs on every event so ci-ok can require plain success; it passes trivially
  # outside pull_request.
  commit-trailers:
    name: commit-trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skip non-pull-request events
        if: github.event_name != 'pull_request'
        run: echo "commit-trailers (${{ github.event_name }}) is not a pull_request; passing."
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        if: github.event_name == 'pull_request'
        with:
          shared-key: gate-xtask-release
          cache-workspace-crates: "true"
          save-if: false
      - name: Build xtask
        if: github.event_name == 'pull_request'
        run: cargo build --locked --release -p carrick-xtask
      - name: Enforce Co-Authored-By trailers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: target/release/carrick-xtask commit-trailers check-range "$BASE_SHA..$HEAD_SHA"

  # Independent checks keep reporting after an earlier check fails. No
  # continue-on-error: every failure still makes its job (and ci-ok) fail.

  lint:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,cargo-deny
      - name: Fetch and validate probe coverage base commit
        env:
          CI_EVENT: ${{ github.event_name }}
        run: just ci-probe-coverage-base
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Install Semgrep
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: just ci-install-semgrep
      - name: Exact Linux and macOS unit shard coverage
        if: ${{ !cancelled() }}
        run: just check-test-shards
      - name: Xtask unit and CI gate tests
        if: ${{ !cancelled() }}
        run: just test-xtask
      - name: Formatting
        if: ${{ !cancelled() }}
        run: just fmt-check
      - name: Clippy (no-panic gate)
        if: ${{ !cancelled() }}
        run: just clippy
      - name: Clippy Linux crates (all targets)
        if: ${{ !cancelled() }}
        run: just clippy-linux
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: just deny
      - name: Support matrix drift
        if: ${{ !cancelled() }}
        run: just check-matrix
      - name: Layering and product feature closure
        if: ${{ !cancelled() }}
        run: just check-layering
      - name: Conformance contract coverage (PR changed surfaces)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: just check-contract-change "$CI_BASE" "$GITHUB_SHA"
      - name: Host-independent typed-domain checks and contract registry
        if: ${{ !cancelled() }}
        run: just lint-domains-source

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  portable:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Compiler cache fallback without sccache
        run: cargo test -p carrick-xtask --test build_cache
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Identify the runner image for the apt cache
        id: runner-image
        if: ${{ !cancelled() }}
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore cross toolchain packages
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-cross
          key: apt-ci-install-linux-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}
          restore-keys: apt-ci-install-linux-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-
      - name: Install Linux C cross toolchain
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: just ci-install-linux-cross
      # Saved even when the download timed out, so a throttled mirror's
      # progress carries to the next run; only a complete set takes the key.
      - name: Choose the cross toolchain package cache key
        id: apt-cross-key
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/apt-cross/complete" ]]; then
            echo "key=apt-ci-install-linux-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}" >> "$GITHUB_OUTPUT"
          else
            echo "key=apt-ci-install-linux-cross-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/ci/apt-cached-install.sh') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Save cross toolchain packages
        if: ${{ !cancelled() }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-cross
          key: ${{ steps.apt-cross-key.outputs.key }}
      - name: Portable kernel compile (aarch64-linux lib, tests and semantics)
        if: ${{ !cancelled() }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: just check-kernel-portable
      - name: Kernel semantics on x86_64 Linux
        if: ${{ !cancelled() }}
        run: just test-kernel-semantics

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  loom:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # The fd-core model alone runs about 15 minutes on an M-class core.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Loom protocol models (first entry, fd, kernel wake, terminal clear, invalidation domain)
        if: ${{ !cancelled() }}
        run: just test-loom

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  linux-doc:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Linux crate rustdoc (including Linux host and KVM modules)
        if: ${{ !cancelled() }}
        run: just doc
      - name: Fuzz harness compile-check
        if: ${{ !cancelled() }}
        run: just check-fuzz

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  macos-clippy:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos_runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Fetch and validate authority debt base commit
        env:
          CI_EVENT: ${{ github.event_name }}
        run: just ci-probe-coverage-base
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Clippy (no-panic gate)
        if: ${{ !cancelled() }}
        run: just clippy
      - name: Live host-authority compiler census
        if: ${{ !cancelled() }}
        run: cargo run --locked -p carrick-xtask -- authority-debt

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  macos-build:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos_runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Workspace build
        if: ${{ !cancelled() }}
        run: just check --workspace
      # The live census and rustdoc retain macOS cfg/backend coverage.
      # Linux runs source-only authority checks and its own rustdoc separately.
      - name: Workspace rustdoc
        if: ${{ !cancelled() }}
        run: just doc

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  macos-unit-a:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true' && github.event_name != 'merge_group'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos_runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Configure persisted compiler cache
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/carrick-sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          shared-key: ${{ github.job }}-debug
          cache-directories: ${{ env.SCCACHE_DIR }}
          cache-workspace-crates: "true"
          save-if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
      - name: Install per-user compiler cache
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: sccache@0.18.0
      - name: Prebuild cached xtask admission helpers
        run: just ci-prebuild-xtask
      - name: Unit tests shard A (host test lanes)
        if: ${{ !cancelled() }}
        run: just ci-macos-test test-shard-a

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: just build-cache

  macos-unit-b:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.lower_layer != 'true' && needs.changes.outputs.heavy == 'true' && needs.changes.outputs.macos == 'true' && github.event_name != 'merge_group'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos_runner) }}
    timeout-minutes: 60
    steps:
