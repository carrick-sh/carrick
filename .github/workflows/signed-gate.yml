name: Signed gate

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number, or main to publish a baseline
        required: true
        type: string
      sha:
        description: Exact full commit SHA (current PR head or a main ancestor)
        required: true
        type: string
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'gate:signed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      base: ${{ steps.request.outputs.base }}
      main: ${{ steps.request.outputs.main }}
    steps:
      - name: Refuse unauthorized actors before checking out code
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          # Owner only: the carrick-workers App is agent-held (#654).
          case "$ACTOR" in tjfontaine) ;; *) exit 1 ;; esac
          case "$TRIGGERING_ACTOR" in tjfontaine) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Authorize exact SHA and retrieve merge-base baseline
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo run --locked -p carrick-xtask -- signed-gate prepare
          --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/request"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request/
          if-no-files-found: error

  # Build the exact-SHA fixture bundle on a hosted, ephemeral ARM Linux runner
  # with no secrets (the same pattern as kernel-runtime's signed-fixtures job).
  # A static bundle path on each Mac goes stale whenever fixture inputs change.
  fixtures:
    needs: authorize
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      bundle-name: ${{ steps.bundle.outputs.name }}
      bundle-sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Verify native ARM Linux publisher
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
      - name: Install pinned Rust toolchain and guest targets
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just,sccache@0.18.0
      - name: Publish exact-SHA fixture bundle
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
        run: just fixtures-publish "$SHA"
      # The archive basename is the manifest digest, not the archive digest.
      - name: Record fixture archive transport identity
        id: bundle
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(target/fixtures/published/"$SHA"/*.tar.gz)
          test "${#bundles[@]}" -eq 1
          digest=$(sha256sum "${bundles[0]}")
          test "$(wc -c < "${bundles[0]}")" -gt 0
          printf 'name=%s\nsha256=%s\n' "${bundles[0]##*/}" "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-fixtures-${{ needs.authorize.outputs.sha }}-${{ github.run_attempt }}
          path: target/fixtures/published/${{ needs.authorize.outputs.sha }}/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  gate:
    needs: [authorize, fixtures]
    runs-on: [self-hosted, macOS, ARM64, carrick-signed-gate]
    timeout-minutes: 240
    # GitHub has not assigned runner.name when it evaluates concurrency.
    # The runner schedules one job at a time; execute holds the per-host gate
    # lease across restore/build/accept/identity inspection. This additional
    # group suppresses duplicate requests for one SHA across both Macs.
    concurrency:
      group: signed-gate-${{ needs.authorize.outputs.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request
      - name: Download the exact-SHA fixture bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-fixtures-${{ needs.authorize.outputs.sha }}-${{ github.run_attempt }}
          path: target/fixtures/incoming
      - name: Verify fixture archive transport digest
        env:
          BUNDLE_NAME: ${{ needs.fixtures.outputs.bundle-name }}
          BUNDLE_SHA256: ${{ needs.fixtures.outputs.bundle-sha256 }}
        run: scripts/ci/download-fixture-bundle.sh verify
      - name: Execute approved SHA in a fresh detached worktree
        env:
          CARRICK_RUN_ID: signed-gate-${{ github.run_id }}-${{ github.run_attempt }}
          # This run's exact-SHA bundle; restore re-verifies its input identity
          # against the candidate tree. No API credential reaches candidate code.
          BUNDLE_NAME: ${{ needs.fixtures.outputs.bundle-name }}
        run: >-
          CARRICK_SIGNED_FIXTURE_BUNDLE="$PWD/target/fixtures/incoming/$BUNDLE_NAME"
          cargo run --locked -p carrick-xtask -- signed-gate execute
          --request "$RUNNER_TEMP/request/request.json" --output "$RUNNER_TEMP/signed-result"
      - name: Upload receipt, artifact identity and step logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-result/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [authorize, gate]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request
      - name: Download execution evidence when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signed-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-result
      - name: Compare typed receipts and publish verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXECUTION_RESULT: ${{ needs.gate.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/signed-result"
          cargo run --locked -p carrick-xtask -- signed-gate publish \
            --request "$RUNNER_TEMP/request/request.json" --results "$RUNNER_TEMP/signed-result" \
            --run-url "$RUN_URL" --execution-result "$EXECUTION_RESULT"
      - name: Publish admitted main baseline
        if: needs.authorize.outputs.main == 'true' && steps.verdict.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: signed-baseline-${{ needs.authorize.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-result/candidate.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload comparison and publication log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-verdict-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/request/
            ${{ runner.temp }}/signed-result/diff.json
            ${{ runner.temp }}/signed-result/comment.md
          if-no-files-found: warn
          retention-days: 30
