name: Soft aarch64 on demand

# Runs the soft aarch64 witnesses on GitHub's hosted Linux ARM64 runner against
# any branch or SHA in this repository, on request. The soft CPU's block runner
# needs a Linux arm64 host: macOS refuses it (UnsupportedHost) and the x86
# sandbox VMs can't run it, so this is the venue for diagnosing a soft-lane
# failure without pushing to a pull request (#2843).
#
# Only people with write access can dispatch it. It checks out the requested
# ref with no persisted credentials, gets no secrets (no compiler-cache
# credentials, so it builds cold), and only reads repository contents.
#
# Dispatch from main: gh workflow run soft-a64-dispatch.yml -f ref=<branch-or-sha>
#   [-f filter=<test name>] [-f ignored=false]. The workflow definition comes
# from the dispatched branch (main); the code under test, including the
# repository's local actions and scripts/ci, comes from `ref`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch name or full commit SHA in this repository
        required: true
        type: string
      filter:
        description: Test name filter passed to libtest (empty runs every soft test)
        required: false
        default: ""
        type: string
      ignored:
        description: Also run the ignored witnesses that need the production EL1 ELF
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: soft-a64-dispatch-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  soft-a64:
    name: soft aarch64 on demand (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Record the tested commit
        run: |
          mkdir -p soft-aarch64-logs
          git rev-parse HEAD | tee soft-aarch64-logs/head.txt
      - name: Prepare pinned Debian arm64 glibc fixture
        run: |
          root=$(mktemp -d "$RUNNER_TEMP/soft-a64-glibc.XXXXXX")
          scripts/ci/fetch-arm64-cross-libc.sh "$root"
          printf 'CARRICK_A64_DYN_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Export pinned arm64 CPython fixture
        run: |
          root=$(mktemp -d "$RUNNER_TEMP/soft-a64-python.XXXXXX")
          scripts/ci/fetch-arm64-python.sh "$root"
          printf 'CARRICK_A64_PYTHON_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Soft aarch64 tests
        env:
          # Inputs reach the script only through the environment, never by
          # interpolation into the script text.
          FILTER: ${{ inputs.filter }}
          IGNORED: ${{ inputs.ignored }}
        run: |
          set -u
          status=0
          filter=()
          [ -n "$FILTER" ] && filter=("$FILTER")
          # The unit pass always runs (the same three packages as ci.yml's
          # soft-aarch64-native job); the ignored witnesses run on top of it.
          cargo test -p carrick-softcpu-aarch64 -p carrick-host-jit -p carrick-softcpu-aarch64-host \
            -- "${filter[@]}" > soft-aarch64-logs/unit.log 2>&1 || status=$?
          cat soft-aarch64-logs/unit.log
          if [ "$IGNORED" = "true" ]; then
            cargo build -p carrick-el1-image > soft-aarch64-logs/el1-build.log 2>&1 || status=$?
            cat soft-aarch64-logs/el1-build.log
            [ "$status" -eq 0 ] || exit "$status"
            elf=$(find target/debug/build -path '*carrick-el1-image-*/out/el1-target/aarch64-unknown-none-softfloat/el1-image/carrick-el1' -type f -print -quit)
            [ -n "$elf" ] || { echo "production EL1 ELF not found" >&2; exit 1; }
            sysroot=$(rustc --print sysroot)
            host=$(rustc -vV | sed -n 's/^host: //p')
            export CARRICK_LLVM_OBJDUMP="$sysroot/lib/rustlib/$host/bin/llvm-objdump"
            CARRICK_A64_ELF="$PWD/$elf" cargo test --release -p carrick-softcpu-aarch64 -p carrick-softcpu-aarch64-host --tests \
              -- --ignored --nocapture "${filter[@]}" \
              --skip generated_loader_vector_spans_are_typed \
              --skip production_loader_vector_spans_split_and_translate_with_no_undefined_word \
              > soft-aarch64-logs/probe.log 2>&1 || status=$?
            cat soft-aarch64-logs/probe.log
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: soft-a64-dispatch-logs
          path: soft-aarch64-logs
          retention-days: 7
