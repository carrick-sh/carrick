# Regenerate a PR head's test lists (#2328 item 4). PR CI (ci.yml) publishes
# `test-list-<isa>-<shard>-<head>` artifacts for heads it ran after this landed;
# for a head whose CI ran earlier (or without them), agy-director's
# land-when-green.sh dispatches this once from main (`gh workflow run
# test-list.yml --ref main -f head=<sha>`) instead of refusing the PR. The
# workflow definition is main's; the code listed is the PR head's, read-only:
# no secrets, no write token (the lists are ground truth against honest
# mistakes under the owner's sole-collaborator threat model, 2026-11-05).
name: Test lists
run-name: test-list ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      head:
        description: The PR head commit to list
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-list-${{ inputs.head }}
  cancel-in-progress: false

jobs:
  x86:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Refuse a head that isn't a full commit SHA
        env:
          HEAD: ${{ inputs.head }}
        run: '[[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head must be a 40-hex commit SHA"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: just
      - name: Install repository Rust toolchain
        run: just ci-toolchain
      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: Install Linux C cross toolchain
        timeout-minutes: 12
        run: just ci-install-linux-cross
      - name: List the compiled tests (x86, test)
        env:
          HEAD: ${{ inputs.head }}
        run: just xtask test-list --head "$HEAD" --isa x86 --recipe test --lane kvm --out "target/test-list-x86-host.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-list-x86-host-${{ inputs.head }}
          path: target/test-list-x86-host.json
          if-no-files-found: error
          retention-days: 14

  arm:
    runs-on: [self-hosted, macOS, ARM64, carrick-macos-ci]
    timeout-minutes: 120
    steps:
      - name: Refuse a head that isn't a full commit SHA
        env:
          HEAD: ${{ inputs.head }}
        run: '[[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head must be a 40-hex commit SHA"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/install-tools
        with:
          tools: just
      - name: Prepare locked Cargo cache (infrastructure)
        uses: ./.github/actions/prepare-cargo
      - name: List the compiled tests (arm, test-shard-a and the signed lanes)
        env:
          HEAD: ${{ inputs.head }}
        run: just lease carrick just xtask test-list --head "$HEAD" --isa arm --recipe test-shard-a --lane signed-hvf --lane signed-cli --out "target/test-list-arm-a.json"
      - name: List the compiled tests (arm, test-shard-b)
        env:
          HEAD: ${{ inputs.head }}
        run: just lease carrick just xtask test-list --head "$HEAD" --isa arm --recipe test-shard-b --out "target/test-list-arm-b.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-list-arm-a-${{ inputs.head }}
          path: target/test-list-arm-a.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: test-list-arm-b-${{ inputs.head }}
          path: target/test-list-arm-b.json
          if-no-files-found: error
          retention-days: 14
