name: Dispatch issue worker

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# Issue events serialize by issue; reviews by head ref. The push lease closes cross-key races.
concurrency:
  group: dispatch-worker-${{ github.event.issue.number || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.actor == 'tjfontaine' && (github.event_name == 'issues' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/agent')) || (github.event.review.state == 'changes_requested' && startsWith(github.event.pull_request.head.ref, 'work/dispatch-')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.validate.outputs.base }}
      head: ${{ steps.validate.outputs.head }}
    steps:
      - name: Refuse stale owner reviews before checkout or build
        id: review-head
        if: github.event_name == 'pull_request_review'
        env:
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          # Authenticated: hosted runners share the unauthenticated API quota.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! live_head=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/carrick-sh/carrick/pulls/$REVIEW_PR" | jq -er '.head.sha'); then
            echo '::error::Cannot verify live PR head; refusing owner review' >&2
            exit 1
          fi
          if [[ "$live_head" != "$REVIEW_HEAD" ]]; then
            echo '::error::Stale owner review: PR head changed; submit a fresh changes_requested review' >&2
            exit 1
          fi
      - name: Resolve trusted driver base before checkout
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          base="$EVENT_SHA"
          if [ "$EVENT_NAME" != issues ]; then
            base=$(git ls-remote https://github.com/carrick-sh/carrick refs/heads/main | cut -f1)
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.base }}
          persist-credentials: false
      - name: Validate owner trigger and scope before requesting a worker
        id: validate
        env:
          CARRICK_DISPATCH_BASE: ${{ steps.base.outputs.base }}
        run: cargo run --locked --release -p carrick-xtask -- dispatch-worker guard --event "$GITHUB_EVENT_PATH"

      # REST run metadata omits issue_comment payloads. The controller uses
      # these trusted-main step names to fetch and independently verify them.
      - name: Dispatch comment ${{ github.event.issue.number }} ${{ github.event.comment.id }} ${{ steps.validate.outputs.comment }}
        if: github.event_name == 'issue_comment'
        run: ':'
      - name: Dispatch head ${{ steps.validate.outputs.head }}
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        run: ':'

  worker:
    needs: guard
    runs-on: [carrick-agent]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    # H1: no runner-owned compiler server may execute agent-selected builds.
    # Environment overrides runner Cargo config for every step.
    env:
      CARRICK_DISPATCH_BASE: ${{ needs.guard.outputs.base }}
      CARRICK_DISPATCH_HEAD: ${{ needs.guard.outputs.head }}
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      CARGO_BUILD_RUSTC_WRAPPER: ''
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ''
      CARRICK_SCCACHE: '0'
      SCCACHE_DISABLE: '1'
      SCCACHE_SERVER_UDS: ''
      SCCACHE_SERVER_PORT: '0'
      SCCACHE_DIR: ''
    timeout-minutes: 60
    steps:
      - name: Reject a pre-existing runner compiler-cache server
        run: |
          status=0
          pgrep -u "$(id -u)" -x sccache > /dev/null || status=$?
          if [ "$status" -ne 1 ]; then
            echo 'Runner compiler-cache server absent check failed; refusing agent admission' >&2
            exit 1
          fi
      - name: Mask the job token before agent execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "::add-mask::$GH_TOKEN"
      - name: Start the bounded job window
        run: echo "CARRICK_AGENT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ needs.guard.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify admitted base against freshly fetched main before building
        run: |
          git fetch --no-tags https://github.com/carrick-sh/carrick refs/heads/main
          test "$(git rev-parse HEAD)" = "$CARRICK_DISPATCH_BASE"
          git merge-base --is-ancestor "$CARRICK_DISPATCH_BASE" FETCH_HEAD
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.96.0'
      # Credentialed driver code must never be compiled from restored objects or
      # toolchains. Keep the resulting executable outside the restored target.
      - name: Build workflow driver
        id: driver
        timeout-minutes: 10
        run: |
          cargo build --locked --release -p carrick-xtask
          install -m 0700 target/release/carrick-xtask "$RUNNER_TEMP/carrick-dispatch-driver"
      - name: Bootstrap pinned agent tools and private foreground launcher
        id: bootstrap
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.AGENT_DIRECTOR_TOKEN }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" agent-runner bootstrap'
      - name: Admit continuation before agent execution
        id: admission
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" dispatch-worker guard --admit --event "$GITHUB_EVENT_PATH"'
      - name: Materialize available worker and loop credentials
        id: auth
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && steps.admission.outcome == 'success' }}
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGY_OAUTH_TOKEN: ${{ secrets.AGY_OAUTH_TOKEN }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" agent-runner auth --event "$GITHUB_EVENT_PATH"'
      - name: Run owner dispatch through the policy tool server
        id: loop
        if: ${{ !cancelled() && steps.driver.outcome == 'success' && steps.admission.outcome == 'success' }}
        timeout-minutes: 47
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/carrick-dispatch-driver" host-lease --mode carrick --check-load --
          "$RUNNER_TEMP/carrick-dispatch-driver" dispatch-worker loop --event "$GITHUB_EVENT_PATH"
          --setup-status '${{ steps.bootstrap.outcome }}/${{ steps.auth.outcome }}'
      - name: Verify retirement before credentialed completion
        id: retire
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" dispatch-worker guard --retire --event "$GITHUB_EVENT_PATH"'
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ !cancelled() && steps.retire.outcome == 'success' && steps.loop.outputs.artifacts_ready == 'true' && (steps.loop.outcome == 'success' || steps.loop.outcome == 'failure') }}
        with:
          name: dispatch-${{ steps.admission.outputs.issue }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-output
          if-no-files-found: warn
          retention-days: 30
      - name: Remove provider and launcher state
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/carrick-dispatch-driver"; then
            "$RUNNER_TEMP/carrick-dispatch-driver" agent-runner cleanup
          fi
      - name: Reflect the worker contract in the job verdict
        if: ${{ !cancelled() && steps.loop.outputs.worker_failed == 'true' }}
        run: exit 1
