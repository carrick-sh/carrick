name: Dispatch issue worker

on:
  issues:
    types: [labeled]

permissions:
  contents: read

# Per-issue serialization; the clone controller independently caps its pool at 4.
concurrency:
  group: dispatch-worker-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate actor, tier and brief before requesting a worker
        run: cargo run --locked --release -p carrick-xtask -- dispatch-worker guard --event "$GITHUB_EVENT_PATH"

  worker:
    needs: guard
    runs-on: [carrick-agent]
    environment: agent-execution
    # No runner-owned compiler server may be started before crossing the uid
    # boundary. Environment overrides runner Cargo config for every step.
    env:
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      CARGO_BUILD_RUSTC_WRAPPER: ''
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ''
      CARRICK_SCCACHE: '0'
      SCCACHE_DISABLE: '1'
      SCCACHE_SERVER_UDS: ''
      SCCACHE_SERVER_PORT: '0'
      SCCACHE_DIR: ''
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    timeout-minutes: 40
    steps:
      - name: Reject a pre-existing runner compiler-cache server
        run: |
          status=0
          pgrep -u "$(id -u)" -x sccache > /dev/null || status=$?
          if [ "$status" -ne 1 ]; then
            echo 'Runner compiler-cache server absent check failed; refusing agent admission' >&2
            exit 1
          fi
      - name: Start the bounded token window
        run: echo "CARRICK_AGENT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.96.0'
      # Credentialed driver code must never be compiled from restored objects or
      # toolchains. Keep the resulting executable outside the restored target.
      - name: Build workflow driver
        id: driver
        timeout-minutes: 10
        run: |
          cargo build --locked --release -p carrick-xtask
          cp target/release/carrick-xtask "$RUNNER_TEMP/carrick-dispatch-driver"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.rustup/toolchains
          key: dispatch-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Bootstrap pinned agent tools and private foreground launcher
        id: bootstrap
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.AGENT_DIRECTOR_TOKEN }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" agent-runner bootstrap'
      - name: Materialize selected provider credentials
        id: auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGY_OAUTH_TOKEN: ${{ secrets.AGY_OAUTH_TOKEN }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" agent-runner auth --event "$GITHUB_EVENT_PATH"'
      - name: Run isolated agent and package safe outputs
        id: worker
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        timeout-minutes: 40
        run: >-
          "$RUNNER_TEMP/carrick-dispatch-driver" host-lease --mode carrick --check-load --
          "$RUNNER_TEMP/carrick-dispatch-driver" dispatch-worker run --event "$GITHUB_EVENT_PATH"
          --setup-status '${{ steps.bootstrap.outcome }}/${{ steps.auth.outcome }}'
      - name: Remove job credentials and provider state
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/carrick-dispatch-driver"; then
            "$RUNNER_TEMP/carrick-dispatch-driver" agent-runner cleanup
          fi
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        with:
          name: dispatch-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-output
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: worker
    if: ${{ !cancelled() && needs.worker.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    environment: agent-dispatch
    timeout-minutes: 15
    steps:
      # Build only admitted main code, before touching any candidate data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.96.0'
      - name: Build trusted publisher without candidate data or restored caches
        run: |
          cargo build --locked --release -p carrick-xtask
          cp target/release/carrick-xtask "$RUNNER_TEMP/carrick-dispatch-publisher"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.worker.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/dispatch-input
      - name: Validate and publish outputs
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKER_TOKEN }}
          # Capture exact provider credentials for the publication gate too.
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGY_OAUTH_TOKEN: ${{ secrets.AGY_OAUTH_TOKEN }}
        run: >-
          "$RUNNER_TEMP/carrick-dispatch-publisher" dispatch-worker publish
          --event "$GITHUB_EVENT_PATH" --artifact "$RUNNER_TEMP/dispatch-input"
