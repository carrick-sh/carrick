name: Dispatch issue worker

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Round chaining (#1241 part 3): only the chain job below sends this. Its
  # one input names the Continuing outcome; the guard and the controller
  # re-read and verify everything else from the API.
  workflow_dispatch:
    inputs:
      outcome:
        description: Continuing dispatch outcome comment id
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    # Cheap pre-filter only (#1214). Comments and reviews need an OWNER, MEMBER or
    # COLLABORATOR association; applying a label already needs triage access. The
    # guard's live collaborator-permission check (write or higher) is authoritative.
    # A chained round is a workflow_dispatch from the chain job, so its
    # actors are the Actions bot; the guard's chain rule is authoritative.
    if: (github.event.sender.type == 'User' && ((github.event_name == 'issues' && (github.event.label.name == 'dispatch' || startsWith(github.event.label.name, 'dispatch:'))) || (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/agent')) || (github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) && github.event.review.state == 'changes_requested' && startsWith(github.event.pull_request.head.ref, 'work/dispatch-')))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.validate.outputs.base }}
      head: ${{ steps.validate.outputs.head }}
      issue: ${{ steps.validate.outputs.issue }}
    steps:
      - name: Refuse stale owner reviews before checkout or build
        id: review-head
        if: github.event_name == 'pull_request_review'
        env:
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          # Authenticated: hosted runners share the unauthenticated API quota.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! live_head=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/carrick-sh/carrick/pulls/$REVIEW_PR" | jq -er '.head.sha'); then
            echo '::error::Cannot verify live PR head; refusing owner review' >&2
            exit 1
          fi
          if [[ "$live_head" != "$REVIEW_HEAD" ]]; then
            echo '::error::Stale owner review: PR head changed; submit a fresh changes_requested review' >&2
            exit 1
          fi
      - name: Resolve trusted driver base before checkout
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          base="$EVENT_SHA"
          if [ "$EVENT_NAME" != issues ]; then
            base=$(git ls-remote https://github.com/carrick-sh/carrick refs/heads/main | cut -f1)
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.base }}
          persist-credentials: false
      - name: Validate owner trigger and scope before requesting a worker
        id: validate
        env:
          CARRICK_DISPATCH_BASE: ${{ steps.base.outputs.base }}
          # Read-only (the job has contents: read) and used only for the API
          # rate limit. Without --admit the guard still binds publication
          # through public comment receipts, never the artifact handoff.
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --release -p carrick-xtask -- dispatch-worker guard --event "$GITHUB_EVENT_PATH"

      - name: Dispatch issue ${{ steps.validate.outputs.issue }}
        run: ':'

      # REST run metadata omits issue_comment payloads. The controller uses
      # these trusted-main step names to fetch and independently verify them.
      - name: Dispatch comment ${{ github.event.issue.number }} ${{ github.event.comment.id }} ${{ steps.validate.outputs.comment }}
        if: github.event_name == 'issue_comment'
        run: ':'
      - name: Dispatch head ${{ steps.validate.outputs.head }}
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        run: ':'
      # A chained round names the outcome the guard verified (#1241 part 3).
      - name: Chain outcome ${{ steps.validate.outputs.issue }} ${{ steps.validate.outputs.chain }}
        if: github.event_name == 'workflow_dispatch'
        run: ':'

  worker:
    needs: guard
    # Workers serialize by dispatch issue (#1241). A trigger queued behind a
    # running round collapses into it at start when that round's outcome
    # lists it as seen; otherwise it runs. The push lease closes cross-key
    # races.
    concurrency:
      group: dispatch-worker-${{ needs.guard.outputs.issue }}
      cancel-in-progress: false
    runs-on: [carrick-agent]
    # A pre-filter for the chain job, which re-reads the outcome itself.
    outputs:
      chain: ${{ steps.loop.outputs.chain }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    # H1: no runner-owned compiler server may execute agent-selected builds.
    # Environment overrides runner Cargo config for every step.
    env:
      CARRICK_DISPATCH_BASE: ${{ needs.guard.outputs.base }}
      CARRICK_DISPATCH_HEAD: ${{ needs.guard.outputs.head }}
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      CARGO_BUILD_RUSTC_WRAPPER: ''
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ''
      CARRICK_SCCACHE: '0'
      SCCACHE_DISABLE: '1'
      SCCACHE_SERVER_UDS: ''
      SCCACHE_SERVER_PORT: '0'
      SCCACHE_DIR: ''
    timeout-minutes: 85
    steps:
      - name: Reject a pre-existing runner compiler-cache server
        run: |
          status=0
          pgrep -u "$(id -u)" -x sccache > /dev/null || status=$?
          if [ "$status" -ne 1 ]; then
            echo 'Runner compiler-cache server absent check failed; refusing agent admission' >&2
            exit 1
          fi
      - name: Mask the job token before agent execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "::add-mask::$GH_TOKEN"
      - name: Start the bounded job window
        run: echo "CARRICK_AGENT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ needs.guard.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify admitted base against freshly fetched main before building
        run: |
          git fetch --no-tags https://github.com/carrick-sh/carrick refs/heads/main
          test "$(git rev-parse HEAD)" = "$CARRICK_DISPATCH_BASE"
          git merge-base --is-ancestor "$CARRICK_DISPATCH_BASE" FETCH_HEAD
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.96.0'
      # Credentialed driver code must never be compiled from restored objects or
      # toolchains. Keep the resulting executable outside the restored target.
      - name: Build workflow driver
        id: driver
        timeout-minutes: 10
        run: |
          cargo build --locked --release -p carrick-xtask
          install -m 0700 target/release/carrick-xtask "$RUNNER_TEMP/carrick-dispatch-driver"
      - name: Bootstrap pinned agent tools and private foreground launcher
        id: bootstrap
        timeout-minutes: 10
        # The launcher read token is minted on demand by the ctb controller
        # through the runner state directory (#1034); no secret is passed.
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" agent-runner bootstrap'
      - name: Admit continuation before agent execution
        id: admission
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" dispatch-worker guard --admit --event "$GITHUB_EVENT_PATH"'
      - name: Materialize available worker and loop credentials
        id: auth
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && steps.admission.outcome == 'success' }}
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGY_OAUTH_TOKEN: ${{ secrets.AGY_OAUTH_TOKEN }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" agent-runner auth --event "$GITHUB_EVENT_PATH"'
      - name: Run owner dispatch through the policy tool server
        id: loop
        if: ${{ !cancelled() && steps.driver.outcome == 'success' && steps.admission.outcome == 'success' }}
        timeout-minutes: 72
        # Publish and board App tokens are minted on demand by the ctb
        # controller through the runner state directory (#1012).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CARRICK_DISPATCH_STEP_STARTED_AT=$(date +%s)
          export CARRICK_DISPATCH_STEP_STARTED_AT
          "$RUNNER_TEMP/carrick-dispatch-driver" host-lease --mode gate --check-load -- \
            "$RUNNER_TEMP/carrick-dispatch-driver" dispatch-worker loop --event "$GITHUB_EVENT_PATH" \
            --setup-status '${{ steps.bootstrap.outcome }}/${{ steps.auth.outcome }}'
      - name: Verify retirement before credentialed completion
        id: retire
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        run: '"$RUNNER_TEMP/carrick-dispatch-driver" dispatch-worker guard --retire --event "$GITHUB_EVENT_PATH"'
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ !cancelled() && steps.retire.outcome == 'success' && steps.loop.outputs.artifacts_ready == 'true' && (steps.loop.outcome == 'success' || steps.loop.outcome == 'failure') }}
        with:
          name: dispatch-${{ steps.admission.outputs.issue }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-output
          if-no-files-found: warn
          retention-days: 30
      - name: Remove provider and launcher state
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/carrick-dispatch-driver"; then
            "$RUNNER_TEMP/carrick-dispatch-driver" agent-runner cleanup
          fi
      - name: Reflect the worker contract in the job verdict
        if: ${{ !cancelled() && steps.loop.outputs.worker_failed == 'true' }}
        run: exit 1

  chain:
    # Round chaining (#1241 part 3). The only job in any workflow with
    # `actions: write`, held by its last step alone: no worker or model
    # output runs here, checkout fetches public main without a credential,
    # and no action (`uses:`) receives the token. `dispatch-worker chain`
    # re-derives from the API that this run's outcome is the issue's latest
    # dispatch outcome and an admissible Continuing one, then sends one
    # `workflow_dispatch` whose only input is that outcome's comment id.
    needs: [guard, worker]
    if: ${{ !cancelled() && needs.worker.outputs.chain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Fetch trusted main without a credential
        run: |
          set -euo pipefail
          base=$(git ls-remote https://github.com/carrick-sh/carrick refs/heads/main | cut -f1)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          git init -q .
          git fetch -q --depth 1 https://github.com/carrick-sh/carrick "$base"
          git checkout -q --detach FETCH_HEAD
      - name: Build the chain driver
        run: |
          cargo build --locked --release -p carrick-xtask
          install -m 0700 target/release/carrick-xtask "$RUNNER_TEMP/carrick-chain-driver"
      - name: Dispatch the next round from a Continuing outcome
        env:
          CHAIN_ISSUE: ${{ needs.guard.outputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/carrick-chain-driver" dispatch-worker chain --issue "$CHAIN_ISSUE"'
