[package]
name = "carrick-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Only ELF parsing is exercised. Select the native runtime backend so the
# compile-only gate works on Linux without enabling Hypervisor.framework.
[target.'cfg(target_os = "linux")'.dependencies]
carrick-runtime = { path = "../crates/carrick-runtime", default-features = false, features = ["platform-linux"] }

[target.'cfg(target_os = "macos")'.dependencies]
carrick-runtime = { path = "../crates/carrick-runtime" }

[[bin]]
name = "elf_load_plan"
path = "fuzz_targets/elf_load_plan.rs"
test = false
doc = false
bench = false
