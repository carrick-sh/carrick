[package]
name = "carrick-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_runtime"
path = "src/lib.rs"

# Phase B real-dispatch KVM driver: runs an aarch64 ELF under KVM through the
# FULL dispatcher (vs the thin `carrick-vmm-kvm` shim). Only built in the
# platform-linux configuration; on macOS the default build skips it.
[[bin]]
name = "carrick-kvm"
path = "src/bin/carrick-kvm.rs"
required-features = ["platform-linux"]

# NetBSD/NVMM real-dispatch driver: runs an x86_64 ELF or OCI rootfs through the
# FULL dispatcher, parallel to carrick-kvm.
[[bin]]
name = "carrick-nvmm"
path = "src/bin/carrick-nvmm.rs"
required-features = ["platform-netbsd"]

[lints]
workspace = true

[features]
default = ["platform-macos"]
# Guest-side syscall shim (docs/syscall-shim-design.md). NO default here on
# purpose: the binary (carrick-cli) is the single control point. carrick-cli's
# default enables it for normal builds; dependents that use carrick-runtime as a
# library do not re-enable it through feature unification.
syscall-shim = []
# In-memory fs backend selection (default OFF; control point is carrick-cli).
fs-memory = ["carrick-spec/fs-memory"]
# Debug-only tracing (compile-gated, default OFF). Own gates plus passthroughs
# to the leaf crates, so carrick-cli can enable any of them through this crate.
trace-tty = []
trace-io = []
trace-traps = []
watchpoint = []
event-ring-dump = []
trace-hvf = ["carrick-vmm-hvf/trace-hvf"]
trace-syscalls = ["carrick-vmm-hvf?/trace-syscalls", "carrick-observability/trace-syscalls"]
debug-stats = ["carrick-vmm-hvf/debug-stats"]
trace-elf = ["carrick-mem/trace-elf"]
# Native test failpoints/captures (carrick_dsr::test_hooks). Never enabled by
# production builds. This crate's own unit tests get the hook STATE through
# the [dev-dependencies] re-declaration of carrick-dsr/carrick-dsr-aarch64
# below (cargo feature unification applies dev-dep features to every test
# target's dependency graph); the check sites in native_darwin compile under
# `cfg(any(test, feature = "test-hooks"))`, so an external consumer can also
# opt in explicitly via this forwarding feature.
test-hooks = ["carrick-dsr/test-hooks", "carrick-dsr-aarch64/test-hooks"]

# Platform backend selection (exactly one active at a time). carrick-cli's
# `default` enables `platform-macos`; a `platform-linux` build links NO HVF.
# The `dep:` syntax keeps the optional crates from auto-becoming implicit
# features, so the only way to pull in carrick-vmm-hvf is via `platform-macos`.
platform-macos = ["dep:carrick-vmm-hvf", "dep:carrick-host-bsd"]
platform-linux = ["dep:carrick-vmm-kvm", "dep:carrick-host-linux"]
# FreeBSD/bhyve backend (scaffolding; aarch64 FreeBSD host needed for L2).
# Mirrors platform-linux.
# Pulls in carrick-host-bsd for the FreeBSD kqueue EventMultiplexer (shared with macOS).
platform-freebsd = ["dep:carrick-vmm-bhyve", "dep:carrick-host-bsd"]
platform-netbsd = ["dep:carrick-vmm-nvmm", "dep:carrick-host-bsd"]
[dependencies]
carrick-abi = { path = "../carrick-abi" }
carrick-hal = { path = "../carrick-hal" }
carrick-portable = { path = "../carrick-portable" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-thread = { path = "../carrick-thread" }
carrick-vmm-hvf = { path = "../carrick-vmm-hvf", optional = true }
carrick-host-bsd = { path = "../carrick-host-bsd", optional = true }
carrick-vmm-kvm = { path = "../carrick-vmm-kvm", optional = true }
# The Linux host-OS layer (epoll EventMultiplexer + errno identity), split out
# of the KVM backend. Pulled in alongside carrick-vmm-kvm by platform-linux.
carrick-host-linux = { path = "../carrick-host-linux", optional = true }
carrick-vmm-bhyve = { path = "../carrick-vmm-bhyve", optional = true }
carrick-vmm-nvmm = { path = "../carrick-vmm-nvmm", optional = true }
carrick-dsr = { path = "../carrick-dsr" }
# The AArch64 guest-ISA translator crate. UNCONDITIONAL: it compiles on every
# host (bad64/dynasmrt are pure Rust); only its assembled gateway is
# target-gated inside the crate itself.
carrick-dsr-aarch64 = { path = "../carrick-dsr-aarch64" }
# The x86_64 guest-ISA translator crate. Also UNCONDITIONAL, same rationale as
# carrick-dsr-aarch64 above: its portable layout/decode surface (consumed
# cross-host by `x86_dsr_profiler_layout` for diagnostic scripts) compiles
# everywhere; only its assembled native gateway is target-gated inside the
# crate itself.
carrick-dsr-x86 = { path = "../carrick-dsr-x86" }
carrick-host = { path = "../carrick-host" }
carrick-kernel = { path = "../carrick-kernel" }
carrick-mem = { path = "../carrick-mem" }
carrick-observability = { path = "../carrick-observability" }
carrick-signal-core = { path = "../carrick-signal-core" }
carrick-timer-core = { path = "../carrick-timer-core" }
anyhow.workspace = true
bitflags.workspace = true
libc.workspace = true
camino.workspace = true
cap-std.workspace = true
clap.workspace = true
fd-lock.workspace = true
flate2.workspace = true
getrandom.workspace = true
goblin.workspace = true
hickory-proto = "0.26.1"
oci-client.workspace = true
parking_lot.workspace = true
parking_lot_core.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
sha2.workspace = true
socket2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
usdt.workspace = true
zerocopy.workspace = true
carrick-spec = { path = "../carrick-spec" }


# The real FreeBSD native-lane host layer (dual-mapped W^X JIT); selected by
# target, not feature — the lane is a property of the host, and the crate
# compiles to nothing elsewhere.
[target.'cfg(target_os = "freebsd")'.dependencies]
carrick-native-freebsd = { path = "../carrick-native-freebsd" }

# The real Darwin native-lane host layer (MAP_JIT W^X JIT + the C trap/kick
# shim, csrc/native_darwin.c); selected by target like the FreeBSD twin above.
# Compiles to a real MAP_JIT impl on aarch64 and a fail-closed stub on any
# other macOS arch (the crate's own internal gate), so it's always safe to
# depend on here.
[target.'cfg(target_os = "macos")'.dependencies]
carrick-native-darwin = { path = "../carrick-native-darwin" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
applevisor.workspace = true
applevisor-sys.workspace = true
mach2.workspace = true

[dev-dependencies]
# bad64/dynasmrt dropped to DEV-dependencies with the extraction-completing
# slice: the runtime LIB no longer references either (the emulation blobs,
# translator, and memory model live in carrick-dsr-aarch64); the
# still-runtime-resident DSR oracle, the dsr shim test suites, and the
# emission microbenchmark are the remaining consumers. UNCONDITIONAL (both
# are pure Rust) so `--all-targets` typechecks the test code on every host.
bad64.workspace = true
dynasmrt.workspace = true
carrick-test-support = { path = "../carrick-test-support" }
tempfile.workspace = true
carrick-image = { path = "../carrick-image" }
proptest.workspace = true
static_assertions = "1"
# The dev-dep feature-unification trick for the native test hooks: test
# builds of this crate compile carrick-dsr WITH the hook state; production
# consumers (carrick-cli) never enable it. See `test-hooks` in [features].
carrick-dsr = { path = "../carrick-dsr", features = ["test-hooks"] }
carrick-dsr-aarch64 = { path = "../carrick-dsr-aarch64", features = ["test-hooks"] }
