[package]
name = "carrick-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Guest-side syscall shim (docs/syscall-shim-design.md). NO default here on
# purpose: the binary (carrick-cli) is the single control point. carrick-cli's
# default enables it for normal builds; dependents that use carrick-runtime as a
# library do not re-enable it through feature unification.
syscall-shim = ["carrick-kernel/syscall-shim"]
# In-memory fs backend selection (default OFF; control point is carrick-cli).
fs-memory = ["carrick-kernel/fs-memory", "carrick-vfs/fs-memory", "carrick-spec/fs-memory"]
# Debug-only tracing (compile-gated, default OFF). Own gates plus passthroughs
# to the leaf crates, so carrick-cli can enable any of them through this crate.
trace-tty = ["carrick-kernel/trace-tty"]
trace-io = ["carrick-kernel/trace-io"]
trace-traps = []
watchpoint = ["carrick-kernel/watchpoint"]
event-ring-dump = ["carrick-kernel/event-ring-dump"]
trace-hvf = ["carrick-vmm-hvf/trace-hvf"]
trace-syscalls = ["carrick-vmm-hvf/trace-syscalls", "carrick-observability/trace-syscalls"]
debug-stats = ["carrick-vmm-hvf/debug-stats"]
trace-elf = ["carrick-mem/trace-elf"]
# The bridge-less test surface: carrick-hal's Null host-signal / guest-timer
# bridges, `SyscallDispatcher::new()` and the other constructors that build a
# dispatcher on them, and `RootBootstrap::for_reference_model`. Enabled for
# this crate's own test targets through the self dev-dependency below (a unit
# test sees `cfg(test)`, an integration test does not); a product build never
# compiles it.
test-support = ["carrick-hal/test-support", "carrick-kernel/test-support"]
conformance-metrics = ["carrick-kernel/conformance-metrics", "carrick-observability/conformance-metrics"]

[dependencies]
carrick-fatal.workspace = true
carrick-abi = { path = "../carrick-abi" }
carrick-el1-abi = { path = "../carrick-el1-abi" }
carrick-el1 = { path = "../carrick-el1" }
carrick-hal = { path = "../carrick-hal" }
carrick-kernel = { path = "../carrick-kernel" }
carrick-portable = { path = "../carrick-portable" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-thread = { path = "../carrick-thread" }
# The VMM/host backend crates are NOT declared here. The build target selects
# the backend: each lives in a `[target.'cfg(...)'.dependencies]` table below,
# so a plain `cargo build` on any supported host links that host's backend and
# no other (there is no `platform-*` feature to forget, or to mismatch with the
# target). carrick-host-linux is not declared either — the Linux host-OS layer
# (epoll EventMultiplexer, errno identity) is below the kernel, so
# carrick-kernel depends on it under `cfg(target_os = "linux")` and the carrier
# names it nowhere.
carrick-aarch64 = { path = "../carrick-aarch64" }
carrick-host = { path = "../carrick-host" }
carrick-kernel-arena = { path = "../carrick-kernel-arena" }
carrick-mem = { path = "../carrick-mem" }
carrick-mmu-core = { path = "../carrick-mmu-core" }
carrick-observability = { path = "../carrick-observability" }
carrick-signal-linux = { path = "../carrick-signal-linux" }
carrick-timer-core = { path = "../carrick-timer-core" }
anyhow.workspace = true
arc-swap.workspace = true
bitflags.workspace = true
libc.workspace = true
camino.workspace = true
clap.workspace = true

fd-lock.workspace = true
flate2.workspace = true
getrandom.workspace = true
goblin.workspace = true
hickory-proto = "0.26.1"
oci-client.workspace = true
parking_lot.workspace = true
parking_lot_core.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
sha2.workspace = true
socket2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# NOTE: no `usdt` edge here. This crate names no `usdt` type — the provider (and
# its `register_dtrace_probes`) lives in carrick-observability, which scopes the
# `usdt` dependency to the targets whose `probes::real` arm actually fires it.
# An unconditional edge here would drag `usdt-impl` into an aarch64-FreeBSD build
# that cannot compile it (see the carrick-observability manifest for the E0308).
zerocopy.workspace = true
carrick-spec = { path = "../carrick-spec" }
carrick-vfs = { path = "../carrick-vfs" }


# ── Host backend, selected by the build target ──────────────────────────────
# macOS: the HVF VMM. Linux: KVM. FreeBSD / NetBSD: the kqueue host layer plus,
# on x86_64 only, the bhyve / NVMM VMM (an aarch64 BSD build is the native
# lane). The source gates on the same `target_os` / `target_arch` predicates,
# so the manifest and the code cannot disagree about which backend is linked.
[target.'cfg(target_os = "macos")'.dependencies]
carrick-vmm-hvf = { path = "../carrick-vmm-hvf" }

[target.'cfg(target_os = "linux")'.dependencies]
carrick-vmm-kvm = { path = "../carrick-vmm-kvm" }

# The kqueue EventMultiplexer shared by macOS and the BSDs.
[target.'cfg(any(target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
carrick-host-bsd = { path = "../carrick-host-bsd" }

# The FreeBSD/bhyve VMM backend. Arch-scoped, not just OS-scoped: bhyve
# virtualizes the host ISA, so this crate is x86_64-only. Its own crate-level
# gate keys on `target_os`, which matches on FreeBSD/aarch64 too, so an OS-only
# dependency edge would compile libvmmapi and the x86 engine into an aarch64
# build that has no VMM lane at all.
[target.'cfg(all(target_os = "freebsd", target_arch = "x86_64"))'.dependencies]
carrick-vmm-bhyve = { path = "../carrick-vmm-bhyve" }

# The NetBSD/NVMM VMM backend, arch-scoped for the same reason. NVMM is an
# x86-only NetBSD subsystem and there is no `/usr/lib/libnvmm.so` on arm64, so
# the manifest is what keeps `-lnvmm` off a NetBSD/aarch64 link line.
[target.'cfg(all(target_os = "netbsd", target_arch = "x86_64"))'.dependencies]
carrick-vmm-nvmm = { path = "../carrick-vmm-nvmm" }


[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
applevisor.workspace = true
applevisor-sys.workspace = true
mach2.workspace = true

[dev-dependencies]
# Lane tests hold an MM's EL1 editor exclusion from its sched-core proof.
carrick-sched-core = { path = "../carrick-sched-core" }
carrick-conformance-contract = { path = "../carrick-conformance-contract" }
# Self dev-dependency: enables `test-support` on this crate's own lib when it
# is built for an integration test (`tests/`), which sees no `cfg(test)`.
carrick-runtime = { path = ".", features = ["test-support"] }
carrick-test-support = { path = "../carrick-test-support" }
# The host-open/stat/xattr amplification counters live on carrick-vfs's hot
# path and are compiled out of a normal build; the fs tests here assert on them.
carrick-vfs = { path = "../carrick-vfs", features = ["test-support"] }
tempfile.workspace = true
tokio.workspace = true
carrick-image = { path = "../carrick-image" }
proptest.workspace = true
static_assertions = "1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
carrick-vmm-hvf = { path = "../carrick-vmm-hvf", features = ["foreign-cow-test-support"] }

# Bounded native translator is a macOS-only test instrument, never a runtime
# dependency or product executor. It exercises carrier data grants with an ELF.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies.native-syscall-slice]
path = "../../experiments/native-syscall-slice"
