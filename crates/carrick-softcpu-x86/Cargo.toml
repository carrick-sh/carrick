[package]
name = "carrick-softcpu-x86"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_softcpu_x86"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
carrick-softmmu = { path = "../carrick-softmmu", features = ["std"] }
iced-x86 = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
carrick-hal = { path = "../carrick-hal" }
carrick-x86 = { path = "../carrick-x86" }
goblin = { workspace = true }

[package.metadata.carrick.test-lanes]
softcpu_level0 = { lane = "host", reason = "x86_64-only (#![cfg(target_arch = \"x86_64\")]); runs in the VM-free host lane on x86_64" }
softcpu_cpl0 = { lane = "host", reason = "x86_64-only (#![cfg(target_arch = \"x86_64\")]); runs VM-free CPL0 privileged instruction and SoftMachine boot tests on x86_64" }
softcpu_idt_delivery = { lane = "host", reason = "x86_64-only (#![cfg(target_arch = \"x86_64\")]); runs VM-free per-vector 64-bit IDT exception delivery tests on x86_64" }
