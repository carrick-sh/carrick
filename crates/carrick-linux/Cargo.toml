[package]
name = "carrick-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_linux"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
carrick-hal = { path = "../carrick-hal" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-mem = { path = "../carrick-mem" }
libc.workspace = true

# Linux-only KVM bindings: target-gated so the macOS workspace never resolves
# them (kvm-ioctls/kvm-bindings are cfg(target_os = "linux") only).
[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.22.1"
kvm-bindings = "0.12.1"
vmm-sys-util = "0.15.0"
