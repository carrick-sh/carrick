[package]
name = "carrick-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_linux"
path = "src/lib.rs"

# The MVP `run-elf` entry point. Self-contained (no carrick-runtime dep), so it
# links for aarch64-linux independently of the macOS dispatch layer. On non-Linux
# hosts `main` is a stub (the lib is empty there), so the workspace still builds.
[[bin]]
name = "carrick-linux"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
carrick-hal = { path = "../carrick-hal" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-mem = { path = "../carrick-mem" }
carrick-abi = { path = "../carrick-abi" }
# The shared x86 engine scaffold (Stage 4-KVM): the KVM x86 lane is migrated onto
# `X86EngineCore<KvmVmm>` instead of the hand-rolled `KvmX86TrapEngine`.
carrick-x86 = { path = "../carrick-x86" }
# Neutral timer slot/registry bookkeeping. `KvmTimerDelivery` delegates slot
# mutation here and (for POSIX) spawns the wall-clock firing thread; interval
# timers use the caller-spawned `run_fallback` (arm_itimer → false).
carrick-timer-core = { path = "../carrick-timer-core" }
# The neutral per-thread pending store. The POSIX firing thread publishes the
# timer signal here (publish_pending_for) then kicks the target vCPU — the same
# publish+kick the runtime's `timer_delivery::deliver` does, replicated so the
# firing thread does not cross back into carrick-runtime.
carrick-signal-core = { path = "../carrick-signal-core" }
# The hypervisor-agnostic private-futex parking table. `KvmFutex` wraps the SAME
# `carrick_thread::thread::FutexTable` `HvfFutex` does (the private/cross-thread
# path); only the shared (cross-process MAP_SHARED) path differs (host SYS_futex
# vs the macOS os_sync API). carrick-thread compiles on every host (leaf deps).
carrick-thread = { path = "../carrick-thread" }
libc.workspace = true

# Linux-only KVM bindings: target-gated so the macOS workspace never resolves
# them (kvm-ioctls/kvm-bindings are cfg(target_os = "linux") only).
[target.'cfg(target_os = "linux")'.dependencies]
carrick-host = { path = "../carrick-host" }
kvm-ioctls = "0.22.1"
kvm-bindings = "0.12.1"
vmm-sys-util = "0.15.0"
