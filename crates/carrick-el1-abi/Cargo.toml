[package]
name = "carrick-el1-abi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
carrick-guest-arch = { path = "../carrick-guest-arch" }
carrick-fd-core = { path = "../carrick-fd-core" }
carrick-pipe-core = { path = "../carrick-pipe-core" }
carrick-inotify-core = { path = "../carrick-inotify-core" }
carrick-mmu-core = { path = "../carrick-mmu-core" }
carrick-sched-core = { path = "../carrick-sched-core" }
carrick-signal-core = { path = "../carrick-signal-core" }
carrick-core-abi = { path = "../carrick-core-abi" }
carrick-el1-control-abi = { path = "../carrick-el1-control-abi" }
carrick-personality-linux = { path = "../carrick-personality-linux" }
carrick-syscall-abi = { path = "../carrick-syscall-abi" }

[features]
# Substitutions exist only in this crate's unit-test target, never the ABI.
loom = []
# Test-only holds of shared locks for host witnesses (#2988); never the ABI.
test-support = ["carrick-fd-core/test-support"]

[dev-dependencies]
loom = "=0.7.2"
# Lazily committed IPC directory and pool fixtures (#2822). A dev-only cycle:
# the support crate's own copy of this ABI is never mixed with the tested one.
carrick-test-support = { path = "../carrick-test-support" }
