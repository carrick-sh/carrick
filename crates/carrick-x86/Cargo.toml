[package]
name = "carrick-x86"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_x86"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The shared x86 engine scaffold sits ABOVE carrick-hal/carrick-mem/
# carrick-guest-mem and BELOW the per-VMM backend crates (carrick-vmm-bhyve /
# carrick-vmm-kvm / carrick-vmm-nvmm). It reuses the ISA-neutral error type
# (`TrapError`), the syscall-frame type, and the PML4 map-spec from those leaves;
# it pulls in NO backend crate (those depend on IT, once Stage 2+ wires callers).
carrick-hal = { path = "../carrick-hal" }
carrick-mem = { path = "../carrick-mem" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
# The shared sigframe glue (`inject_signal`) trades in `carrick_abi::LinuxSiginfo`;
# the run-elf service loop + fault delivery call host `read(2)`/`write(2)` and
# reference `libc` signal/errno numbers.
carrick-abi = { path = "../carrick-abi" }
libc.workspace = true
