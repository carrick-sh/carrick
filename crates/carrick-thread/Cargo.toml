[package]
name = "carrick-thread"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_thread"
path = "src/lib.rs"

[lints]
workspace = true

# Per-process thread registry + private futex table + fork/page-table quiesce
# barriers. Hypervisor-AGNOSTIC (compiles on macOS/Linux/FreeBSD); depends only
# on the lowest leaf crates so both carrick-vmm-hvf and carrick-vmm-kvm can use it
# without depending on each other.
[dependencies]
carrick-hal = { path = "../carrick-hal" }
carrick-abi = { path = "../carrick-abi" }
# Neutral USDT provider: the shared cross-process-futex seam fires the
# `futex-unexpected-errno` probe so the silent ABI-guard fold is observable on
# EVERY backend, not just HVF. Acyclic (carrick-observability deps neither
# carrick-thread nor carrick-hal upward).
carrick-observability = { path = "../carrick-observability" }
libc.workspace = true
parking_lot.workspace = true
parking_lot_core.workspace = true
serde.workspace = true
