[package]
name = "carrick-bhyve-threads"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone M2-Tier-2 fixture (the root Cargo.toml excludes crates/*/fixtures/*).
# Cross-compiled to x86_64-unknown-linux-musl (static, non-PIE ET_EXEC) by a
# plain `cargo build --release` via .cargo/config.toml (rust-lld; no build.sh).
# Spawns N threads (clone(CLONE_THREAD) → sibling vCPUs on one bhyve VM) that
# each touch a thread-local, sum into an AtomicUsize, and join (futex) — the
# proof that bhyve sibling vCPUs + the private futex run end-to-end.

[[bin]]
name = "carrick-bhyve-threads"
path = "src/main.rs"

[profile.release]
opt-level = "z"
panic = "abort"

[workspace]
