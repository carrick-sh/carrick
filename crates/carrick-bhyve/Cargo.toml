[package]
name = "carrick-bhyve"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_bhyve"
path = "src/lib.rs"

[[bin]]
name = "carrick-bhyve"
path = "src/main.rs"

[lints]
workspace = true

# The FreeBSD/bhyve HAL backend (the third platform, after macOS/HVF and
# Linux/KVM). The whole crate is `#![cfg(target_os = "freebsd")]`; on any other
# host the lib is empty, so the workspace still builds on macOS/Linux. It FFIs
# to the system `libvmmapi` (linked via `#[link(name = "vmmapi")]`) and, like
# carrick-linux, depends only on the leaf crates (NOT carrick-runtime), so it
# cross-compiles for aarch64-freebsd independently of the dispatch layer.
[dependencies]
carrick-hal = { path = "../carrick-hal" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-mem = { path = "../carrick-mem" }
carrick-abi = { path = "../carrick-abi" }
# The hypervisor-agnostic private-futex parking table. `BhyveFutex` wraps the
# SAME `carrick_thread::thread::FutexTable` `KvmFutex`/`HvfFutex` do; only the
# shared (MAP_SHARED cross-process) path differs (FreeBSD `_umtx_op`).
carrick-thread = { path = "../carrick-thread" }
# `carrick_host::umtx` is the FreeBSD `_umtx_op` shared-futex wrapper used by
# BhyveFutex's shared half. (cfg(target_os = "freebsd") inside carrick-host.)
carrick-host = { path = "../carrick-host" }
# The BSD-family host layer: the one shared `SIGNUM_XLATE` signal-number table
# (`carrick_bsd::signum`), shared verbatim with the HVF/macOS backend. Gated on
# `carrick_bsd_family` (includes freebsd), so it is present on the bhyve host.
carrick-host-bsd = { path = "../carrick-host-bsd" }
# Neutral timer slot bookkeeping (BhyveTimerDelivery) + per-thread pending store
# (the timer firing thread publishes here then kicks). Mirrors carrick-linux.
carrick-timer-core = { path = "../carrick-timer-core" }
carrick-signal-core = { path = "../carrick-signal-core" }
# The shared x86_64 VMM-backend engine scaffold (Axis 2). `BhyveVmm`/`BhyveX86Vcpu`
# (bhyve_x86_engine) are the thin per-VMM trait pair `X86EngineCore<V>` is
# parameterized over — the same crate carrick-linux (KVM) and carrick-nvmm build on.
carrick-x86 = { path = "../carrick-x86" }
libc.workspace = true

[features]
# Stage-4 (portability) instant-revert flag. The DEFAULT (flag OFF) drives the
# new `X86EngineCore<BhyveVmm>` shared engine. With `bhyve-legacy-engine` ON the
# run-path falls back to the hand-rolled `BhyveTrapEngine` (kept for one cycle so
# a regression is a flag flip, not a code revert). Exercised once on-box before
# the new path is blessed.
default = []
bhyve-legacy-engine = []
