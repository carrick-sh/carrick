[package]
name = "carrick-dsr"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_dsr"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
# Compiles in the native test-hook state (`src/test_hooks.rs`) for OTHER
# crates' test builds. Cross-crate `cfg(test)` does not compose, so
# carrick-runtime's [dev-dependencies] re-declare carrick-dsr with this
# feature: cargo's feature unification turns the hooks on for runtime test
# builds while production builds never see them.
test-hooks = []

[dependencies]
carrick-abi = { path = "../carrick-abi" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-host = { path = "../carrick-host" }
carrick-mem = { path = "../carrick-mem" }
libc.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
# Pulled in by `prepared_image` (the artifact digest + the scratch-file the
# copy-in path materializes); both are ISA-free, matching the module's own
# "compiles on every target" contract.
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# `prepared_image`'s own unit tests round-trip the schema through JSON
# (moved with the module; production code never touches serde_json).
serde_json.workspace = true
