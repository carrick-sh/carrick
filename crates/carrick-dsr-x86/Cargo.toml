[package]
name = "carrick-dsr-x86"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_dsr_x86"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
# Forwards to carrick-dsr's test-hook state (census counters/fault
# injection), consumed by this crate's own moved-identity-memory tests in
# `cflow.rs`. Never enabled by production builds; this crate's own test
# target gets it through the [dev-dependencies] re-declaration below (same
# pattern as carrick-runtime's own test-hooks feature).
test-hooks = ["carrick-dsr/test-hooks"]

[dependencies]
carrick-abi = { path = "../carrick-abi" }
carrick-dsr = { path = "../carrick-dsr" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
iced-x86.workspace = true
thiserror.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
carrick-dsr = { path = "../carrick-dsr", features = ["test-hooks"] }
libc.workspace = true
goblin.workspace = true
tempfile.workspace = true
