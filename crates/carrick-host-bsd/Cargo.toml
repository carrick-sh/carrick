[package]
name = "carrick-host-bsd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_host_bsd"
path = "src/lib.rs"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
carrick-hal = { path = "../carrick-hal" }
carrick-abi = { path = "../carrick-abi" }
carrick-host = { path = "../carrick-host" }
# The `HostSignalGlue` trait `native_glue` implements. carrick-signal-core
# depends only on carrick-abi + libc, so this edge introduces no cycle.
carrick-signal-core = { path = "../carrick-signal-core" }
libc.workspace = true
