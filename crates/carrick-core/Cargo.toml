[package]
name = "carrick-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Neutral MM, fork, COW, and wait/lifecycle substrate for Carrick."

[features]
default = []
host-test = ["carrick-sched-core/host-test"]
# Substitutes loom words in this crate's unit-test target only, never the ABI.
loom = []

[dependencies]
bitflags.workspace = true
carrick-mmu-core = { path = "../carrick-mmu-core" }
carrick-guest-arch = { path = "../carrick-guest-arch" }
carrick-core-abi = { path = "../carrick-core-abi" }
carrick-sched-core = { path = "../carrick-sched-core" }
zerocopy.workspace = true

[dev-dependencies]
carrick-conformance-contract = { path = "../carrick-conformance-contract" }
carrick-el1-abi = { path = "../carrick-el1-abi" }
parking_lot.workspace = true
loom = "=0.7.2"
carrick-el1 = { path = "../carrick-el1", features = ["host-test"] }
carrick-el1-linux = { path = "../carrick-el1-linux", features = ["host-test"] }
carrick-personality-linux = { path = "../carrick-personality-linux" }

[lints]
workspace = true
