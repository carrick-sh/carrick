# Build this fixture for the x86 guest target with carrick's loader requirements
# baked in, so a plain `cargo build --release` (run in this dir) produces a
# static, fixed-address x86_64 Linux ET_EXEC.
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=ld.lld",
    "-C", "relocation-model=static",
    "-C", "link-arg=--no-pie",
]
