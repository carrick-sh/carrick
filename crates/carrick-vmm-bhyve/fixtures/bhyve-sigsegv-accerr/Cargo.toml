[package]
name = "carrick-bhyve-sigsegv-accerr"
version = "0.0.0"
edition = "2021"
publish = false

# SP4.4 fixture: present read-only page write -> SIGSEGV/SEGV_ACCERR.
# Cross-compiled static x86_64-unknown-linux-musl (non-PIE ET_EXEC).

[dependencies]
libc = "0.2"

[[bin]]
name = "carrick-bhyve-sigsegv-accerr"
path = "src/main.rs"

[profile.release]
opt-level = "z"
panic = "abort"

[workspace]
