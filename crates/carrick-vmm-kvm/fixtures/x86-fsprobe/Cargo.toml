[package]
name = "carrick-x86-fsprobe"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone fixture crate (the root Cargo.toml excludes crates/*/fixtures/*).
# Cross-compiled to x86_64-unknown-linux-musl by build.sh. It calls uname(2)
# to witness shared host dispatch once PR #81 binds it to the CPL0 carrier.
# The former standalone run-elf loop is retired; this fixture is not evidence
# of current production dispatch until it has a shared-kernel execution receipt.

[[bin]]
name = "carrick-x86-fsprobe"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
panic = "abort"

[workspace]
