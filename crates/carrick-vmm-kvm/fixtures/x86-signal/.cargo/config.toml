# Build this fixture for the x86 guest target with carrick's loader requirements
# baked in, so a plain `cargo build --release` (run in this dir) produces the
# runnable artifact at target/x86_64-unknown-linux-musl/release/x86-signal.
# See fixtures/x86-fork/.cargo/config.toml for the rationale.
# One-time host setup: rustup target add x86_64-unknown-linux-musl
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=ld.lld",
    "-C", "relocation-model=static",
    "-C", "link-arg=--no-pie",
]
