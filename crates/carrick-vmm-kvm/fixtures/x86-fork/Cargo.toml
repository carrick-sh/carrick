[package]
name = "carrick-x86-fork"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone M3c fixture (the root Cargo.toml excludes crates/*/fixtures/*).
# Cross-compiled to x86_64-unknown-linux-musl by build.sh (rust-lld, static,
# non-PIE ET_EXEC). Exercises libc::fork + waitpid + write + _exit: the proof
# that the x86 KVM fork() (parent keeps its VM, child rebuilds over COW mmaps)
# works end-to-end under carrick-kvm.

[[bin]]
name = "x86-fork"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
panic = "abort"

[workspace]
