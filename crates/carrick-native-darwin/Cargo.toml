[package]
name = "carrick-native-darwin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_native_darwin"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bincode.workspace = true
carrick-dsr = { path = "../carrick-dsr" }
carrick-dsr-aarch64 = { path = "../carrick-dsr-aarch64" }
# Tier D's eligibility scan decodes guest text to find the 0.03% of words that
# cannot execute on Darwin (x18, tpidr_el0). Same decoder the translator uses.
bad64.workspace = true
getrandom.workspace = true
libc.workspace = true
memmap2.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tracing.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
carrick-guest-mem = { path = "../carrick-guest-mem" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2.workspace = true
