[package]
name = "carrick-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "carrick"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Guest-side syscall shim (forwarded to carrick-runtime). The base shim
# (getpid, answered guest-side from the identity page)
# is default ON. (Clock syscalls are served via the vDSO and dispatch, not
# the EL1 shim.) Build with `--no-default-features` for the legacy trap-only
# vector path. The VMM/host backend is NOT a feature: the build target selects
# it (see the target-scoped dependency tables at the bottom of this file).
default        = ["syscall-shim"]
# Heap-allocation census (diagnostic, like carrick-runtime's `debug-stats`).
# Installs `dhat` as the global allocator so every allocation is attributed to
# a call stack, and writes one `dhat-<pid>.json` per process. Answers "what
# allocates the ~20.5 GB of large-zone heap per `go build`" -- a question no
# EXTERNAL instrument can answer here: `ustack()` misresolves across ~70
# self-re-exec'd processes with independent ASLR slides, `fbt::mach_vm_allocate`
# never fires, and `syscall::mmap` sees only the MAP_NORESERVE reservations
# because libmalloc sub-allocates a few large regions. Opt-in: it makes the
# binary much slower, so it is a measurement build, never a shipping one.
alloc-census   = ["dep:dhat"]
syscall-shim   = ["carrick-runtime/syscall-shim", "carrick-embed/syscall-shim"]
# In-memory fs backend selection (`--fs memory`). Default OFF on purpose; opt in
# with `cargo build -p carrick-cli --features fs-memory`.
fs-memory = ["carrick-spec/fs-memory", "carrick-engine/fs-memory", "carrick-runtime/fs-memory"]
# Debug-only tracing (compile-gated, default OFF). Each forwards to the owning
# crate; `debug-all` turns the lot on. e.g. `cargo build --features trace-tty`.
trace-tty = ["carrick-runtime/trace-tty"]
trace-io = ["carrick-runtime/trace-io"]
trace-traps = ["carrick-runtime/trace-traps"]
watchpoint = ["carrick-runtime/watchpoint"]
event-ring-dump = ["carrick-runtime/event-ring-dump"]
trace-hvf = ["carrick-runtime/trace-hvf"]
trace-syscalls = ["carrick-runtime/trace-syscalls"]
debug-stats = ["carrick-runtime/debug-stats"]
trace-elf = ["carrick-runtime/trace-elf"]
trace-dtrace = []
debug-all = [
    "trace-tty",
    "trace-io",
    "trace-traps",
    "watchpoint",
    "event-ring-dump",
    "trace-hvf",
    "trace-syscalls",
    "debug-stats",
    "trace-elf",
    "trace-dtrace",
]

[dependencies]
carrick-embed = { path = "../carrick-embed", default-features = false }
carrick-conformance-contract = { path = "../carrick-conformance-contract" }
carrick-runtime = { path = "../carrick-runtime", default-features = false }
carrick-kernel = { path = "../carrick-kernel" }
carrick-el1-abi = { path = "../carrick-el1-abi" }
carrick-vfs = { path = "../carrick-vfs" }
carrick-fatal.workspace = true
dhat = { version = "0.3", optional = true }
# The VMM/host backend crates live in target-scoped tables at the bottom of
# this file: the build target, not a feature, selects the backend.
carrick-spec = { path = "../carrick-spec", features = ["clap"] }
carrick-image = { path = "../carrick-image" }
carrick-engine = { path = "../carrick-engine", default-features = false }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
tempfile.workspace = true
camino.workspace = true
libc.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
flate2.workspace = true
tar.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
goblin.workspace = true
rustc-demangle.workspace = true

[dev-dependencies]
carrick-test-support = { path = "../carrick-test-support" }
carrick-xtask = { path = "../carrick-xtask" }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
bollard.workspace = true
futures-util.workspace = true
tokio.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }

# ── Host backend, selected by the build target ──────────────────────────────
# Mirrors carrick-runtime's tables: macOS -> HVF, Linux -> KVM, FreeBSD/NetBSD
# -> the kqueue host layer plus, on x86_64 only, bhyve / NVMM. Arch-scoped for
# the same reason as carrick-runtime's copies: bhyve and NVMM are x86_64-only
# VMMs whose own crate-level gates key on `target_os` alone, so an OS-only
# dependency edge would drag libvmmapi / -lnvmm and the x86 engine into an
# aarch64 BSD build that has no VMM lane.
[target.'cfg(target_os = "macos")'.dependencies]
carrick-vmm-hvf = { path = "../carrick-vmm-hvf" }

[target.'cfg(target_os = "linux")'.dependencies]
carrick-vmm-kvm = { path = "../carrick-vmm-kvm" }

[target.'cfg(any(target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
carrick-host-bsd = { path = "../carrick-host-bsd" }

[target.'cfg(all(target_os = "freebsd", target_arch = "x86_64"))'.dependencies]
carrick-vmm-bhyve = { path = "../carrick-vmm-bhyve" }

[target.'cfg(all(target_os = "netbsd", target_arch = "x86_64"))'.dependencies]
carrick-vmm-nvmm = { path = "../carrick-vmm-nvmm" }
