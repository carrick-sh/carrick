[package]
name = "carrick-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "carrick"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Guest-side syscall shim (forwarded to carrick-runtime). The base shim
# (getpid/get*id/gettid, answered guest-side from the identity page / TPIDR_EL1)
# is default ON. Build with `--no-default-features` for the legacy trap-only
# vector path.
default        = ["syscall-shim", "platform-macos"]
syscall-shim   = ["carrick-runtime/syscall-shim"]
# Exactly one platform-* is active at a time; `default` keeps macOS building
# exactly as today. `platform-linux` links NO HVF.
platform-macos = ["dep:carrick-vmm-hvf", "dep:carrick-host-bsd", "carrick-runtime/platform-macos", "carrick-engine/platform-macos"]
platform-linux = ["dep:carrick-vmm-kvm", "carrick-runtime/platform-linux", "carrick-engine/platform-linux"]
# `dep:carrick-vmm-bhyve` / `dep:carrick-vmm-nvmm` resolve against the
# ARCH-SCOPED target tables at the bottom of this file: both VMMs are
# x86_64-only, while the platform feature names the HOST backend on every arch.
# On a non-matching target cargo accepts the `dep:` reference and activates
# nothing, so one feature name covers both arches (see carrick-runtime's
# Cargo.toml for the full rationale).
platform-freebsd = ["dep:carrick-vmm-bhyve", "dep:carrick-host-bsd", "carrick-runtime/platform-freebsd", "carrick-engine/platform-freebsd"]
platform-netbsd = ["dep:carrick-vmm-nvmm", "dep:carrick-host-bsd", "carrick-runtime/platform-netbsd", "carrick-engine/platform-netbsd"]
# In-memory fs backend selection (`--fs memory`). Default OFF on purpose; opt in
# with `cargo build -p carrick-cli --features fs-memory`.
fs-memory = ["carrick-spec/fs-memory", "carrick-engine/fs-memory", "carrick-runtime/fs-memory"]
# Debug-only tracing (compile-gated, default OFF). Each forwards to the owning
# crate; `debug-all` turns the lot on. e.g. `cargo build --features trace-tty`.
trace-tty = ["carrick-runtime/trace-tty"]
trace-io = ["carrick-runtime/trace-io"]
trace-traps = ["carrick-runtime/trace-traps"]
watchpoint = ["carrick-runtime/watchpoint"]
event-ring-dump = ["carrick-runtime/event-ring-dump"]
trace-hvf = ["carrick-runtime/trace-hvf"]
trace-syscalls = ["carrick-runtime/trace-syscalls"]
debug-stats = ["carrick-runtime/debug-stats"]
trace-elf = ["carrick-runtime/trace-elf"]
trace-dtrace = []
debug-all = [
    "trace-tty",
    "trace-io",
    "trace-traps",
    "watchpoint",
    "event-ring-dump",
    "trace-hvf",
    "trace-syscalls",
    "debug-stats",
    "trace-elf",
    "trace-dtrace",
]

[dependencies]
carrick-runtime = { path = "../carrick-runtime", default-features = false }
carrick-vmm-hvf = { path = "../carrick-vmm-hvf", optional = true }
carrick-host-bsd = { path = "../carrick-host-bsd", optional = true }
carrick-vmm-kvm = { path = "../carrick-vmm-kvm", optional = true }
# carrick-vmm-bhyve / carrick-vmm-nvmm are NOT declared here: they are
# x86_64-only and live in arch-scoped target tables at the bottom of this file.
carrick-spec = { path = "../carrick-spec", features = ["clap"] }
carrick-image = { path = "../carrick-image" }
carrick-engine = { path = "../carrick-engine", default-features = false }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
tempfile.workspace = true
camino.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
flate2.workspace = true
tar.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
carrick-test-support = { path = "../carrick-test-support" }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
bollard.workspace = true
futures-util.workspace = true
tokio.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }

# Arch-scoped for the same reason as carrick-runtime's copies: bhyve and NVMM
# are x86_64-only VMMs whose own crate-level gates key on `target_os` alone, so
# an OS-only dependency edge would drag libvmmapi / -lnvmm and the x86 engine
# into an aarch64 BSD build that has no VMM lane. `platform-freebsd` /
# `platform-netbsd` still name the host backend on both arches.
[target.'cfg(all(target_os = "freebsd", target_arch = "x86_64"))'.dependencies]
carrick-vmm-bhyve = { path = "../carrick-vmm-bhyve", optional = true }

[target.'cfg(all(target_os = "netbsd", target_arch = "x86_64"))'.dependencies]
carrick-vmm-nvmm = { path = "../carrick-vmm-nvmm", optional = true }
