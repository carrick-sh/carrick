# Leaf crate: signed guest fixtures depend on it, so every byte here is part
# of the signed fixture bundle's input identity (docs/signed-fixtures.md).
# It must stay dependency-free; `carrick-xtask fixtures leaf-closure` (run by
# `just lint-domains`) fails if a fixture closure grows a non-leaf crate.
[package]
name = "carrick-el1-control-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

