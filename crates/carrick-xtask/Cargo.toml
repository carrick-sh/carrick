[package]
name = "carrick-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_xtask"
path = "src/lib.rs"

[[bin]]
name = "carrick-xtask"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
impact = ["dep:carrick-conformance"]
# The signed smoke reads its census through the conformance test tooling.
smoke-signed = ["dep:carrick-conformance"]

[dependencies]
carrick-fatal = { path = "../carrick-fatal" }
clap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
thiserror.workspace = true
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
signal-hook.workspace = true
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
toml.workspace = true
yaml-rust2 = { version = "0.13", default-features = false }

carrick-conformance = { path = "../carrick-conformance", optional = true }
# Constants and the argument parser of the root capture front (#1621); xtask
# only checks its installation and is never root-run itself.
carrick-capture = { path = "../carrick-capture" }
carrick-guest-arch = { path = "../carrick-guest-arch" }
carrick-portable = { path = "../carrick-portable" }

[dev-dependencies]
# The sysroot test imports the EL1 image build script and its ABI image limit.
carrick-el1-abi = { path = "../carrick-el1-abi" }
