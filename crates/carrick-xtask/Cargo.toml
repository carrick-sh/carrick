[package]
name = "carrick-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_xtask"
path = "src/lib.rs"

[[bin]]
name = "carrick-xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
thiserror.workspace = true
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
signal-hook.workspace = true
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
toml.workspace = true

carrick-conformance = { path = "../carrick-conformance" }
carrick-portable = { path = "../carrick-portable" }

[dev-dependencies]
yaml-rust2 = { version = "0.13", default-features = false }
