[package]
name = "carrick-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_hal"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The Null host-signal / guest-timer bridges a dispatcher boots with when no
# carrier hands it real ones (`SyscallDispatcher::new()`, the example backend).
# Test-only surface: nothing in a product carrier constructs them.
test-support = []

[dependencies]
carrick-guest-arch = { path = "../carrick-guest-arch" }
carrick-abi = { path = "../carrick-abi" }
# Neutral sealed owner receipts carry Fork across task/backend publication.
# el1-abi is no_std and has no HAL or platform dependency.
carrick-el1-abi = { path = "../carrick-el1-abi" }
carrick-fatal.workspace = true
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-mem = { path = "../carrick-mem" }
carrick-mmu-core = { path = "../carrick-mmu-core" }
carrick-observability = { path = "../carrick-observability" }
# The EL1-editor exclusion witness is registered from the sched-core proof
# (`ExcludedEditor`). No cycle: carrick-sched-core has no dependencies.
carrick-sched-core = { path = "../carrick-sched-core" }
# Timer-delivery trait return/arg types (`PosixTimerSpec`, `TimerArm`) live in the
# neutral timer-core; carrick-hal re-exports them through the `TimerDelivery`
# trait so backends name one set of types. No cycle: timer-core depends only on
# carrick-abi/portable/host (none of which depend on carrick-hal).
carrick-timer-core = { path = "../carrick-timer-core" }
# The shared async host-signal PUMP (`signal_pump`) needs the neutral pending
# store + child-watch + the `HostSignalGlue` seam. No cycle: carrick-signal-linux
# depends only on libc (not carrick-hal).
carrick-signal-linux = { path = "../carrick-signal-linux" }
thiserror.workspace = true
libc.workspace = true
zerocopy.workspace = true
# `ThreadId` serializes as its bare i32 key so diagnostics payloads that embed
# tids (carrick-runtime's Serialize-derived outcomes) keep their wire shape.
serde.workspace = true
