[package]
name = "carrick-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_hal"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
carrick-abi = { path = "../carrick-abi" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-mem = { path = "../carrick-mem" }
# Timer-delivery trait return/arg types (`PosixTimerSpec`, `TimerArm`) live in the
# neutral timer-core; carrick-hal re-exports them through the `TimerDelivery`
# trait so backends name one set of types. No cycle: timer-core depends only on
# carrick-abi/portable/host (none of which depend on carrick-hal).
carrick-timer-core = { path = "../carrick-timer-core" }
# The shared async host-signal PUMP (`signal_pump`) needs the neutral pending
# store + child-watch + the `HostSignalGlue` seam. No cycle: carrick-signal-core
# depends only on libc (not carrick-hal).
carrick-signal-core = { path = "../carrick-signal-core" }
thiserror.workspace = true
libc.workspace = true
zerocopy.workspace = true
