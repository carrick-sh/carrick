[package]
name = "carrick-vmm-nvmm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_vmm_nvmm"
path = "src/lib.rs"

[lints]
workspace = true

# The NetBSD/NVMM host backend (the fourth platform, after macOS/HVF,
# Linux/KVM, and FreeBSD/bhyve). The whole crate is `#![cfg(target_os =
# "netbsd")]`; on any other host the lib compiles to an empty crate, so the
# default macOS workspace build (and Linux CI) stay green without libnvmm on
# the link line.
#
# M1 builds the thin per-VMM `X86Vmm`/`X86Vcpu` trait pair over the SHARED
# `carrick-x86` engine (the portability Stage-5 acceptance test): the trap loop,
# long-mode bring-up, snapshot triple, and run-elf service loop all live ONCE in
# carrick-x86. carrick-vmm-nvmm supplies only the NVMM marshalling + the run_elf
# wiring. The deps are unconditional (these leaf crates build on every host
# already); the crate's own code is `#![cfg(target_os = "netbsd")]`, so the
# libnvmm link line only appears on NetBSD and the default macOS/Linux workspace
# build stays green. It FFIs to the system **libnvmm** (`#[link(name = "nvmm")]`,
# /usr/lib/libnvmm.so), and like carrick-linux/bhyve depends only on the leaf
# crates (NOT carrick-runtime) so it cross-compiles independently.
[dependencies]
carrick-hal = { path = "../carrick-hal" }
carrick-x86 = { path = "../carrick-x86" }
carrick-mem = { path = "../carrick-mem" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
libc.workspace = true
