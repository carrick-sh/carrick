[package]
name = "carrick-el1-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux personality client of the neutral carrick-el1 runtime, and the EL1 image binary."

[dependencies]
carrick-el1 = { path = "../carrick-el1" }
carrick-abi = { path = "../carrick-abi" }
carrick-core-abi = { path = "../carrick-core-abi" }
carrick-syscall-abi = { path = "../carrick-syscall-abi" }
carrick-personality-linux = { path = "../carrick-personality-linux" }
carrick-core = { path = "../carrick-core" }
carrick-el1-abi = { path = "../carrick-el1-abi" }
carrick-fd-core = { path = "../carrick-fd-core" }
carrick-guest-arch = { path = "../carrick-guest-arch" }
carrick-inotify-core = { path = "../carrick-inotify-core" }
carrick-mmu-core = { path = "../carrick-mmu-core" }
carrick-sched-core = { path = "../carrick-sched-core" }
carrick-signal-core = { path = "../carrick-signal-core" }
zerocopy.workspace = true

[features]
default = []
host-test = ["carrick-el1/host-test", "carrick-sched-core/host-test", "carrick-core/host-test", "carrick-personality-linux/host-test"]
allocator-test-control = ["carrick-el1/allocator-test-control"]

[[bin]]
name = "carrick-el1"
path = "src/entry.rs"

[lib]
path = "src/lib.rs"

[dev-dependencies]
carrick-el1 = { path = "../carrick-el1", features = ["host-test"] }
carrick-kernel = { path = "../carrick-kernel", features = ["test-support"] }
carrick-mem = { path = "../carrick-mem" }
carrick-guest-mem = { path = "../carrick-guest-mem" }
carrick-test-support = { path = "../carrick-test-support" }
carrick-core = { path = "../carrick-core", features = ["host-test"] }
carrick-aarch64 = { path = "../carrick-aarch64" }
carrick-hal = { path = "../carrick-hal" }
carrick-sched-core = { path = "../carrick-sched-core", features = ["host-test"] }
carrick-personality-linux = { path = "../carrick-personality-linux", features = ["host-test"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
carrick-fatal = { path = "../carrick-fatal" }
libc.workspace = true
