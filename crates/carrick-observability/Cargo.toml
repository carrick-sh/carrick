[package]
name = "carrick-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_observability"
path = "src/lib.rs"

[features]
# Verbose per-syscall stderr trace in CompatReporter::record (compiled out by
# default). Forwarded from carrick-runtime/trace-syscalls alongside the HVF
# crate's own gate, mirroring the upstream debug-feature refactor.
trace-syscalls = []

[lints]
workspace = true

[dependencies]
carrick-abi = { path = "../carrick-abi" }
libc.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# usdt is non-target-gated on purpose. On macOS/FreeBSD it provides the REAL
# DTrace provider machinery the `probes::real` module fires; on Linux/NetBSD the
# crate compiles as a pure-Rust no-op, but its `usdt::Error` type is still needed
# by the `probes::stub` `register_dtrace_probes` signature (which the dispatcher
# calls on every platform). This mirrors carrick-runtime's existing usage and is
# the proven cross-platform pattern — target-gating usdt would break the stub
# signature on Linux. The real provider mod is itself cfg'd to macOS/FreeBSD, so
# DTrace asm anchors are only emitted where usdt supports them.
usdt.workspace = true
