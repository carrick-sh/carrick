[package]
name = "carrick-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "carrick_observability"
path = "src/lib.rs"

[features]
# Verbose per-syscall stderr trace in CompatReporter::record (compiled out by
# default). Forwarded from carrick-runtime/trace-syscalls alongside the HVF
# crate's own gate, mirroring the upstream debug-feature refactor.
trace-syscalls = []

[lints]
workspace = true

[dependencies]
carrick-abi = { path = "../carrick-abi" }
libc.workspace = true

# `probes::host_image_base` reads the main image's base/slide/path through dyld.
# libc deprecated those three in favour of mach2, and the workspace denies
# warnings, so take them from mach2 directly. macOS-only: dyld is macOS-only,
# and the callers are the Darwin native lane.
[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# usdt is scoped to EXACTLY the target set that compiles `probes::real` — see
# the matching `#[cfg]` at the top of src/probes.rs. Everything else links
# `probes::stub`, which fires nothing and (since `register_dtrace_probes` now
# returns the crate-local `ProbeRegistrationError`) names no `usdt` type at all.
#
# This is not cosmetic scoping: `usdt-impl` 0.6.0 DOES NOT COMPILE on
# aarch64-unknown-freebsd. Its build.rs picks the `Standard` (illumos/FreeBSD)
# DTrace backend from `target_os` alone, and that backend's `no-linker.rs:166`
# writes `modname[i] = byte as i8` into a `[std::os::raw::c_char; 64]`. FreeBSD's
# `c_char` is `i8` on x86_64 but `u8` on aarch64, so the aarch64 lane gets E0308
# ("expected `[u8; 64]`, found `[i8; 64]`") and the whole acceptance-path build
# dies. 0.6.0 is the newest published release, so there is no version to move to.
# The stub arm was ALREADY selected on every target this scoping drops (aarch64
# freebsd/linux, netbsd), so no probe capability is lost — dropping the edge is
# what lets those targets build at all.
[target.'cfg(any(target_os = "macos", all(any(target_os = "linux", target_os = "freebsd"), target_arch = "x86_64")))'.dependencies]
usdt.workspace = true
