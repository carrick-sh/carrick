# Pin the toolchain so rustfmt output is identical across every machine and CI,
# eliminating the formatting skew that previously made `just fmt-check` fail on
# unrelated files (CI's moving dtolnay@stable vs each dev's local stable).
# Mac + the lima KVM-gate guest + CI all run 1.96.0 today, so this is a no-op
# install for them. Bump deliberately (and re-run `cargo fmt --all`) when moving.
# NOTE: the FreeBSD host (Part A) uses pkg-managed rust (1.94, not rustup); build
# the leaf crates there with its own toolchain — this pin targets the workspace
# build/format path on macOS/Linux/CI.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
