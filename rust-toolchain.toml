# Pin the toolchain so rustfmt output is identical across every machine and CI,
# eliminating the formatting skew that previously made `just fmt-check` fail on
# unrelated files (CI's moving dtolnay@stable vs each dev's local stable).
# Mac, the lima KVM-gate guest, the FreeBSD host, and CI all run 1.96.0, so this
# is a no-op install for them. Bump deliberately (and re-run `cargo fmt --all`)
# when moving. The FreeBSD host was converted from pkg-rust to rustup-managed
# (`rustup default 1.96.0`) so it honors this pin too — the toolchain (and rustfmt
# 1.9.0) is now identical across every build/format environment.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
# Cross-compile targets the gates need, declared on the PINNED toolchain (not
# just added to CI's moving @stable). The host-integration suite builds a static
# aarch64-unknown-linux-musl fixture ELF (scripts/build-linux-fixtures.sh), and
# the aarch64-linux cross-check runs `cargo check --target
# aarch64-unknown-linux-gnu`. Declaring them here makes rustup install them for
# 1.96.0 in every environment, so the targets land on the toolchain cargo
# actually uses — not a sibling `stable` toolchain that this file then overrides
# (which is exactly how a fresh CI runner ended up missing them).
targets = ["aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-unknown-freebsd"]
