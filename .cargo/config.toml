# carrick cargo config.
#
# ⚠️  DO NOT set the linker to lld here (`-fuse-ld=lld`).
#
# It is tempting (lld links the 44k-line carrick-runtime rlib far faster — see
# docs/archive/build-decomposition-design.md), but it BREAKS `carrick trace`. Root cause:
# the `usdt` 0.6 crate hardcodes the macOS "Linker" backend (usdt-impl build.rs:
# `Some("macos") => Backend::Linker`), which depends on Apple ld64's proprietary
# DTrace probe-processing pass to synthesize the `__dof_carrick` Mach-O section.
# `ld64.lld` does not implement that pass, so `__dof_carrick` is never created and
# `usdt::register_probes()` finds zero probes (verified: 551 USDT probes under
# ld64 → 0 under lld on the same trace). This is the regression that caused the
# earlier lld adoption to be reverted.
#
# lld can only be adopted once carrick moves usdt to its linker-agnostic
# `no-linker` backend (runtime-built DOF via the dof_helper ioctl), which needs a
# usdt fork/patch. Until then, the default (Apple ld64) is mandatory for any build
# that `carrick trace` will trace (the signed release binary in particular).
#
# Build-speed wins that are SAFE (no linker change, no DTrace impact) live in the
# workspace `[profile.*]` blocks in Cargo.toml.

# ⚠️  DO NOT remove `force-frame-pointers` below.
#
# Without it `dtrace`'s `ustack()` cannot walk this binary, and — this is the
# dangerous part — it does not fail loudly. It produces plausible-looking
# NONSENSE by scanning the stack and snapping each word to the nearest preceding
# symbol. A measured example from 2026-07-29:
#
#     carrick`oci_client::sha256_digest
#     carrick`bad64::sysreg::...ToPrimitive...
#     carrick`core::ptr::drop_in_place<Option<Backtrace>>
#     carrick`fcvtzs_z_p_z+0x388
#
# — a call chain that cannot exist, with the SAME bogus tail on every stack.
# Rebuilding with this flag turned the same profile into coherent stacks that
# located a real defect (`RawRwLock::lock_shared_slow` at 8.2% of on-CPU time,
# fixed in `perf(native): widen the per-thread block cache`). A profiler that
# lies is worse than no profiler: it costs a whole investigation.
#
# Cost is near zero on aarch64-apple-darwin, where the platform ABI already
# reserves x29 as the frame pointer; the x86_64 lanes give up %rbp, which is the
# price of being able to profile them at all.
#
# CAVEAT: a `RUSTFLAGS` environment variable REPLACES this list wholesale rather
# than appending to it, so exporting `RUSTFLAGS` silently drops frame pointers.
# `just check-frame-pointers` (wired into `just ci`) fails if that happens.
[build]
rustflags = ["-C", "force-frame-pointers=yes"]
