rationale = "The exact product diff completes the registered kernel.el1.anonymous-first-touch and kernel.el1.stage1-publication transactions. ABI and fault changes replace one carrier-wide frame-grant mailbox with independently authenticated per-vCPU-slot single-flight records; fault vector routing, GIC records, guest run-queue state and the metadata allocator mailbox are unchanged. MMU changes allow an older live host editor to follow authenticated guest-linked hierarchy through physical capacity and advance its allocation cursor before reuse; fork snapshot behavior, GIC output exclusion and metadata-refusal rollback remain covered by the complete 101-test MMU suite. The COW and inventory edits prepare, authenticate, retire and roll back only the new anonymous bulk grant; syscall-code-write, fork mapping/image projection, realtime calibration and backing-maintenance lookup logic are unchanged. Red-first ABI/MMU tests, 63 EL1 tests, 27 ABI tests, focused runtime/HVF tests, warning-denied Clippy, the personality boundary and the exact committed signed 256/1024/4096-page witness all pass."
