rationale = "The exact product diff widens the fail-stop EL1 entry-binding fatal diagnostic (#1642): the terminal HVC #3 now also carries the raising NativeInvariant variant (x4) and the caller's source-file tail (x5..x12), HVF reads those registers only inside the existing PANIC_SENTINEL fatal branch and renders them into the same fatal record, and NativeInvariant::fatal_reason becomes fatal_cause with two new fatal codes for previously merged physical-custody refusals. Every changed line runs only after an invariant has already failed and the run is terminating; no refusal policy, dispatch route, errno, scheduling, custody, fork, exec, IPC, signal or vCPU decision changes, and no hot path gains work (invalid_completion and the HVC body are cold and never inlined, with a 0x70-byte frame in the built image). memory.rs changes only its fatal-record unit test. The red-first serial_host invalid_completion witness, the carrick-el1-abi round-trip and width tests, the EL1 image frame-budget build, warning-denied Clippy and cross-check-macos cover the changed boundary."
