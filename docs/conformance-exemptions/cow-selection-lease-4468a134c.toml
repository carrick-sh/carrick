rationale = "#3040 changes one guest-visible mechanism, the copy-on-write supply of a kernel user copy and of x86's EL0 COW crossing, whose contract kernel.el1.fork-cow carries this PR's VM-free witnesses. The listed paths are bound to these other contracts only by file. The edits there are: (a) in core-abi, the neutral PortalGrantSlot lease (lease_cow_selection, adopt_cow_selection, supply_cow_selection, CowSelectionLease, CowSettlement, CowSupplyRefusal), a read-only selection_snapshot, and take_cow_fault_selection now comparing the stamped generation under reservation (every production publisher stamps generation equal to the window's sequence, so correct takes are unchanged); (b) the ARM and x86 supply_cow callers, x86 supply_user_fault's COW arm, and the shared NativeProcessError::from_cow_supply mapping; and (c) unit tests. No entry, completion, signal, wait, IPC, futex, entropy, host-file, file-region, exec, scheduler or admission path is touched, and no work unit changes: a supply still costs one crossing, and a refusal now withdraws one selection in place of leaving it published."
