rationale = "These five files only expose the read-only Aarch64EngineCore::runtime_projection accessor, factor HvfAarch64Engine::build_thread_birth_template so resident and loaded engines share one template builder, widen HvpatchTaskEngineBindingState::thread_birth_template to BackendBirthTemplate, delegate prepare_hvpatch_logical_job to thread_adoption::bind_executable_thread_births, and compile mod thread_adoption on non-macOS hosts. The post-exec thread-birth gate reopen in exec.rs and thread_adoption.rs is owned and evidenced by kernel.el1.task-load-entry; no stage-1/stage-2 mapping, owner-wait, directory copyout, scheduler queue, or VMM trap semantics or work units change."
