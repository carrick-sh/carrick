rationale = """
The guest-visible change in these shared files is owned by the new
`kernel.el1.poll-revents` contract: the poll body publishes one two-byte
`revents` field per entry instead of the frozen whole-record array, and the
retained native-venue output carries the same shape. Nothing else in these
files moves: the other poll branches keep their result, their host crossing,
their refusal arms and their fallbacks; `copy_poll_revents` reads only the
resolved entry's `revents` and keeps the same Forward on a refused copy. The
receipt names the remaining contracts bound to these files because the gate
requires evidence for every contract on a modified surface, not because their
behaviour changed. Their red-first production witnesses are unchanged and
still pass, and the structural budget narrows: 2n guest bytes for n entries
instead of 8n, with the same n entries visited and no added allocation,
retry, poll or lock.
"""
