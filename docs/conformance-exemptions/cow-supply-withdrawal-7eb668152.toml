rationale = "#3040 changes one guest-visible mechanism, the copy-on-write supply of a kernel user copy, whose contract kernel.el1.fork-cow carries the new VM-free witnesses in this PR. The listed paths are bound to these other contracts only by file: the edits there are (a) the neutral PortalGrantSlot::supply_cow_selection, the exact take_cow_fault_selection and its typed CowSupplyRefusal in core-abi; (b) the two supply_cow callers and the shared NativeProcessError::from_cow_supply mapping; (c) host fatal-message and warning text that reports grant-slot state on an already fatal or refused path; and (d) unit tests. No entry, completion, signal, wait, IPC, futex, entropy, host-file, exec, scheduler or admission path is touched, and no work unit changes: the supply still costs one crossing, and a refusal now withdraws one selection in place of leaving it published."
