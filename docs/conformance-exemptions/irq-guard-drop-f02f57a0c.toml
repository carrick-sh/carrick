rationale = "This change makes the existing interrupt-mask save and restore lifetime-safe and combines the existing mask-then-lock order into one guard. All currently reachable sections retain the same saved mask and release the same lock before restoring it; only an early exit that previously leaked the mask gains safe restoration. The existing semantic and work contracts remain unchanged, and a host test covers the corrected early-return path."
