rationale = "The exact product diff implements the registered kernel.el1.stage1-publication missing-hierarchy transaction. Shared ABI constants move the existing null-guard and GIC-window literal values to the ABI without changing their values or layouts; memory continues to consume those same values. Fault routing and mailbox layout are unchanged. The shared manager now publishes terminal descriptors before table pointers and descendant pointers before ancestors, strengthening live visibility without changing fork snapshots, GIC exclusion, metadata-refusal rollback or existing protection semantics. The complete 97-test MMU suite and 174-test memory suite pass, including fork image, GIC exclusion, metadata refusal, rollback, live synchronization and EL1 vector controls; targeted warning-denied Clippy and the bare-metal EL1 release build also pass."
