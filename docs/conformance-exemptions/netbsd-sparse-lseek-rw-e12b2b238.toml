paths = ["crates/carrick-kernel/src/dispatch/fs/rw.rs"]
contracts = ["kernel.mm.syscall-code-write"]
rationale = "The rw.rs edit only replaces the host SEEK_DATA/SEEK_HOLE whence mapping in lseek_host_file and the host-backed File lseek arm with carrick_portable::lseek_sparse; on macOS, FreeBSD and Linux that is the same native host lseek with the same whence, and the changed semantics are owned and evidenced by kernel.fs.lseek-sparse. No read, readv, pread64, preadv or recvfrom destination path, physical backing retention, code-dependency invalidation or EFAULT handling is touched, so syscall-code-write semantics and work units are unchanged."
