rationale = "#1093 S3 adds no guest-reachable behavior. The AArch64 owner change moves its closed-successor slot, adoption and cancellation into the shared carrick_el1_linux::exec_successor module with the same publication order, rollback and identity check. The x86 successor hooks are unreachable until S4: execve has no x86 route, no KVM Exec arm exists and every physical crossing returns Unsupported, so x86 exec stays a counted refusal. initial_mm.rs, vcpu_loop/mod.rs, native_execution.rs, file_region.rs and guest-arch lib.rs are equivalent refactors or additive constructors covered by their existing tests and the VM-free witnesses bound in process.exec.custody and process.exec.files. The remaining paths are the #1093 S1 boundary move, re-covered unchanged because that receipt stops applying once exec.rs changes."
