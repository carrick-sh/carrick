rationale = "Slice S3c of #1756 moves IPC adapter operation retirement from the ARM-only NativeProcessService::retire_adapter_operation trait hook into the shared NativeProcessEntry::retire_adapter_result owner over self.service.exec_ipc_binding(), deleting the trait default, the ARM override, the host-test Physical override, and the vanished frame-budget symbol. Witness tests in host_test_support.rs (ipc_backing_refusal_retires_the_operation_and_pin, exec_settlement_retires_retained_ipc_operation_and_pin_once, exit_group_settlement_retires_retained_ipc_operation_and_pin_once) exercise the shared retirement path across both ParkedContextWords and Aarch64ParkedContext; host_test_support.rs is not matched by check-contract-change's *_tests.rs filename heuristic."
