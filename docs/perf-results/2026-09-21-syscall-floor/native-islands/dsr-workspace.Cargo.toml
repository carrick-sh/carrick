[workspace]
resolver = "2"
members = ["carrick-dsr", "carrick-dsr-aarch64", "text-audit"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carrick-sh/carrick"
homepage = "https://carrick.sh"
description = "Run unmodified Linux binaries as host-native processes via a hardware-virtualized vCPU per guest thread and a Rust syscall-translation layer (experimental)."
readme = "README.md"


[workspace.lints]

[workspace.dependencies]
carrick-fatal = { path = "crates/carrick-fatal" }
arc-swap = "1.7.1"
chrono = "0.4.44"
anyhow = "1.0.100"
bad64 = "0.12.0"
bincode = { version = "2.0.1", features = ["serde"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "instr_info"] }
bitflags = "2.10.0"
dynasmrt = "5.0.0"
libc = "0.2"
mach2 = "0.6.0"
camino = { version = "1.2.1", features = ["serde1"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
fd-lock = "4"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.3.4"
goblin = { version = "0.10.5", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls"] }
parking_lot = { version = "0.12", features = ["arc_lock"] }
parking_lot_core = "0.9"
proptest = "1.11.0"
rand = "0.10.1"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.4.4"
sha2 = "0.10.9"
socket2 = "0.6.3"
tar = { version = "0.4.45", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "net", "process", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
memmap2 = "0.9.10"
toml = "0.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
usdt = "0.6.0"
zerocopy = { version = "0.8.48", features = ["derive"] }
# macos-15-0 (vs 13-0) exposes hv_sys_reg_t::ACTLR_EL1 (0xc081), whose EnTSO bit
# (index 1) toggles hardware x86_64 TSO memory ordering — required by Rosetta 2
# translation (see docs/rosetta.md). Host must be macOS 15+.
applevisor = { version = "1.0.0", default-features = false, features = ["macos-15-0"] }
applevisor-sys = { version = "1.0.0", default-features = false, features = ["macos-15-0"] }
# dev
assert_cmd = "2.1.1"
predicates = "3.1.3"
bollard = "0.18"
futures-util = "0.3"
base64 = "0.22"
