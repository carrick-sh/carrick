
[[suite]]
name = "spawn-loop"
ecosystem = "node"
image = "ubuntu:24.04"
cmd = ["/bin/sh", "-c", "set -eu; n=1000; start=$(date +%s%N); i=0; while [ \"$i\" -lt \"$n\" ]; do /bin/true; i=$((i+1)); done; end=$(date +%s%N); printf \"impact_window_ns=%s\\n\" \"$((end-start))\""]
verdict = "shell"
tier = "full"
weight = "heavy"
timeout_s = 300
carrick_flags = ["--fs", "host"]

[[suite]]
name = "thread-spawn"
ecosystem = "node"
image = "localhost:5005/carrick-nodejs-conformance:24.16.0-26.2.0"
cmd = ["/opt/nodejs-conformance/bin/node24", "-e", "const {Worker}=require(\"node:worker_threads\"); (async()=>{const start=process.hrtime.bigint(); for(let i=0;i<1000;i++){await new Promise((resolve,reject)=>{const w=new Worker(\"\",{eval:true});w.on(\"error\",reject);w.on(\"exit\",code=>code===0?resolve():reject(new Error(`exit ${code}`)));});} console.log(\"impact_window_ns=\"+(process.hrtime.bigint()-start));})().catch(e=>{console.error(e);process.exitCode=1;});"]
verdict = "shell"
tier = "full"
weight = "heavy"
timeout_s = 300
carrick_flags = ["--fs", "host"]
[suite.entrypoint]
# Begin cmd with the executable so Carrick does not parse Node's -e as host env.
both = ""

[[suite]]
name = "fork-exec"
ecosystem = "node"
image = "ubuntu:24.04"
cmd = ["/bin/sh", "-c", "/tmp/impact-fork-exec"]
verdict = "shell"
tier = "full"
weight = "heavy"
timeout_s = 300
carrick_flags = ["--fs", "host"]
bind_mounts = ["conformance-probes/target/aarch64-unknown-linux-musl/release/perf_fork_exec:/tmp/impact-fork-exec:ro"]
