[workspace]
resolver = "2"
members = ["crates/*"]
# conformance-probes is a STANDALONE crate (its own Cargo.lock) built as static
# Linux/musl ELFs in a container by scripts/build-probes.sh, never as part of
# the host workspace — exclude it so host `cargo` commands don't try to absorb it.
exclude = ["fixtures/*", "crates/*/fixtures/*", "conformance-probes", "bench-native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carrick-sh/carrick"
homepage = "https://carrick.sh"
description = "Run unmodified Linux binaries as host-native processes via a hardware-virtualized vCPU per guest thread and a Rust syscall-translation layer (experimental)."
readme = "README.md"

[workspace.lints.rust]
# The AGENTS.md match-arm footgun: a LINUX_*/SYS_* constant used as a match
# arm but NOT imported degrades to a catch-all binding that silently shadows
# every later arm. rustc's default warn is easy to scroll past in a full
# build; deny turns the whole class into a build failure.
unreachable_patterns = "deny"
bindings_with_variant_name = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Build-speed tuning that does NOT touch the linker or DTrace (see
# docs/archive/build-decomposition-design.md and .cargo/config.toml for why lld is off).
# macOS defaults to bundling debuginfo into a .dSYM via dsymutil on every link;
# `unpacked` skips that packaging step (lldb/`carrick trace` still resolve line
# info from the .o), cutting the link-dominated test-binary rebuild waves.
# Incremental compilation is OFF workspace-wide (dev/test; dev-fast inherits dev,
# release already defaults off). Incremental can mark the binary "fresh" without
# re-running the post-build codesign step, leaving a stale/unsigned binary that
# fails with HV_DENIED on the HVF rig — and it adds a class of stale-rlib
# nondeterminism (a dependent crate compiled against an out-of-date rlib).
# Determinism + reliable re-signing matter more here than the rebuild speedup.
[profile.dev]
split-debuginfo = "unpacked"
incremental = false

[profile.test]
split-debuginfo = "unpacked"
incremental = false

# Everyday fast inner-loop profile: drop heavy type/variable DWARF, keep line
# tables (backtraces + `carrick trace`/lldb line numbers still work). Use
# `cargo build/test --profile dev-fast` for the normal loop; plain `dev` keeps
# full debuginfo for deep lldb variable inspection (the macos-vm-lldb-debug flow).
[profile.dev-fast]
inherits = "dev"
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Carrick does arithmetic on guest-controlled integers throughout the syscall
# emulation. overflow-checks turns a silent wrap (which can become a too-small
# buffer / OOB — see the msgsnd 8+sz finding) into a panic, which the per-syscall
# dispatch backstop (`dispatch_with_panic_backstop` in runtime.rs) catches and
# turns into a deterministic guest ABORT (logged syscall + SIGABRT) rather than
# letting it unwind a vCPU thread (silently killing a sibling vCPU → guest hang,
# or tearing through half-edited lock-protected state). Defense-in-depth behind
# the explicit checked_* added at hot sites. (audit M0)
[profile.release]
overflow-checks = true
# Ship FULL DWARF in release builds so a `sample`/`atos`/lldb backtrace AND
# `frame variable` / local inspection in a core post-mortem both resolve — not
# just symbol+offset or file:line. This is a hypervisor we routinely post-mortem
# (HVF wedges, bhyve/x86 guest-fault SIGSEGVs, fork-quiesce aborts), so paying
# the larger build output + slightly longer link to keep variable inspection
# always-on is the right trade. Debuginfo does NOT change codegen, so the runtime
# behaviour is identical to a line-tables-only build. Drop back to
# `debug = "line-tables-only"` only if a build-size/link-time emergency demands.
debug = true
# Keep the debug info in a sidecar .dSYM (auto-found by atos/lldb/dtrace) so the
# runtime binary itself stays lean.
split-debuginfo = "packed"

[workspace.dependencies]
chrono = "0.4.44"
anyhow = "1.0.100"
bad64 = "0.12.0"
bitflags = "2.10.0"
dynasmrt = "5.0.0"
libc = "0.2"
camino = { version = "1.2.1", features = ["serde1"] }
cap-std = "4"
clap = { version = "4.5.51", features = ["derive", "env"] }
fd-lock = "4"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.3.4"
goblin = { version = "0.10.5", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls"] }
parking_lot = "0.12"
parking_lot_core = "0.9"
proptest = "1.11.0"
rand = "0.9.4"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = { version = "0.4.45", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "net", "process", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
toml = "0.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
usdt = "0.6.0"
zerocopy = { version = "0.8.48", features = ["derive"] }
# macos-15-0 (vs 13-0) exposes hv_sys_reg_t::ACTLR_EL1 (0xc081), whose EnTSO bit
# (index 1) toggles hardware x86_64 TSO memory ordering — required by Rosetta 2
# translation (see docs/rosetta.md). Host must be macOS 15+.
applevisor = { version = "1.0.0", default-features = false, features = ["macos-15-0"] }
applevisor-sys = { version = "1.0.0", default-features = false, features = ["macos-15-0"] }
# dev
assert_cmd = "2.1.1"
predicates = "3.1.3"
bollard = "0.18"
futures-util = "0.3"
base64 = "0.22"
